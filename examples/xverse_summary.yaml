name: "XVERSE Summary"
description: "Fetch a webpage, summarize it using XVERSE API, and save the result"

steps:
  - node: fetch_url
    params:
      url: "https://example.com"

  - node: xverse
    params:
      model: "XVERSE-7B-Chat"
      system: "You are a helpful assistant that summarizes text concisely."

  - node: file_write
    params:
      path: "xverse_summary.txt"
