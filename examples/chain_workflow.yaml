name: "Chained Workflow"
description: "Call a sub-workflow from main workflow"

steps:
  - node: execute
    params:
      command: "echo 'Starting main workflow...'"
  
  - node: call
    params:
      workflow: "./examples/monitoring_alert.yaml"
  
  - node: execute
    params:
      command: "echo 'Main workflow completed!'"
