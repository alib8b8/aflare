name: "DeepSeek Summary"
description: "Fetch a webpage, summarize it using DeepSeek API, and save the result"

steps:
  - node: fetch_url
    params:
      url: "https://example.com"

  - node: deepseek
    params:
      model: "deepseek-chat"
      system: "You are a helpful assistant that summarizes text concisely."

  - node: file_write
    params:
      path: "deepseek_summary.txt"
