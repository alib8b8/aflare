name: "InternLM Summary"
description: "Fetch a webpage, summarize it using InternLM API, and save the result"

steps:
  - node: fetch_url
    params:
      url: "https://example.com"

  - node: internlm
    params:
      model: "internlm3-latest"
      system: "You are a helpful assistant that summarizes text concisely."

  - node: file_write
    params:
      path: "internlm_summary.txt"
