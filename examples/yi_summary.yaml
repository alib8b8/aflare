name: "Yi Summary"
description: "Fetch a webpage, summarize it using Lingyiwanwu Yi API, and save the result"

steps:
  - node: fetch_url
    params:
      url: "https://example.com"

  - node: yi
    params:
      model: "yi-lightning"
      system: "You are a helpful assistant that summarizes text concisely."

  - node: file_write
    params:
      path: "yi_summary.txt"
