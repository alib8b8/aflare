name: Cross-Bank Transfer Saga
description: |
  跨行转账 Saga：debit → credit → notify + 失败自动补偿。

  展示 aflare 在金融可靠性场景的核心能力：
  1. 🔄  Saga 事务补偿 — 多步骤写入，失败自动反向补偿
  2. 🛡️  LLM 欺诈检测 — 转账前 AI 风险分析
  3. 🔑  幂等性 — Idempotency-Key 防重复扣款
  4. 🚦  限流 + 重试 + 退避 — 保护下游银行 API
  5. 🛑  capture_error — LLM 不可用时降级，不阻塞转账
  6. 📜  审计日志 — 所有步骤自动记录

  流程：
    fraud_check(LLM) → saga(debit⇄refund, credit⇄reverse, notify) → audit → notification
    ─────────────────────────────────────────────────────────────────
    失败时 saga 反向补偿 + capture_error 兜底

  故障注入（演示补偿路径）：
    - amount=9999 触发 credit 失败 → debit 被补偿（退款）
    - 其他 amount 正常处理，saga 提交

  使用方式：
    # 1. 启动 mock 银行
    python3 mock-server.py
    # 2. 运行工作流（默认 amount=9999，演示补偿）
    aflare run workflow.yaml
    # 3. 正常运行（amount=5000）
    aflare run workflow.yaml --var amount=5000

vars:
  bank_api_url: "http://localhost:17904"
  from_account: "ACC-001"
  to_account: "ACC-002"
  # amount=9999 触发 credit 失败 → debit 补偿。改此值观察不同路径。
  amount: "9999"
  currency: "CNY"
  transfer_ref: "TXN-20260809-001"
  audit_log: "./audit-trail.jsonl"
  fraud_report: "./fraud-report.json"

  # LLM 配置（用于欺诈检测）
  provider: openai
  model: gpt-4o

steps:
  # ═══════════════════════════════════════════════════════════════
  # Step 1: LLM 欺诈检测（转账前 AI 风险分析）
  # ═══════════════════════════════════════════════════════════════
  # 使用 LLM 分析交易风险，capture_error 兜底：LLM 不可用时降级
  - name: fraud_check
    node: openai
    params:
      model: "{{var.model}}"
      system: |
        你是企业金融交易欺诈检测专家。分析转账请求，输出结构化风险评估。

        关注以下风险维度：
        1. 交易金额异常（如整数大额、频繁小额测试）
        2. 收款方是否在黑名单/制裁名单
        3. 交易模式是否匹配历史行为
        4. 时间/地区异常

        只输出 JSON，格式：
        {
          "risk_score": 0-100,
          "risk_level": "low|medium|high|critical",
          "flags": ["flag1", "flag2"],
          "decision": "allow|review|block",
          "reasoning": "分析依据"
        }
      prompt: |
        请分析以下企业转账请求的欺诈风险：

        转账编号：{{var.transfer_ref}}
        付款账户：{{var.from_account}}
        收款账户：{{var.to_account}}
        金额：{{var.amount}} {{var.currency}}
    retry: 2
    backoff:
      exponential: true
      base: "500ms"
      max_delay: "5s"
      jitter: true
    capture_error:
      # LLM 不可用时降级为"人工审核"，不阻塞转账
      - name: fraud_fallback
        node: template_render
        params:
          template: |
            {"risk_score":50,"risk_level":"medium","flags":["llm_unavailable"],"decision":"review","reasoning":"LLM 服务不可用，降级为人工审核。转账编号：{{var.transfer_ref}}"}

  # ═══════════════════════════════════════════════════════════════
  # Step 2: 保存欺诈检测报告
  # ═══════════════════════════════════════════════════════════════
  - name: save_fraud_report
    node: file_write
    params:
      path: "{{var.fraud_report}}"
      mode: write

  # ═══════════════════════════════════════════════════════════════
  # Step 3: Saga 跨行转账（核心事务）
  # ═══════════════════════════════════════════════════════════════
  # debit → credit → notify，任一步骤失败时按反向补偿
  # 每个 forward 步骤都带 Idempotency-Key、限流、重试、退避
  - name: cross_bank_transfer
    saga:
      steps:
        # ── forward 1: A 行扣款（带限流+重试）──
        - forward:
            name: debit
            node: http_request
            params:
              method: POST
              url: "{{var.bank_api_url}}/debit"
              headers: |-
                Content-Type: application/json
                Idempotency-Key: {{var.transfer_ref}}-debit
              body: '{"account":"{{var.from_account}}","amount":{{var.amount}},"currency":"{{var.currency}}","ref":"{{var.transfer_ref}}"}'
              rate_limit_rps: "5"
              rate_limit_burst: "2"
              max_retries: "3"
              retry_backoff_ms: "200"
              retry_on_status: "429,500,502,503,504"
          # compensate 1: A 行退款（撤销 debit）
          compensate:
            name: refund_debit
            node: http_request
            params:
              method: POST
              url: "{{var.bank_api_url}}/refund"
              headers: |-
                Content-Type: application/json
                Idempotency-Key: {{var.transfer_ref}}-refund
              body: '{"account":"{{var.from_account}}","amount":{{var.amount}},"currency":"{{var.currency}}","ref":"{{var.transfer_ref}}","reason":"{{var.error}}"}'
              rate_limit_rps: "5"
              max_retries: "3"
              retry_backoff_ms: "200"
              retry_on_status: "429,500,502,503,504"

        # ── forward 2: B 行入账（amount=9999 触发失败，演示补偿）──
        - forward:
            name: credit
            node: http_request
            params:
              method: POST
              url: "{{var.bank_api_url}}/credit"
              headers: |-
                Content-Type: application/json
                Idempotency-Key: {{var.transfer_ref}}-credit
              body: '{"account":"{{var.to_account}}","amount":{{var.amount}},"currency":"{{var.currency}}","ref":"{{var.transfer_ref}}"}'
              rate_limit_rps: "5"
              rate_limit_burst: "2"
              max_retries: "3"
              retry_backoff_ms: "200"
              retry_on_status: "429,500,502,503,504"
          # compensate 2: B 行冲正（撤销 credit）
          compensate:
            name: reverse_credit
            node: http_request
            params:
              method: POST
              url: "{{var.bank_api_url}}/reverse"
              headers: |-
                Content-Type: application/json
                Idempotency-Key: {{var.transfer_ref}}-reverse
              body: '{"account":"{{var.to_account}}","amount":{{var.amount}},"currency":"{{var.currency}}","ref":"{{var.transfer_ref}}","reason":"{{var.error}}"}'
              max_retries: "2"

        # ── forward 3: 通知（无副作用，无需 compensate）──
        - forward:
            name: notify_bank
            node: http_request
            params:
              method: POST
              url: "{{var.bank_api_url}}/notify"
              headers: |-
                Content-Type: application/json
              body: '{"from":"{{var.from_account}}","to":"{{var.to_account}}","amount":{{var.amount}},"ref":"{{var.transfer_ref}}","status":"success"}'
              max_retries: "2"

  # ═══════════════════════════════════════════════════════════════
  # Step 4: 生成审计轨迹
  # ═══════════════════════════════════════════════════════════════
  - name: generate_audit
    node: template_render
    params:
      template: |
        {
          "audit_id": "{{var.transfer_ref}}",
          "timestamp": "{{now}}",
          "transaction": {
            "ref": "{{var.transfer_ref}}",
            "from": "{{var.from_account}}",
            "to": "{{var.to_account}}",
            "amount": {{var.amount}},
            "currency": "{{var.currency}}"
          },
          "fraud_check": {{step.fraud_check}},
          "transfer_result": "{{step.cross_bank_transfer}}",
          "compliance": {
            "idempotency_key": "{{var.transfer_ref}}",
            "saga_compensated": {{#if step.cross_bank_transfer.status}}true{{else}}false{{/if}}
          }
        }
    continue_on_error: true
    capture_error:
      - name: audit_fallback
        node: template_render
        params:
          template: |
            {"audit_id":"{{var.transfer_ref}}","timestamp":"{{now}}","error":"audit generation failed","transaction":{"ref":"{{var.transfer_ref}}","from":"{{var.from_account}}","to":"{{var.to_account}}","amount":{{var.amount}},"currency":"{{var.currency}}"}}

  # ═══════════════════════════════════════════════════════════════
  # Step 5: 落盘审计轨迹
  # ═══════════════════════════════════════════════════════════════
  - name: save_audit
    node: file_write
    params:
      path: "{{var.audit_log}}"
      mode: append

  # ═══════════════════════════════════════════════════════════════
  # Step 6: 发送通知
  # ═══════════════════════════════════════════════════════════════
  - name: send_notification
    node: notify
    params:
      channel: stdout
      message: |
        ============================================
        🏦  跨行转账 Saga 工作流执行完毕
        ============================================
        转账编号: {{var.transfer_ref}}
        付款账户: {{var.from_account}}
        收款账户: {{var.to_account}}
        金额:     {{var.amount}} {{var.currency}}
        风控结果: {{step.fraud_check}}
        转账结果: {{step.cross_bank_transfer}}
        审计轨迹: {{var.audit_log}}
        ============================================

output: |
  ============================================
  跨行转账 Saga 工作流执行报告
  ============================================
  转账编号: {{var.transfer_ref}}
  转账结果: {{step.cross_bank_transfer}}
  风控评分: {{step.fraud_check}}
  审计轨迹: {{var.audit_log}}