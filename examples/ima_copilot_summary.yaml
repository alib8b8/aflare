name: "IMA Copilot Summary"
description: "Fetch a webpage, summarize it using IMA Copilot API, and save the result"

steps:
  - node: fetch_url
    params:
      url: "https://example.com"

  - node: ima
    params:
      model: "gpt-4o"
      system: "You are a helpful assistant that summarizes text concisely."

  - node: file_write
    params:
      path: "ima_summary.txt"
