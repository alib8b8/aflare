name: "GLM Summary"
description: "Fetch a webpage, summarize it using Zhipu AI GLM API, and save the result"

steps:
  - node: fetch_url
    params:
      url: "https://example.com"

  - node: glm
    params:
      model: "glm-4"
      system: "You are a helpful assistant that summarizes text concisely."

  - node: file_write
    params:
      path: "glm_summary.txt"
