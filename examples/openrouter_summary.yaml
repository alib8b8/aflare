name: "OpenRouter Summary"
description: "Summarize a webpage using any model available on OpenRouter"

steps:
  - node: fetch_url
    params:
      url: "https://example.com"

  - node: openai
    params:
      model: "openai/gpt-4o"
      endpoint: "https://openrouter.ai/api/v1"
      system: "You are a helpful assistant that summarizes text concisely."

  - node: file_write
    params:
      path: "output.txt"
