# 宇树 Go2 四足机器人 - 巡逻巡检工作流
# 默认使用 simulate 模式，可切换为 mode=api 直连硬件

name: 宇树 Go2 仓库巡逻巡检
description: |
  Unitree Go2 仓库巡逻示例：站立 -> 巡检A区 -> 拍照 -> 检查状态 -> 蹲下。
  默认 simulate 模式，连接真机时设置 mode=api 和 robot_ip。

steps:
  # 1. Go2 站立就绪
  - name: go2_stand
    node: unitree_robot
    params:
      robot_model: "Go2"
      action: "stand"
      safety_zone_m: "1.0"

  # 2. 巡逻仓库A区，低速慢行
  - name: patrol_zone_a
    node: unitree_robot
    params:
      robot_model: "Go2"
      action: "patrol"
      target_location: "warehouse_zone_a"
      speed: "0.3"
      safety_zone_m: "1.5"
      duration_seconds: "30"

  # 3. 拍照记录
  - name: capture_photo
    node: unitree_robot
    params:
      robot_model: "Go2"
      action: "get_camera"

  # 4. 检查机器人状态（电池、温度、IMU）
  - name: check_status
    node: unitree_robot
    params:
      robot_model: "Go2"
      action: "get_status"

  # 5. 任务完成，蹲下
  - name: go2_sit
    node: unitree_robot
    params:
      robot_model: "Go2"
      action: "sit"