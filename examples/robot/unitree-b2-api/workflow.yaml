# 宇树 B2 工业四足机器人 - API 直连模式
# 通过 HTTP API 直接控制 B2 机器人硬件

name: 宇树 B2 API 直连控制
description: |
  通过 HTTP API 直连宇树 B2 工业机器人。
  需设置 UNITREE_B2_IP 环境变量或直接填写 robot_ip。

steps:
  # 1. B2 站立
  - name: b2_stand
    node: unitree_robot
    params:
      robot_model: "B2"
      robot_ip: "{{var.unitree_b2_ip}}"
      mode: "api"
      action: "stand"
      speed: "0.5"
      safety_zone_m: "1.5"

  # 2. 巡逻工业园区
  - name: b2_patrol
    node: unitree_robot
    params:
      robot_model: "B2"
      robot_ip: "{{var.unitree_b2_ip}}"
      mode: "api"
      action: "patrol"
      target_location: "industrial_park"
      speed: "0.4"
      safety_zone_m: "2.0"
      duration_seconds: "60"

  # 3. 获取实时状态
  - name: b2_status
    node: unitree_robot
    params:
      robot_model: "B2"
      robot_ip: "{{var.unitree_b2_ip}}"
      mode: "api"
      action: "get_status"

  # 4. 蹲下
  - name: b2_sit
    node: unitree_robot
    params:
      robot_model: "B2"
      robot_ip: "{{var.unitree_b2_ip}}"
      mode: "api"
      action: "sit"