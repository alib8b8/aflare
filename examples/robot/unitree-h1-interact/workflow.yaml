# 宇树 H1 人形机器人 - 自然语言交互工作流
# 输入自然语言指令，自动推断动作并执行

name: 宇树 H1 自然语言交互
description: |
  向宇树 H1 人形机器人发送自然语言指令，自动推断动作类型。
  支持挥手、握手、站立、行走等动作。

steps:
  # 1. 自然语言指令 -> 自动推断动作
  - name: h1_greet
    node: unitree_robot
    params:
      robot_model: "H1"
      robot_id: "h1_assistant"
      speed: "0.5"
      safety_zone_m: "1.0"
    input: "挥手打招呼"

  # 2. 握手
  - name: h1_handshake
    node: unitree_robot
    params:
      robot_model: "H1"
      robot_id: "h1_assistant"
      action: "shake_hands"
      safety_zone_m: "1.0"

  # 3. 检查状态
  - name: h1_status
    node: unitree_robot
    params:
      robot_model: "H1"
      action: "get_status"