name: "Template Render Demo"
description: "Render a template with input data"

steps:
  - node: fetch_url
    params:
      url: "https://api.github.com/users/octocat"
  
  - node: template_render
    params:
      template: |
        # User Profile
        
        Name: {{ .name }}
        Bio: {{ .bio }}
        Followers: {{ .followers }}
        Following: {{ .following }}
        Public Repos: {{ .public_repos }}
        
        ---
        Generated by llm-box
  
  - node: file_write
    params:
      path: "profile.md"
