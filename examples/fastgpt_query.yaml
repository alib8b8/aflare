name: "FastGPT Knowledge Base Query"
description: "Query a FastGPT knowledge base and save the answer"

steps:
  - node: fastgpt
    params:
      app_id: "your-app-id"
      api_key: "your-api-key"
      endpoint: "https://your-fastgpt-domain.com/api/v1"
      system: "You are a helpful assistant that answers questions based on the knowledge base."
  
  - node: file_write
    params:
      path: "fastgpt_answer.txt"
