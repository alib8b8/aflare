name: "Kimi Summary"
description: "Fetch a webpage, summarize it using Kimi (Moonshot) API, and save the result"

steps:
  - node: fetch_url
    params:
      url: "https://example.com"

  - node: kimi
    params:
      model: "moonshot-v1-8k"
      system: "You are a helpful assistant that summarizes text concisely."

  - node: file_write
    params:
      path: "kimi_summary.txt"
