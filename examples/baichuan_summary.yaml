name: "Baichuan Summary"
description: "Fetch a webpage, summarize it using Baichuan API, and save the result"

steps:
  - node: fetch_url
    params:
      url: "https://example.com"

  - node: baichuan
    params:
      model: "Baichuan4"
      system: "You are a helpful assistant that summarizes text concisely."

  - node: file_write
    params:
      path: "baichuan_summary.txt"
