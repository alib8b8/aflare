name: Grill-Me
description: |
  Constraint skill inspired by mattpocock/skills /grill-me: forces the AI
  to thoroughly clarify requirements before writing any code. The agent
  must produce at least min_questions clarification questions covering
  boundary conditions, error handling, performance, security,
  compatibility, testing, and deployment dimensions, then self-answer
  them with reasonable assumptions before declaring ready_to_code.
  No code is permitted during the clarification phase.

vars:
  task_description: ""
  min_questions: "50"
  provider: ollama
  model: llama3
  log_path: clarification-log.md

steps:
  - node: template_render
    name: questions_prompt
    params:
      template: |
        You are a Requirements Clarification Expert (需求澄清专家).
        Your sole job is to interrogate the requirements until every
        ambiguity is resolved. You are operating under a hard constraint.

        CONSTRAINTS:
        - You MUST ask at least {{var.min_questions}} clarification questions.
        - You MUST NOT write any code in this phase. No snippets, no
          pseudocode, no implementation, no comments about implementation.
          Questions only.
        - Each question must be specific, concrete, and answerable.

        Cover AT LEAST these dimensions (multiple questions per dimension):
        1. Boundary conditions (边界条件): edge cases, empty/null inputs,
           limits, overflow, off-by-one.
        2. Error handling (错误处理): failure modes, retries, partial
           failures, idempotency, error propagation.
        3. Performance requirements (性能要求): latency, throughput,
           concurrency, memory, caching, scaling.
        4. Security considerations (安全考量): authn/authz, input
           validation, secrets, attack surface, audit logging.
        5. Compatibility (兼容性): backward/forward compatibility,
           platform, language version, dependencies.
        6. Testing strategy (测试策略): unit/integration/e2e, coverage
           targets, fixtures, mutation testing.
        7. Deployment environment (部署环境): runtime, config, network,
           regions, rollback, blue/green.
        8. Data & state management: schema, migrations, consistency,
           persistence, caching invalidation.
        9. API & interface contracts: versioning, pagination, errors,
           idempotency keys, rate limits.
        10. Observability & operations: metrics, logs, tracing, alerts,
            on-call runbooks, SLOs.

        Task to implement:
        {{var.task_description}}

        Number each question (Q1, Q2, Q3, ...). Produce at least
        {{var.min_questions}} questions. Do not stop early.

  - node: ollama
    name: generate_questions
    params:
      model: "{{var.model}}"

  - node: template_render
    name: answers_prompt
    params:
      template: |
        You are a Requirements Clarification Expert (需求澄清专家).
        Below is a list of clarification questions for a task. For each
        question, provide a reasonable, explicit, assumption-based answer.

        Rules:
        - Answer every question. Number answers (A1, A2, ...) to match
          the question numbering.
        - If a question is truly undecidable without stakeholder input,
          mark it as "[NEEDS HUMAN INPUT]" and state what is blocking.
        - Otherwise state the assumed answer and a confidence level
          (high / medium / low).
        - Do NOT write any code. Produce only the clarification document.

        Task to implement:
        {{var.task_description}}

        Clarification questions:
        {{step.generate_questions}}

        Output a structured Requirements Clarification Document.

  - node: ollama
    name: generate_answers
    params:
      model: "{{var.model}}"

  - node: template_render
    name: summary
    params:
      template: |
        # Requirements Clarification Log (Grill-Me)

        **Task:** {{var.task_description}}
        **Minimum questions threshold:** {{var.min_questions}}
        **Provider / Model:** {{var.provider}} / {{var.model}}

        ---

        ## 1. Clarification Questions

        {{step.generate_questions}}

        ---

        ## 2. Clarification Answers (Assumption-Based)

        {{step.generate_answers}}

        ---

        ## 3. Readiness Check

        - **clarification_log:** produced above (questions + assumption-based answers).
        - **ready_to_code:** true
        - **rationale:** The clarification phase is complete. Questions were
          generated against the minimum threshold of {{var.min_questions}} and
          answered with explicit assumptions. Before writing production code,
          review every item marked "[NEEDS HUMAN INPUT]" with stakeholders.

        ---

        _Generated by the grill-me constraint skill ({{var.provider}}/{{var.model}})._

  - node: file_write
    name: save_log
    params:
      path: "{{var.log_path}}"

  - node: notify
    name: notify
    params:
      channel: stdout
      message: "Grill-Me complete. ready_to_code=true. Clarification log written to {{var.log_path}} (target: {{var.min_questions}}+ questions)."
