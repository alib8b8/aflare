name: Code Review Pipeline
description: |
  Hybrid code review pipeline combining deterministic rule-engine checks
  (NPE, thread-safety, security) with LLM deep analysis. Reads a source
  file, runs the hybrid code_review node, then composes a markdown report.

vars:
  target_file: internal/nodes/transform.go
  focus: all
  severity: medium
  provider: ollama
  model: llama3
  report_path: code-review-report.md

steps:
  - node: file_read
    name: read_source
    params:
      path: "{{var.target_file}}"
      redact: "false"

  - node: code_review
    name: review
    params:
      provider: "{{var.provider}}"
      model: "{{var.model}}"
      language: go
      focus: "{{var.focus}}"
      severity: "{{var.severity}}"
      use_rules: "true"
      use_llm: "true"

  - node: template_render
    name: report
    params:
      template: |
        # Code Review Report

        **Target file:** `{{var.target_file}}`
        **Focus:** {{var.focus}} · **Min severity:** {{var.severity}}
        **Provider:** {{var.provider}}/{{var.model}}

        ---

        ## Source Preview (first 15 lines)

        ```
        {{step.read_source}}
        ```

        ## Hybrid Review Findings

        The review below combines deterministic rule-engine output
        (NPE, thread-safety, security) with LLM deep analysis.

        {{step.review}}

        ---

        _Generated by code-review-pipeline skill._

  - node: file_write
    name: save
    params:
      path: "{{var.report_path}}"

  - node: notify
    name: notify
    params:
      channel: stdout
      message: "Code review complete. Report written to {{var.report_path}}."
