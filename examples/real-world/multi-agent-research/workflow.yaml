name: Multi-Agent Research
description: |
  A multi-agent research pipeline: a Planner decomposes the question,
  a Researcher gathers and summarizes sources, a Critic reviews the
  findings for gaps and bias, and a final template_render step
  synthesizes everything into a structured research brief.

vars:
  topic: "What are the trade-offs between RAG and fine-tuning for enterprise LLM deployment?"
  research_urls: "https://arxiv.org/abs/2005.11401,https://research.ibm.com/blog/retrieval-augmented-generation"
  depth: detailed
  provider: ollama
  model: llama3
  report_path: research-brief.md

steps:
  - node: planner
    name: plan
    params:
      provider: "{{var.provider}}"
      model: "{{var.model}}"
      max_steps: "6"
      context: "Output a JSON array of research sub-questions."

  - node: researcher
    name: research
    params:
      provider: "{{var.provider}}"
      model: "{{var.model}}"
      urls: "{{var.research_urls}}"
      depth: "{{var.depth}}"
      output_format: markdown

  - node: critic
    name: critique
    params:
      provider: "{{var.provider}}"
      model: "{{var.model}}"
      role: general
      criteria: "factual_accuracy,source_coverage,bias,completeness"
      output_format: markdown
      suggest_improvements: "true"

  - node: template_render
    name: brief
    params:
      template: |
        # Research Brief

        **Question:** {{var.topic}}

        ---

        ## 1. Research Plan (Planner)

        {{step.plan}}

        ## 2. Findings (Researcher)

        {{step.research}}

        ## 3. Critical Review (Critic)

        {{step.critique}}

        ## 4. Synthesis

        The brief above was produced by three cooperating agents:
        a **Planner** decomposed the question, a **Researcher** gathered
        sources ({{var.research_urls}}), and a **Critic** reviewed for
        accuracy, coverage, bias, and completeness. Review the Critic's
        suggestions before relying on the findings.

        ---

        _Generated by multi-agent-research skill ({{var.provider}}/{{var.model}})._

  - node: file_write
    name: save
    params:
      path: "{{var.report_path}}"

  - node: notify
    name: notify
    params:
      channel: stdout
      message: "Research brief written to {{var.report_path}}."
