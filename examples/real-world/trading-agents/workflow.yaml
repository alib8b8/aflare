name: Trading Agents
description: |
  A role-specialized trading desk (TradingAgents-style): the market Analyst
  structures the raw snapshot, the Researcher gathers news context from open
  sources, the Trader turns both into a BUY/SELL/HOLD proposal, and the Risk
  Manager independently reviews it before the trade memo is filed.

vars:
  symbol: "EUR/USD"
  market_snapshot: |
    EUR/USD spot 1.0842 (prev close 1.0810, +0.30% w/w)
    DXY index 104.2 (5-day average 104.6)
    US 10Y Treasury yield 4.28% (+4bp w/w)
    EUR 2Y swap rate 2.91% (-2bp w/w)
    Upcoming event: FOMC minutes release in 48h
  news_urls: "https://api.frankfurter.app/latest?from=USD&to=EUR,https://www.ecb.europa.eu/stats/eurofxref/eurofxref-generic.html"
  provider: ollama
  model: llama3
  memo_path: trade-memo.md

steps:
  # 1. Market Analyst — turn the raw snapshot into structured intelligence.
  - node: structured_output
    name: analyst
    input: "{{var.market_snapshot}}"
    params:
      provider: "{{var.provider}}"
      model: "{{var.model}}"
      schema_name: market_analysis
      schema: |
        {
          "type": "object",
          "properties": {
            "symbol": {"type": "string", "description": "instrument under analysis"},
            "trend": {"type": "string", "description": "bullish, bearish, or range"},
            "volatility": {"type": "string", "description": "low, medium, or high"},
            "key_levels": {"type": "array", "items": {"type": "string"}, "description": "support/resistance levels with direction"},
            "drivers": {"type": "array", "items": {"type": "string"}, "description": "factors moving the instrument"},
            "summary": {"type": "string", "description": "one-paragraph read of the market"}
          },
          "required": ["symbol", "trend", "volatility", "key_levels", "drivers", "summary"]
        }

  # 2. Researcher — gather news/macro context from open, key-free sources.
  - node: researcher
    name: research
    params:
      provider: "{{var.provider}}"
      model: "{{var.model}}"
      urls: "{{var.news_urls}}"
      depth: basic
      output_format: summary

  # 3. Trader — synthesize analysis + research into ONE actionable decision.
  - node: agent
    name: trader
    input:
      - "MARKET ANALYSIS:\n{{step.analyst}}"
      - "RESEARCH CONTEXT:\n{{step.research}}"
    params:
      provider: "{{var.provider}}"
      model: "{{var.model}}"
      system: |
        You are the senior trader on a small FX/macro desk. Turn the market
        analysis and research context into ONE actionable decision for
        {{var.symbol}}. Respond with exactly this structure:
        DECISION: BUY, SELL, or HOLD
        CONVICTION: LOW, MEDIUM, or HIGH
        ENTRY / STOP / TARGET: concrete levels taken from the key_levels
        RATIONALE: 3-5 bullets citing the analyst's levels and the researcher's context
        RISKS: what would invalidate this trade
      tools: "json_parse"
      max_iterations: "5"
      enable_thinking: "false"
      show_thinking: "false"

  # 4. Risk Manager — independent review before the memo is filed.
  - node: critic
    name: risk
    params:
      provider: "{{var.provider}}"
      model: "{{var.model}}"
      role: general
      criteria: "position_size,directional_risk,stop_discipline,liquidity,event_risk,compliance"
      output_format: markdown
      suggest_improvements: "true"

  # 5. File the trade memo.
  - node: template_render
    name: memo
    params:
      template: |
        # Trade Memo — {{var.symbol}}

        ---

        ## 1. Market Analysis (Analyst)

        {{step.analyst}}

        ## 2. Research Context (Researcher)

        {{step.research}}

        ## 3. Trade Proposal (Trader)

        {{step.trader}}

        ## 4. Risk Review (Risk Manager)

        {{step.risk}}

        ---

        _Generated by trading-agents skill ({{var.provider}}/{{var.model}}).
        For research and educational purposes only — not investment advice._

  - node: file_write
    name: save
    params:
      path: "{{var.memo_path}}"

  - node: notify
    name: notify
    params:
      channel: stdout
      message: "Trade memo for {{var.symbol}} written to {{var.memo_path}}."
