name: "CI/CD Pipeline"
description: "Run a CI/CD pipeline to build and test"

steps:
  - node: execute
    params:
      command: "echo '=== Starting CI/CD Pipeline ==='"
  
  - node: execute
    params:
      command: "git status"
  
  - node: execute
    params:
      command: "go build ./..."
  
  - node: execute
    params:
      command: "go test ./... -count=1"
  
  - node: execute
    params:
      command: "echo '=== CI/CD Pipeline Completed ==='"
