name: "MiMo Summary"
description: "Fetch a webpage, summarize it using Xiaomi MiMo API, and save the result"

steps:
  - node: fetch_url
    params:
      url: "https://example.com"
  
  - node: mimo
    params:
      model: "mimo-v2.5-pro"
      system: "You are a helpful assistant that summarizes text concisely."
  
  - node: file_write
    params:
      path: "mimo_summary.txt"
