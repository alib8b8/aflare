name: "Coze Summary"
description: "Fetch a webpage, summarize it using Coze API, and save the result"

steps:
  - node: fetch_url
    params:
      url: "https://example.com"

  - node: coze
    params:
      model: "glm-4"
      system: "You are a helpful assistant that summarizes text concisely."

  - node: file_write
    params:
      path: "coze_summary.txt"
