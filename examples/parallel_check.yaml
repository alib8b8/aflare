name: "Parallel Health Check"
description: "Check multiple services in parallel"

steps:
  - parallel:
      - node: execute
        params:
          command: "echo 'Checking service 1...' && sleep 1 && echo 'Service 1 OK'"
      - node: execute
        params:
          command: "echo 'Checking service 2...' && sleep 1 && echo 'Service 2 OK'"
      - node: execute
        params:
          command: "echo 'Checking service 3...' && sleep 1 && echo 'Service 3 OK'"
  
  - node: notify
    params:
      channel: stdout
      message: "All parallel checks completed!"
