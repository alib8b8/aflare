name: Log Analyzer
# Analyze application logs for errors and patterns
# Usage: llm-box install devops-monitoring/log-analyzer
#        llm-box run log-analyzer/workflow.yaml

steps:
  - node: execute
    params:
      command: tail -1000 /var/log/syslog
    id: system_logs

  - node: execute
    params:
      command: grep -c "ERROR\|error\|Error" /var/log/syslog 2>/dev/null || echo "0"
    id: error_count

  - node: execute
    params:
      command: grep "ERROR\|error" /var/log/syslog | tail -20 2>/dev/null || echo "No errors found"
    id: recent_errors

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 2
    input: |
      Analyze these system logs and create a summary:
      Error count: {{ .error_count }}
      Recent errors: {{ .recent_errors }}
      
      Identify patterns and provide actionable recommendations.
    id: analysis

  - node: file_write
    params:
      path: log-analysis.md
    input: analysis
    id: save
