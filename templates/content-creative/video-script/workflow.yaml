name: Video Script Generator
# Generate AI-powered video scripts for YouTube, TikTok, and other platforms
# Usage: aflare install creative/video-script
#        aflare run video-script/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 4
    input: |
      Create a professional video script for {{ .params.platform }}.

      Video topic: {{ .params.topic }}
      Target platform: {{ .params.platform }}
      Target audience: {{ .params.audience }}
      Video duration: {{ .params.duration }}
      Tone: {{ .params.tone }}
      Creator style: {{ .params.style }}

      Generate the following sections:
      1. Video Metadata
         - SEO-optimized title (3 options)
         - Video description with keywords
         - Suggested tags (10-15)
         - Thumbnail concept description
      2. Hook (first 5-8 seconds)
         - Opening line that grabs attention
         - Pattern interrupt technique used
         - Visual suggestion for the hook
      3. Script Body
         - Timestamped segments (every 30 seconds)
         - Narration/voiceover text for each segment
         - B-roll and visual suggestions
         - On-screen text overlays
         - Transition cues between segments
      4. Call to Action (CTA)
         - Subscribe/like/comment prompt
         - Next video teaser
         - Engagement question for comments
      5. Production Notes
         - Music/mood suggestions
         - Sound effect cues
         - Color grading direction
         - Pacing recommendations

      Make the script conversational, engaging, and platform-appropriate.
      For TikTok, keep it fast-paced and trend-aware.
      For YouTube, allow for deeper dives and storytelling.
    id: video_script

  - node: transform
    params:
      operation: extract_sections
      sections:
        - title
        - description
        - tags
        - hook
        - script_body
        - cta
        - production_notes
    input: video_script
    id: structured_output

  - node: file_write
    params:
      path: video-script.md
    input: video_script
    id: save_full

  - node: file_write
    params:
      path: video-script-structured.json
    input: structured_output
    id: save_structured

  - node: notify
    params:
      channel: stdout
    input: video_script
    id: notify