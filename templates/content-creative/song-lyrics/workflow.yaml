name: Song Lyric Generator
# Generate song lyrics in any style
# Usage: aflare install creative/song-lyrics
#        aflare run song-lyrics/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Write song lyrics for {{ .params.topic }}.
      
      Topic: {{ .params.topic }}
      Genre: {{ .params.genre }}
      Mood: {{ .params.mood }}
      Structure: {{ .params.structure }}
      Tempo: {{ .params.tempo }}
      
      Song should include:
      1. Title (3 alternatives)
      2. Verse 1
      3. Pre-Chorus
      4. Chorus
      5. Verse 2
      6. Pre-Chorus
      7. Chorus
      8. Bridge
      9. Chorus (final, perhaps with variation)
      10. Outro
      
      Additional:
      - Rhyme scheme notes
      - Melody suggestions
      - Production notes (instrumentation, arrangement)
      - Harmony ideas for chorus
      
      Make it catchy and emotionally resonant.
    id: lyrics

  - node: file_write
    params:
      path: song-lyrics.md
    input: lyrics
    id: save

  - node: notify
    params:
      channel: stdout
    input: lyrics
    id: notify
