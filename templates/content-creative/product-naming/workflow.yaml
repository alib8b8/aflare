name: Product Naming Generator
# Brainstorm product and brand names with evaluation
# Usage: aflare install creative/product-naming
#        aflare run product-naming/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 4
    input: |
      Generate creative product or brand name ideas for {{ .params.product_description }}.

      Product description: {{ .params.product_description }}
      Industry: {{ .params.industry }}
      Target audience: {{ .params.audience }}
      Brand architecture: {{ .params.brand_architecture }}
      Naming style preference: {{ .params.naming_style }}
      Competitor names: {{ .params.competitor_names }}
      Keywords to incorporate: {{ .params.keywords }}
      Language considerations: {{ .params.language }}

      Generate the following naming outputs:
      1. Naming Strategy
         - Brand naming architecture (master brand, sub-brand, endorsed)
         - Naming territory map
         - Phonetic and semantic considerations
         - Cultural sensitivity notes
      2. Name Categories (10 names per category)
         - Descriptive names (describe what the product does)
         - Evocative names (suggest an experience or feeling)
         - Invented/coined names (new word creation)
         - Compound names (two words combined)
         - Metaphorical names (symbolic associations)
         - Acronym-based names (from key phrases)
         - Founder/persona names (personal brand style)
         - Geographical names (place-inspired)
      3. Name Evaluation Matrix
         For the top 20 names, score each on:
         - Memorability (1-10)
         - Pronounceability (1-10)
         - Uniqueness (1-10)
         - Brand fit (1-10)
         - Domain availability potential
         - Trademark risk level
         - International appeal
      4. Top Recommendations
         - Top 5 names with detailed rationale
         - Name story/narrative for each
         - Logo concept suggestion for each
         - Tagline pairing suggestion
         - Sub-brand extension potential
      5. Validation Checklist
         - Domain name availability (common TLDs)
         - Social media handle availability
         - USPTO trademark search guidance
         - Negative connotations check
         - Competitor similarity analysis
    id: naming_output

  - node: transform
    params:
      operation: extract_sections
      sections:
        - strategy
        - names
        - evaluation
        - recommendations
        - validation
    input: naming_output
    id: structured_output

  - node: file_write
    params:
      path: product-names.md
    input: naming_output
    id: save_full

  - node: file_write
    params:
      path: product-names-evaluation.json
    input: structured_output
    id: save_evaluation

  - node: notify
    params:
      channel: stdout
    input: naming_output
    id: notify