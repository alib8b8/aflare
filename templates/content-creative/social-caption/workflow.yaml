name: Social Media Caption Generator
# Generate social media captions for Instagram, LinkedIn, Twitter, and more
# Usage: aflare install creative/social-caption
#        aflare run social-caption/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Generate engaging social media captions for {{ .params.platform }}.

      Platform: {{ .params.platform }}
      Content type: {{ .params.content_type }}
      Topic/theme: {{ .params.topic }}
      Brand voice: {{ .params.brand_voice }}
      Goal: {{ .params.goal }}
      Target audience: {{ .params.audience }}
      Hashtag strategy: {{ .params.hashtag_strategy }}

      Generate the following:
      1. Primary Caption
         - Hook line (first sentence that stops the scroll)
         - Body text (engaging, value-driven)
         - Call to action (clear, platform-appropriate)
         - Emoji placement suggestions
      2. Caption Variations
         - Short form (for stories/reels)
         - Long form (for carousel/educational posts)
         - Conversational variant
         - Professional variant
         - Witty/humorous variant
      3. Hashtag Sets
         - Broad reach hashtags (5-10)
         - Niche-specific hashtags (5-10)
         - Branded hashtags (3-5)
         - Trending hashtags (if relevant)
      4. Platform-Specific Optimizations
         - Instagram: Alt text suggestion, location tag, collab suggestions
         - LinkedIn: Professional tone adjustment, industry hashtags, @mentions
         - Twitter/X: Thread structure, character count optimization
         - Facebook: Community engagement prompts
         - TikTok: Trend reference, sound suggestion
      5. Engagement Strategy
         - Poll/quiz idea for stories
         - Discussion starter question
         - User-generated content prompt
         - Reply strategy for comments
    id: social_caption

  - node: transform
    params:
      operation: extract_sections
      sections:
        - primary_caption
        - variations
        - hashtags
        - platform_optimizations
        - engagement_strategy
    input: social_caption
    id: structured_output

  - node: file_write
    params:
      path: social-caption.md
    input: social_caption
    id: save_full

  - node: file_write
    params:
      path: social-caption-optimized.json
    input: structured_output
    id: save_optimized

  - node: notify
    params:
      channel: stdout
    input: social_caption
    id: notify