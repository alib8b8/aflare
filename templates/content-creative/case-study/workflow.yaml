name: Case Study Generator
# Generate customer case study template
# Usage: aflare install writing-content/case-study
#        aflare run case-study/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Create a compelling customer case study for {{ .params.company }}.
      
      Customer: {{ .params.customer }}
      Industry: {{ .params.industry }}
      Challenge: {{ .params.challenge }}
      Solution: {{ .params.solution }}
      Results: {{ .params.results }}
      
      Case study structure:
      1. Headline (results-focused)
      2. Customer profile box
         - Company name, industry, size, location
         - Product/service used
      3. Executive Summary
      4. The Challenge
         - Business problem
         - Why they needed a solution
         - What they tried before
      5. The Solution
         - Why they chose you
         - Implementation process
         - Key features used
      6. The Results
         - Quantifiable metrics (before/after)
         - Business impact
         - ROI calculation
      7. Quotes
         - Customer quote (executive)
         - Customer quote (end user)
      8. Next Steps / Future Plans
      9. Call to Action
      
      Write in a story-telling, benefit-focused way.
      Include specific numbers where possible.
    id: case_study

  - node: file_write
    params:
      path: case-study.md
    input: case_study
    id: save
