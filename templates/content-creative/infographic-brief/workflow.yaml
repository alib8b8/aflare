name: Infographic Brief Generator
# Generate infographic content briefs and data outlines
# Usage: aflare install creative/infographic-brief
#        aflare run infographic-brief/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Create a detailed infographic content brief for {{ .params.topic }}.

      Topic: {{ .params.topic }}
      Industry: {{ .params.industry }}
      Target audience: {{ .params.audience }}
      Infographic type: {{ .params.infographic_type }}
      Data sources: {{ .params.data_sources }}
      Brand style: {{ .params.brand_style }}
      Goal: {{ .params.goal }}

      Generate the following infographic brief components:
      1. Infographic Strategy
         - Infographic type (statistical, timeline, process, comparison, etc.)
         - Core message and key takeaway
         - Target audience persona
         - Distribution channels
         - SEO keyword strategy
      2. Content Outline
         - Title (3 options, data-driven and click-worthy)
         - Subtitle
         - Introduction section (setting context)
         - Main data points (8-12 key statistics or facts)
         - Data visualization suggestions for each point
         - Narrative flow and story arc
         - Conclusion and CTA
      3. Data Breakdown
         - Data point 1: Statistic, source, visualization type
         - Data point 2: Statistic, source, visualization type
         - (continue for all data points)
         - Source citations for all data
         - Data accuracy notes
      4. Visual Design Direction
         - Color palette (primary, secondary, accent)
         - Icon style and suggestions
         - Chart/graph types for each data point
         - Layout structure (vertical, horizontal, modular)
         - Typography hierarchy
         - Illustration style direction
         - Brand element placement
      5. Section-by-Section Wireframe
         - Header section (title, subtitle, branding)
         - Section 1: content, visual elements, dimensions
         - Section 2: content, visual elements, dimensions
         - (continue for all sections)
         - Footer section (sources, logo, CTA, URL)
      6. Distribution Plan
         - Social media snippet versions
         - Blog post companion content
         - Email newsletter teaser
         - Pinterest-optimized version notes
         - Embed code description
    id: infographic_brief

  - node: transform
    params:
      operation: extract_sections
      sections:
        - strategy
        - content_outline
        - data_breakdown
        - visual_design
        - wireframe
        - distribution
    input: infographic_brief
    id: structured_output

  - node: file_write
    params:
      path: infographic-brief.md
    input: infographic_brief
    id: save_brief

  - node: file_write
    params:
      path: infographic-brief-design.json
    input: structured_output
    id: save_design

  - node: notify
    params:
      channel: stdout
    input: infographic_brief
    id: notify