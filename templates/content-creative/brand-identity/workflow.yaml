name: Brand Identity Guide
# Generate complete brand identity guide
# Usage: aflare install creative/brand-identity
#        aflare run brand-identity/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 4
    input: |
      Create a complete brand identity guide for {{ .params.brand }}.
      
      Brand name: {{ .params.brand }}
      Industry: {{ .params.industry }}
      Target audience: {{ .params.audience }}
      Brand personality: {{ .params.personality }}
      
      Brand identity guide:
      1. Brand Strategy
         - Brand mission
         - Brand vision
         - Core values (3-5)
         - Brand promise
         - Brand positioning statement
      2. Brand Voice
         - Voice characteristics
         - Do's and Don'ts
         - Example copy
         - Tone variations for different channels
      3. Visual Identity
         - Logo concept descriptions (3 concepts)
         - Color palette (primary, secondary, accent)
         - Typography (heading, body, accent fonts)
         - Photography style
         - Illustration style
         - Iconography style
      4. Brand Messaging
         - Tagline (5 alternatives)
         - Elevator pitch
         - Key messages (3-5)
         - Value proposition
      5. Brand Applications
         - Business card design description
         - Social media templates
         - Website header description
         - Email signature
         - Merchandise ideas
      6. Brand Guidelines
         - Logo usage
         - Color usage
         - Typography rules
         - What to avoid
    id: brand_guide

  - node: file_write
    params:
      path: brand-identity-guide.md
    input: brand_guide
    id: save

  - node: notify
    params:
      channel: stdout
    input: brand_guide
    id: notify
