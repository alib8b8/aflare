name: Slogan Generator
# Generate brand slogans and taglines
# Usage: aflare install creative/slogan-generator
#        aflare run slogan-generator/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 4
    input: |
      Generate compelling brand slogans and taglines for {{ .params.brand }}.

      Brand name: {{ .params.brand }}
      Industry: {{ .params.industry }}
      Brand personality: {{ .params.personality }}
      Core values: {{ .params.values }}
      Target audience: {{ .params.audience }}
      Unique selling proposition: {{ .params.usp }}
      Competitor slogans: {{ .params.competitor_slogans }}
      Language: {{ .params.language }}

      Generate the following slogan categories:
      1. Slogan Strategy
         - Brand positioning analysis
         - Emotional territory mapping
         - Key message pillars
         - Slogan architecture (master + sub-slogans)
      2. Slogan Categories
         - Emotional/aspirational slogans (10 options)
           - Short (3-5 words)
           - Medium (5-8 words)
           - With wordplay
         - Descriptive/functional slogans (10 options)
           - Direct benefit-focused
           - Problem-solution framework
           - Feature-highlighting
         - Command/action-oriented slogans (10 options)
           - Call to action style
           - Imperative mood
           - Challenge-based
         - Rhythmic/rhyming slogans (10 options)
           - With rhyme scheme
           - Alliterative
           - Musical/catchy
      3. Tagline Variants
         - One-word taglines (5 options)
         - Question-based taglines (5 options)
         - Provocative/challenger taglines (5 options)
         - Story-mini taglines (5 options)
      4. Evaluation Matrix
         - Memorability score for top 10
         - Brand alignment score
         - Differentiation score
         - Emotional impact score
         - Versatility across channels
      5. Top Recommendations
         - Top 3 slogans with rationale
         - Best tagline for each use case
           - Website hero
           - Social media bio
           - Email signature
           - Product packaging
           - Billboard/outdoor
         - International translation considerations
         - Trademark availability notes
    id: slogan_output

  - node: transform
    params:
      operation: extract_sections
      sections:
        - strategy
        - slogans
        - taglines
        - evaluation
        - recommendations
    input: slogan_output
    id: structured_output

  - node: file_write
    params:
      path: brand-slogans.md
    input: slogan_output
    id: save_full

  - node: file_write
    params:
      path: slogan-recommendations.json
    input: structured_output
    id: save_recommendations

  - node: notify
    params:
      channel: stdout
    input: slogan_output
    id: notify