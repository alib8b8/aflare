name: Crypto Tracker
# Cryptocurrency portfolio tracker and alert
# Usage: aflare install finance/crypto-tracker
#        aflare run crypto-tracker/workflow.yaml

steps:
  - node: http_request
    params:
      url: "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids={{ .params.coin_ids }}&order=market_cap_desc&sparkline=true&price_change_percentage=1h,24h,7d,30d"
      method: GET
      timeout: 30s
    id: price_data

  - node: file_read
    params:
      path: "{{ .params.portfolio_file }}"
    id: portfolio

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render,json_parse
      max_iterations: 3
    input: |
      Analyze cryptocurrency portfolio performance:

      Current Prices:
      {{ .price_data }}

      Portfolio Holdings:
      {{ .portfolio }}

      Alert Thresholds: {{ .params.alert_thresholds }}

      Generate:
      1. PORTFOLIO OVERVIEW
         - Total portfolio value
         - 24h change ($ and %)
         - 7d, 30d performance
         - All-time performance

      2. ASSET BREAKDOWN
         - Individual coin performance
         - Weight in portfolio
         - Profit/loss per position
         - Cost basis vs current value

      3. MARKET ANALYSIS
         - Market cap ranking
         - Volume analysis
         - Market dominance
         - Fear & Greed indicators

      4. TECHNICAL ANALYSIS
         - Support and resistance levels
         - Moving averages (50, 200 MA)
         - RSI and MACD signals
         - Trend direction

      5. RISK ASSESSMENT
         - Portfolio concentration risk
         - Volatility metrics
         - Correlation between holdings
         - Downside risk analysis

      6. ALERTS AND SIGNALS
         - Price crossing alert thresholds
         - Volume spike detection
         - Trend reversal signals
         - Take-profit / stop-loss triggers

      7. REBALANCING SUGGESTIONS
         - Overweight positions
         - Underweight positions
         - Suggested trades
         - Tax-loss harvesting opportunities
    id: analysis

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json

      prices = {{ .price_data }}
      portfolio = {{ .portfolio }}
      analysis = {{ .analysis }}

      # Calculate portfolio metrics
      total_value = 0
      total_cost = 0
      positions = []

      if isinstance(prices, list):
          for coin in prices:
              symbol = coin.get('symbol', 'unknown').upper()
              price = coin.get('current_price', 0) or 0
              change_24h = coin.get('price_change_percentage_24h', 0) or 0
              market_cap = coin.get('market_cap', 0) or 0

              # Find matching portfolio entry
              holding = next((h for h in (portfolio if isinstance(portfolio, list) else []) if h.get('symbol', '').upper() == symbol), None)
              if holding:
                  qty = holding.get('quantity', 0) or 0
                  cost = holding.get('cost_basis', 0) or 0
                  value = qty * price
                  pnl = value - cost
                  total_value += value
                  total_cost += cost
                  positions.append({
                      'symbol': symbol,
                      'price': price,
                      'quantity': qty,
                      'value': value,
                      'cost': cost,
                      'pnl': pnl,
                      'pnl_pct': (pnl / cost * 100) if cost > 0 else 0,
                      'change_24h': change_24h,
                      'weight': 0  # will calculate after
                  })

      # Calculate weights
      for p in positions:
          p['weight'] = (p['value'] / total_value * 100) if total_value > 0 else 0

      total_pnl = total_value - total_cost
      total_pnl_pct = (total_pnl / total_cost * 100) if total_cost > 0 else 0

      print("## Portfolio Summary")
      print(f"Total Value: ${total_value:,.2f}")
      print(f"Total Cost: ${total_cost:,.2f}")
      print(f"Total P/L: ${total_pnl:,.2f} ({total_pnl_pct:.1f}%)")
      print()
      print(f"{'Asset':<10} {'Price':>10} {'Qty':>8} {'Value':>12} {'P/L':>10} {'Weight':>8} {'24h':>8}")
      print("-" * 75)
      for p in sorted(positions, key=lambda x: x['value'], reverse=True):
          print(f"{p['symbol']:<10} ${p['price']:>9,.2f} {p['quantity']:>8.4f} ${p['value']:>11,.2f} {p['pnl_pct']:>9.1f}% {p['weight']:>7.1f}% {p['change_24h']:>7.1f}%")
    id: calculations

  - node: file_write
    params:
      path: crypto-tracker-report.md
    input: |
      # Cryptocurrency Portfolio Report

      Generated: {{ .metadata.timestamp }}

      ## Analysis
      {{ .analysis }}

      ## Portfolio Metrics
      {{ .calculations }}
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      Crypto portfolio tracking complete. Report saved to crypto-tracker-report.md
    id: notify