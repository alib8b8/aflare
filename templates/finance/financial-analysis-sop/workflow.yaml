name: financial-analysis
description: 金融分析 SOP - 多角色协作财务分析工作流
version: "1.0"
category: finance
tags: [finance, analysis, investment, risk, sop]

params:
  - name: company_name
    description: 公司名称或标的
    required: true
  - name: analysis_type
    description: 分析类型（investment, credit, valuation, performance）
    default: investment
  - name: report_file
    description: 财报或数据文件路径（可选）
    default: ""
  - name: risk_tolerance
    description: 风险偏好（conservative, moderate, aggressive）
    default: moderate

steps:
  - node: supervisor
    params:
      strategy: parallel
      domain: finance
      output_format: json
    input: |
      请制定关于"{{ .params.company_name }}"的金融分析方案。

      **分析类型：** {{ .params.analysis_type }}
      **风险偏好：** {{ .params.risk_tolerance }}

      **参与专家：**
      1. financial_expert - 财务专家：财务报表分析、盈利能力分析
      2. data_analyst - 数据分析师：数据可视化、趋势分析
      3. researcher - 研究员：行业研究、竞品分析
      4. critic - 风险评论家：风险评估、负面因素
      5. evaluator - 评估员：综合评级和建议

      请将分析任务分成并行执行的几组。
    id: analysis_plan

  - node: ollama
    params:
      model: "llama3"
      system: |
        你是一名资深财务分析师。请进行财务分析：
        1. 盈利能力分析（毛利率、净利率、ROE、ROA）
        2. 偿债能力分析（资产负债率、流动比率、速动比率）
        3. 营运能力分析（周转率、周转天数）
        4. 成长能力分析（收入增长、利润增长）
        5. 现金流分析（经营、投资、筹资现金流）
        6. 财务健康综合评分

        请用专业但易懂的语言分析。
    input: |
      分析对象：{{ .params.company_name }}
      分析类型：{{ .params.analysis_type }}
      风险偏好：{{ .params.risk_tolerance }}

      分析计划：
      {{ .steps.analysis_plan.output }}

      {{ if .params.report_file }}
      参考数据文件：{{ .params.report_file }}
      {{ end }}

      请进行全面的财务分析。
    id: financial_analysis

  - node: ollama
    params:
      model: "llama3"
      system: |
        你是一名行业研究专家。请进行行业和竞争分析：
        1. 行业概况和发展趋势
        2. 竞争格局和市场份额
        3. 主要竞争对手分析
        4. 行业增长驱动因素
        5. 政策和监管环境
        6. 技术变革影响

        请基于公开信息进行分析。
    input: |
      分析对象：{{ .params.company_name }}
      分析类型：{{ .params.analysis_type }}

      请进行行业和竞争分析。
    id: industry_analysis

  - node: ollama
    params:
      model: "llama3"
      system: |
        你是一名风险评估专家。请进行风险分析：
        1. 市场风险
        2. 信用风险
        3. 流动性风险
        4. 操作风险
        5. 法律合规风险
        6. 行业特定风险
        7. 风险矩阵（可能性 vs 影响）
        8. 风险缓释建议

        请全面评估潜在风险。
    input: |
      分析对象：{{ .params.company_name }}
      风险偏好：{{ .params.risk_tolerance }}

      财务分析：
      {{ .steps.financial_analysis.output }}

      行业分析：
      {{ .steps.industry_analysis.output }}

      请进行全面的风险评估。
    id: risk_analysis

  - node: ollama
    params:
      model: "llama3"
      system: |
        你是一名投资评估专家。请综合所有分析结果：
        1. 投资价值评估
        2. 综合评级（买入/持有/卖出）
        3. 目标价格或估值区间（如适用）
        4. 投资建议
        5. 关键假设和不确定性
        6. 后续跟踪指标

        请给出明确、有依据的结论。
    input: |
      分析对象：{{ .params.company_name }}
      分析类型：{{ .params.analysis_type }}
      风险偏好：{{ .params.risk_tolerance }}

      财务分析：
      {{ .steps.financial_analysis.output }}

      行业分析：
      {{ .steps.industry_analysis.output }}

      风险分析：
      {{ .steps.risk_analysis.output }}

      分析计划：
      {{ .steps.analysis_plan.output }}

      请进行综合评估并给出最终建议。
    id: final_evaluation

  - node: template_render
    params:
      template: |
        # 金融分析报告：{{ .params.company_name }}

        **分析类型：** {{ .params.analysis_type }}
        **风险偏好：** {{ .params.risk_tolerance }}
        **报告生成时间：** {{ .metadata.timestamp }}

        ---

        ## 一、分析计划

        {{ .steps.analysis_plan.output }}

        ---

        ## 二、财务分析

        {{ .steps.financial_analysis.output }}

        ---

        ## 三、行业与竞争分析

        {{ .steps.industry_analysis.output }}

        ---

        ## 四、风险评估

        {{ .steps.risk_analysis.output }}

        ---

        ## 五、综合评估与建议

        {{ .steps.final_evaluation.output }}

        ---

        > ⚠️ **免责声明**：本报告仅供参考，不构成投资建议。
        > 投资有风险，决策需谨慎。

        *报告生成时间：{{ .metadata.timestamp }}*
    id: final_report

output: "{{ .steps.final_report.output }}"
