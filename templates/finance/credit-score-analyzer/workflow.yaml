name: Credit Score Analyzer
# Credit score analysis and improvement suggestions
# Usage: aflare install finance/credit-score-analyzer
#        aflare run credit-score-analyzer/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.credit_report }}"
    id: credit_data

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render,json_parse
      max_iterations: 3
    input: |
      Analyze the credit profile and provide improvement recommendations:

      Credit Report Data:
      {{ .credit_data }}

      Profile:
      - Current Score: {{ .params.current_score }}
      - Score Model: {{ .params.score_model }}
      - Goal Score: {{ .params.goal_score }}
      - Timeline: {{ .params.timeline }}

      Analyze:
      1. SCORE COMPOSITION
         - Payment history impact (35%)
         - Credit utilization impact (30%)
         - Credit age impact (15%)
         - Credit mix impact (10%)
         - New credit impact (10%)

      2. STRENGTHS
         - What is working well
         - Positive factors contributing to score

      3. WEAKNESSES
         - Negative items dragging score down
         - Collection accounts, late payments, charge-offs
         - Hard inquiries impact

      4. IMPROVEMENT PLAN
         - Immediate actions (next 30 days)
         - Short-term strategies (1-3 months)
         - Medium-term strategies (3-6 months)
         - Long-term strategies (6-12 months)

      5. SCORE PROJECTION
         - Estimated score in 3 months
         - Estimated score in 6 months
         - Estimated score in 12 months
         - Time to reach goal score

      6. DISPUTE RECOMMENDATIONS
         - Items that may be disputable
         - Steps to dispute errors

      7. CREDIT BUILDING OPTIONS
         - Secured credit cards
         - Credit builder loans
         - Authorized user strategy
    id: analysis

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json

      analysis = {{ .analysis }}
      current_score = int({{ .params.current_score }})
      goal_score = int({{ .params.goal_score }})

      # Score improvement projection
      improvement_rates = {
          'payment_history': 2.5,  # points per month
          'utilization': 3.0,
          'credit_age': 1.0,
          'credit_mix': 0.5,
          'new_credit': 1.5
      }

      # Estimate monthly improvement
      monthly_gain = sum(improvement_rates.values())
      gap = max(0, goal_score - current_score)
      months_to_goal = gap / monthly_gain if monthly_gain > 0 else float('inf')

      print("## Score Projection")
      print(f"Current Score: {current_score}")
      print(f"Goal Score: {goal_score}")
      print(f"Score Gap: {gap}")
      print(f"Estimated Monthly Improvement: {monthly_gain:.1f} points")
      print(f"Estimated Time to Goal: {months_to_goal:.1f} months")
      print()
      for m in [3, 6, 12]:
          projected = min(current_score + monthly_gain * m, 850)
          print(f"Projected Score in {m} months: {projected:.0f}")
    id: projections

  - node: file_write
    params:
      path: credit-score-analysis.md
    input: |
      # Credit Score Analysis Report

      Generated: {{ .metadata.timestamp }}

      ## Analysis
      {{ .analysis }}

      ## Score Projections
      {{ .projections }}

      ---
      > **Disclaimer:** This analysis is for educational purposes. Results are not guaranteed.
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      Credit score analysis complete. Report saved to credit-score-analysis.md
    id: notify