name: Stock Screener
# Stock screening and filtering tool
# Usage: aflare install finance/stock-screener
#        aflare run stock-screener/workflow.yaml

steps:
  - node: http_request
    params:
      url: "{{ .params.market_api_url }}"
      method: GET
      timeout: 30s
      headers:
        Authorization: "Bearer {{ .params.api_key }}"
    id: market_data

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render,json_parse
      max_iterations: 3
    input: |
      Screen stocks based on the following criteria:

      Market Data:
      {{ .market_data }}

      Screening Criteria:
      - Market Cap: {{ .params.market_cap_min }} - {{ .params.market_cap_max }}
      - Sector: {{ .params.sector }}
      - P/E Ratio: {{ .params.pe_min }} - {{ .params.pe_max }}
      - Dividend Yield: {{ .params.div_yield_min }}% minimum
      - Revenue Growth: {{ .params.revenue_growth_min }}% minimum
      - Debt/Equity: {{ .params.de_ratio_max }} maximum
      - ROE: {{ .params.roe_min }}% minimum
      - Beta: {{ .params.beta_min }} - {{ .params.beta_max }}
      - Price: {{ .params.price_min }} - {{ .params.price_max }}

      For each stock passing the screen:
      1. Company Profile
         - Business description
         - Sector and industry
         - Market cap classification

      2. Valuation Metrics
         - P/E, P/B, P/S, EV/EBITDA
         - PEG ratio
         - Price to book value

      3. Growth Metrics
         - Revenue growth (YoY, 3yr, 5yr)
         - Earnings growth (YoY, 3yr, 5yr)
         - EPS trend

      4. Profitability
         - Gross margin, operating margin, net margin
         - ROE, ROA, ROIC
         - Free cash flow yield

      5. Financial Health
         - Current ratio, quick ratio
         - Debt/equity, interest coverage
         - Altman Z-score

      6. Technical Indicators
         - RSI, MACD, moving averages
         - Support and resistance levels
         - Volume trends

      7. Risk Assessment
         - Beta and volatility
         - Short interest
         - Insider trading activity

      8. Overall Score and Ranking
    id: screening_results

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json

      results = {{ .screening_results }}
      stocks = results.get('stocks', []) if isinstance(results, dict) else []

      # Calculate composite score
      for stock in stocks:
          score = 0
          metrics = stock.get('metrics', {})

          # PE score (lower is better, but not negative)
          pe = metrics.get('pe_ratio', 0) or 0
          if 10 <= pe <= 25:
              score += 2
          elif 0 < pe < 10:
              score += 1

          # ROE score
          roe = metrics.get('roe', 0) or 0
          if roe >= 15:
              score += 2
          elif roe >= 10:
              score += 1

          # Growth score
          growth = metrics.get('revenue_growth', 0) or 0
          if growth >= 15:
              score += 2
          elif growth >= 5:
              score += 1

          stock['composite_score'] = score

      stocks.sort(key=lambda x: x.get('composite_score', 0), reverse=True)

      print("## Stock Screening Results")
      print(f"Stocks Screened: {len(stocks)}")
      print()
      print(f"{'Rank':<5} {'Ticker':<8} {'Name':<20} {'Score':<6} {'P/E':<8} {'ROE':<8} {'Growth':<8}")
      print("-" * 70)
      for i, s in enumerate(stocks[:25]):
          m = s.get('metrics', {})
          print(f"{i+1:<5} {s.get('ticker', 'N/A'):<8} {s.get('name', 'N/A'):<20} {s.get('composite_score', 0):<6} {m.get('pe_ratio', 'N/A'):<8} {m.get('roe', 'N/A'):<8} {m.get('revenue_growth', 'N/A'):<8}")
    id: scoring

  - node: file_write
    params:
      path: stock-screener-results.md
    input: |
      # Stock Screener Results

      Screening Date: {{ .metadata.timestamp }}

      ## Screening Results
      {{ .screening_results }}

      ## Composite Scoring
      {{ .scoring }}
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      Stock screening complete. Results saved to stock-screener-results.md
    id: notify