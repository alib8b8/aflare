name: Investment Portfolio Review
# Review and optimize investment portfolio
# Usage: aflare install finance-investing/portfolio-review
#        aflare run portfolio-review/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.portfolio_file }}"
    id: portfolio_data

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Conduct an investment portfolio review based on:
      {{ .portfolio_data }}
      
      Investor profile:
      - Age: {{ .params.age }}
      - Risk tolerance: {{ .params.risk_tolerance }}
      - Time horizon: {{ .params.time_horizon }}
      - Investment goals: {{ .params.goals }}
      
      Portfolio review should include:
      1. Current Asset Allocation
         - Breakdown by asset class
         - Geographic allocation
         - Sector concentration
      2. Performance Analysis
         - Overall returns
         - vs benchmarks
         - Individual holding performance
      3. Risk Assessment
         - Diversification analysis
         - Concentration risk
         - Correlation analysis
      4. Fee Analysis
         - Expense ratios
         - Trading costs
         - Tax implications
      5. Recommendations
         - Rebalancing suggestions
         - New positions to consider
         - Positions to reduce/eliminate
         - Tax-loss harvesting opportunities
      6. Action Plan
         - Immediate actions
         - Over next 3 months
         - Ongoing monitoring
      
      Include appropriate disclaimers.
    id: review

  - node: file_write
    params:
      path: portfolio-review.md
    input: review
    id: save
