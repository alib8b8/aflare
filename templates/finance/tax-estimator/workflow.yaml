name: Tax Estimator
# Tax liability estimation and planning
# Usage: aflare install finance/tax-estimator
#        aflare run tax-estimator/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.income_file }}"
    id: income_data

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render,json_parse
      max_iterations: 3
    input: |
      Estimate tax liability based on the following information:

      Income Data:
      {{ .income_data }}

      Taxpayer Profile:
      - Filing Status: {{ .params.filing_status }}
      - State: {{ .params.state }}
      - Dependents: {{ .params.dependents }}
      - Age: {{ .params.age }}

      Tax Parameters:
      - Tax Year: {{ .params.tax_year }}
      - Country: {{ .params.country }}

      Calculate:
      1. Gross Income Breakdown
         - Wages and salaries
         - Investment income (dividends, interest, capital gains)
         - Business/self-employment income
         - Rental income
         - Other income sources

      2. Adjustments and Deductions
         - Standard vs itemized deduction comparison
         - Retirement contributions (401k, IRA)
         - Health savings account (HSA)
         - Student loan interest
         - Self-employment deductions

      3. Tax Credits
         - Child tax credit
         - Earned income tax credit
         - Education credits
         - Energy credits

      4. Tax Liability Calculation
         - Federal income tax by bracket
         - State income tax
         - Self-employment tax (if applicable)
         - Net investment income tax
         - Alternative minimum tax check

      5. Effective Tax Rate

      6. Estimated Refund or Amount Owed

      7. Tax Planning Recommendations
         - Strategies to reduce future liability
         - Estimated quarterly payments needed
         - Retirement contribution optimization
    id: tax_analysis

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json

      analysis = {{ .tax_analysis }}

      # Extract tax bracket calculations
      brackets = {
          'federal': [
              (11000, 0.10),
              (44725, 0.12),
              (95375, 0.22),
              (182100, 0.24),
              (231250, 0.32),
              (578125, 0.35),
              (float('inf'), 0.37)
          ]
      }

      # Calculate progressive tax
      def calc_tax(income, brackets):
          tax = 0
          prev = 0
          for limit, rate in brackets:
              if income > prev:
                  taxable = min(income, limit) - prev
                  tax += taxable * rate
              prev = limit
          return tax

      # Placeholder for actual income extraction
      estimated_income = float(analysis.get('gross_income', 0) or 0)
      federal_tax = calc_tax(estimated_income, brackets['federal'])
      effective_rate = (federal_tax / estimated_income * 100) if estimated_income > 0 else 0

      print(f"## Tax Summary")
      print(f"Estimated Gross Income: ${estimated_income:,.2f}")
      print(f"Estimated Federal Tax: ${federal_tax:,.2f}")
      print(f"Effective Federal Rate: {effective_rate:.1f}%")
    id: calculations

  - node: file_write
    params:
      path: tax-estimate-report.md
    input: |
      # Tax Liability Estimate
      
      Tax Year: {{ .params.tax_year }}
      Generated: {{ .metadata.timestamp }}
      
      ## Analysis
      {{ .tax_analysis }}
      
      ## Calculations
      {{ .calculations }}
      
      ---
      > **Disclaimer:** This is an estimate only. Consult a tax professional for official advice.
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      Tax estimation complete. Report saved to tax-estimate-report.md
    id: notify