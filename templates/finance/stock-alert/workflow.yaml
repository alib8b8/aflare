name: A-Share Price Alert
description: Monitor an A-share stock price and alert when the threshold is crossed.
# Monitors an A-share stock price and alerts when the threshold is crossed.
# Usage: aflare install finance/stock-alert
#        aflare run stock-alert/workflow.yaml
# Config: aflare run stock-alert/workflow.yaml --set symbol=sh600519 --set threshold=1400
#         (or edit the defaults in vars: below)
# Data source: Tencent quote API (web.ifzq.gtimg.cn) — UTF-8 JSON, no auth,
# returns the live price as a decimal string the gt/lt operators can compare.
# symbol: sh600519 (Shanghai) / sz000001 (Shenzhen) — 6xx→sh, 0xx/3xx→sz

# vars are the workflow's defaults; --set symbol=... overrides them at run time.
vars:
  symbol: sh600519
  threshold: "1400"

steps:
  - node: http_request
    params:
      url: "https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param={{var.symbol}},day,,,1,qfq"
      method: GET
      timeout: "30"
    name: fetch_quote

  # data.<symbol>.qt.<symbol>.[3] is the live price field of the Tencent qt
  # snapshot (decimal string, e.g. "1307.88").
  - node: json_parse
    params:
      path: "data.{{var.symbol}}.qt.{{var.symbol}}.[3]"
    name: current_price

  # Step-level if: the gt operator compares the previous step's output (the
  # parsed price) against the threshold. {{ .input }} below is NOT a workflow
  # expression — the engine leaves unknown expressions verbatim, so it reaches
  # template_render's Go template, where .input is the step's input (the price).
  - if:
      condition: "gt:{{var.threshold}}"
      then:
        - node: template_render
          params:
            template: |
              A-Share Price Alert
              Symbol: {{var.symbol}}
              Current: ¥{{ .input }} CNY
              Threshold: ¥{{var.threshold}} CNY
          name: alert_message
        - node: notify
          params:
            channel: stdout
          name: notify
        - node: file_write
          params:
            path: stock-alert.log
            mode: append
          name: log
