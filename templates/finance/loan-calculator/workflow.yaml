name: Loan Calculator
# Loan comparison and amortization schedule
# Usage: aflare install finance/loan-calculator
#        aflare run loan-calculator/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render,json_parse
      max_iterations: 3
    input: |
      Analyze and compare the following loan options:

      Loan Scenarios:
      {{ .params.loan_scenarios }}

      Loan Type: {{ .params.loan_type }}
      Borrower Profile: {{ .params.borrower_profile }}

      For each loan scenario, calculate:
      1. Monthly payment (principal + interest)
      2. Total interest paid over loan life
      3. Total cost of loan
      4. Amortization schedule (first 12 months and annual summary)
      5. Effective APR including fees

      Comparison Analysis:
      1. Side-by-side comparison of all scenarios
      2. Interest savings between options
      3. Break-even analysis for points/fees
      4. Prepayment analysis (impact of extra payments)
      5. Recommendation based on borrower profile

      Loan Type Specifics:
      - Mortgage: PMI calculation, property tax, insurance escrow
      - Auto: Depreciation schedule, gap insurance consideration
      - Personal: Debt consolidation savings analysis
      - Student: Income-based repayment options, forgiveness eligibility
      - Business: SBA options, equipment depreciation
    id: analysis

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json

      analysis = {{ .analysis }}

      # Amortization calculation function
      def calculate_amortization(principal, annual_rate, term_months, extra_payment=0):
          monthly_rate = annual_rate / 12 / 100
          if monthly_rate == 0:
              payment = principal / term_months
          else:
              payment = principal * (monthly_rate * (1 + monthly_rate) ** term_months) / ((1 + monthly_rate) ** term_months - 1)

          balance = principal
          total_interest = 0
          schedule = []

          for month in range(1, term_months + 1):
              interest = balance * monthly_rate
              principal_paid = payment - interest + extra_payment
              balance -= principal_paid
              total_interest += interest
              if balance < 0:
                  balance = 0
              if month <= 12 or month % 12 == 0:
                  schedule.append({
                      'month': month,
                      'payment': payment + extra_payment,
                      'interest': interest,
                      'principal': principal_paid,
                      'balance': max(0, balance)
                  })
              if balance <= 0:
                  break

          return {
              'monthly_payment': payment,
              'total_interest': total_interest,
              'schedule': schedule
          }

      # Parse scenarios from analysis
      scenarios = analysis.get('scenarios', []) if isinstance(analysis, dict) else []

      print("## Amortization Comparison")
      for s in scenarios:
          result = calculate_amortization(
              principal=s.get('principal', 0),
              annual_rate=s.get('rate', 0),
              term_months=s.get('term_months', 360)
          )
          print(f"### {s.get('name', 'Loan')}")
          print(f"- Monthly Payment: ${result['monthly_payment']:.2f}")
          print(f"- Total Interest: ${result['total_interest']:.2f}")
          print()
    id: calculations

  - node: file_write
    params:
      path: loan-analysis-report.md
    input: |
      # Loan Comparison & Analysis Report

      Generated: {{ .metadata.timestamp }}

      ## Analysis
      {{ .analysis }}

      ## Amortization Details
      {{ .calculations }}
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      Loan analysis complete. Report saved to loan-analysis-report.md
    id: notify