name: Insurance Comparison Analyzer
# Insurance policy comparison analyzer
# Usage: aflare install finance/insurance-comparison
#        aflare run insurance-comparison/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.policies_file }}"
    id: policies_data

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render,json_parse
      max_iterations: 3
    input: |
      Compare and analyze insurance policies:

      Policy Data:
      {{ .policies_data }}

      Insurance Type: {{ .params.insurance_type }}
      Coverage Needs: {{ .params.coverage_needs }}
      Budget: {{ .params.budget }}

      For each policy, analyze:
      1. COVERAGE DETAILS
         - Coverage limits and sub-limits
         - Deductibles and copays
         - Exclusions and limitations
         - Waiting periods
         - Coverage territory

      2. COST ANALYSIS
         - Annual premium
         - Monthly premium
         - Payment frequency options
         - Discounts available
         - Rate lock guarantees

      3. BENEFITS COMPARISON
         - Additional riders and endorsements
         - Wellness programs
         - Telehealth options
         - Network size (health)
         - Claims process rating

      4. VALUE ASSESSMENT
         - Cost per unit of coverage
         - Coverage gap analysis
         - Over-insurance check
         - Deductible vs premium trade-off

      5. FINANCIAL STRENGTH
         - AM Best rating
         - S&P / Moody's rating
         - Claims satisfaction score
         - Complaint ratio

      6. RECOMMENDATION
         - Best overall value
         - Best for budget
         - Best comprehensive coverage
         - Policy stacking strategies
    id: comparison

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json

      comparison = {{ .comparison }}
      policies = comparison.get('policies', []) if isinstance(comparison, dict) else []

      # Calculate cost-effectiveness scores
      results = []
      for p in policies:
          premium = p.get('annual_premium', 0) or 0
          coverage = p.get('coverage_limit', 0) or 0
          deductible = p.get('deductible', 0) or 0

          cost_per_coverage = premium / coverage if coverage > 0 else float('inf')
          budget_impact = premium / 12  # monthly

          results.append({
              'name': p.get('name', 'Unknown'),
              'annual_premium': premium,
              'monthly_premium': budget_impact,
              'cost_per_1000_coverage': cost_per_coverage * 1000,
              'deductible': deductible
          })

      results.sort(key=lambda x: x['annual_premium'])

      print("## Policy Cost Comparison")
      print(f"{'Policy':<20} {'Annual':>12} {'Monthly':>10} {'Cost/1K':>10} {'Deductible':>12}")
      print("-" * 70)
      for r in results:
          print(f"{r['name']:<20} ${r['annual_premium']:>11,.2f} ${r['monthly_premium']:>9,.2f} ${r['cost_per_1000_coverage']:>9,.2f} ${r['deductible']:>11,.2f}")
    id: cost_analysis

  - node: file_write
    params:
      path: insurance-comparison-report.md
    input: |
      # Insurance Policy Comparison Report

      Insurance Type: {{ .params.insurance_type }}
      Generated: {{ .metadata.timestamp }}

      ## Comparison Analysis
      {{ .comparison }}

      ## Cost Breakdown
      {{ .cost_analysis }}
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      Insurance comparison complete. Report saved to insurance-comparison-report.md
    id: notify