name: Forex Analyzer
# Foreign exchange rate analysis and trend detection
# Usage: aflare install finance/forex-analyzer
#        aflare run forex-analyzer/workflow.yaml

steps:
  - node: http_request
    params:
      url: "https://api.exchangerate-api.com/v4/latest/{{ .params.base_currency }}"
      method: GET
      timeout: 30s
    id: current_rates

  - node: http_request
    params:
      url: "{{ .params.historical_api_url }}?base={{ .params.base_currency }}&target={{ .params.target_currency }}&days={{ .params.historical_days }}"
      method: GET
      timeout: 30s
    id: historical_data

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render,json_parse
      max_iterations: 3
    input: |
      Analyze foreign exchange rates and trends:

      Current Rates:
      {{ .current_rates }}

      Historical Data:
      {{ .historical_data }}

      Analysis Parameters:
      - Base Currency: {{ .params.base_currency }}
      - Target Currencies: {{ .params.target_currency }}
      - Timeframe: {{ .params.timeframe }}
      - Analysis Type: {{ .params.analysis_type }}

      Generate:
      1. CURRENT RATE SUMMARY
         - Direct and cross rates
         - Bid/Ask spread analysis
         - Real-time changes

      2. HISTORICAL TREND ANALYSIS
         - {{ .params.historical_days }}-day price movement
         - Support and resistance levels
         - Trend direction (bullish/bearish/neutral)
         - Key reversal points

      3. TECHNICAL INDICATORS
         - Moving averages (SMA 20, 50, 200)
         - RSI and overbought/oversold
         - MACD and signal crossovers
         - Bollinger Bands
         - Fibonacci retracement levels

      4. FUNDAMENTAL DRIVERS
         - Interest rate differentials
         - Inflation comparisons
         - GDP growth differentials
         - Trade balance impacts
         - Political/geopolitical factors

      5. VOLATILITY ANALYSIS
         - Historical volatility
         - Implied volatility
         - ATR (Average True Range)
         - Volatility regime detection

      6. CORRELATION ANALYSIS
         - Currency pair correlations
         - Correlation with commodities
         - Correlation with equity indices

      7. FORECAST AND SIGNALS
         - Short-term direction (1-7 days)
         - Medium-term outlook (1-3 months)
         - Entry and exit levels
         - Stop-loss recommendations
         - Risk/reward assessment
    id: analysis

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json

      historical = {{ .historical_data }}
      current = {{ .current_rates }}
      analysis = {{ .analysis }}

      # Calculate volatility from historical data
      rates = []
      if isinstance(historical, dict):
          data_points = historical.get('rates', historical.get('data', []))
          if isinstance(data_points, list):
              for point in data_points:
                  if isinstance(point, dict):
                      rate = point.get('rate', point.get('value', 0))
                      rates.append(rate)

      if len(rates) > 1:
          # Daily returns
          returns = []
          for i in range(1, len(rates)):
              if rates[i-1] > 0:
                  returns.append((rates[i] - rates[i-1]) / rates[i-1])

          if returns:
              import statistics
              avg_return = sum(returns) / len(returns)
              variance = sum((r - avg_return) ** 2 for r in returns) / len(returns)
              volatility = variance ** 0.5

              # Annualized (assuming daily data)
              annualized_vol = volatility * (252 ** 0.5) * 100

              print("## Volatility Metrics")
              print(f"Daily Volatility: {volatility*100:.4f}%")
              print(f"Annualized Volatility: {annualized_vol:.2f}%")
              print(f"Data Points: {len(rates)}")
              print(f"Average Daily Return: {avg_return*100:.4f}%")

              # Trend detection
              if len(rates) > 20:
                  sma20 = sum(rates[-20:]) / 20
                  current_price = rates[-1]
                  trend = "Bullish" if current_price > sma20 else "Bearish"
                  print(f"\nSMA(20): {sma20:.4f}")
                  print(f"Current: {current_price:.4f}")
                  print(f"Trend: {trend}")
    id: calculations

  - node: file_write
    params:
      path: forex-analysis-report.md
    input: |
      # Forex Analysis Report

      Pair: {{ .params.base_currency }}/{{ .params.target_currency }}
      Generated: {{ .metadata.timestamp }}

      ## Analysis
      {{ .analysis }}

      ## Quantitative Metrics
      {{ .calculations }}
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      Forex analysis complete. Report saved to forex-analysis-report.md
    id: notify