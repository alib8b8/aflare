name: Cap Table Manager
# Startup cap table and equity management
# Usage: aflare install finance/cap-table
#        aflare run cap-table/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.cap_table_file }}"
    id: current_cap_table

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render,json_parse
      max_iterations: 3
    input: |
      Manage and analyze the startup capitalization table:

      Current Cap Table:
      {{ .current_cap_table }}

      Scenario: {{ .params.scenario }}
      Company Stage: {{ .params.stage }}
      Current Valuation: {{ .params.valuation }}

      Analyze:
      1. CURRENT OWNERSHIP STRUCTURE
         - Founders equity and vesting status
         - Employee option pool (issued, outstanding, available)
         - Investor share classes and preferences
         - Advisor shares
         - Fully diluted shares outstanding

      2. EQUITY BREAKDOWN
         - By stakeholder group
         - By share class (Common, Preferred A, Preferred B, etc.)
         - Voting rights summary
         - Liquidation preferences

      3. VESTING SCHEDULE
         - Founders vesting (cliff and schedule)
         - Employee option vesting
         - Upcoming cliff dates
         - Unvested shares summary

      4. DILUTION ANALYSIS
         - Current fully diluted ownership
         - Pro forma after new round
         - Option pool expansion impact
         - Founder dilution over rounds

      5. SCENARIO MODELING
         - {{ .params.scenario }}
         - Pre-money and post-money valuation
         - Price per share calculation
         - New investor ownership
         - Pro forma cap table

      6. EXIT SCENARIO ANALYSIS
         - Return waterfalls by share class
         - Exit value required for each class to participate
         - Founder and employee proceeds at various exit values
         - Investor MOIC and IRR estimates

      7. COMPLIANCE CHECK
         - 409A valuation status
         - Option strike price vs FMV
         - Securities law compliance
         - Board approval requirements
         - Investor rights and protective provisions
    id: analysis

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json

      cap_table = {{ .current_cap_table }}
      valuation = float({{ .params.valuation }})

      # Parse cap table entries
      total_shares = 0
      shareholders = []

      if isinstance(cap_table, dict):
          entries = cap_table.get('shareholders', cap_table.get('entries', []))
          if isinstance(entries, list):
              for entry in entries:
                  if isinstance(entry, dict):
                      shares = entry.get('shares', 0) or 0
                      name = entry.get('name', 'Unknown')
                      share_class = entry.get('class', 'Common')
                      total_shares += shares
                      shareholders.append({
                          'name': name,
                          'class': share_class,
                          'shares': shares,
                          'pct': 0
                      })

      # Calculate ownership percentages
      if total_shares > 0:
          price_per_share = valuation / total_shares
          for s in shareholders:
              s['pct'] = (s['shares'] / total_shares) * 100
              s['value'] = s['shares'] * price_per_share

      # Summarize by class
      class_summary = {}
      for s in shareholders:
          cls = s['class']
          if cls not in class_summary:
              class_summary[cls] = {'shares': 0, 'pct': 0, 'value': 0}
          class_summary[cls]['shares'] += s['shares']
          class_summary[cls]['pct'] += s['pct']
          class_summary[cls]['value'] += s.get('value', 0)

      print("## Cap Table Summary")
      print(f"Total Shares: {total_shares:,.0f}")
      print(f"Valuation: ${valuation:,.2f}")
      print(f"Price per Share: ${price_per_share:.4f}")
      print()
      print("### By Share Class")
      print(f"{'Class':<15} {'Shares':>12} {'Ownership':>10} {'Value':>15}")
      print("-" * 55)
      for cls, data in class_summary.items():
          print(f"{cls:<15} {data['shares']:>12,.0f} {data['pct']:>9.1f}% ${data['value']:>14,.2f}")

      print()
      print("### Top Shareholders")
      print(f"{'Name':<25} {'Class':<12} {'Shares':>10} {'Ownership':>10}")
      print("-" * 60)
      for s in sorted(shareholders, key=lambda x: x['pct'], reverse=True)[:15]:
          print(f"{s['name']:<25} {s['class']:<12} {s['shares']:>10,.0f} {s['pct']:>9.1f}%")
    id: calculations

  - node: file_write
    params:
      path: cap-table-report.md
    input: |
      # Capitalization Table Report

      Company Stage: {{ .params.stage }}
      Valuation: {{ .params.valuation }}
      Generated: {{ .metadata.timestamp }}

      ## Analysis
      {{ .analysis }}

      ## Ownership Breakdown
      {{ .calculations }}
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      Cap table analysis complete. Report saved to cap-table-report.md
    id: notify