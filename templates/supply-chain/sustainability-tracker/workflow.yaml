name: sustainability-tracker
description: Supply chain carbon footprint tracking and reporting
version: "1.0.0"
input_schema:
  - name: supply_chain_data
    type: string
    required: true
    description: JSON with supply chain activities, transportation modes, and energy usage
  - name: emission_factors_api
    type: string
    required: true
    description: API endpoint for emission factors (EPA, DEFRA, GHG Protocol)
  - name: reporting_period
    type: string
    required: false
    default: "monthly"
    description: Reporting period granularity (monthly, quarterly, annual)
  - name: scope_boundaries
    type: string
    required: false
    default: '["scope1","scope2","scope3"]'
    description: JSON array of GHG Protocol scopes to include
  - name: output_file
    type: string
    required: false
    default: /tmp/carbon_footprint.json
    description: Output file for carbon footprint report

steps:
  - id: fetch_emission_factors
    node: http_request
    params:
      method: GET
      url: "{{ .params.emission_factors_api }}"
      headers:
        Content-Type: application/json
      params:
        region: global
        year: 2026
    description: Fetch latest emission factors from regulatory database

  - id: compute_footprint
    node: code_interpreter
    params:
      language: python
      code: |
        import json

        sc_data = json.loads('''{{ .params.supply_chain_data }}''')
        factors_raw = json.loads('''{{ index .steps "fetch_emission_factors" "response" "body" }}''')
        scopes = json.loads('''{{ .params.scope_boundaries }}''')

        # Emission factors (kg CO2e per unit) - fallback defaults
        default_factors = {
            "diesel_liter": 2.68,
            "gasoline_liter": 2.31,
            "electricity_kwh": 0.45,
            "natural_gas_m3": 1.92,
            "air_freight_ton_km": 0.60,
            "sea_freight_ton_km": 0.015,
            "road_freight_ton_km": 0.12,
            "rail_freight_ton_km": 0.03,
            "warehouse_m2": 15.0,
            "packaging_kg": 2.5,
            "employee_commute_km": 0.18
        }
        factors = factors_raw.get("factors", default_factors)
        if not factors:
            factors = default_factors

        results = {"scope1": [], "scope2": [], "scope3": []}
        totals = {"scope1": 0.0, "scope2": 0.0, "scope3": 0.0}

        # Scope 1 - Direct emissions
        if "scope1" in scopes:
            for activity in sc_data.get("scope1", []):
                activity_type = activity.get("type", "")
                quantity = activity.get("quantity", 0)
                if activity_type == "fuel_diesel":
                    co2 = quantity * factors.get("diesel_liter", 2.68)
                elif activity_type == "fuel_gasoline":
                    co2 = quantity * factors.get("gasoline_liter", 2.31)
                elif activity_type == "natural_gas":
                    co2 = quantity * factors.get("natural_gas_m3", 1.92)
                else:
                    co2 = quantity * 1.0
                co2 = round(co2, 2)
                results["scope1"].append({
                    "activity": activity.get("description", activity_type),
                    "type": activity_type,
                    "quantity": quantity,
                    "unit": activity.get("unit", ""),
                    "emissions_kg_co2e": co2
                })
                totals["scope1"] += co2

        # Scope 2 - Indirect energy
        if "scope2" in scopes:
            for activity in sc_data.get("scope2", []):
                activity_type = activity.get("type", "")
                quantity = activity.get("quantity", 0)
                if activity_type == "electricity":
                    co2 = quantity * factors.get("electricity_kwh", 0.45)
                else:
                    co2 = quantity * 1.0
                co2 = round(co2, 2)
                results["scope2"].append({
                    "activity": activity.get("description", activity_type),
                    "type": activity_type,
                    "quantity": quantity,
                    "unit": activity.get("unit", "kWh"),
                    "emissions_kg_co2e": co2
                })
                totals["scope2"] += co2

        # Scope 3 - Value chain
        if "scope3" in scopes:
            for activity in sc_data.get("scope3", []):
                activity_type = activity.get("type", "")
                quantity = activity.get("quantity", 0)
                if activity_type == "air_freight":
                    co2 = quantity * factors.get("air_freight_ton_km", 0.60)
                elif activity_type == "sea_freight":
                    co2 = quantity * factors.get("sea_freight_ton_km", 0.015)
                elif activity_type == "road_freight":
                    co2 = quantity * factors.get("road_freight_ton_km", 0.12)
                elif activity_type == "rail_freight":
                    co2 = quantity * factors.get("rail_freight_ton_km", 0.03)
                elif activity_type == "warehousing":
                    co2 = quantity * factors.get("warehouse_m2", 15.0)
                elif activity_type == "packaging":
                    co2 = quantity * factors.get("packaging_kg", 2.5)
                elif activity_type == "employee_commute":
                    co2 = quantity * factors.get("employee_commute_km", 0.18)
                else:
                    co2 = quantity * 1.0
                co2 = round(co2, 2)
                results["scope3"].append({
                    "activity": activity.get("description", activity_type),
                    "type": activity_type,
                    "quantity": quantity,
                    "unit": activity.get("unit", ""),
                    "emissions_kg_co2e": co2
                })
                totals["scope3"] += co2

        total_all = round(sum(totals.values()), 2)
        total_tonnes = round(total_all / 1000, 3)

        # Carbon intensity
        revenue = sc_data.get("revenue", 1)
        carbon_intensity = round(total_tonnes / (revenue / 1000000), 3) if revenue > 0 else 0

        result = {
            "reporting_period": "{{ .params.reporting_period }}",
            "generated_at": "{{ now }}",
            "methodology": "GHG Protocol",
            "scopes_included": scopes,
            "emissions_by_scope": {
                "scope1_kg_co2e": round(totals["scope1"], 2),
                "scope2_kg_co2e": round(totals["scope2"], 2),
                "scope3_kg_co2e": round(totals["scope3"], 2),
                "total_kg_co2e": total_all,
                "total_tonnes_co2e": total_tonnes
            },
            "carbon_intensity": {
                "tonnes_per_million_revenue": carbon_intensity,
                "revenue_used": revenue
            },
            "scope_percentage": {
                "scope1_pct": round(totals["scope1"] / total_all * 100, 1) if total_all > 0 else 0,
                "scope2_pct": round(totals["scope2"] / total_all * 100, 1) if total_all > 0 else 0,
                "scope3_pct": round(totals["scope3"] / total_all * 100, 1) if total_all > 0 else 0
            },
            "detailed_breakdown": results
        }
        print(json.dumps(result))
    description: Compute carbon footprint across all GHG Protocol scopes

  - id: generate_reduction_plan
    node: agent
    params:
      prompt: |
        Analyze the carbon footprint and generate a reduction roadmap:
        {{ index .steps "compute_footprint" "output" }}

        Provide:
        1. Executive summary of carbon footprint
        2. Top 3 emission hotspots and reduction opportunities
        3. Mode shift recommendations (air to sea, road to rail)
        4. Renewable energy transition roadmap
        5. Science-based targets (SBTi) alignment recommendations
        6. Carbon offset strategy for unavoidable emissions
    description: Generate AI-powered carbon reduction roadmap

  - id: save_footprint
    node: file_write
    params:
      path: "{{ .params.output_file }}"
      content: |
        {
          "carbon_footprint": {{ index .steps "compute_footprint" "output" }},
          "reduction_roadmap": {{ index .steps "generate_reduction_plan" "output" }}
        }
    description: Save carbon footprint report to output file