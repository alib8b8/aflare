name: quality-inspection
description: Quality control inspection workflow with AQL sampling
version: "1.0.0"
params:
  - name: lot_data
    type: string
    required: true
    description: JSON with lot size, product specs, and inspection criteria
  - name: aql_level
    type: string
    required: false
    default: "II"
    description: AQL inspection level (I, II, III, S-1 through S-4)
  - name: aql_limit
    type: number
    required: false
    default: 2.5
    description: AQL acceptance limit percentage
  - name: inspection_api_endpoint
    type: string
    required: true
    description: API endpoint to submit inspection results
  - name: output_file
    type: string
    required: false
    default: /tmp/inspection_report.json
    description: Output file for inspection report

steps:
  - id: compute_sample_size
    node: code_interpreter
    params:
      language: python
      code: |
        import json

        lot = json.loads('''{{ .params.lot_data }}''')
        aql_level = "{{ .params.aql_level }}"
        aql_limit = {{ .params.aql_limit }}

        lot_size = lot.get("lot_size", 0)
        product_type = lot.get("product_type", "standard")

        # AQL sample size table (simplified for levels I, II, III)
        aql_table = {
            "I":   [(2,8,2),(9,15,2),(16,25,3),(26,50,5),(51,90,5),(91,150,8),(151,280,13),(281,500,20),(501,1200,32),(1201,3200,50),(3201,10000,80),(10001,35000,125),(35001,150000,200),(150001,500000,315),(500001,float("inf"),500)],
            "II":  [(2,8,2),(9,15,3),(16,25,5),(26,50,8),(51,90,13),(91,150,20),(151,280,32),(281,500,50),(501,1200,80),(1201,3200,125),(3201,10000,200),(10001,35000,315),(35001,150000,500),(150001,500000,800),(500001,float("inf"),1250)],
            "III": [(2,8,3),(9,15,5),(16,25,8),(26,50,13),(51,90,20),(91,150,32),(151,280,50),(281,500,80),(501,1200,125),(1201,3200,200),(3201,10000,315),(10001,35000,500),(35001,150000,800),(150001,500000,1250),(500001,float("inf"),2000)]
        }

        level_table = aql_table.get(aql_level, aql_table["II"])
        sample_size = 0
        for low, high, size in level_table:
            if low <= lot_size <= high:
                sample_size = size
                break

        # Acceptance number based on AQL limit
        acceptance_table = {
            0.65: {2: (0,1), 3: (0,1), 5: (0,1), 8: (0,1), 13: (0,1), 20: (0,1), 32: (1,2), 50: (1,2), 80: (2,3), 125: (3,4), 200: (5,6), 315: (7,8), 500: (10,11), 800: (14,15), 1250: (21,22)},
            1.0:  {2: (0,1), 3: (0,1), 5: (0,1), 8: (0,1), 13: (1,2), 20: (1,2), 32: (2,3), 50: (3,4), 80: (5,6), 125: (7,8), 200: (10,11), 315: (14,15), 500: (21,22), 800: (21,22), 1250: (21,22)},
            2.5:  {2: (0,1), 3: (0,1), 5: (0,1), 8: (0,1), 13: (1,2), 20: (2,3), 32: (3,4), 50: (5,6), 80: (7,8), 125: (10,11), 200: (14,15), 315: (21,22), 500: (21,22), 800: (21,22), 1250: (21,22)},
            4.0:  {2: (0,1), 3: (0,1), 5: (0,1), 8: (1,2), 13: (2,3), 20: (3,4), 32: (5,6), 50: (7,8), 80: (10,11), 125: (14,15), 200: (21,22), 315: (21,22), 500: (21,22), 800: (21,22), 1250: (21,22)}
        }

        ac_reject = acceptance_table.get(aql_limit, acceptance_table[2.5])
        ac, re = 0, 1
        for size_key in sorted(ac_reject.keys()):
            if sample_size <= size_key:
                ac, re = ac_reject[size_key]
                break

        result = {
            "lot_size": lot_size,
            "aql_level": aql_level,
            "aql_limit": aql_limit,
            "sample_size": sample_size,
            "accept_number": ac,
            "reject_number": re,
            "inspection_criteria": lot.get("criteria", []),
            "product_specs": lot.get("specs", {})
        }
        print(json.dumps(result))
    description: Compute AQL sample size and acceptance numbers

  - id: generate_checklist
    node: agent
    params:
      prompt: |
        Based on the inspection plan, generate a detailed quality inspection checklist:
        {{ index .steps "compute_sample_size" "output" }}

        Generate:
        1. Step-by-step inspection procedure
        2. Visual inspection criteria checklist
        3. Dimensional measurement specifications
        4. Functional testing requirements
        5. Packaging and labeling verification points
        6. Pass/fail decision matrix
    description: Generate AI-powered inspection checklist

  - id: submit_plan
    node: http_request
    params:
      method: POST
      url: "{{ .params.inspection_api_endpoint }}"
      headers:
        Content-Type: application/json
      body:
        sampling_plan: "{{ index .steps 'compute_sample_size' 'output' }}"
        checklist: "{{ index .steps 'generate_checklist' 'output' }}"
    description: Submit inspection plan to quality management system

  - id: save_inspection_plan
    node: file_write
    params:
      path: "{{ .params.output_file }}"
      content: |
        {
          "sampling_plan": {{ index .steps "compute_sample_size" "output" }},
          "checklist": {{ index .steps "generate_checklist" "output" }},
          "submission": {{ index .steps "submit_plan" "response" "body" }}
        }
    description: Save inspection plan to output file