name: procurement-workflow
description: Purchase order creation and procurement automation
version: "1.0.0"
params:
  - name: requisition_data
    type: string
    required: true
    description: JSON with requisition details including items, quantities, and supplier
  - name: approval_threshold
    type: number
    required: false
    default: 5000
    description: Purchase amount threshold requiring manager approval
  - name: erp_endpoint
    type: string
    required: true
    description: ERP system API endpoint for PO creation
  - name: notify_email
    type: string
    required: false
    default: ""
    description: Email for procurement notifications
  - name: output_file
    type: string
    required: false
    default: /tmp/purchase_order.json
    description: Output file for purchase order

steps:
  - id: validate_requisition
    node: code_interpreter
    params:
      language: python
      code: |
        import json

        req = json.loads('''{{ .params.requisition_data }}''')
        threshold = {{ .params.approval_threshold }}

        items = req.get("items", [])
        total = sum(item.get("unit_price", 0) * item.get("quantity", 0) for item in items)

        validation = {
            "is_valid": True,
            "errors": [],
            "warnings": []
        }

        if not items:
            validation["is_valid"] = False
            validation["errors"].append("No line items in requisition")

        for i, item in enumerate(items):
            if not item.get("sku"):
                validation["errors"].append(f"Item {i}: Missing SKU")
            if item.get("quantity", 0) <= 0:
                validation["errors"].append(f"Item {i}: Invalid quantity")
            if item.get("unit_price", 0) < 0:
                validation["errors"].append(f"Item {i}: Negative unit price")

        if total > threshold * 2:
            validation["warnings"].append(f"Total {total} exceeds 2x threshold, executive approval may be needed")

        if validation["errors"]:
            validation["is_valid"] = False

        result = {
            "requisition_id": req.get("id", "REQ-UNKNOWN"),
            "total_amount": total,
            "currency": req.get("currency", "USD"),
            "line_items": len(items),
            "requires_approval": total > threshold,
            "validation": validation
        }
        print(json.dumps(result))
    description: Validate requisition data and compute totals

  - id: generate_po
    node: agent
    params:
      prompt: |
        Based on the validated requisition, generate a purchase order:
        Requisition: {{ .params.requisition_data }}
        Validation: {{ index .steps "validate_requisition" "output" }}

        Generate:
        1. PO number (format: PO-YYYYMMDD-XXXX)
        2. Payment terms recommendation
        3. Delivery schedule
        4. Terms and conditions
        5. Special instructions for the supplier
    description: Generate purchase order details with AI

  - id: submit_po
    node: http_request
    params:
      method: POST
      url: "{{ .params.erp_endpoint }}/purchase-orders"
      headers:
        Content-Type: application/json
      body:
        requisition: "{{ .params.requisition_data }}"
        validation: "{{ index .steps 'validate_requisition' 'output' }}"
        po_details: "{{ index .steps 'generate_po' 'output' }}"
    description: Submit purchase order to ERP system

  - id: send_notification
    node: notify
    params:
      channel: email
      recipient: "{{ .params.notify_email }}"
      subject: "Purchase Order Created - {{ index .steps 'validate_requisition' 'output' }}"
      body: |
        Purchase Order has been created successfully.

        Requisition: {{ .params.requisition_data }}
        Validation Result: {{ index .steps "validate_requisition" "output" }}
        PO Details: {{ index .steps "generate_po" "output" }}
        ERP Response: {{ index .steps "submit_po" "response" "body" }}
    description: Send procurement notification email

  - id: save_po
    node: file_write
    params:
      path: "{{ .params.output_file }}"
      content: |
        {
          "validation": {{ index .steps "validate_requisition" "output" }},
          "po_details": {{ index .steps "generate_po" "output" }},
          "erp_response": {{ index .steps "submit_po" "response" "body" }}
        }
    description: Save purchase order to output file