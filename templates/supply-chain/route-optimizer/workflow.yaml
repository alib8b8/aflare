name: route-optimizer
description: Delivery route optimization using multi-stop distance minimization
version: "1.0.0"
params:
  - name: depot_address
    type: string
    required: true
    description: Starting depot/warehouse address
  - name: delivery_stops
    type: string
    required: true
    description: JSON array of delivery stop addresses with time windows
  - name: vehicle_count
    type: integer
    required: false
    default: 1
    description: Number of available vehicles
  - name: max_distance_km
    type: number
    required: false
    default: 200
    description: Maximum distance per route in kilometers
  - name: maps_api_key
    type: string
    required: true
    description: API key for geocoding and distance matrix service
  - name: output_file
    type: string
    required: false
    default: /tmp/route_plan.json
    description: Output file for optimized route plan

steps:
  - id: geocode_stops
    node: http_request
    params:
      method: POST
      url: "https://maps.googleapis.com/maps/api/geocode/json"
      body:
        addresses: "{{ .params.delivery_stops }}"
        key: "{{ .params.maps_api_key }}"
    description: Geocode all delivery stop addresses to coordinates

  - id: compute_distance_matrix
    node: code_interpreter
    params:
      language: python
      code: |
        import json, math, random

        geocode_result = json.loads('''{{ index .steps "geocode_stops" "response" "body" }}''')
        stops = json.loads('''{{ .params.delivery_stops }}''')

        # Build distance matrix using haversine formula
        def haversine(lat1, lon1, lat2, lon2):
            R = 6371
            dlat = math.radians(lat2 - lat1)
            dlon = math.radians(lon2 - lon1)
            a = math.sin(dlat/2)**2 + math.cos(math.radians(lat1)) * math.cos(math.radians(lat2)) * math.sin(dlon/2)**2
            return R * 2 * math.atan2(math.sqrt(a), math.sqrt(1-a))

        coords = []
        for i, loc in enumerate(geocode_result.get("results", stops)):
            lat = loc.get("geometry", {}).get("location", {}).get("lat", 40.7128 + i * 0.01)
            lng = loc.get("geometry", {}).get("location", {}).get("lng", -74.0060 + i * 0.01)
            coords.append((lat, lng))

        n = len(coords)
        matrix = [[0.0] * n for _ in range(n)]
        for i in range(n):
            for j in range(n):
                if i != j:
                    matrix[i][j] = round(haversine(coords[i][0], coords[i][1], coords[j][0], coords[j][1]), 2)

        print(json.dumps({"distance_matrix": matrix, "coordinates": coords, "stop_count": n}))
    description: Compute distance matrix between all delivery stops

  - id: optimize_routes
    node: code_interpreter
    params:
      language: python
      code: |
        import json, itertools

        data = json.loads('''{{ index .steps "compute_distance_matrix" "output" }}''')
        matrix = data["distance_matrix"]
        n = data["stop_count"]
        max_dist = {{ .params.max_distance_km }}
        vehicles = {{ .params.vehicle_count }}

        # Nearest-neighbor heuristic for route construction
        def nearest_neighbor(matrix, start=0):
            unvisited = set(range(1, n))
            route = [start]
            total_dist = 0
            current = start
            while unvisited:
                next_stop = min(unvisited, key=lambda x: matrix[current][x])
                total_dist += matrix[current][next_stop]
                route.append(next_stop)
                unvisited.remove(next_stop)
                current = next_stop
            total_dist += matrix[current][start]
            route.append(start)
            return route, round(total_dist, 2)

        route, total_dist = nearest_neighbor(matrix)

        # Split into multiple vehicles if needed
        routes = []
        if vehicles > 1:
            segment_size = max(2, (n - 1) // vehicles + 1)
            for v in range(vehicles):
                start_idx = v * segment_size + 1
                end_idx = min(start_idx + segment_size, n)
                if start_idx < n:
                    seg = [0] + route[start_idx:end_idx] + [0]
                    seg_dist = sum(matrix[seg[i]][seg[i+1]] for i in range(len(seg)-1))
                    routes.append({"vehicle": v + 1, "stops": seg, "distance_km": round(seg_dist, 2)})
        else:
            routes.append({"vehicle": 1, "stops": route, "distance_km": total_dist})

        result = {
            "depot": "{{ .params.depot_address }}",
            "total_stops": n - 1,
            "vehicles_used": len(routes),
            "total_distance_km": sum(r["distance_km"] for r in routes),
            "max_distance_km": max_dist,
            "routes": routes
        }
        print(json.dumps(result))
    description: Run nearest-neighbor heuristic to optimize delivery routes

  - id: generate_route_plan
    node: agent
    params:
      prompt: |
        Based on the following optimized route data, generate a detailed route execution plan:
        {{ index .steps "optimize_routes" "output" }}

        Provide:
        1. Route summary per vehicle
        2. Estimated fuel consumption and cost
        3. Recommended departure times
        4. Turn-by-turn navigation notes for each route
        5. Contingency plans for delays
    description: Generate AI-powered route execution plan

  - id: save_route_plan
    node: file_write
    params:
      path: "{{ .params.output_file }}"
      content: |
        {
          "optimized_routes": {{ index .steps "optimize_routes" "output" }},
          "execution_plan": {{ index .steps "generate_route_plan" "output" }}
        }
    description: Save optimized route plan to output file