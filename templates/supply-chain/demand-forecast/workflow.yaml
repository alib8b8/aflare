name: demand-forecast
description: Demand forecasting with time series analysis using historical sales data
version: "1.0.0"
params:
  - name: product_id
    type: string
    required: true
    description: Product identifier for forecasting
  - name: historical_data_endpoint
    type: string
    required: true
    description: API endpoint for historical sales data
  - name: forecast_horizon_days
    type: integer
    required: false
    default: 30
    description: Number of days to forecast ahead
  - name: seasonality_period
    type: integer
    required: false
    default: 7
    description: Seasonality period in days (7=weekly, 30=monthly)
  - name: output_file
    type: string
    required: false
    default: /tmp/demand_forecast.json
    description: Path for forecast output file

steps:
  - id: fetch_historical
    node: http_request
    config:
      method: GET
      url: "{{ .params.historical_data_endpoint }}"
      params:
        product_id: "{{ .params.product_id }}"
        days: 365
      headers:
        Content-Type: application/json
    description: Fetch historical sales data from API

  - id: analyze_demand
    node: code_interpreter
    config:
      language: python
      code: |
        import json
        import numpy as np
        from datetime import datetime, timedelta

        data = json.loads('''{{ index .steps "fetch_historical" "response" "body" }}''')
        sales = [d["quantity"] for d in data["sales"]]
        dates = [d["date"] for d in data["sales"]]

        # Simple exponential smoothing with trend and seasonality
        alpha = 0.3
        beta = 0.1
        gamma = 0.1
        season_len = {{ .params.seasonality_period }}

        # Initialize components
        level = np.mean(sales[:season_len])
        trend = 0
        seasonal = [s - level for s in sales[:season_len]]

        # Fit model
        fitted = []
        for i, s in enumerate(sales):
            if i < season_len:
                fitted.append(s)
                continue
            old_level = level
            level = alpha * (s - seasonal[i % season_len]) + (1 - alpha) * (level + trend)
            trend = beta * (level - old_level) + (1 - beta) * trend
            seasonal[i % season_len] = gamma * (s - level) + (1 - gamma) * seasonal[i % season_len]
            fitted.append(level + trend + seasonal[i % season_len])

        # Forecast
        horizon = {{ .params.forecast_horizon_days }}
        forecasts = []
        last_date = datetime.strptime(dates[-1], "%Y-%m-%d")
        for h in range(horizon):
            fc_date = last_date + timedelta(days=h + 1)
            fc_value = level + (h + 1) * trend + seasonal[(len(sales) + h) % season_len]
            forecasts.append({
                "date": fc_date.strftime("%Y-%m-%d"),
                "forecast": max(0, round(fc_value, 2)),
                "lower_bound": max(0, round(fc_value * 0.85, 2)),
                "upper_bound": round(fc_value * 1.15, 2)
            })

        result = {
            "product_id": "{{ .params.product_id }}",
            "forecast_horizon": horizon,
            "generated_at": datetime.now().isoformat(),
            "model_metrics": {
                "mape": round(np.mean(np.abs((np.array(sales[season_len:]) - np.array(fitted[season_len:])) / np.array(sales[season_len:]))) * 100, 2),
                "trend_direction": "up" if trend > 0 else "down"
            },
            "forecasts": forecasts
        }
        print(json.dumps(result))
    description: Run time series forecasting model on sales data

  - id: generate_insights
    node: agent
    config:
      prompt: |
        Analyze the following demand forecast results and provide actionable insights:
        {{ index .steps "analyze_demand" "output" }}

        Provide:
        1. Summary of forecast trend
        2. Key demand drivers identified
        3. Recommended inventory adjustments
        4. Risk factors to monitor
        5. Suggested replenishment quantities
    description: Generate AI-powered demand insights and recommendations

  - id: save_forecast
    node: file_write
    config:
      path: "{{ .params.output_file }}"
      content: |
        {
          "forecast": {{ index .steps "analyze_demand" "output" }},
          "insights": {{ index .steps "generate_insights" "output" }}
        }
    description: Save forecast results and insights to output file