name: warehouse-planner
description: Warehouse layout and slotting optimization for efficient storage
version: "1.0.0"
input_schema:
  - name: warehouse_dimensions
    type: string
    required: true
    description: JSON with warehouse length, width, height in meters
  - name: inventory_data
    type: string
    required: true
    description: JSON array of SKU data with dimensions, turnover rate, and quantity
  - name: storage_strategy
    type: string
    required: false
    default: "abc"
    description: Storage strategy (abc, dedicated, random, class-based)
  - name: aisle_width
    type: number
    required: false
    default: 3.0
    description: Aisle width in meters
  - name: output_file
    type: string
    required: false
    default: /tmp/warehouse_plan.json
    description: Output file for warehouse layout plan

steps:
  - id: classify_inventory
    node: code_interpreter
    params:
      language: python
      code: |
        import json

        inventory = json.loads('''{{ .params.inventory_data }}''')
        warehouse = json.loads('''{{ .params.warehouse_dimensions }}''')

        # ABC classification based on turnover rate
        sorted_items = sorted(inventory, key=lambda x: x.get("turnover_rate", 0), reverse=True)
        total_turnover = sum(i.get("turnover_rate", 0) for i in sorted_items)
        cumulative = 0

        classified = []
        for item in sorted_items:
            cumulative += item.get("turnover_rate", 0)
            pct = cumulative / total_turnover if total_turnover > 0 else 0
            if pct <= 0.70:
                zone = "A"
            elif pct <= 0.90:
                zone = "B"
            else:
                zone = "C"
            classified.append({**item, "zone": zone, "cumulative_pct": round(pct * 100, 1)})

        result = {
            "warehouse_area": warehouse["length"] * warehouse["width"],
            "total_skus": len(classified),
            "zone_distribution": {
                "A": sum(1 for i in classified if i["zone"] == "A"),
                "B": sum(1 for i in classified if i["zone"] == "B"),
                "C": sum(1 for i in classified if i["zone"] == "C")
            },
            "classified_items": classified
        }
        print(json.dumps(result))
    description: Classify inventory using ABC analysis based on turnover rates

  - id: compute_slotting
    node: code_interpreter
    params:
      language: python
      code: |
        import json

        data = json.loads('''{{ index .steps "classify_inventory" "output" }}''')
        warehouse = json.loads('''{{ .params.warehouse_dimensions }}''')
        aisle_w = {{ .params.aisle_width }}

        w_len = warehouse["length"]
        w_wid = warehouse["width"]
        w_hgt = warehouse["height"]

        # Calculate shelving layout
        shelf_depth = 1.2
        num_aisles = max(1, int((w_wid - 2) / (shelf_depth * 2 + aisle_w)))
        shelf_length = w_len - 4
        shelf_height = w_hgt - 1
        levels_per_shelf = max(1, int(shelf_height / 1.5))
        total_slots = num_aisles * 2 * levels_per_shelf * int(shelf_length / 1.0)

        # Assign slots by zone
        zone_a = [i for i in data["classified_items"] if i["zone"] == "A"]
        zone_b = [i for i in data["classified_items"] if i["zone"] == "B"]
        zone_c = [i for i in data["classified_items"] if i["zone"] == "C"]

        a_slots = int(total_slots * 0.15)
        b_slots = int(total_slots * 0.25)
        c_slots = total_slots - a_slots - b_slots

        slotting = []
        slot_id = 0
        for zone_items, zone_slots, zone_name in [(zone_a, a_slots, "A"), (zone_b, b_slots, "B"), (zone_c, c_slots, "C")]:
            for item in zone_items:
                qty = item.get("quantity", 1)
                pallets = max(1, (qty + 49) // 50)
                for _ in range(pallets):
                    if slot_id < zone_slots:
                        slotting.append({
                            "slot_id": f"{zone_name}-{slot_id:04d}",
                            "sku": item["sku"],
                            "zone": zone_name,
                            "quantity": min(qty, 50),
                            "aisle": (slot_id % num_aisles) + 1,
                            "level": (slot_id // num_aisles) % levels_per_shelf + 1,
                            "position": (slot_id // (num_aisles * levels_per_shelf)) + 1
                        })
                        slot_id += 1

        result = {
            "total_slots": total_slots,
            "slots_used": len(slotting),
            "layout": {
                "num_aisles": num_aisles,
                "shelf_length_m": shelf_length,
                "levels_per_shelf": levels_per_shelf,
                "total_shelf_capacity": total_slots
            },
            "zone_allocation": {
                "A_slots": a_slots,
                "B_slots": b_slots,
                "C_slots": c_slots
            },
            "slotting_plan": slotting
        }
        print(json.dumps(result))
    description: Compute optimal slotting plan based on warehouse dimensions and ABC zones

  - id: generate_layout_plan
    node: agent
    params:
      prompt: |
        Based on the warehouse slotting optimization results, generate a comprehensive layout plan:
        {{ index .steps "compute_slotting" "output" }}

        Provide:
        1. Visual layout description (aisle and shelf arrangement)
        2. Picking path optimization recommendations
        3. Zone A fast-mover placement strategy
        4. Receiving and shipping dock placement suggestions
        5. Estimated picking efficiency improvement percentage
    description: Generate AI-powered warehouse layout recommendations

  - id: save_warehouse_plan
    node: file_write
    params:
      path: "{{ .params.output_file }}"
      content: |
        {
          "slotting_plan": {{ index .steps "compute_slotting" "output" }},
          "layout_recommendations": {{ index .steps "generate_layout_plan" "output" }}
        }
    description: Save warehouse layout and slotting plan to output file