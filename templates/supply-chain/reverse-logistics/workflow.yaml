name: reverse-logistics
description: Returns and reverse logistics management with disposition routing
version: "1.0.0"
params:
  - name: returns_data
    type: string
    required: true
    description: JSON array of return requests with product details and reasons
  - name: disposition_rules
    type: string
    required: false
    default: '{"restock": {"max_days": 30, "max_value": 500}, "refurbish": {"max_days": 90, "max_value": 2000}, "recycle": {"categories": ["electronics","batteries"]}, "liquidate": {"min_value": 50}}'
    description: JSON disposition routing rules
  - name: warehouse_api
    type: string
    required: true
    description: API endpoint for warehouse receiving and disposition
  - name: output_file
    type: string
    required: false
    default: /tmp/returns_management.json
    description: Output file for returns processing plan

steps:
  - id: classify_returns
    node: code_interpreter
    config:
      language: python
      code: |
        import json
        from datetime import datetime

        returns = json.loads('''{{ .params.returns_data }}''')
        rules = json.loads('''{{ .params.disposition_rules }}''')

        now = datetime.utcnow()
        classified = []

        for r in returns:
            order_date = r.get("order_date", "")
            return_reason = r.get("reason", "other")
            item_value = r.get("item_value", 0)
            category = r.get("category", "general")
            condition = r.get("condition", "unknown")

            # Calculate days since order
            try:
                order_dt = datetime.fromisoformat(order_date.replace("Z", "+00:00"))
                days_since = (now - order_dt.replace(tzinfo=None)).days
            except:
                days_since = 999

            # Determine disposition
            disposition = "inspect"
            disposition_reason = "Manual inspection required"

            restock = rules.get("restock", {})
            refurbish = rules.get("refurbish", {})
            recycle = rules.get("recycle", {})
            liquidate = rules.get("liquidate", {})

            if condition == "unopened" and days_since <= restock.get("max_days", 30) and item_value <= restock.get("max_value", 500):
                disposition = "restock"
                disposition_reason = "Unopened, within restock window"
            elif condition in ("good", "minor_damage") and days_since <= refurbish.get("max_days", 90) and item_value <= refurbish.get("max_value", 2000):
                disposition = "refurbish"
                disposition_reason = f"Within refurbish window, condition: {condition}"
            elif category in recycle.get("categories", []):
                disposition = "recycle"
                disposition_reason = f"Category {category} requires recycling"
            elif item_value >= liquidate.get("min_value", 50) and days_since > refurbish.get("max_days", 90):
                disposition = "liquidate"
                disposition_reason = "Outside return window, value above liquidation threshold"
            elif return_reason == "defective":
                disposition = "return_to_vendor"
                disposition_reason = "Defective product, return to vendor"
            elif item_value < 10:
                disposition = "dispose"
                disposition_reason = "Low value, not economical to process"

            # Calculate estimated processing cost
            cost_map = {
                "restock": 5.0,
                "refurbish": 25.0,
                "recycle": 10.0,
                "liquidate": 15.0,
                "return_to_vendor": 20.0,
                "dispose": 3.0,
                "inspect": 12.0
            }

            recovery_map = {
                "restock": item_value * 0.95,
                "refurbish": item_value * 0.60,
                "liquidate": item_value * 0.30,
                "return_to_vendor": item_value * 0.80,
                "recycle": item_value * 0.05,
                "dispose": 0,
                "inspect": 0
            }

            proc_cost = cost_map.get(disposition, 10.0)
            recovery = recovery_map.get(disposition, 0)
            net = round(recovery - proc_cost, 2)

            classified.append({
                "return_id": r.get("return_id", "UNKNOWN"),
                "product_id": r.get("product_id"),
                "product_name": r.get("product_name", ""),
                "reason": return_reason,
                "condition": condition,
                "days_since_order": days_since,
                "item_value": item_value,
                "disposition": disposition,
                "disposition_reason": disposition_reason,
                "processing_cost": proc_cost,
                "estimated_recovery": recovery,
                "net_value": net
            })

        classified.sort(key=lambda x: x["net_value"], reverse=True)

        result = {
            "processed_at": now.isoformat(),
            "total_returns": len(classified),
            "total_processing_cost": round(sum(c["processing_cost"] for c in classified), 2),
            "total_recovery": round(sum(c["estimated_recovery"] for c in classified), 2),
            "total_net_value": round(sum(c["net_value"] for c in classified), 2),
            "disposition_summary": {},
            "returns": classified
        }

        for c in classified:
            d = c["disposition"]
            if d not in result["disposition_summary"]:
                result["disposition_summary"][d] = {"count": 0, "total_net": 0}
            result["disposition_summary"][d]["count"] += 1
            result["disposition_summary"][d]["total_net"] = round(result["disposition_summary"][d]["total_net"] + c["net_value"], 2)

        print(json.dumps(result))
    description: Classify returns and determine optimal disposition

  - id: generate_routing_plan
    node: agent
    config:
      prompt: |
        Analyze the classified returns and generate a routing and processing plan:
        {{ index .steps "classify_returns" "output" }}

        Provide:
        1. Summary of return dispositions and volumes
        2. Warehouse routing instructions per disposition type
        3. Estimated labor requirements for processing
        4. Expected recovery value and margin analysis
        5. Recommendations for reducing return rates
    description: Generate AI-powered returns routing plan

  - id: submit_dispositions
    node: http_request
    config:
      method: POST
      url: "{{ .params.warehouse_api }}/returns/disposition"
      headers:
        Content-Type: application/json
      body:
        classified_returns: "{{ index .steps 'classify_returns' 'output' }}"
        routing_plan: "{{ index .steps 'generate_routing_plan' 'output' }}"
    description: Submit disposition instructions to warehouse system

  - id: save_returns_plan
    node: file_write
    config:
      path: "{{ .params.output_file }}"
      content: |
        {
          "returns_classification": {{ index .steps "classify_returns" "output" }},
          "routing_plan": {{ index .steps "generate_routing_plan" "output" }},
          "warehouse_submission": {{ index .steps "submit_dispositions" "response" "body" }}
        }
    description: Save returns management plan to output file