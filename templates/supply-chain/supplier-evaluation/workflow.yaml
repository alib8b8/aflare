name: supplier-evaluation
description: Supplier scorecard and evaluation with weighted KPIs
version: "1.0.0"
params:
  - name: supplier_data_endpoint
    type: string
    required: true
    description: API endpoint for supplier performance data
  - name: evaluation_period
    type: string
    required: false
    default: "last_quarter"
    description: Evaluation period (last_month, last_quarter, last_year)
  - name: kpi_weights
    type: string
    required: false
    default: '{"quality": 0.30, "delivery": 0.25, "cost": 0.20, "responsiveness": 0.15, "compliance": 0.10}'
    description: JSON object with KPI category weights summing to 1.0
  - name: output_file
    type: string
    required: false
    default: /tmp/supplier_evaluation.json
    description: Output file for evaluation results

steps:
  - id: fetch_supplier_data
    node: http_request
    params:
      method: GET
      url: "{{ .params.supplier_data_endpoint }}"
      params:
        period: "{{ .params.evaluation_period }}"
      headers:
        Content-Type: application/json
    description: Fetch supplier performance data from API

  - id: compute_scorecard
    node: code_interpreter
    params:
      language: python
      code: |
        import json

        raw_data = json.loads('''{{ index .steps "fetch_supplier_data" "response" "body" }}''')
        weights = json.loads('''{{ .params.kpi_weights }}''')

        suppliers = raw_data.get("suppliers", [])
        scorecards = []

        for s in suppliers:
            scores = {}
            # Quality score (0-100)
            defect_rate = s.get("defect_rate", 0)
            quality = max(0, 100 - defect_rate * 100)
            scores["quality"] = round(quality, 2)

            # Delivery score (0-100)
            on_time_pct = s.get("on_time_delivery_pct", 0)
            scores["delivery"] = round(on_time_pct, 2)

            # Cost score (0-100)
            cost_competitiveness = s.get("cost_competitiveness", 0)
            scores["cost"] = round(cost_competitiveness, 2)

            # Responsiveness score (0-100)
            response_time_h = s.get("avg_response_time_hours", 24)
            scores["responsiveness"] = round(max(0, 100 - response_time_h * 2), 2)

            # Compliance score (0-100)
            compliance = s.get("compliance_score", 0)
            scores["compliance"] = round(compliance, 2)

            # Weighted total
            total = sum(scores[k] * weights.get(k, 0) for k in scores)
            total = round(total, 2)

            # Tier assignment
            if total >= 85:
                tier = "Gold"
            elif total >= 70:
                tier = "Silver"
            elif total >= 50:
                tier = "Bronze"
            else:
                tier = "At Risk"

            scorecards.append({
                "supplier_id": s["id"],
                "supplier_name": s["name"],
                "category_scores": scores,
                "weighted_total": total,
                "tier": tier,
                "trend": s.get("trend", "stable")
            })

        scorecards.sort(key=lambda x: x["weighted_total"], reverse=True)

        result = {
            "evaluation_period": "{{ .params.evaluation_period }}",
            "kpi_weights": weights,
            "total_suppliers": len(scorecards),
            "tier_distribution": {
                "Gold": sum(1 for sc in scorecards if sc["tier"] == "Gold"),
                "Silver": sum(1 for sc in scorecards if sc["tier"] == "Silver"),
                "Bronze": sum(1 for sc in scorecards if sc["tier"] == "Bronze"),
                "At Risk": sum(1 for sc in scorecards if sc["tier"] == "At Risk")
            },
            "scorecards": scorecards
        }
        print(json.dumps(result))
    description: Compute weighted supplier scorecards and tier assignments

  - id: generate_evaluation_report
    node: agent
    params:
      prompt: |
        Analyze the following supplier evaluation results and generate a detailed report:
        {{ index .steps "compute_scorecard" "output" }}

        Provide:
        1. Executive summary of supplier performance
        2. Top 3 suppliers and their key strengths
        3. At-risk suppliers and recommended corrective actions
        4. Category-level performance trends
        5. Strategic sourcing recommendations
    description: Generate AI-powered supplier evaluation report

  - id: save_evaluation
    node: file_write
    params:
      path: "{{ .params.output_file }}"
      content: |
        {
          "scorecard": {{ index .steps "compute_scorecard" "output" }},
          "evaluation_report": {{ index .steps "generate_evaluation_report" "output" }}
        }
    description: Save evaluation results and report to output file