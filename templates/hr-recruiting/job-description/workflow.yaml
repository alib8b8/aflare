name: Job Description Generator
# Generate professional job descriptions
# Usage: llm-box install hr-recruiting/job-description
#        llm-box run job-description/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Create a professional job description for {{ .params.role }}.
      
      Role: {{ .params.role }}
      Level: {{ .params.level }}
      Department: {{ .params.department }}
      Company: {{ .params.company }}
      Location: {{ .params.location }}
      Employment type: {{ .params.employment_type }}
      
      Job description should include:
      1. Job Title
      2. Company Overview
      3. Role Summary
      4. Key Responsibilities (10-15 bullet points)
      5. Required Qualifications
         - Must-have
         - Nice-to-have
      6. Skills & Competencies
      7. Education & Experience
      8. What We Offer (benefits)
      9. Equal Opportunity statement
      10. How to Apply
      
      Write in inclusive, bias-free language.
    id: jd

  - node: file_write
    params:
      path: job-description.md
    input: jd
    id: save

  - node: notify
    params:
      channel: stdout
    input: jd
    id: notify
