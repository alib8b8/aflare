name: Onboarding Plan
# Create 30-60-90 day onboarding plan
# Usage: llm-box install hr-recruiting/onboarding-plan
#        llm-box run onboarding-plan/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Create a comprehensive 30-60-90 day onboarding plan for {{ .params.role }}.
      
      Role: {{ .params.role }}
      Level: {{ .params.level }}
      Department: {{ .params.department }}
      
      Onboarding plan structure:
      1. Pre-Day 1 (preparation)
         - Paperwork and setup
         - Welcome package
         - First day schedule
      2. First Week
         - Day 1: Welcome and setup
         - Day 2: Company overview
         - Day 3: Team introductions
         - Day 4: Tools and processes
         - Day 5: Shadowing and first small task
      3. First 30 Days
         - Learning objectives
         - Key tasks
         - Meetings to attend
         - People to meet
         - First deliverable
      4. First 60 Days
         - Increased responsibility
         - Project involvement
         - Skill building
         - First performance check-in
      5. First 90 Days
         - Full role integration
         - Ownership of responsibilities
         - Performance review
         - Goals setting
      6. Manager checklist
      7. Buddy/mentor responsibilities
      8. Onboarding success metrics
    id: onboarding

  - node: file_write
    params:
      path: onboarding-plan.md
    input: onboarding
    id: save

  - node: notify
    params:
      channel: stdout
    input: onboarding
    id: notify
