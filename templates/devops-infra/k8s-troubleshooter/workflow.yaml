name: K8s Troubleshooter
# Diagnose and fix Kubernetes issues from error logs
# Usage: aflare install devops-infra/k8s-troubleshooter
#        aflare run k8s-troubleshooter/workflow.yaml

steps:
  - node: code_interpreter
    params:
      language: python
      code: |
        import subprocess, json

        def run_kubectl(args):
            r = subprocess.run(["kubectl"] + args, capture_output=True, text=True)
            return r.stdout or r.stderr or ""

        print("=== Cluster Info ===")
        out = run_kubectl(["cluster-info"])
        print(out or "Cannot connect to cluster")

        print("=== Node Status ===")
        out = run_kubectl(["get", "nodes", "-o", "wide"])
        print(out or "Cannot get nodes")

        print("=== Node Conditions ===")
        r = subprocess.run(["kubectl", "get", "nodes", "-o", "json"], capture_output=True, text=True)
        try:
            data = json.loads(r.stdout)
            for item in data.get("items", []):
                name = item["metadata"]["name"]
                for cond in item["status"].get("conditions", []):
                    if cond["status"] != "False" or cond["type"] == "Ready":
                        print(f'{name}: {cond["type"]}={cond["status"]} ({cond.get("reason", "")})')
        except Exception:
            print("Cannot parse node conditions")
    id: cluster_info

  - node: execute
    params:
      command: |
        echo "=== Problem Pods ==="
        kubectl get pods --all-namespaces --field-selector=status.phase!=Running 2>/dev/null | head -30 || echo "Cannot get pods"
        echo "=== Recent Events ==="
        kubectl get events --all-namespaces --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || echo "Cannot get events"
        echo "=== Resource Pressure ==="
        kubectl top nodes 2>/dev/null || echo "Metrics server not available"
        kubectl top pods --all-namespaces 2>/dev/null | head -20 || echo "Pod metrics not available"
    id: pod_events

  - node: code_interpreter
    params:
      language: python
      code: |
        import subprocess

        namespace = "{{ .params.namespace }}"
        resource_type = "{{ .params.resource_type }}"
        resource_name = "{{ .params.resource_name }}"
        error_logs = "{{ .params.error_logs }}"

        print("=== Error Logs ===")
        if error_logs:
            print(error_logs)
        else:
            print("No specific error logs provided. Checking common sources...")
            r = subprocess.run(["kubectl", "logs", "-n", "kube-system", "-l", "component=kube-apiserver", "--tail=20"], capture_output=True, text=True)
            print(r.stdout or "Cannot access API server logs")
            print("---")
            r = subprocess.run(["kubectl", "logs", "-n", "kube-system", "-l", "component=kube-controller-manager", "--tail=20"], capture_output=True, text=True)
            print(r.stdout or "Cannot access controller manager logs")

        print("=== Target Namespace ===")
        r = subprocess.run(["kubectl", "get", "all", "-n", namespace], capture_output=True, text=True)
        print(r.stdout or f"Cannot access namespace {namespace}")

        print("=== Target Resource ===")
        r = subprocess.run(["kubectl", "describe", resource_type, resource_name, "-n", namespace], capture_output=True, text=True)
        print(r.stdout or f"Cannot describe resource {resource_type}/{resource_name}")
    id: error_context

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 5
    input: |
      Troubleshoot the Kubernetes issue based on the following diagnostics:

      Cluster Info: {{ .cluster_info }}
      Pod Events: {{ .pod_events }}
      Error Context: {{ .error_context }}

      Target namespace: {{ .params.namespace }}
      Target resource: {{ .params.resource_type }}/{{ .params.resource_name }}
      Symptom description: {{ .params.symptom }}

      Generate a comprehensive troubleshooting guide:

      1. Issue Summary
         - What is the observed symptom
         - Which resources are affected
         - Impact severity (Critical / High / Medium / Low)
         - Timeline of the issue (if determinable)

      2. Root Cause Analysis
         - Most likely root cause (with confidence level)
         - Alternative possible causes
         - Evidence supporting each hypothesis
         - Event chain leading to the failure

      3. Diagnostic Steps Performed
         - What was checked and findings
         - Cluster health indicators
         - Resource utilization patterns
         - Configuration inconsistencies found

      4. Step-by-Step Fix Guide
         - Immediate mitigation steps (stop the bleeding)
         - Permanent fix steps with exact commands
         - Validation steps after each fix
         - Rollback instructions if fix doesn't work

      5. Prevention Measures
         - Monitoring alerts to add
         - Resource limits to adjust
         - Health checks to implement
         - Configuration changes to prevent recurrence
         - Runbook/documentation updates needed

      6. Related Resources
         - Relevant Kubernetes documentation links
         - Community issues or known bugs
         - Similar incident patterns
    id: fix_guide

  - node: file_write
    params:
      path: k8s-troubleshoot-guide.md
    input: fix_guide
    id: save