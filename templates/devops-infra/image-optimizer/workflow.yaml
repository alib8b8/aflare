name: Image Optimizer
# Batch optimize images for web
# Usage: aflare install automation/image-optimizer
#        aflare run image-optimizer/workflow.yaml

steps:
  - node: code_interpreter
    params:
      language: python
      code: |
        import os, shutil, glob as globmod

        directory = "{{ .params.directory }}"
        quality = int("{{ .params.quality | default 80 }}")

        before_size = sum(os.path.getsize(os.path.join(directory, f)) for f in os.listdir(directory) if os.path.isfile(os.path.join(directory, f)))
        image_exts = [".jpg", ".jpeg", ".png", ".webp"]
        image_files = [f for f in os.listdir(directory) if os.path.isfile(os.path.join(directory, f)) and os.path.splitext(f)[1].lower() in image_exts]
        print("=== Before ===")
        print(f"Directory size: {before_size} bytes")
        print(f"{len(image_files)} images found")

        optimized_dir = os.path.join(directory, "optimized")
        os.makedirs(optimized_dir, exist_ok=True)
        for img in image_files:
            src = os.path.join(directory, img)
            dst = os.path.join(optimized_dir, img)
            try:
                from PIL import Image
                im = Image.open(src)
                im.save(dst, quality=quality)
            except:
                shutil.copy2(src, dst)
        print("Optimization complete")

        after_size = sum(os.path.getsize(os.path.join(optimized_dir, f)) for f in os.listdir(optimized_dir) if os.path.isfile(os.path.join(optimized_dir, f)))
        print("=== After ===")
        print(f"Optimized size: {after_size} bytes")
        if before_size > 0:
            saved_pct = (before_size - after_size) * 100 / before_size
            print(f"Saved: {saved_pct:.1f}%")
    id: optimize

  - node: template_render
    params:
      template: |
        # Image Optimization Report
        Date: {{ .date }}
        Directory: {{ .params.directory }}
        Quality: {{ .params.quality | default 80 }}%
        
        {{ .optimize }}
    id: report

  - node: file_write
    params:
      path: optimization-report.md
    input: report
    id: save

  - node: notify
    params:
      channel: stdout
    input: report
    id: notify
