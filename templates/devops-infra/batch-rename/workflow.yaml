name: Rename Batch Tool
# Batch rename files with patterns
# Usage: llm-box install automation/batch-rename
#        llm-box run batch-rename/workflow.yaml

steps:
  - node: execute
    params:
      command: ls "{{ .params.directory }}" | head -30
    id: original_files

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 2
    input: |
      Generate a shell script to batch rename files in "{{ .params.directory }}".
      
      Rename pattern: {{ .params.pattern }}
      Replace with: {{ .params.replace }}
      
      Original files:
      {{ .original_files }}
      
      Create a dry-run script that shows what would change,
      then the actual rename command.
    id: rename_script

  - node: file_write
    params:
      path: rename-files.sh
    input: rename_script
    id: save

  - node: template_render
    params:
      template: |
        # Batch Rename
        Date: {{ .date }}
        Directory: {{ .params.directory }}
        Pattern: {{ .params.pattern }}
        
        Script saved to rename-files.sh
        
        Original files:
        {{ .original_files }}
    id: report

  - node: notify
    params:
      channel: stdout
    input: report
    id: notify
