name: SSL Certificate Checker
# Check SSL certificate expiry for domains
# Usage: aflare install devops-monitoring/ssl-cert-checker
#        aflare run ssl-cert-checker/workflow.yaml

steps:
  - node: code_interpreter
    params:
      language: python
      code: |
        import subprocess, ssl, socket, datetime

        domains = "{{ .params.domains }}".split()
        for domain in domains:
            print(f"=== {domain} ===")
            r = subprocess.run(
                ["openssl", "s_client", "-servername", domain, "-connect", f"{domain}:443"],
                input=b"", capture_output=True, text=True, timeout=10
            )
            if r.returncode == 0:
                r2 = subprocess.run(
                    ["openssl", "x509", "-noout", "-dates", "-subject"],
                    input=r.stdout, capture_output=True, text=True
                )
                print(r2.stdout or "Failed to parse cert")
            else:
                print("Failed to connect")
            print()
    id: cert_info

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 2
    input: |
      Analyze these SSL certificates and create an expiry alert report:
      {{ .cert_info }}
      
      Highlight certificates expiring within 30 days.
    id: report

  - node: file_write
    params:
      path: ssl-cert-report.md
    input: report
    id: save

  - node: notify
    params:
      channel: stdout
    input: report
    id: notify
