name: Incident Response Plan
# Generate incident response playbook
# Usage: llm-box install security/incident-response
#        llm-box run incident-response/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Create a comprehensive incident response plan for {{ .params.company }}.
      
      Company size: {{ .params.size }}
      Industry: {{ .params.industry }}
      
      Playbook should cover:
      1. Incident Classification
         - Critical / High / Medium / Low definitions
         - Examples for each level
      2. Response Team
         - Roles and responsibilities
         - Escalation paths
         - Communication protocols
      3. Incident Types & Playbooks
         - Data breach
         - Ransomware
         - DDoS attack
         - Insider threat
         - Phishing incident
      4. Response Timeline
         - First 15 minutes
         - First hour
         - First 4 hours
         - First 24 hours
      5. Communication Templates
         - Internal notification
         - Customer notification
         - Regulatory reporting
      6. Post-Incident Review
         - Lessons learned process
         - Root cause analysis
      7. Tabletop exercise plan
    id: playbook

  - node: file_write
    params:
      path: incident-response-playbook.md
    input: playbook
    id: save
