name: File Organizer
# Organize files by type, date, or extension
# Usage: aflare install automation/file-organizer
#        aflare run file-organizer/workflow.yaml

steps:
  - node: code_interpreter
    params:
      language: python
      code: |
        import os, shutil

        directory = "{{ .params.directory }}"
        files = sorted(os.listdir(directory))[:30]
        for f in files:
            full = os.path.join(directory, f)
            if os.path.isfile(full):
                size = os.path.getsize(full)
                print(f"{size:>10}  {f}")

        # Organize by type
        categories = {
            "images": [".jpg", ".jpeg", ".png", ".gif", ".svg", ".webp"],
            "documents": [".pdf", ".doc", ".docx", ".txt", ".md", ".xls", ".xlsx", ".ppt", ".pptx"],
            "archives": [".zip", ".tar.gz", ".rar", ".7z"],
            "code": [".py", ".js", ".go", ".java", ".cpp", ".rs", ".ts"],
            "audio": [".mp3", ".wav", ".flac", ".aac"],
            "video": [".mp4", ".mkv", ".avi", ".mov", ".webm"],
        }
        for cat in categories:
            os.makedirs(os.path.join(directory, cat), exist_ok=True)

        moved = {}
        for f in os.listdir(directory):
            src = os.path.join(directory, f)
            if not os.path.isfile(src):
                continue
            ext = os.path.splitext(f)[1].lower()
            dest_cat = "other"
            for cat, exts in categories.items():
                if ext in exts:
                    dest_cat = cat
                    break
            shutil.move(src, os.path.join(directory, dest_cat, f))
            moved[dest_cat] = moved.get(dest_cat, 0) + 1

        print("\nOrganization complete")
        print("=== Directory Structure ===")
        for cat in sorted(moved.keys()):
            print(f"{cat}: {moved[cat]} files")
    id: organize

  - node: template_render
    params:
      template: |
        # File Organization Report
        Date: {{ .date }}
        Directory: {{ .params.directory }}
        
        ## Result
        {{ .organize }}
        
        Files organized by type into subdirectories.
    id: report

  - node: file_write
    params:
      path: file-organization-report.md
    input: report
    id: save

  - node: notify
    params:
      channel: stdout
    input: report
    id: notify
