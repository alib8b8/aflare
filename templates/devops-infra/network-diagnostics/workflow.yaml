name: Network Diagnostics
# Run network diagnostics and generate report
# Usage: aflare install networking/network-diagnostics
#        aflare run network-diagnostics/workflow.yaml

steps:
  - node: code_interpreter
    params:
      language: python
      code: |
        import subprocess, sys

        target = "{{ .params.target }}"

        print("=== Ping Test ===")
        r = subprocess.run(["ping", "-c", "4", target], capture_output=True, text=True)
        print(r.stdout or r.stderr or "ping failed")

        print("=== Traceroute ===")
        r = subprocess.run(["traceroute", target], capture_output=True, text=True)
        if r.returncode != 0:
            r = subprocess.run(["tracepath", target], capture_output=True, text=True)
        print(r.stdout or r.stderr or "traceroute unavailable")

        print("=== DNS Lookup ===")
        r = subprocess.run(["nslookup", target], capture_output=True, text=True)
        print(r.stdout or r.stderr or "nslookup failed")
        r = subprocess.run(["dig", target], capture_output=True, text=True)
        print(r.stdout or r.stderr or "dig unavailable")

        print("=== Port Check ===")
        import socket
        for port in [80, 443, 22]:
            try:
                s = socket.create_connection((target, port), timeout=3)
                s.close()
                print(f"Port {port}: OPEN")
            except:
                print(f"Port {port}: closed")

        print("=== Speed Test ===")
        r = subprocess.run(["curl", "-s", "-o", "/dev/null", "-w", "Download speed: %{speed_download} bytes/sec\\n", "https://speed.cloudflare.com/__down?bytes=10000000"], capture_output=True, text=True)
        print(r.stdout or r.stderr or "speed test failed")
    id: diagnostics

  - node: template_render
    params:
      template: |
        # Network Diagnostics Report
        Date: {{ .date }}
        Target: {{ .params.target }}
        
        {{ .diagnostics }}
    id: report

  - node: file_write
    params:
      path: network-report.md
    input: report
    id: save

  - node: notify
    params:
      channel: stdout
    input: report
    id: notify
