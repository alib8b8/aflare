name: RSS Feed Aggregator
# Aggregate and summarize RSS feeds
# Usage: aflare install automation/rss-aggregator
#        aflare run rss-aggregator/workflow.yaml

steps:
  - node: code_interpreter
    params:
      language: python
      code: |
        import urllib.request

        feeds = "{{ .params.feeds }}".split()
        for feed in feeds:
            print(f"=== {feed} ===")
            try:
                with urllib.request.urlopen(feed, timeout=30) as resp:
                    data = resp.read().decode("utf-8", errors="replace")
                    print(data[:2000])
            except Exception as e:
                print(f"Error fetching feed: {e}")
            print()
    id: feed_data

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render, json_parse
      max_iterations: 3
    input: |
      Parse and summarize these RSS feeds:
      {{ .feed_data }}
      
      Create a digest with:
      1. Top 10 most important stories
      2. Categorize by topic
      3. Key trends across all feeds
      4. Must-read articles with brief summaries
      5. Sources and attribution
      
      Format as a readable daily digest.
    id: digest

  - node: file_write
    params:
      path: rss-digest.md
    input: digest
    id: save

  - node: notify
    params:
      channel: stdout
    input: digest
    id: notify
