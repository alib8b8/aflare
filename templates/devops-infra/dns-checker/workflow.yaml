name: DNS Records Checker
# Check all DNS records for a domain
# Usage: aflare install networking/dns-checker
#        aflare run dns-checker/workflow.yaml

steps:
  - node: code_interpreter
    params:
      language: python
      code: |
        import subprocess

        domain = "{{ .params.domain }}"

        def run_dig(record_type, name):
            r = subprocess.run(["dig", "+short", record_type, name], capture_output=True, text=True)
            if r.returncode == 0 and r.stdout.strip():
                return r.stdout.strip()
            r = subprocess.run(["nslookup", f"-type={record_type}", name], capture_output=True, text=True)
            return r.stdout.strip() or "N/A"

        print(f"=== DNS Records for {domain} ===")
        print("A Records:")
        print(run_dig("A", domain))
        print("\nAAAA Records:")
        print(run_dig("AAAA", domain))
        print("\nMX Records:")
        print(run_dig("MX", domain))
        print("\nNS Records:")
        print(run_dig("NS", domain))
        print("\nTXT Records:")
        print(run_dig("TXT", domain))
        print("\nCNAME (www):")
        print(run_dig("CNAME", f"www.{domain}"))
        print("\nSOA Record:")
        print(run_dig("SOA", domain))
    id: dns_records

  - node: template_render
    params:
      template: |
        # DNS Records Report
        Date: {{ .date }}
        Domain: {{ .params.domain }}
        
        {{ .dns_records }}
    id: report

  - node: file_write
    params:
      path: dns-report.md
    input: report
    id: save

  - node: notify
    params:
      channel: stdout
    input: report
    id: notify
