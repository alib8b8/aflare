name: Backup Automation
# Automated backup workflow with verification
# Usage: aflare install automation/backup-automation
#        aflare run backup-automation/workflow.yaml

steps:
  - node: code_interpreter
    params:
      language: python
      code: |
        import os, tarfile, datetime, glob as globmod, time

        backup_dir = "{{ .params.backup_dir }}"
        dest = "{{ .params.destination }}"
        retention_days = int("{{ .params.retention_days }}")

        timestamp = datetime.datetime.now().strftime("%Y%m%d-%H%M%S")
        archive_name = os.path.join(dest, f"backup-{timestamp}.tar.gz")
        os.makedirs(dest, exist_ok=True)

        with tarfile.open(archive_name, "w:gz") as tar:
            tar.add(backup_dir, arcname=os.path.basename(backup_dir))
        print("Backup completed")
        print(f"Archive: {archive_name}")

        # Verification
        print("=== Recent backups ===")
        for f in sorted(globmod.glob(os.path.join(dest, "*.tar.gz")), key=os.path.getmtime, reverse=True)[:5]:
            size = os.path.getsize(f)
            print(f"{os.path.basename(f)}: {size} bytes")

        # Cleanup
        cutoff = time.time() - retention_days * 86400
        for f in globmod.glob(os.path.join(dest, "*.tar.gz")):
            if os.path.getmtime(f) < cutoff:
                os.remove(f)
                print(f"Removed old backup: {os.path.basename(f)}")
        print("Old backups cleaned up")
    id: backup_ops

  - node: template_render
    params:
      template: |
        # Backup Report
        Date: {{ .date }}
        Status: Completed
        
        Backup source: {{ .params.backup_dir }}
        Destination: {{ .params.destination }}
        
        {{ .backup_ops }}
        
        Cleanup: Old backups (> {{ .params.retention_days }} days) removed
    id: report

  - node: file_write
    params:
      path: backup-report.md
    input: report
    id: save

  - node: notify
    params:
      channel: stdout
    input: report
    id: notify
