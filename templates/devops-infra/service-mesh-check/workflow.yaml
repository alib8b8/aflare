name: Service Mesh Health Check
# Check Istio/Service Mesh configuration and health
# Usage: aflare install devops-infra/service-mesh-check
#        aflare run service-mesh-check/workflow.yaml

steps:
  - node: execute
    params:
      command: |
        echo "=== Istio Version ==="
        istioctl version --remote=false 2>/dev/null || echo "istioctl not available"
        echo "=== Istio Control Plane ==="
        kubectl get pods -n istio-system 2>/dev/null || echo "Cannot access istio-system namespace"
        echo "=== Istio Ingress Gateway ==="
        kubectl get svc istio-ingressgateway -n istio-system 2>/dev/null || echo "No ingress gateway found"
        echo "=== Sidecar Injection Status ==="
        kubectl get namespace -l istio-injection=enabled 2>/dev/null || echo "No namespaces with injection enabled"
    id: mesh_status

  - node: execute
    params:
      command: |
        echo "=== Virtual Services ==="
        kubectl get virtualservices --all-namespaces 2>/dev/null | head -30 || echo "No VirtualServices found"
        echo "=== Destination Rules ==="
        kubectl get destinationrules --all-namespaces 2>/dev/null | head -20 || echo "No DestinationRules found"
        echo "=== Gateways ==="
        kubectl get gateways --all-namespaces 2>/dev/null | head -10 || echo "No Gateways found"
        echo "=== PeerAuthentications ==="
        kubectl get peerauthentications --all-namespaces 2>/dev/null | head -10 || echo "No PeerAuthentications found"
        echo "=== AuthorizationPolicies ==="
        kubectl get authorizationpolicies --all-namespaces 2>/dev/null | head -15 || echo "No AuthorizationPolicies found"
        echo "=== Service Entries ==="
        kubectl get serviceentries --all-namespaces 2>/dev/null | head -10 || echo "No ServiceEntries found"
    id: mesh_resources

  - node: execute
    params:
      command: |
        echo "=== Pods with Sidecar Issues ==="
        kubectl get pods --all-namespaces -o json 2>/dev/null | python3 -c "
import json, sys
try:
    data = json.load(sys.stdin)
    issues = []
    for item in data.get('items', []):
        ns = item['metadata']['namespace']
        name = item['metadata']['name']
        containers = item['spec'].get('containers', [])
        container_names = [c['name'] for c in containers]
        istio_containers = [c for c in container_names if 'istio' in c.lower()]
        statuses = item['status'].get('containerStatuses', [])
        for cs in statuses:
            if cs.get('name') in istio_containers and not cs.get('ready', False):
                issues.append(f'{ns}/{name}: {cs[\"name\"]} not ready')
    for i in issues[:20]:
        print(i)
    if not issues:
        print('No sidecar issues detected')
except Exception as e:
    print(f'Error: {e}')
" 2>/dev/null || echo "Cannot query pod sidecar status"
    id: sidecar_health

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 4
    input: |
      Analyze the service mesh health based on the following diagnostics:

      Control Plane Status: {{ .mesh_status }}
      Mesh Resources: {{ .mesh_resources }}
      Sidecar Health: {{ .sidecar_health }}

      Generate a comprehensive Service Mesh Health Report:

      1. Control Plane Health
         - Istio version and upgrade recommendations
         - Control plane component status (istiod, ingress, egress)
         - Resource utilization assessment
         - High availability configuration check

      2. Data Plane Analysis
         - Sidecar injection coverage across namespaces
         - Sidecar health and readiness issues
         - Resource limits and requests for sidecars
         - Proxy configuration version consistency

      3. Traffic Management Review
         - VirtualService configuration overview
         - DestinationRule settings (load balancing, TLS)
         - Gateway exposure and ingress patterns
         - Circuit breaking and retry policies
         - Timeout and fault injection configurations

      4. Security Posture
         - mTLS status (strict vs permissive mode)
         - PeerAuthentication policies
         - AuthorizationPolicy coverage
         - Service-to-service access control gaps
         - External service access control (ServiceEntries)

      5. Observability
         - Tracing configuration
         - Metrics collection status
         - Access logging configuration
         - Integration with monitoring tools (Prometheus, Grafana, Kiali)

      6. Issues & Recommendations
         - Critical issues requiring immediate attention
         - Configuration drift from best practices
         - Performance optimization opportunities
         - Upgrade and migration recommendations
         - Security hardening steps
    id: mesh_report

  - node: file_write
    params:
      path: service-mesh-health-report.md
    input: mesh_report
    id: save