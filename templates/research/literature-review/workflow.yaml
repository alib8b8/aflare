name: Literature Review
# Systematic literature review and synthesis workflow
# Usage: llm-box install research/literature-review
#        llm-box run literature-review/workflow.yaml

steps:
  - node: search_aggregate
    params:
      platforms: reddit,hackernews,github,google
      max_results: "50"
    input: |
      {{ .params.topic }}
      Recent papers, studies, and reviews in this field
    id: initial_search

  - node: supervisor
    params:
      strategy: swarm
      domain: research
      specialists: researcher,critic,evaluator,data_analyst
    input: |
      Conduct a systematic literature review on: {{ .params.topic }}

      Search Results:
      {{ .initial_search }}

      Time range: {{ .params.time_range | default "last 5 years" }}
      Focus areas: {{ .params.focus | default "all" }}

      Produce:
      1. KEY PAPERS — 20 most influential papers with: title, authors, year, venue, key contribution, citations
      2. RESEARCH GAPS — underexplored areas and open questions
      3. METHODOLOGY TRENDS — evolution of approaches over time
      4. THEORETICAL FOUNDATIONS — core theories and frameworks
      5. DEBATES & CONTROVERSIES — conflicting findings and unresolved issues
      6. FUTURE DIRECTIONS — promising research avenues
      7. MINDMAP — visual structure of the field (Mermaid)
    id: review

  - node: verify
    params:
      verify_type: factual
      output_format: detailed
    input: |
      Verify this literature review for accuracy:
      {{ .review }}

      Check:
      1. Are paper titles and authors correct?
      2. Are venue names accurate?
      3. Are key contributions properly attributed?
      4. Is the analysis balanced (doesn't omit important work)?
      5. Are research gaps genuinely gaps or just missing searches?
    id: verification

  - node: file_write
    params:
      path: literature-review.md
    input: review
    id: save

  - node: notify
    params:
      channel: stdout
    input: review
    id: notify
