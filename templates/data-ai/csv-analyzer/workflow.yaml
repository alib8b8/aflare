name: CSV Data Analyzer
# Analyze CSV data files and generate insights
# Usage: aflare install data-analytics/csv-analyzer
#        aflare run csv-analyzer/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.csv_path }}"
    id: csv_data

  - node: code_interpreter
    params:
      language: python
      code: |
        import csv, os

        path = "{{ .params.csv_path }}"
        with open(path) as f:
            reader = csv.reader(f)
            header = next(reader)
            line_count = sum(1 for _ in reader) + 1

        print(f"Columns: {len(header)}")
        for i, col in enumerate(header, 1):
            print(f"{i}: {col}")
        print(f"---")
        print(f"Total lines: {line_count}")
        print(f"---")
        with open(path) as f:
            for i, line in enumerate(f):
                if i < 5:
                    print(line.rstrip())
    id: csv_stats

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render, transform
      max_iterations: 4
    input: |
      Analyze this CSV data:
      
      File stats: {{ .csv_stats }}
      
      Data preview: {{ .csv_data }}
      
      Provide:
      1. Data quality assessment (missing values, outliers)
      2. Descriptive statistics for numerical columns
      3. Key trends and patterns
      4. Interesting correlations
      5. Top insights (5-7 findings)
      6. Recommendations based on data
      7. Suggested next steps for deeper analysis
    id: analysis

  - node: file_write
    params:
      path: data-analysis-report.md
    input: analysis
    id: save

  - node: notify
    params:
      channel: stdout
    input: analysis
    id: notify
