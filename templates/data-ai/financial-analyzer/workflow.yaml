name: Financial Report Analyzer
# Analyze financial reports and key metrics
# Usage: aflare install data-analytics/financial-analyzer
#        aflare run financial-analyzer/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.financial_file }}"
    id: financial_data

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Analyze this financial data:
      {{ .financial_data }}
      
      Company: {{ .params.company }}
      Period: {{ .params.period }}
      
      Provide:
      1. Revenue analysis and trends
      2. Profitability analysis (gross margin, operating margin, net margin)
      3. Key financial ratios
      4. Expense breakdown and analysis
      5. Cash flow assessment
      6. Balance sheet health
      7. Year-over-year comparisons
      8. Red flags and concerns
      9. Financial health score
      10. Recommendations for improvement
    id: analysis

  - node: file_write
    params:
      path: financial-analysis.md
    input: analysis
    id: save

  - node: notify
    params:
      channel: stdout
    input: analysis
    id: notify
