name: Research Data Analysis
# Statistical analysis and visualization for research data
# Usage: aflare install research/data-analysis
#        aflare run data-analysis/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.data_file }}"
    id: raw_data

  - node: code_interpreter
    params:
      sandbox: "true"
    input: |
      Analyze this research data:

      Data: {{ .raw_data }}
      Research question: {{ .params.research_question }}
      Dependent variables: {{ .params.dependent_vars }}
      Independent variables: {{ .params.independent_vars }}
      Hypothesis: {{ .params.hypothesis }}

      Perform:
      1. Descriptive statistics (mean, median, SD, range, distribution)
      2. Data cleaning: identify outliers, missing values, anomalies
      3. Inferential statistics: appropriate tests (t-test, ANOVA, regression, chi-square, etc.)
      4. Effect sizes and confidence intervals
      5. Statistical power analysis
      6. Visualizations: boxplots, scatterplots, histograms, heatmaps (as text-based or data descriptions)
      7. Assumptions checking: normality, homogeneity of variance, independence
      8. Results table with proper formatting

      Report in APA-like format with clear interpretation.
    id: analysis

  - node: supervisor
    params:
      strategy: sequential
      domain: research
      specialists: data_analyst,critic,evaluator
    input: |
      Review and validate this statistical analysis:

      {{ .analysis }}

      Original hypothesis: {{ .params.hypothesis }}
      Research question: {{ .params.research_question }}

      Check:
      1. Are the statistical tests appropriate for the data type?
      2. Are assumptions properly checked and reported?
      3. Is effect size reported alongside p-values?
      4. Is the interpretation accurate (not overclaiming)?
      5. Are limitations properly acknowledged?
      6. Is there any p-hacking or questionable practice?

      Produce a validated analysis report.
    id: validated_analysis

  - node: file_write
    params:
      path: data-analysis-report.md
    input: validated_analysis
    id: save

  - node: notify
    params:
      channel: stdout
    input: validated_analysis
    id: notify
