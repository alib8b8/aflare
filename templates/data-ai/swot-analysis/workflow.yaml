name: SWOT Analysis Generator
# Generate comprehensive SWOT analysis for any business
# Usage: llm-box install research-analysis/swot-analysis
#        llm-box run swot-analysis/workflow.yaml

steps:
  - node: http_request
    params:
      url: https://hn.algolia.com/api/v1/search?query={{ .params.company }}&tags=story&hitsPerPage=10
      method: GET
      timeout: 30s
    id: company_mentions

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: researcher, template_render
      max_iterations: 4
    input: |
      Create a detailed SWOT analysis for {{ .params.company }} in {{ .params.industry }}.
      
      Context: {{ .company_mentions }}
      
      Include:
      STRENGTHS (8-10 points):
      - Core competencies
      - Unique advantages
      - Strong resources
      
      WEAKNESSES (8-10 points):
      - Gaps and limitations
      - Competitive disadvantages
      - Resource constraints
      
      OPPORTUNITIES (8-10 points):
      - Market trends to leverage
      - New growth areas
      - Partnership potential
      
      THREATS (8-10 points):
      - Competitive pressures
      - Market risks
      - Regulatory concerns
      
      Add a TOWS matrix summary at the end with strategic combinations.
    id: swot

  - node: file_write
    params:
      path: swot-analysis.md
    input: swot
    id: save
