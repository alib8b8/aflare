name: Data Cleaning Pipeline
# Generate data cleaning and preprocessing pipeline
# Usage: aflare install ai-ml/data-cleaning
#        aflare run data-cleaning/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.data_sample }}"
    id: data_sample

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 4
    input: |
      Create a comprehensive data cleaning pipeline for this dataset:
      {{ .data_sample }}
      
      Dataset type: {{ .params.data_type }}
      Target variable: {{ .params.target }}
      
      Generate Python code for:
      1. Exploratory data analysis (EDA) script
         - Summary statistics
         - Missing value analysis
         - Distribution plots
         - Correlation matrix
      2. Data cleaning pipeline
         - Handle missing values (with multiple strategies)
         - Remove duplicates
         - Handle outliers
         - Fix data types
         - Text cleaning (if applicable)
      3. Feature engineering
         - Scaling/Normalization
         - Encoding categorical variables
         - Feature creation
         - Dimensionality reduction options
      4. Train/test split with stratification
      5. Pipeline saving/loading utility
      
      Include comments and best practices.
    id: pipeline

  - node: file_write
    params:
      path: data-pipeline.py
    input: pipeline
    id: save
