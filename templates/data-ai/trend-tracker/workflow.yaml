name: Trend Tracker
# Track and analyze emerging industry trends
# Usage: llm-box install research-analysis/trend-tracker
#        llm-box run trend-tracker/workflow.yaml

steps:
  - node: http_request
    params:
      url: https://hn.algolia.com/api/v1/search_by_date?tags=story&hitsPerPage=30
      method: GET
      timeout: 30s
    id: top_stories

  - node: json_parse
    params:
      path: hits
    input: top_stories
    id: stories

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Analyze these recent tech stories and identify emerging trends:
      {{ .stories }}
      
      Create a trend report with:
      1. Top 5 trending topics with reasoning
      2. Technologies gaining momentum
      3. Declining trends to watch
      4. Surprising/contrarian signals
      5. Actionable insights for businesses
      6. 90-day outlook predictions
    id: trend_report

  - node: file_write
    params:
      path: trend-report.md
    input: trend_report
    id: save

  - node: notify
    params:
      channel: stdout
    input: trend_report
    id: notify
