name: LLM Fine-tuning Guide
# Generate LLM fine-tuning preparation guide
# Usage: aflare install ai-ml/llm-finetune
#        aflare run llm-finetune/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 4
    input: |
      Create a complete fine-tuning guide for {{ .params.model }}
      on {{ .params.task }} task.
      
      Base model: {{ .params.model }}
      Fine-tuning method: {{ .params.method }}
      Dataset size: {{ .params.dataset_size }}
      
      Include:
      1. Data Preparation Guide
         - Format requirements
         - Quality checklist
         - Train/val/test split strategy
         - Data augmentation techniques
         - Cleaning pipeline
      2. Hyperparameter Configuration
         - Learning rate
         - Batch size
         - Epochs/steps
         - LoRA config (if applicable)
      3. Training Script Template
      4. Evaluation Plan
         - Metrics to track
         - Baseline comparison
         - Human eval protocol
      5. Deployment Considerations
         - Inference optimization
         - Cost analysis
      6. Common Pitfalls & Troubleshooting
      7. Estimated timeline and resources
    id: guide

  - node: file_write
    params:
      path: finetuning-guide.md
    input: guide
    id: save
