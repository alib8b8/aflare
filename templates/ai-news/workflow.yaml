name: AI News Daily
# Fetches and summarizes the latest AI news
# Usage: llm-box install ai-news
#        llm-box run ai-news/workflow.yaml

steps:
  - node: http_request
    params:
      url: https://hn.algolia.com/api/v1/search_by_date?tags=story&query=AI
      method: GET
      timeout: 30s
    id: fetch_ai_stories

  - node: json_parse
    params:
      path: hits
    input: fetch_ai_stories
    id: stories

  - node: http_request
    params:
      url: https://hn.algolia.com/api/v1/search_by_date?tags=story&query=machine+learning
      method: GET
      timeout: 30s
    id: fetch_ml_stories

  - node: json_parse
    params:
      path: hits
    input: fetch_ml_stories
    id: ml_stories

  - node: template_render
    params:
      template: |
        AI News Summary - {{ .date }}
        ===================================

        Top AI Stories:
        {{ range .ai_stories }}
        - {{ .title }} ({{ .url }})
        {{ end }}

        Top ML Stories:
        {{ range .ml_stories }}
        - {{ .title }} ({{ .url }})
        {{ end }}
      date: "{{ .date }}"
    id: raw_summary

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: http_request,json_parse
      max_iterations: 3
    input: |
      Summarize the following AI and ML news stories in 3-5 bullet points.
      Focus on breakthroughs, funding rounds, and new model releases.
      Stories: {{ .raw_summary }}
    id: summary

  - node: file_write
    params:
      path: ai-news-daily.md
    input: summary
    id: save

  - node: notify
    params:
      channel: stdout
    input: summary
    id: notify