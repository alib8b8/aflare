name: alert-threshold
description: Sensor threshold alerting and notification pipeline with multi-channel delivery
version: "1.0.0"
input_schema:
  - name: sensor_id
    type: string
    default: ""
    description: Target sensor device ID
  - name: metric
    type: string
    default: "temperature"
    description: Metric to monitor
  - name: warning_threshold
    type: number
    default: 80
    description: Warning level threshold value
  - name: critical_threshold
    type: number
    default: 95
    description: Critical level threshold value
  - name: notification_channels
    type: string
    default: "email,webhook"
    description: Comma-separated notification channels
  - name: sensor_api
    type: string
    default: "https://api.sensors.local/v1"
    description: Sensor data API endpoint

steps:
  - id: read_sensor
    node: http_request
    params:
      method: GET
      url: "{{ .params.sensor_api }}/sensors/{{ .params.sensor_id }}/metrics/{{ .params.metric }}"
      headers:
        Authorization: "Bearer {{ .env.SENSOR_API_TOKEN }}"
    description: Read current sensor metric value

  - id: evaluate_threshold
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        from datetime import datetime

        reading = {{ .steps.read_sensor.output | toJson }}
        warning = {{ .params.warning_threshold }}
        critical = {{ .params.critical_threshold }}
        value = reading.get("value", 0)

        severity = "normal"
        if value >= critical:
            severity = "critical"
        elif value >= warning:
            severity = "warning"

        result = {
            "sensor_id": "{{ .params.sensor_id }}",
            "metric": "{{ .params.metric }}",
            "value": value,
            "unit": reading.get("unit", ""),
            "warning_threshold": warning,
            "critical_threshold": critical,
            "severity": severity,
            "alert_triggered": severity != "normal",
            "timestamp": datetime.utcnow().isoformat()
        }
        print(json.dumps(result))
    description: Evaluate sensor reading against defined thresholds

  - id: generate_alert
    node: agent
    params:
      prompt: |
        Generate a detailed alert notification based on the threshold evaluation:

        {{ .steps.evaluate_threshold.output | toJson }}

        Create a notification that includes:
        1. Alert title and severity badge
        2. Current value and threshold comparison
        3. Potential impact assessment
        4. Recommended immediate actions
        5. Escalation path if applicable

        Return as JSON with "alert_message" containing title, body, severity, and actions.
      output_format: json
    description: AI-generated alert notification content

  - id: compute_date
    node: code_interpreter
    params:
      language: python
      code: |
        from datetime import date
        print(date.today().isoformat())

  - id: compute_timestamp
    node: code_interpreter
    params:
      language: python
      code: |
        from datetime import datetime
        print(datetime.now().strftime('%H%M%S'))

  - id: notify_channels
    node: http_request
    params:
      method: POST
      url: "{{ .params.sensor_api }}/notifications"
      headers:
        Authorization: "Bearer {{ .env.SENSOR_API_TOKEN }}"
        Content-Type: application/json
      body: |
        {
          "channels": {{ .params.notification_channels | split "," | toJson }},
          "alert": {{ .steps.generate_alert.output.alert_message | toJson }},
          "evaluation": {{ .steps.evaluate_threshold.output | toJson }}
        }
    description: Send notifications through configured channels

  - id: log_alert
    node: file_write
    params:
      file_path: "/data/alerts/{{ .params.sensor_id }}/{{ .compute_date }}_{{ .compute_timestamp }}.json"
      content: |
        {
          "alert_id": "{{ uuid }}",
          "created_at": "{{ now }}",
          "evaluation": {{ .steps.evaluate_threshold.output | toJson }},
          "message": {{ .steps.generate_alert.output | toJson }},
          "notification_status": {{ .steps.notify_channels.output | toJson }}
        }
    description: Log alert event to persistent storage