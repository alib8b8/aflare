name: predictive-maintenance
description: Predictive maintenance for industrial equipment using vibration analysis, temperature trends, and failure prediction
version: "1.0.0"
params:
  - name: equipment_ids
    type: string
    default: ""
    description: Comma-separated equipment IDs to monitor
  - name: equipment_type
    type: string
    default: "motor"
    description: Equipment type - motor, pump, compressor, conveyor, turbine, or generator
  - name: monitoring_metrics
    type: string
    default: "vibration,temperature,current,pressure,rpm,runtime"
    description: Comma-separated predictive maintenance metrics
  - name: failure_thresholds
    type: string
    default: "{}"
    description: JSON failure threshold configuration per metric
  - name: maintenance_api
    type: string
    default: "https://api.maintenance.local/v1"
    description: Predictive maintenance API

steps:
  - id: fetch_equipment_data
    node: http_request
    config:
      method: POST
      url: "{{ .params.maintenance_api }}/equipment/readings"
      headers:
        Authorization: "Bearer {{ .env.MAINTENANCE_API_TOKEN }}"
        Content-Type: application/json
      body: |
        {
          "equipment_ids": {{ .params.equipment_ids | split "," | toJson }},
          "metrics": {{ .params.monitoring_metrics | split "," | toJson }},
          "equipment_type": "{{ .params.equipment_type }}"
        }
    description: Fetch equipment sensor readings

  - id: predict_failures
    node: code_interpreter
    config:
      language: python
      code: |
        import json
        import numpy as np
        from datetime import datetime, timedelta

        data = {{ .steps.fetch_equipment_data.output | toJson }}
        thresholds = json.loads('''{{ .params.failure_thresholds }}''')

        default_thresholds = {
            "vibration": {"warning": 7.0, "critical": 10.0},
            "temperature": {"warning": 75, "critical": 90},
            "current": {"warning": 1.2, "critical": 1.5},
            "pressure": {"warning": 1.1, "critical": 1.3},
            "rpm": {"warning": 1.15, "critical": 1.3}
        }

        equipment = []
        for e in data.get("equipment", []):
            readings = e.get("readings", {})
            risk_factors = []
            overall_risk = 0

            for metric, value_obj in readings.items():
                vals = value_obj.get("history", [value_obj.get("value", 0)])
                if not isinstance(vals, list):
                    vals = [vals]
                current = vals[-1] if vals else 0
                baseline = value_obj.get("baseline", current)

                th = thresholds.get(metric, default_thresholds.get(metric, {}))
                warning = th.get("warning", float("inf"))
                critical = th.get("critical", float("inf"))

                deviation = abs(current - baseline) / max(abs(baseline), 0.001)
                trend = np.polyfit(range(len(vals)), vals, 1)[0] if len(vals) > 1 else 0

                if current >= critical:
                    risk_factors.append({"metric": metric, "value": current, "baseline": baseline, "severity": "critical"})
                    overall_risk += 35
                elif current >= warning:
                    risk_factors.append({"metric": metric, "value": current, "baseline": baseline, "severity": "warning"})
                    overall_risk += 20
                elif deviation > 0.5:
                    risk_factors.append({"metric": metric, "value": current, "baseline": baseline, "severity": "elevated"})
                    overall_risk += 10

                if trend > 0.01:
                    hours_to_critical = (critical - current) / trend if trend > 0 else float("inf")
                    risk_factors[-1]["hours_to_critical"] = round(hours_to_critical, 1) if hours_to_critical < float("inf") else None

            overall_risk = min(overall_risk, 100)
            status = "healthy" if overall_risk < 20 else "monitor" if overall_risk < 50 else "maintenance_required" if overall_risk < 80 else "critical"

            equipment.append({
                "equipment_id": e["equipment_id"],
                "equipment_name": e.get("name", ""),
                "type": "{{ .params.equipment_type }}",
                "runtime_hours": e.get("runtime_hours", 0),
                "risk_score": overall_risk,
                "status": status,
                "risk_factors": risk_factors,
                "recommended_action": "immediate_shutdown" if overall_risk >= 80 else "schedule_maintenance" if overall_risk >= 50 else "increase_monitoring" if overall_risk >= 20 else "routine_check"
            })

        result = {
            "equipment_type": "{{ .params.equipment_type }}",
            "equipment": equipment,
            "summary": {
                "total": len(equipment),
                "healthy": sum(1 for e in equipment if e["status"] == "healthy"),
                "monitor": sum(1 for e in equipment if e["status"] == "monitor"),
                "maintenance_required": sum(1 for e in equipment if e["status"] == "maintenance_required"),
                "critical": sum(1 for e in equipment if e["status"] == "critical")
            }
        }
        print(json.dumps(result))
    description: Predict equipment failures using sensor data and trend analysis

  - id: maintenance_plan
    node: agent
    config:
      prompt: |
        Analyze the predictive maintenance assessment and generate a maintenance plan:

        {{ .steps.predict_failures.output | toJson }}

        Provide:
        1. Prioritized maintenance schedule
        2. Estimated remaining useful life per equipment
        3. Required spare parts and resources
        4. Maintenance procedure recommendations
        5. Cost optimization suggestions (batch maintenance vs. individual)

        Return as JSON with "maintenance_plan" key.
      output_format: json
    description: AI-powered maintenance planning and scheduling

  - id: create_work_orders
    node: http_request
    config:
      method: POST
      url: "{{ .params.maintenance_api }}/work-orders/batch"
      headers:
        Authorization: "Bearer {{ .env.MAINTENANCE_API_TOKEN }}"
        Content-Type: application/json
      body: |
        {{ .steps.maintenance_plan.output.maintenance_plan | toJson }}
    description: Create maintenance work orders for at-risk equipment

  - id: save_prediction_report
    node: file_write
    config:
      file_path: "/data/maintenance/{{ now | date \"2006-01-02\" }}/prediction_{{ .params.equipment_type }}.json"
      content: |
        {
          "report_id": "{{ uuid }}",
          "timestamp": "{{ now }}",
          "equipment_type": "{{ .params.equipment_type }}",
          "predictions": {{ .steps.predict_failures.output.equipment | toJson }},
          "summary": {{ .steps.predict_failures.output.summary | toJson }},
          "maintenance_plan": {{ .steps.maintenance_plan.output | toJson }},
          "work_orders": {{ .steps.create_work_orders.output | toJson }}
        }
    description: Save predictive maintenance report