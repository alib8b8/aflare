name: device-registry
description: IoT device registry and metadata management with CRUD operations and lifecycle tracking
version: "1.0.0"
params:
  - name: registry_api
    type: string
    default: "https://api.iot-registry.local/v1"
    description: Device registry API endpoint
  - name: operation
    type: string
    default: "register"
    description: Operation type - register, update, query, or decommission
  - name: device_payload
    type: string
    default: "{}"
    description: JSON device payload for register/update operations
  - name: device_filter
    type: string
    default: "{}"
    description: JSON filter criteria for query operations

steps:
  - id: validate_device
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        import re

        payload = json.loads('''{{ .params.device_payload }}''')
        errors = []

        required = ["device_id", "device_type", "manufacturer"]
        for field in required:
            if field not in payload or not payload[field]:
                errors.append(f"Missing required field: {field}")

        if "device_id" in payload:
            if not re.match(r'^[a-zA-Z0-9\-_]+$', payload["device_id"]):
                errors.append("Invalid device_id format")

        valid_types = ["sensor", "actuator", "gateway", "controller", "edge"]
        if payload.get("device_type") not in valid_types:
            errors.append(f"Invalid device_type. Must be one of: {valid_types}")

        result = {
            "valid": len(errors) == 0,
            "errors": errors,
            "payload": payload
        }
        print(json.dumps(result))
    description: Validate device metadata before registration

  - id: manage_device
    node: http_request
    params:
      method: "{{ if eq .params.operation \"query\" }}GET{{ else }}POST{{ end }}"
      url: "{{ .params.registry_api }}/devices{{ if eq .params.operation \"query\" }}?filter={{ .params.device_filter }}{{ end }}"
      headers:
        Authorization: "Bearer {{ .env.REGISTRY_TOKEN }}"
        Content-Type: application/json
      body: |
        {{ if ne .params.operation "query" }}{{ .steps.validate_device.output.payload | toJson }}{{ end }}
    description: Execute device registry operation

  - id: analyze_lifecycle
    node: agent
    params:
      prompt: |
        Review the device registry operation result and provide lifecycle management recommendations:

        Operation: {{ .params.operation }}
        Device: {{ .steps.validate_device.output.payload | toJson }}
        Registry Response: {{ .steps.manage_device.output | toJson }}

        Provide:
        1. Current lifecycle stage assessment
        2. Recommended next maintenance window
        3. Compliance check result
        4. Any warnings or advisories

        Return as JSON with "lifecycle_report" key.
      output_format: json
    description: AI-powered device lifecycle analysis

  - id: compute_date
    node: code_interpreter
    params:
      language: python
      code: |
        from datetime import date
        print(date.today().isoformat())

  - id: persist_record
    node: file_write
    params:
      file_path: "/data/registry/{{ .params.operation }}/{{ .compute_date }}_{{ .steps.validate_device.output.payload.device_id }}.json"
      content: |
        {
          "operation": "{{ .params.operation }}",
          "timestamp": "{{ now }}",
          "device": {{ .steps.validate_device.output.payload | toJson }},
          "result": {{ .steps.manage_device.output | toJson }},
          "lifecycle": {{ .steps.analyze_lifecycle.output | toJson }}
        }
    description: Persist device registry record