name: device-health-monitor
description: IoT device health and uptime monitoring with heartbeat tracking, diagnostics, and SLA reporting
version: "1.0.0"
input_schema:
  - name: device_ids
    type: string
    default: ""
    description: Comma-separated device IDs to monitor
  - name: heartbeat_timeout
    type: integer
    default: 300
    description: Heartbeat timeout in seconds before marking offline
  - name: health_metrics
    type: string
    default: "cpu,memory,disk,network,battery"
    description: Comma-separated health metrics to track
  - name: sla_target
    type: number
    default: 99.9
    description: Target SLA percentage for uptime
  - name: monitor_api
    type: string
    default: "https://api.monitor.local/v1"
    description: Device monitoring API endpoint

steps:
  - id: check_heartbeats
    node: http_request
    params:
      method: POST
      url: "{{ .params.monitor_api }}/devices/heartbeat"
      headers:
        Authorization: "Bearer {{ .env.MONITOR_API_TOKEN }}"
        Content-Type: application/json
      body: |
        {
          "device_ids": {{ .params.device_ids | split "," | toJson }},
          "timeout_seconds": {{ .params.heartbeat_timeout }}
        }
    description: Check heartbeat status of all monitored devices

  - id: compute_health
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        from datetime import datetime, timedelta

        devices = {{ .steps.check_heartbeats.output.devices | toJson }}
        timeout = {{ .params.heartbeat_timeout }}
        metrics = "{{ .params.health_metrics }}".split(",")
        sla_target = {{ .params.sla_target }}

        health_report = []
        now = datetime.utcnow()

        for d in devices:
            last_heartbeat = d.get("last_heartbeat")
            online = False
            downtime_minutes = 0

            if last_heartbeat:
                hb_time = datetime.fromisoformat(last_heartbeat.replace("Z", "+00:00"))
                delta = (now - hb_time).total_seconds()
                online = delta <= timeout
                if not online:
                    downtime_minutes = round((delta - timeout) / 60, 1)

            device_metrics = {}
            for m in metrics:
                if m in d.get("metrics", {}):
                    device_metrics[m] = d["metrics"][m]

            uptime_30d = d.get("uptime_30d_percent", 100 if online else 0)
            sla_compliant = uptime_30d >= sla_target

            health_report.append({
                "device_id": d["device_id"],
                "online": online,
                "last_heartbeat": last_heartbeat,
                "downtime_minutes": downtime_minutes,
                "metrics": device_metrics,
                "uptime_30d": uptime_30d,
                "sla_compliant": sla_compliant,
                "status": "healthy" if online and sla_compliant else "unhealthy"
            })

        online_count = sum(1 for d in health_report if d["online"])
        sla_compliant_count = sum(1 for d in health_report if d["sla_compliant"])

        result = {
            "total_devices": len(health_report),
            "online": online_count,
            "offline": len(health_report) - online_count,
            "sla_compliant": sla_compliant_count,
            "sla_target": sla_target,
            "devices": health_report
        }
        print(json.dumps(result))
    description: Compute health scores and SLA compliance

  - id: diagnose_issues
    node: agent
    params:
      prompt: |
        Analyze the device health report and diagnose any issues:

        Health Report: {{ .steps.compute_health.output | toJson }}

        For each unhealthy device, provide:
        1. Root cause diagnosis
        2. Recommended remediation steps
        3. Estimated recovery time
        4. Escalation priority

        Return as JSON with "diagnostics" key containing per-device analysis.
      output_format: json
    description: AI-powered device diagnostics and remediation recommendations

  - id: compute_date
    node: code_interpreter
    params:
      language: python
      code: |
        from datetime import date
        print(date.today().isoformat())

  - id: compute_timestamp
    node: code_interpreter
    params:
      language: python
      code: |
        from datetime import datetime
        print(datetime.now().strftime('%H%M%S'))

  - id: generate_report
    node: file_write
    params:
      file_path: "/data/health_reports/{{ .compute_date }}/health_{{ .compute_timestamp }}.json"
      content: |
        {
          "report_id": "{{ uuid }}",
          "generated_at": "{{ now }}",
          "summary": {
            "total": {{ .steps.compute_health.output.total_devices }},
            "online": {{ .steps.compute_health.output.online }},
            "offline": {{ .steps.compute_health.output.offline }},
            "sla_compliance_rate": {{ .steps.compute_health.output.sla_compliant }}
          },
          "devices": {{ .steps.compute_health.output.devices | toJson }},
          "diagnostics": {{ .steps.diagnose_issues.output | toJson }}
        }
    description: Generate and persist health report