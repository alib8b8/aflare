name: sensor-data-pipeline
description: IoT sensor data ingestion and processing pipeline with validation, enrichment, and storage
version: "1.0.0"
params:
  - name: mqtt_topic
    type: string
    default: "sensors/+/data"
    description: MQTT topic to subscribe for sensor data
  - name: batch_size
    type: integer
    default: 100
    description: Number of records per batch before processing
  - name: anomaly_threshold
    type: number
    default: 3.0
    description: Standard deviation multiplier for anomaly detection
  - name: output_format
    type: string
    default: "json"
    description: Output format for processed data
  - name: storage_endpoint
    type: string
    default: ""
    description: Endpoint for data storage service

steps:
  - id: ingest
    node: http_request
    params:
      method: POST
      url: "{{ .params.storage_endpoint }}/ingest"
      headers:
        Content-Type: application/json
      body: |
        {
          "topic": "{{ .params.mqtt_topic }}",
          "batch_size": {{ .params.batch_size }},
          "timestamp": "{{ now }}"
        }
    description: Subscribe to MQTT topic and ingest raw sensor data

  - id: validate
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        import numpy as np

        raw_data = {{ .steps.ingest.output | toJson }}
        records = raw_data.get("records", [])

        validated = []
        rejected = []
        for rec in records:
            if rec.get("value") is not None and rec.get("timestamp") is not None:
                rec["status"] = "validated"
                validated.append(rec)
            else:
                rec["status"] = "rejected"
                rec["reason"] = "missing required fields"
                rejected.append(rec)

        result = {
            "total": len(records),
            "validated": len(validated),
            "rejected": len(rejected),
            "valid_records": validated,
            "rejected_records": rejected
        }
        print(json.dumps(result))
    description: Validate sensor data completeness and format

  - id: detect_anomalies
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        import numpy as np

        validated = {{ .steps.validate.output.valid_records | toJson }}
        threshold = {{ .params.anomaly_threshold }}

        values = [r["value"] for r in validated]
        mean = np.mean(values)
        std = np.std(values)

        for r in validated:
            z_score = abs((r["value"] - mean) / std) if std > 0 else 0
            r["z_score"] = round(z_score, 3)
            r["is_anomaly"] = z_score > threshold

        anomalies = [r for r in validated if r["is_anomaly"]]
        result = {
            "mean": float(mean),
            "std": float(std),
            "anomaly_count": len(anomalies),
            "records": validated,
            "anomalies": anomalies
        }
        print(json.dumps(result))
    description: Detect anomalies using statistical z-score analysis

  - id: enrich
    node: agent
    params:
      prompt: |
        Analyze the following IoT sensor data with anomaly detection results and provide enrichment insights:

        Records: {{ .steps.detect_anomalies.output.records | toJson }}
        Anomalies: {{ .steps.detect_anomalies.output.anomalies | toJson }}
        Mean: {{ .steps.detect_anomalies.output.mean }}
        Std Dev: {{ .steps.detect_anomalies.output.std }}

        For each anomaly, provide:
        1. Possible cause of the deviation
        2. Recommended action
        3. Severity level (low/medium/high/critical)

        Return the enriched data as JSON with "enrichment" key containing the analysis.
      output_format: json
    description: AI-powered enrichment and root cause analysis

  - id: compute_date
    node: code_interpreter
    params:
      language: python
      code: |
        from datetime import date
        print(date.today().isoformat())

  - id: store
    node: file_write
    params:
      file_path: "/data/processed/{{ .compute_date }}/sensor_batch.json"
      content: |
        {{ .steps.enrich.output | toJson }}
    description: Persist processed and enriched data to storage