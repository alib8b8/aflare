name: occupancy-sensor
description: Occupancy and space utilization tracking with real-time analytics, heatmap generation, and workspace optimization
version: "1.0.0"
params:
  - name: space_ids
    type: string
    default: ""
    description: Comma-separated space or room IDs
  - name: sensor_types
    type: string
    default: "pir,thermal,camera,desk"
    description: Comma-separated occupancy sensor types
  - name: capacity_map
    type: string
    default: "{}"
    description: JSON mapping of space IDs to max capacity
  - name: reporting_window
    type: string
    default: "daily"
    description: Reporting window - hourly, daily, or weekly
  - name: occupancy_api
    type: string
    default: "https://api.occupancy.local/v1"
    description: Occupancy sensor API

steps:
  - id: fetch_occupancy
    node: http_request
    config:
      method: POST
      url: "{{ .params.occupancy_api }}/spaces/occupancy"
      headers:
        Authorization: "Bearer {{ .env.OCCUPANCY_API_TOKEN }}"
        Content-Type: application/json
      body: |
        {
          "space_ids": {{ .params.space_ids | split "," | toJson }},
          "sensor_types": {{ .params.sensor_types | split "," | toJson }}
        }
    description: Fetch real-time occupancy data from sensors

  - id: analyze_utilization
    node: code_interpreter
    config:
      language: python
      code: |
        import json
        import numpy as np

        data = {{ .steps.fetch_occupancy.output | toJson }}
        capacity_map = json.loads('''{{ .params.capacity_map }}''')

        spaces = []
        total_occupancy = 0
        total_capacity = 0

        for s in data.get("spaces", []):
            space_id = s["space_id"]
            current = s.get("current_occupancy", 0)
            max_cap = capacity_map.get(space_id, s.get("max_capacity", 100))
            hourly = s.get("hourly_occupancy", [])

            utilization = (current / max_cap * 100) if max_cap > 0 else 0
            avg_utilization = np.mean(hourly) / max_cap * 100 if hourly and max_cap > 0 else 0
            peak_utilization = max(hourly) / max_cap * 100 if hourly and max_cap > 0 else 0

            status = "underutilized"
            if utilization > 90:
                status = "overcrowded"
            elif utilization > 70:
                status = "optimal"
            elif utilization > 30:
                status = "moderate"

            total_occupancy += current
            total_capacity += max_cap

            spaces.append({
                "space_id": space_id,
                "space_name": s.get("name", ""),
                "current_occupancy": current,
                "max_capacity": max_cap,
                "utilization_pct": round(utilization, 1),
                "avg_utilization_pct": round(avg_utilization, 1),
                "peak_utilization_pct": round(peak_utilization, 1),
                "status": status,
                "free_capacity": max_cap - current
            })

        overall_utilization = (total_occupancy / total_capacity * 100) if total_capacity > 0 else 0

        result = {
            "spaces": spaces,
            "summary": {
                "total_spaces": len(spaces),
                "total_occupancy": total_occupancy,
                "total_capacity": total_capacity,
                "overall_utilization_pct": round(overall_utilization, 1),
                "underutilized": sum(1 for s in spaces if s["status"] == "underutilized"),
                "optimal": sum(1 for s in spaces if s["status"] == "optimal"),
                "overcrowded": sum(1 for s in spaces if s["status"] == "overcrowded")
            }
        }
        print(json.dumps(result))
    description: Analyze space utilization and occupancy patterns

  - id: space_optimization
    node: agent
    config:
      prompt: |
        Analyze the occupancy data and provide space optimization recommendations:

        {{ .steps.analyze_utilization.output | toJson }}

        Provide:
        1. Space utilization efficiency assessment
        2. Underutilized space recommendations
        3. Overcrowding mitigation strategies
        4. Workspace redesign suggestions
        5. Peak usage prediction for next period

        Return as JSON with "space_optimization" key.
      output_format: json
    description: AI-powered space utilization optimization

  - id: save_occupancy_report
    node: file_write
    config:
      file_path: "/data/occupancy/{{ now | date \"2006-01-02\" }}/occupancy_{{ .params.reporting_window }}.json"
      content: |
        {
          "report_id": "{{ uuid }}",
          "timestamp": "{{ now }}",
          "window": "{{ .params.reporting_window }}",
          "spaces": {{ .steps.analyze_utilization.output.spaces | toJson }},
          "summary": {{ .steps.analyze_utilization.output.summary | toJson }},
          "optimization": {{ .steps.space_optimization.output | toJson }}
        }
    description: Save occupancy and utilization report