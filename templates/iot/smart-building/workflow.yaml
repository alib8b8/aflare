name: smart-building
description: Smart building automation and monitoring with HVAC, lighting, access control, and energy optimization
version: "1.0.0"
params:
  - name: building_id
    type: string
    default: ""
    description: Building identifier
  - name: zones
    type: string
    default: ""
    description: Comma-separated building zones or floors
  - name: subsystems
    type: string
    default: "hvac,lighting,access,energy"
    description: Comma-separated building subsystems to monitor
  - name: occupancy_schedule
    type: string
    default: "{}"
    description: JSON occupancy schedule configuration
  - name: building_api
    type: string
    default: "https://api.building.local/v1"
    description: Smart building management API

steps:
  - id: fetch_building_state
    node: http_request
    config:
      method: POST
      url: "{{ .params.building_api }}/buildings/{{ .params.building_id }}/state"
      headers:
        Authorization: "Bearer {{ .env.BUILDING_API_TOKEN }}"
        Content-Type: application/json
      body: |
        {
          "zones": {{ .params.zones | split "," | toJson }},
          "subsystems": {{ .params.subsystems | split "," | toJson }}
        }
    description: Fetch current state of all building subsystems

  - id: analyze_efficiency
    node: code_interpreter
    config:
      language: python
      code: |
        import json
        import numpy as np

        state = {{ .steps.fetch_building_state.output | toJson }}
        schedule = json.loads('''{{ .params.occupancy_schedule }}''')

        zones = []
        total_energy = 0
        total_occupancy = 0

        for z in state.get("zones", []):
            hvac = z.get("hvac", {})
            lighting = z.get("lighting", {})
            energy = z.get("energy", {})
            access = z.get("access", {})

            current_temp = hvac.get("temperature", 0)
            target_temp = hvac.get("target_temperature", 22)
            temp_diff = abs(current_temp - target_temp)

            zone_occupancy = access.get("current_occupancy", 0)
            max_occupancy = access.get("max_occupancy", 100)
            occupancy_rate = (zone_occupancy / max_occupancy * 100) if max_occupancy > 0 else 0

            energy_consumption = energy.get("current_kw", 0)
            total_energy += energy_consumption
            total_occupancy += zone_occupancy

            efficiency_score = 100
            if temp_diff > 3:
                efficiency_score -= 20
            if occupancy_rate < 10 and lighting.get("status") == "on":
                efficiency_score -= 15
            if occupancy_rate > 80 and hvac.get("mode") == "eco":
                efficiency_score -= 10

            zones.append({
                "zone_id": z["zone_id"],
                "temperature": current_temp,
                "target_temp": target_temp,
                "temp_variance": round(temp_diff, 1),
                "occupancy": zone_occupancy,
                "occupancy_rate": round(occupancy_rate, 1),
                "energy_kw": energy_consumption,
                "lighting": lighting.get("status", "off"),
                "hvac_mode": hvac.get("mode", "auto"),
                "efficiency_score": max(efficiency_score, 0)
            })

        result = {
            "building_id": "{{ .params.building_id }}",
            "zones": zones,
            "summary": {
                "total_zones": len(zones),
                "total_energy_kw": round(total_energy, 2),
                "total_occupancy": total_occupancy,
                "avg_efficiency": round(np.mean([z["efficiency_score"] for z in zones]), 1)
            }
        }
        print(json.dumps(result))
    description: Analyze building efficiency and occupancy patterns

  - id: optimize_building
    node: agent
    config:
      prompt: |
        Analyze the smart building data and provide optimization recommendations:

        {{ .steps.analyze_efficiency.output | toJson }}

        Provide:
        1. HVAC optimization for energy savings
        2. Lighting schedule adjustments based on occupancy
        3. Space utilization improvement suggestions
        4. Energy consumption reduction plan
        5. Comfort vs. efficiency balance recommendations

        Return as JSON with "building_optimizations" key.
      output_format: json
    description: AI-powered building optimization recommendations

  - id: apply_automation
    node: http_request
    config:
      method: POST
      url: "{{ .params.building_api }}/buildings/{{ .params.building_id }}/automation"
      headers:
        Authorization: "Bearer {{ .env.BUILDING_API_TOKEN }}"
        Content-Type: application/json
      body: |
        {{ .steps.optimize_building.output.building_optimizations | toJson }}
    description: Apply automated building optimization actions

  - id: save_building_report
    node: file_write
    config:
      file_path: "/data/building/{{ .params.building_id }}/{{ now | date \"2006-01-02\" }}/building_{{ now | date \"150405\" }}.json"
      content: |
        {
          "report_id": "{{ uuid }}",
          "timestamp": "{{ now }}",
          "building_id": "{{ .params.building_id }}",
          "zones": {{ .steps.analyze_efficiency.output.zones | toJson }},
          "summary": {{ .steps.analyze_efficiency.output.summary | toJson }},
          "optimizations": {{ .steps.optimize_building.output | toJson }},
          "automation_result": {{ .steps.apply_automation.output | toJson }}
        }
    description: Save building monitoring and optimization report