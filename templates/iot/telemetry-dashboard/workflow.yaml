name: telemetry-dashboard
description: Real-time telemetry dashboard generator for IoT device metrics visualization
version: "1.0.0"
params:
  - name: device_ids
    type: string
    default: ""
    description: Comma-separated list of device IDs to monitor
  - name: metrics
    type: string
    default: "temperature,humidity,pressure,battery"
    description: Comma-separated list of metrics to display
  - name: time_range
    type: string
    default: "1h"
    description: Time range for data aggregation
  - name: refresh_interval
    type: integer
    default: 30
    description: Dashboard refresh interval in seconds
  - name: telemetry_api
    type: string
    default: "https://api.telemetry.local/v1"
    description: Telemetry data API endpoint

steps:
  - id: query_telemetry
    node: http_request
    config:
      method: POST
      url: "{{ .params.telemetry_api }}/query"
      headers:
        Authorization: "Bearer {{ .env.TELEMETRY_TOKEN }}"
        Content-Type: application/json
      body: |
        {
          "device_ids": {{ .params.device_ids | split "," | toJson }},
          "metrics": {{ .params.metrics | split "," | toJson }},
          "time_range": "{{ .params.time_range }}"
        }
    description: Query telemetry data from API

  - id: aggregate_metrics
    node: code_interpreter
    config:
      language: python
      code: |
        import json
        import numpy as np

        data = {{ .steps.query_telemetry.output | toJson }}
        metrics = "{{ .params.metrics }}".split(",")

        dashboard = {"devices": {}, "summary": {}}
        for device in data.get("results", []):
            did = device["device_id"]
            device_metrics = {}
            for metric in metrics:
                values = [dp[metric] for dp in device.get("data_points", []) if metric in dp]
                if values:
                    device_metrics[metric] = {
                        "current": round(values[-1], 2),
                        "min": round(min(values), 2),
                        "max": round(max(values), 2),
                        "avg": round(np.mean(values), 2),
                        "trend": "up" if len(values) > 1 and values[-1] > values[-2] else "down"
                    }
            dashboard["devices"][did] = device_metrics

        for metric in metrics:
            all_vals = []
            for d in dashboard["devices"].values():
                if metric in d:
                    all_vals.append(d[metric]["current"])
            if all_vals:
                dashboard["summary"][metric] = {
                    "avg": round(np.mean(all_vals), 2),
                    "min": round(min(all_vals), 2),
                    "max": round(max(all_vals), 2)
                }

        print(json.dumps(dashboard))
    description: Aggregate metrics with statistics and trend detection

  - id: generate_insights
    node: agent
    config:
      prompt: |
        Analyze the following telemetry dashboard data and generate actionable insights:

        Dashboard: {{ .steps.aggregate_metrics.output | toJson }}
        Time Range: {{ .params.time_range }}

        Provide:
        1. Top 3 notable observations
        2. Devices requiring attention
        3. Trend analysis for each metric
        4. Recommendations for optimization

        Return as JSON with "insights" key.
      output_format: json
    description: AI-powered dashboard insights and recommendations

  - id: render_dashboard
    node: file_write
    config:
      file_path: "/data/dashboards/{{ now | date \"2006-01-02\" }}/telemetry_{{ now | date \"150405\" }}.json"
      content: |
        {
          "generated_at": "{{ now }}",
          "time_range": "{{ .params.time_range }}",
          "metrics": {{ .params.metrics | split "," | toJson }},
          "devices": {{ .steps.aggregate_metrics.output.devices | toJson }},
          "summary": {{ .steps.aggregate_metrics.output.summary | toJson }},
          "insights": {{ .steps.generate_insights.output | toJson }}
        }
    description: Render and persist dashboard output