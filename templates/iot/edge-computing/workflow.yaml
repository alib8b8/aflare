name: edge-computing
description: Edge computing workload distribution and task orchestration across IoT edge nodes
version: "1.0.0"
params:
  - name: edge_nodes
    type: string
    default: ""
    description: Comma-separated list of edge node IDs
  - name: workload_type
    type: string
    default: "inference"
    description: Type of workload - inference, preprocessing, aggregation, or filtering
  - name: task_payload
    type: string
    default: "{}"
    description: JSON task payload to distribute
  - name: scheduling_strategy
    type: string
    default: "round_robin"
    description: Scheduling strategy - round_robin, least_loaded, or latency_aware
  - name: edge_api
    type: string
    default: "https://api.edge.local/v1"
    description: Edge computing management API

steps:
  - id: query_node_status
    node: http_request
    config:
      method: POST
      url: "{{ .params.edge_api }}/nodes/status"
      headers:
        Authorization: "Bearer {{ .env.EDGE_API_TOKEN }}"
        Content-Type: application/json
      body: |
        {
          "node_ids": {{ .params.edge_nodes | split "," | toJson }}
        }
    description: Query current status and load of edge nodes

  - id: optimize_schedule
    node: code_interpreter
    config:
      language: python
      code: |
        import json

        nodes = {{ .steps.query_node_status.output.nodes | toJson }}
        strategy = "{{ .params.scheduling_strategy }}"
        workload = json.loads('''{{ .params.task_payload }}''')

        node_list = []
        for n in nodes:
            node_list.append({
                "node_id": n["node_id"],
                "cpu_load": n.get("cpu_load", 0),
                "memory_free": n.get("memory_free_mb", 0),
                "latency_ms": n.get("latency_ms", 0),
                "online": n.get("status") == "online"
            })

        online = [n for n in node_list if n["online"]]
        if strategy == "least_loaded":
            online.sort(key=lambda x: x["cpu_load"])
        elif strategy == "latency_aware":
            online.sort(key=lambda x: x["latency_ms"])

        assignments = []
        chunks = workload.get("chunks", [workload])
        for i, chunk in enumerate(chunks):
            if i < len(online):
                assignments.append({
                    "node_id": online[i % len(online)]["node_id"],
                    "task": chunk,
                    "priority": i + 1
                })

        result = {
            "strategy": strategy,
            "total_nodes": len(node_list),
            "online_nodes": len(online),
            "assignments": assignments
        }
        print(json.dumps(result))
    description: Optimize workload distribution based on node status and scheduling strategy

  - id: dispatch_tasks
    node: http_request
    config:
      method: POST
      url: "{{ .params.edge_api }}/tasks/dispatch"
      headers:
        Authorization: "Bearer {{ .env.EDGE_API_TOKEN }}"
        Content-Type: application/json
      body: |
        {{ .steps.optimize_schedule.output | toJson }}
    description: Dispatch optimized tasks to edge nodes

  - id: analyze_distribution
    node: agent
    config:
      prompt: |
        Analyze the edge computing workload distribution results:

        Schedule: {{ .steps.optimize_schedule.output | toJson }}
        Dispatch Result: {{ .steps.dispatch_tasks.output | toJson }}

        Provide:
        1. Load balance assessment across nodes
        2. Bottleneck identification
        3. Resource utilization efficiency
        4. Recommendations for future distribution

        Return as JSON with "analysis" key.
      output_format: json
    description: AI-powered analysis of workload distribution effectiveness

  - id: persist_results
    node: file_write
    config:
      file_path: "/data/edge/{{ now | date \"2006-01-02\" }}/workload_{{ now | date \"150405\" }}.json"
      content: |
        {
          "timestamp": "{{ now }}",
          "workload_type": "{{ .params.workload_type }}",
          "schedule": {{ .steps.optimize_schedule.output | toJson }},
          "dispatch": {{ .steps.dispatch_tasks.output | toJson }},
          "analysis": {{ .steps.analyze_distribution.output | toJson }}
        }
    description: Persist workload distribution record