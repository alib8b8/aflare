name: water-quality
description: Water quality monitoring and alerting with multi-parameter analysis, contamination detection, and compliance reporting
version: "1.0.0"
params:
  - name: station_ids
    type: string
    default: ""
    description: Comma-separated water monitoring station IDs
  - name: quality_parameters
    type: string
    default: "ph, dissolved_oxygen, turbidity, conductivity, temperature, tds"
    description: Comma-separated water quality parameters
  - name: standards_profile
    type: string
    default: "drinking_water"
    description: Water quality standard profile - drinking_water, wastewater, industrial, or aquaculture
  - name: sampling_interval
    type: string
    default: "1h"
    description: Sampling interval for water quality readings
  - name: water_api
    type: string
    default: "https://api.water.local/v1"
    description: Water quality monitoring API

steps:
  - id: fetch_water_readings
    node: http_request
    config:
      method: POST
      url: "{{ .params.water_api }}/stations/readings"
      headers:
        Authorization: "Bearer {{ .env.WATER_API_TOKEN }}"
        Content-Type: application/json
      body: |
        {
          "station_ids": {{ .params.station_ids | split "," | toJson }},
          "parameters": {{ .params.quality_parameters | split "," | toJson }},
          "interval": "{{ .params.sampling_interval }}"
        }
    description: Fetch water quality readings from monitoring stations

  - id: assess_quality
    node: code_interpreter
    config:
      language: python
      code: |
        import json

        data = {{ .steps.fetch_water_readings.output | toJson }}
        profile = "{{ .params.standards_profile }}"

        standards = {
            "drinking_water": {
                "ph": (6.5, 8.5), "dissolved_oxygen": (6.0, 14.0),
                "turbidity": (0, 5), "conductivity": (50, 1500),
                "temperature": (0, 35), "tds": (0, 500)
            },
            "wastewater": {
                "ph": (6.0, 9.0), "dissolved_oxygen": (2.0, 14.0),
                "turbidity": (0, 50), "conductivity": (100, 5000),
                "temperature": (0, 40), "tds": (0, 2000)
            },
            "aquaculture": {
                "ph": (6.5, 8.0), "dissolved_oxygen": (5.0, 12.0),
                "turbidity": (0, 25), "conductivity": (100, 2000),
                "temperature": (15, 30), "tds": (0, 1000)
            }
        }
        limits = standards.get(profile, standards["drinking_water"])

        stations = []
        violations = []
        for s in data.get("stations", []):
            readings = s.get("readings", {})
            station_violations = []
            for param, value in readings.items():
                if param in limits:
                    lo, hi = limits[param]
                    val = value.get("value", 0)
                    if val < lo or val > hi:
                        station_violations.append({
                            "parameter": param,
                            "value": val,
                            "range": [lo, hi],
                            "severity": "critical" if abs(val - (lo+hi)/2) / ((hi-lo)/2) > 1.5 else "warning"
                        })

            quality_index = max(0, 100 - len(station_violations) * 20)

            stations.append({
                "station_id": s["station_id"],
                "location": s.get("location", ""),
                "readings": readings,
                "quality_index": quality_index,
                "status": "safe" if quality_index >= 80 else "caution" if quality_index >= 60 else "unsafe",
                "violations": station_violations
            })
            violations.extend([{**v, "station_id": s["station_id"]} for v in station_violations])

        result = {
            "profile": profile,
            "stations": stations,
            "total_violations": len(violations),
            "violations": violations,
            "safe_count": sum(1 for s in stations if s["status"] == "safe"),
            "unsafe_count": sum(1 for s in stations if s["status"] == "unsafe")
        }
        print(json.dumps(result))
    description: Assess water quality against regulatory standards

  - id: contamination_analysis
    node: agent
    config:
      prompt: |
        Analyze the water quality assessment results and provide contamination analysis:

        {{ .steps.assess_quality.output | toJson }}

        Provide:
        1. Overall water quality assessment
        2. Contamination source identification
        3. Health risk assessment for each violation
        4. Recommended treatment actions
        5. Compliance status with regulatory standards

        Return as JSON with "water_analysis" key.
      output_format: json
    description: AI-powered water contamination analysis

  - id: compute_date
    node: code_interpreter
    config:
      language: python
      code: |
        from datetime import date
        print(date.today().isoformat())

  - id: generate_compliance_report
    node: file_write
    config:
      file_path: "/data/water_quality/{{ .compute_date }}/water_{{ .params.standards_profile }}.json"
      content: |
        {
          "report_id": "{{ uuid }}",
          "timestamp": "{{ now }}",
          "profile": "{{ .params.standards_profile }}",
          "stations": {{ .steps.assess_quality.output.stations | toJson }},
          "violations": {{ .steps.assess_quality.output.violations | toJson }},
          "analysis": {{ .steps.contamination_analysis.output | toJson }}
        }
    description: Generate water quality compliance report