name: Privacy Policy Generator
# Generate privacy policy template
# Usage: aflare install legal/privacy-policy
#        aflare run privacy-policy/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Generate a comprehensive privacy policy for {{ .params.company }}.
      
      Company: {{ .params.company }}
      Website: {{ .params.website }}
      Business type: {{ .params.business_type }}
      Data collected: {{ .params.data_collected }}
      Jurisdiction: {{ .params.jurisdiction }}
      
      Privacy policy should include:
      1. Introduction
      2. Information We Collect
         - Personal information
         - Non-personal information
         - How we collect it
      3. How We Use Your Information
         - Primary purposes
         - Marketing (with consent info)
         - Analytics
      4. How We Share Information
         - Service providers
         - Legal requirements
         - Business transfers
      5. Data Security
      6. Your Rights and Choices
         - Access
         - Correction
         - Deletion
         - Opt-out
         - Withdraw consent
      7. Cookies and Tracking Technologies
      8. Children's Privacy
      9. Third-Party Links
      10. Changes to This Policy
      11. Contact Us
      12. GDPR/CCPA specific sections (as applicable)
      
      Include appropriate legal disclaimers.
      Note: This is a template, not legal advice.
    id: privacy_policy

  - node: file_write
    params:
      path: privacy-policy.md
    input: privacy_policy
    id: save
