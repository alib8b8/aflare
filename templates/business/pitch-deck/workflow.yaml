name: Pitch Deck Generator
# Generate pitch deck structure and content
# Usage: llm-box install business-sales/pitch-deck
#        llm-box run pitch-deck/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 4
    input: |
      Create a pitch deck for {{ .params.startup }}.
      
      Startup: {{ .params.startup }}
      Industry: {{ .params.industry }}
      Stage: {{ .params.stage }}
      Funding ask: {{ .params.funding_ask }}
      
      Create a 15-slide pitch deck:
      1. Title slide
      2. The Problem
      3. The Solution
      4. Why Now
      5. Market Size (TAM, SAM, SOM)
      6. Product Overview
      7. Product Demo / Screenshots description
      8. Business Model
      9. Traction & Milestones
      10. Competitive Landscape
      11. Competitive Advantage / Moat
      12. Marketing & Go-to-Market
      13. Team
      14. Financials & Projections
      15. The Ask / Contact
      
      For each slide:
      - Headline
      - Key points (3-5 bullet points)
      - Visual suggestion
      - Speaker notes
      
      Follow the Sequoia pitch deck style.
    id: pitch_deck

  - node: file_write
    params:
      path: pitch-deck.md
    input: pitch_deck
    id: save
