name: Business Plan Generator
# Generate comprehensive business plan outline
# Usage: llm-box install business-sales/business-plan
#        llm-box run business-plan/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: researcher, template_render
      max_iterations: 5
    input: |
      Create a comprehensive business plan for {{ .params.business_idea }}.
      
      Business model: {{ .params.business_model }}
      Target market: {{ .params.target_market }}
      
      Complete business plan with:
      1. Executive Summary
         - Company mission
         - Product/service overview
         - Target market
         - Financial highlights
      2. Company Description
         - Legal structure
         - Location
         - Core values
      3. Market Analysis
         - Industry overview
         - Target market size
         - Competitor analysis
         - SWOT analysis
      4. Organization & Management
         - Team structure
         - Key roles
      5. Products & Services
         - Detailed offerings
         - Pricing strategy
         - Competitive advantages
      6. Marketing & Sales
         - Go-to-market strategy
         - Customer acquisition channels
         - Sales process
      7. Financial Projections (3 years)
         - Revenue forecast
         - Cost structure
         - Break-even analysis
         - Key assumptions
      8. Funding Request (if applicable)
      9. Risk Analysis & Mitigation
      10. Implementation Timeline
    id: business_plan

  - node: file_write
    params:
      path: business-plan.md
    input: business_plan
    id: save
