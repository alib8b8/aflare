name: language-exercise
description: Language learning exercise generator with vocabulary, grammar, and conversation practice
version: "1.0.0"
params:
  - name: target_language
    type: string
    required: true
    description: Language being learned
  - name: native_language
    type: string
    required: false
    default: English
    description: Student's native language
  - name: proficiency_level
    type: string
    required: false
    default: beginner
    description: Proficiency level (A1-C2)
  - name: exercise_types
    type: array
    required: false
    default: ["vocabulary", "grammar", "translation", "conversation"]
    description: Types of exercises
  - name: topic
    type: string
    required: false
    default: general
    description: Thematic topic for exercises
  - name: exercise_count
    type: integer
    required: false
    default: 15
    description: Number of exercises
steps:
  - id: fetch_language_data
    node: http_request
    method: GET
    url: "https://restcountries.com/v3.1/lang/{{ .params.target_language | lower | urlquery }}"
    headers:
      Accept: application/json
    output: language_context

  - id: generate_exercises
    node: agent
    prompt: |
      Create {{ .params.exercise_count }} language learning exercises for {{ .params.target_language }}.
      
      Native Language: {{ .params.native_language }}
      Proficiency Level: {{ .params.proficiency_level }}
      Topic: {{ .params.topic }}
      Exercise Types: {{ .params.exercise_types }}
      
      For each exercise:
      - Vocabulary: Word with translation, example sentence, and usage notes
      - Grammar: Rule explanation with fill-in-the-blank exercises
      - Translation: {{ .params.native_language }} sentences to translate to {{ .params.target_language }}
      - Conversation: Dialogue scenarios with missing responses
      
      Include cultural notes where relevant.
    output: exercises

  - id: structure_exercises
    node: code_interpreter
    language: python
    code: |
      import json
      
      exercises = json.loads('''{{ .exercises }}''')
      
      by_type = {}
      for ex in exercises:
          etype = ex.get('type', 'unknown')
          if etype not in by_type:
              by_type[etype] = []
          by_type[etype].append(ex)
      
      structure = {
          "total_exercises": len(exercises),
          "type_breakdown": {k: len(v) for k, v in by_type.items()},
          "proficiency_level": "{{ .params.proficiency_level }}",
          "estimated_duration": len(exercises) * 3
      }
      
      print(json.dumps(structure, indent=2))
    output: exercise_structure

  - id: save_exercises
    node: file_write
    filename: "language_exercises_{{ .params.target_language | sanitize }}.json"
    content: |
      {
        "language": "{{ .params.target_language }}",
        "proficiency": "{{ .params.proficiency_level }}",
        "structure": {{ .exercise_structure }},
        "exercises": {{ .exercises }}
      }
    output: file_path