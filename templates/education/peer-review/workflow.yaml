name: peer-review
description: Peer review workflow and rubric for structured student-to-student feedback
version: "1.0.0"
params:
  - name: assignment_type
    type: string
    required: true
    description: Type of assignment being reviewed
  - name: review_criteria
    type: array
    required: true
    description: Criteria for peer review
  - name: submission_text
    type: string
    required: true
    description: The student work being reviewed
  - name: reviewer_name
    type: string
    required: false
    default: ""
    description: Name of the peer reviewer
  - name: review_guidelines
    type: string
    required: false
    default: "Be constructive, specific, and respectful"
    description: Guidelines for reviewers
  - name: anonymous
    type: boolean
    required: false
    default: true
    description: Whether review is anonymous
steps:
  - id: analyze_submission
    node: agent
    prompt: |
      Analyze this student submission for peer review:
      
      Assignment Type: {{ .params.assignment_type }}
      Submission: {{ .params.submission_text }}
      
      Analyze the work objectively, noting:
      1. Overall quality and completeness
      2. Adherence to assignment requirements
      3. Strengths demonstrated
      4. Areas needing improvement
    output: submission_analysis

  - id: generate_review
    node: agent
    prompt: |
      Generate a peer review based on the analysis:
      
      Review Criteria: {{ .params.review_criteria }}
      Guidelines: {{ .params.review_guidelines }}
      Anonymous: {{ .params.anonymous }}
      Reviewer: {{ if not .params.anonymous }}{{ .params.reviewer_name }}{{ else }}Anonymous{{ end }}
      
      For each criterion:
      1. Rate on a scale of 1-4 (1=Needs Work, 4=Excellent)
      2. Provide specific evidence from the work
      3. Give constructive feedback
      4. Suggest one actionable improvement
      
      Include:
      - Summary of strengths
      - Summary of areas for growth
      - Overall recommendation
    output: peer_review

  - id: calculate_review_scores
    node: code_interpreter
    language: python
    code: |
      import json
      
      review = json.loads('''{{ .peer_review }}''')
      criteria = review.get('criteria_evaluations', [])
      
      total = sum(c.get('rating', 0) for c in criteria)
      max_possible = len(criteria) * 4
      avg_rating = round(total / max(1, len(criteria)), 2)
      
      scores = {
          "criteria_count": len(criteria),
          "total_rating": total,
          "max_possible": max_possible,
          "average_rating": avg_rating,
          "overall_pct": round((total / max_possible) * 100, 1) if max_possible > 0 else 0,
          "strengths_count": len(review.get('strengths', [])),
          "improvements_count": len(review.get('areas_for_growth', []))
      }
      
      print(json.dumps(scores, indent=2))
    output: review_scores

  - id: save_review
    node: file_write
    filename: "peer_review_{{ .params.assignment_type | sanitize }}.json"
    content: |
      {
        "assignment_type": "{{ .params.assignment_type }}",
        "reviewer": "{{ if not .params.anonymous }}{{ .params.reviewer_name }}{{ else }}Anonymous{{ end }}",
        "scores": {{ .review_scores }},
        "review": {{ .peer_review }}
      }
    output: file_path