name: curriculum-mapper
description: Curriculum mapping and standards alignment tool for course design
version: "1.0.0"
input_schema:
  - name: course_name
    type: string
    required: true
    description: Name of the course
  - name: standards_framework
    type: string
    required: true
    description: Standards framework (e.g., Common Core, NGSS, IB)
  - name: units
    type: array
    required: true
    description: Course units/modules
  - name: grade_level
    type: string
    required: true
    description: Target grade level
  - name: subject
    type: string
    required: true
    description: Subject area
  - name: assessment_types
    type: array
    required: false
    default: ["formative", "summative", "performance"]
    description: Types of assessments to map
  - name: include_skills
    type: boolean
    required: false
    default: true
    description: Include 21st century skills mapping
steps:
  - id: compute_search_query
    node: code_interpreter
    language: python
    code: |
      from urllib.parse import quote

      standards_framework = "{{ .params.standards_framework }}"
      subject = "{{ .params.subject }}"

      search_query = quote(standards_framework) + "+" + quote(subject)
      print(search_query)
    output: compute_search_query

  - id: fetch_standards
    node: http_request
    method: GET
    url: "https://api.openalex.org/works?search={{ .compute_search_query }}&filter=type:article&per_page=10"
    headers:
      Accept: application/json
    output: standards_reference

  - id: map_curriculum
    node: agent
    prompt: |
      Create a curriculum map aligning course units to {{ .params.standards_framework }} standards.
      
      Course: {{ .params.course_name }}
      Subject: {{ .params.subject }}
      Grade Level: {{ .params.grade_level }}
      Units: {{ .params.units }}
      Assessment Types: {{ .params.assessment_types }}
      Include Skills: {{ .params.include_skills }}
      
      For each unit, map:
      1. Specific standards addressed
      2. Learning objectives
      3. Essential questions
      4. Assessment methods
      5. Resources needed
      6. {{ if .params.include_skills }}21st century skills (critical thinking, collaboration, etc.){{ end }}
      7. Cross-curricular connections
    output: curriculum_map

  - id: analyze_coverage
    node: code_interpreter
    language: python
    code: |
      import json
      
      mapping = json.loads('''{{ .curriculum_map }}''')
      units = mapping.get('units', [])
      
      coverage = {}
      total_standards = set()
      
      for unit in units:
          unit_name = unit.get('name', 'Unknown')
          standards = unit.get('standards', [])
          objectives = unit.get('objectives', [])
          assessments = unit.get('assessments', [])
          
          coverage[unit_name] = {
              "standards_count": len(standards),
              "objectives_count": len(objectives),
              "assessments_count": len(assessments),
              "standards": standards
          }
          total_standards.update(standards)
      
      summary = {
          "total_units": len(units),
          "total_unique_standards": len(total_standards),
          "coverage_details": coverage,
          "framework": "{{ .params.standards_framework }}"
      }
      
      print(json.dumps(summary, indent=2))
    output: coverage_analysis

  - id: format_map
    node: transform
    input:
      mapping: "{{ .curriculum_map }}"
      coverage: "{{ .coverage_analysis }}"
    template: |
      # Curriculum Map: {{ .params.course_name }}
      **Framework:** {{ .params.standards_framework }} | **Grade:** {{ .params.grade_level }}
      
      ## Coverage Summary
      - Total Units: {{ .coverage.total_units }}
      - Unique Standards Addressed: {{ .coverage.total_unique_standards }}
      
      ## Unit-by-Unit Mapping
      {{ range .mapping.units }}
      ### {{ .name }}
      - **Standards:** {{ .standards }}
      - **Objectives:** {{ .objectives }}
      - **Essential Questions:** {{ .essential_questions }}
      - **Assessments:** {{ .assessments }}
      {{ end }}
    output: formatted_map

  - id: generate_filename
    node: code_interpreter
    language: python
    code: |
      import re

      course_name = "{{ .params.course_name }}"
      filename = "curriculum_map_" + re.sub(r'[^\w\-]', '_', course_name).strip('_') + ".json"
      print(filename)
    output: generate_filename

  - id: save_map
    node: file_write
    filename: "{{ .generate_filename }}"
    content: |
      {
        "course": "{{ .params.course_name }}",
        "framework": "{{ .params.standards_framework }}",
        "coverage": {{ .coverage_analysis }},
        "mapping": {{ .curriculum_map }}
      }
    output: file_path