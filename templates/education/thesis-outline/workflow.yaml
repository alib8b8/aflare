name: thesis-outline
description: Thesis and dissertation outline builder with chapter structure and content planning
version: "1.0.0"
params:
  - name: thesis_title
    type: string
    required: true
    description: Working title of the thesis
  - name: field
    type: string
    required: true
    description: Academic field
  - name: degree_level
    type: string
    required: false
    default: masters
    description: Degree level (masters, doctoral, undergraduate)
  - name: chapters
    type: integer
    required: false
    default: 5
    description: Number of chapters
  - name: research_questions
    type: array
    required: true
    description: Research questions
  - name: include_timeline
    type: boolean
    required: false
    default: true
    description: Include writing timeline
  - name: citation_style
    type: string
    required: false
    default: APA
    description: Citation style
steps:
  - id: design_outline
    node: agent
    prompt: |
      Create a {{ .params.degree_level }} thesis outline for:
      
      Title: {{ .params.thesis_title }}
      Field: {{ .params.field }}
      Research Questions: {{ .params.research_questions }}
      Number of Chapters: {{ .params.chapters }}
      Citation Style: {{ .params.citation_style }}
      
      For each chapter:
      1. Chapter title and purpose
      2. Key sections and subsections
      3. Content to cover in each section
      4. Expected page count
      5. Key references to include
      
      Also include:
      - Abstract outline
      - Table of contents structure
      - List of figures/tables placeholder
      - Appendices plan
    output: thesis_outline

  - id: generate_timeline
    node: code_interpreter
    language: python
    code: |
      import json
      
      outline = json.loads('''{{ .thesis_outline }}''')
      chapters = outline.get('chapters', [])
      degree = "{{ .params.degree_level }}"
      
      total_pages = sum(c.get('expected_pages', 30) for c in chapters)
      
      if degree == 'doctoral':
          weeks_per_chapter = 8
      elif degree == 'masters':
          weeks_per_chapter = 6
      else:
          weeks_per_chapter = 4
      
      timeline = []
      total_weeks = 0
      for i, ch in enumerate(chapters):
          weeks = max(4, min(12, ch.get('expected_pages', 30) // 5))
          timeline.append({
              "chapter": ch.get('title', f'Chapter {i+1}'),
              "weeks": weeks,
              "start_week": total_weeks + 1,
              "end_week": total_weeks + weeks
          })
          total_weeks += weeks
      
      plan = {
          "total_pages_estimated": total_pages,
          "total_weeks": total_weeks,
          "total_months": round(total_weeks / 4, 1),
          "chapter_timeline": timeline,
          "degree_level": degree
      }
      
      print(json.dumps(plan, indent=2))
    output: writing_timeline

  - id: format_outline
    node: transform
    input:
      outline: "{{ .thesis_outline }}"
      timeline: "{{ .writing_timeline }}"
    template: |
      # Thesis Outline: {{ .params.thesis_title }}
      **Degree:** {{ .params.degree_level }} | **Field:** {{ .params.field }}
      
      ## Writing Timeline
      - Total Estimated Pages: {{ .timeline.total_pages_estimated }}
      - Total Duration: {{ .timeline.total_weeks }} weeks ({{ .timeline.total_months }} months)
      
      {{ range .timeline.chapter_timeline }}
      | {{ .chapter }} | Weeks {{ .start_week }}-{{ .end_week }} ({{ .weeks }} weeks) |
      {{ end }}
      
      ## Chapter Outline
      {{ .outline }}
    output: formatted_outline

  - id: generate_filename
    node: code_interpreter
    language: python
    code: |
      import re
      text = "{{ .params.thesis_title }}"
      sanitized = re.sub(r'[^\w\-]', '_', text).strip('_')[:50]
      print("thesis_outline_" + sanitized + ".md")
    output: filename

  - id: save_outline
    node: file_write
    filename: "{{ .filename }}"
    content: "{{ .formatted_outline }}"
    output: file_path