name: classroom-management
description: Classroom management and behavior tracking with intervention strategies
version: "1.0.0"
params:
  - name: class_name
    type: string
    required: true
    description: Class or group name
  - name: grade_level
    type: string
    required: true
    description: Grade level
  - name: class_size
    type: integer
    required: false
    default: 25
    description: Number of students
  - name: behavior_data
    type: string
    required: false
    default: ""
    description: Recent behavior observations
  - name: management_style
    type: string
    required: false
    default: positive
    description: Management approach (positive, restorative, assertive, collaborative)
  - name: focus_areas
    type: array
    required: false
    default: ["engagement", "disruption", "participation"]
    description: Behavior focus areas
  - name: generate_plan
    type: boolean
    required: false
    default: true
    description: Generate management plan
steps:
  - id: analyze_situation
    node: agent
    prompt: |
      Analyze the classroom management situation:
      
      Class: {{ .params.class_name }}
      Grade Level: {{ .params.grade_level }}
      Class Size: {{ .params.class_size }}
      Management Style: {{ .params.management_style }}
      Focus Areas: {{ .params.focus_areas }}
      
      Behavior Data:
      {{ .params.behavior_data }}
      
      Identify:
      1. Current behavior patterns and trends
      2. Potential triggers and root causes
      3. Student engagement levels
      4. Classroom dynamics
      5. Effectiveness of current strategies
    output: situation_analysis

  - id: design_strategies
    node: agent
    prompt: |
      {{ if .params.generate_plan }}
      Design a classroom management plan based on:
      
      Analysis: {{ .situation_analysis }}
      Management Style: {{ .params.management_style }}
      
      Create:
      1. Prevention strategies (proactive measures)
      2. Intervention strategies (responsive measures)
      3. Positive reinforcement system
      4. Clear expectations and routines
      5. De-escalation protocols
      6. Parent communication plan
      7. Progress monitoring methods
      8. Individual student support strategies
      {{ else }}
      No plan generation requested.
      {{ end }}
    output: management_plan

  - id: create_tracking_tools
    node: code_interpreter
    language: python
    code: |
      import json
      
      focus_areas = {{ .params.focus_areas }}
      class_size = {{ .params.class_size }}
      
      tracking = {
          "class": "{{ .params.class_name }}",
          "grade": "{{ .params.grade_level }}",
          "size": class_size,
          "tracking_categories": [],
          "suggested_frequency": "daily"
      }
      
      for area in focus_areas:
          tracking["tracking_categories"].append({
              "category": area,
              "rating_scale": "1-5",
              "notes_field": True,
              "trend_analysis": "weekly"
          })
      
      tracking["reporting"] = {
          "daily_checklist": True,
          "weekly_summary": True,
          "monthly_trends": True,
          "parent_updates": "bi-weekly"
      }
      
      print(json.dumps(tracking, indent=2))
    output: tracking_tools

  - id: format_plan
    node: transform
    input:
      analysis: "{{ .situation_analysis }}"
      plan: "{{ .management_plan }}"
      tracking: "{{ .tracking_tools }}"
    template: |
      # Classroom Management Plan: {{ .params.class_name }}
      **Grade:** {{ .params.grade_level }} | **Style:** {{ .params.management_style }}
      
      ## Situation Analysis
      {{ .analysis }}
      
      ## Management Plan
      {{ .plan }}
      
      ## Behavior Tracking Tools
      {{ range .tracking.tracking_categories }}
      - **{{ .category }}**: Rating scale {{ .rating_scale }}, {{ .trend_analysis }} trend analysis
      {{ end }}
    output: formatted_plan

  - id: notify_plan
    node: notify
    channel: classroom_management
    message: |
      Classroom management plan generated for {{ .params.class_name }}
      Grade: {{ .params.grade_level }}
      Focus Areas: {{ .params.focus_areas }}
      Tracking tools ready for {{ .tracking_tools.size }} students
    output: notification_sent