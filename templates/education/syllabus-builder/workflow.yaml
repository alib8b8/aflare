name: syllabus-builder
description: Course syllabus and schedule builder with calendar integration
version: "1.0.0"
params:
  - name: course_name
    type: string
    required: true
    description: Name of the course
  - name: course_code
    type: string
    required: true
    description: Course code/number
  - name: semester
    type: string
    required: true
    description: Academic term (e.g., Fall 2026)
  - name: weeks
    type: integer
    required: false
    default: 16
    description: Number of weeks in the semester
  - name: topics
    type: array
    required: true
    description: List of course topics/modules
  - name: textbooks
    type: array
    required: false
    default: []
    description: Required textbooks and readings
  - name: grading_policy
    type: string
    required: false
    default: ""
    description: Custom grading policy
  - name: institution
    type: string
    required: false
    default: ""
    description: Institution name
steps:
  - id: encode_course_name
    node: code_interpreter
    language: python
    code: |
      import urllib.parse
      text = '''{{ .params.course_name }}'''
      encoded = urllib.parse.quote(text)
      print(encoded)
    output: encoded_course_name

  - id: research_standards
    node: http_request
    method: GET
    url: "https://api.openalex.org/works?search={{ .encoded_course_name }}&per_page=5"
    headers:
      Accept: application/json
    output: academic_resources

  - id: build_syllabus
    node: agent
    prompt: |
      Create a comprehensive course syllabus for:
      
      Course: {{ .params.course_name }} ({{ .params.course_code }})
      Semester: {{ .params.semester }}
      Institution: {{ .params.institution }}
      Duration: {{ .params.weeks }} weeks
      
      Topics to cover: {{ .params.topics }}
      Textbooks: {{ .params.textbooks }}
      Grading Policy: {{ .params.grading_policy }}
      
      Include:
      1. Course description and learning objectives
      2. Weekly schedule with topics and readings
      3. Assignment calendar with due dates
      4. Grading breakdown and policies
      5. Academic integrity statement
      6. Office hours and contact information
      7. Accommodation statement
    output: syllabus_content

  - id: generate_date
    node: code_interpreter
    language: python
    code: |
      from datetime import date
      print(date.today().strftime('%Y-%m-%d'))
    output: generated_date

  - id: format_syllabus
    node: transform
    input:
      content: "{{ .syllabus_content }}"
    template: |
      # {{ .params.course_name }}
      **{{ .params.course_code }}** | {{ .params.semester }}
      **Institution:** {{ .params.institution }}
      
      {{ .content }}
      
      ---
      *Generated by Syllabus Builder on {{ .generated_date }}*
    output: formatted_syllabus

  - id: sanitize_syllabus_filename
    node: code_interpreter
    language: python
    code: |
      import re
      text = '''{{ .params.course_code }}'''
      sanitized = re.sub(r'[^\w\-]', '_', text).strip('_')
      print(sanitized)
    output: sanitized_course_code

  - id: save_syllabus
    node: file_write
    filename: "syllabus_{{ .sanitized_course_code }}.md"
    content: "{{ .formatted_syllabus }}"
    output: file_path