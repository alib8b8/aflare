name: grading-assistant
description: Automated essay and assignment grading with rubric-based scoring
version: "1.0.0"
input_schema:
  - name: assignment_text
    type: string
    required: true
    description: The student's assignment or essay text
  - name: rubric
    type: string
    required: true
    description: Grading rubric criteria
  - name: max_score
    type: integer
    required: false
    default: 100
    description: Maximum possible score
  - name: grade_level
    type: string
    required: false
    default: undergraduate
    description: Academic level
  - name: subject
    type: string
    required: true
    description: Subject area of the assignment
  - name: feedback_style
    type: string
    required: false
    default: constructive
    description: Feedback tone (constructive, critical, encouraging)
steps:
  - id: evaluate_submission
    node: agent
    prompt: |
      Evaluate the following student assignment based on the provided rubric.
      
      Subject: {{ .params.subject }}
      Grade Level: {{ .params.grade_level }}
      Max Score: {{ .params.max_score }}
      
      Rubric:
      {{ .params.rubric }}
      
      Assignment Text:
      {{ .params.assignment_text }}
      
      For each rubric criterion, provide:
      1. Score awarded
      2. Specific evidence from the text
      3. Constructive feedback
      4. Suggestions for improvement
    output: evaluation_results

  - id: calculate_scores
    node: code_interpreter
    language: python
    code: |
      import json
      
      results = json.loads('''{{ .evaluation_results }}''')
      
      criteria_scores = results.get('criteria', [])
      total_awarded = sum(c.get('score', 0) for c in criteria_scores)
      max_score = {{ .params.max_score }}
      
      grade_boundaries = [
          (0.90, 'A'), (0.80, 'B'), (0.70, 'C'),
          (0.60, 'D'), (0.00, 'F')
      ]
      
      percentage = (total_awarded / max_score) * 100 if max_score > 0 else 0
      letter_grade = next((g for t, g in grade_boundaries if percentage >= t * 100), 'F')
      
      summary = {
          "total_score": total_awarded,
          "max_score": max_score,
          "percentage": round(percentage, 2),
          "letter_grade": letter_grade,
          "criteria_count": len(criteria_scores),
          "strengths": [c.get('strength', '') for c in criteria_scores if c.get('score', 0) > 0.7 * c.get('max', 1)],
          "weaknesses": [c.get('suggestion', '') for c in criteria_scores if c.get('score', 0) < 0.5 * c.get('max', 1)]
      }
      
      print(json.dumps(summary, indent=2))
    output: scoring_summary

  - id: generate_feedback
    node: agent
    prompt: |
      Generate a comprehensive feedback report with {{ .params.feedback_style }} tone.
      
      Scoring Summary: {{ .scoring_summary }}
      Evaluation: {{ .evaluation_results }}
      
      Include:
      1. Overall performance summary
      2. Key strengths
      3. Areas for improvement
      4. Specific actionable recommendations
      5. Encouraging closing remarks
    output: feedback_report

  - id: sanitize_grading_filename
    node: code_interpreter
    language: python
    code: |
      import re
      text = '''{{ .params.subject }}'''
      sanitized = re.sub(r'[^\w\-]', '_', text).strip('_')
      print(sanitized)
    output: sanitized_subject

  - id: save_grading
    node: file_write
    filename: "grading_{{ .sanitized_subject }}.json"
    content: |
      {
        "grading": {
          "subject": "{{ .params.subject }}",
          "grade_level": "{{ .params.grade_level }}",
          "scoring": {{ .scoring_summary }},
          "detailed_evaluation": {{ .evaluation_results }},
          "feedback": "{{ .feedback_report }}"
        }
      }
    output: file_path