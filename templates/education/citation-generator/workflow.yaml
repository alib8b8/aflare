name: citation-generator
description: Bibliography and citation formatter supporting multiple academic styles
version: "1.0.0"
params:
  - name: sources
    type: array
    required: true
    description: List of sources with metadata (title, author, year, etc.)
  - name: citation_style
    type: string
    required: false
    default: APA
    description: Citation style (APA, MLA, Chicago, Harvard, IEEE, Vancouver)
  - name: output_format
    type: string
    required: false
    default: bibliography
    description: Output type (bibliography, in_text, both)
  - name: sort_by
    type: string
    required: false
    default: author
    description: Sort order (author, year, title, appearance)
  - name: include_doi
    type: boolean
    required: false
    default: true
    description: Include DOI links when available
steps:
  - id: validate_sources
    node: http_request
    method: GET
    url: "https://api.openalex.org/works?search={{ index .params.sources 0 | urlquery }}&per_page=5"
    headers:
      Accept: application/json
    output: validated_references

  - id: format_citations
    node: agent
    prompt: |
      Format citations in {{ .params.citation_style }} style for the following sources:
      
      {{ .params.sources }}
      
      Style: {{ .params.citation_style }}
      Output: {{ .params.output_format }}
      Sort By: {{ .params.sort_by }}
      Include DOI: {{ .params.include_doi }}
      
      For each source:
      1. Format full bibliographic entry per {{ .params.citation_style }} rules
      2. {{ if or (eq .params.output_format "in_text") (eq .params.output_format "both") }}Generate in-text citation format{{ end }}
      3. Add DOI link if available
      4. Note any missing required fields
    output: formatted_citations

  - id: generate_bibliography
    node: code_interpreter
    language: python
    code: |
      import json
      
      citations = json.loads('''{{ .formatted_citations }}''')
      style = "{{ .params.citation_style }}"
      sort_by = "{{ .params.sort_by }}"
      
      entries = citations.get('entries', [])
      
      if sort_by == 'author':
          entries.sort(key=lambda x: x.get('author', '').lower())
      elif sort_by == 'year':
          entries.sort(key=lambda x: x.get('year', 0))
      elif sort_by == 'title':
          entries.sort(key=lambda x: x.get('title', '').lower())
      
      bib = {
          "style": style,
          "total_entries": len(entries),
          "sort_order": sort_by,
          "entries": entries,
          "formatting_notes": citations.get('notes', [])
      }
      
      print(json.dumps(bib, indent=2))
    output: sorted_bibliography

  - id: save_citations
    node: file_write
    filename: "bibliography_{{ .params.citation_style | lower }}.json"
    content: |
      {
        "citation_style": "{{ .params.citation_style }}",
        "bibliography": {{ .sorted_bibliography }}
      }
    output: file_path