name: study-guide
description: Comprehensive study guide generator with chapter summaries and practice questions
version: "1.0.0"
input_schema:
  - name: subject
    type: string
    required: true
    description: Subject or course name
  - name: topics
    type: array
    required: true
    description: List of topics to cover
  - name: depth
    type: string
    required: false
    default: comprehensive
    description: Detail level (summary, standard, comprehensive)
  - name: include_practice
    type: boolean
    required: false
    default: true
    description: Include practice questions
  - name: format
    type: string
    required: false
    default: markdown
    description: Output format
  - name: target_audience
    type: string
    required: false
    default: student
    description: Target audience level
steps:
  - id: compute_search_query
    node: code_interpreter
    language: python
    code: |
      from urllib.parse import quote
      subject = "{{ .params.subject }}"
      search_query = quote(subject)
      print(search_query)
    output: compute_search_query

  - id: fetch_resources
    node: http_request
    method: GET
    url: "https://api.openalex.org/works?search={{ .compute_search_query }}&per_page=10"
    headers:
      Accept: application/json
    output: reference_works

  - id: build_guide
    node: agent
    prompt: |
      Create a {{ .params.depth }} study guide for {{ .params.subject }}.
      
      Topics to cover: {{ .params.topics }}
      Target Audience: {{ .params.target_audience }}
      Include practice questions: {{ .params.include_practice }}
      
      For each topic, include:
      1. Key concepts and definitions
      2. Important formulas/theories
      3. Common misconceptions
      4. Real-world examples
      5. {{ if .params.include_practice }}Practice questions with answers{{ end }}
      
      Also include:
      - Study tips and strategies
      - Review checklist
      - Recommended reading order
      - Key terms glossary
    output: study_content

  - id: generate_summary
    node: code_interpreter
    language: python
    code: |
      import json
      
      content = json.loads('''{{ .study_content }}''')
      topics = {{ .params.topics }}
      
      guide_info = {
          "subject": "{{ .params.subject }}",
          "depth": "{{ .params.depth }}",
          "topics_covered": len(topics),
          "topic_list": topics,
          "estimated_study_hours": len(topics) * 2,
          "recommended_approach": "Study in order, reviewing each topic before moving to the next"
      }
      
      print(json.dumps(guide_info, indent=2))
    output: guide_metadata

  - id: generate_filename
    node: code_interpreter
    language: python
    code: |
      import re
      subject = "{{ .params.subject }}"
      sanitized = re.sub(r'[^\w\-]', '_', subject).strip('_')
      filename = f"study_guide_{sanitized}.md"
      print(filename)
    output: generate_filename

  - id: save_guide
    node: file_write
    filename: "{{ .generate_filename }}"
    content: |
      # Study Guide: {{ .params.subject }}
      
      {{ .guide_metadata }}
      
      {{ .study_content }}
    output: file_path