name: learning-path
description: Personalized learning path designer with adaptive milestones and resources
version: "1.0.0"
input_schema:
  - name: subject
    type: string
    required: true
    description: Subject or skill to learn
  - name: current_level
    type: string
    required: true
    description: Current proficiency level
  - name: target_level
    type: string
    required: true
    description: Desired proficiency level
  - name: timeframe_weeks
    type: integer
    required: false
    default: 12
    description: Timeframe in weeks
  - name: hours_per_week
    type: integer
    required: false
    default: 5
    description: Study hours per week
  - name: learning_style
    type: string
    required: false
    default: mixed
    description: Preferred learning style (visual, auditory, reading, kinesthetic, mixed)
  - name: resources_preference
    type: array
    required: false
    default: ["videos", "books", "exercises", "projects"]
    description: Preferred resource types
steps:
  - id: assess_gap
    node: agent
    prompt: |
      Analyze the learning gap between current and target proficiency:
      
      Subject: {{ .params.subject }}
      Current Level: {{ .params.current_level }}
      Target Level: {{ .params.target_level }}
      Timeframe: {{ .params.timeframe_weeks }} weeks
      Hours per Week: {{ .params.hours_per_week }}
      Learning Style: {{ .params.learning_style }}
      
      Identify:
      1. Key skills and knowledge to acquire
      2. Prerequisites needed
      3. Natural learning progression
      4. Common challenges at this level
      5. Estimated time per skill area
    output: gap_analysis

  - id: design_path
    node: agent
    prompt: |
      Design a personalized learning path based on:
      
      Gap Analysis: {{ .gap_analysis }}
      Learning Style: {{ .params.learning_style }}
      Preferred Resources: {{ .params.resources_preference }}
      Timeframe: {{ .params.timeframe_weeks }} weeks
      
      Create week-by-week plan with:
      1. Weekly learning objectives
      2. Specific resources and activities
      3. Practice exercises and projects
      4. Checkpoint assessments
      5. Milestone achievements
      6. Review and reinforcement weeks
    output: learning_path

  - id: calculate_progress
    node: code_interpreter
    language: python
    code: |
      import json
      
      path = json.loads('''{{ .learning_path }}''')
      weeks = {{ .params.timeframe_weeks }}
      hours = {{ .params.hours_per_week }}
      
      total_hours = weeks * hours
      milestones = path.get('milestones', [])
      
      progress = {
          "total_weeks": weeks,
          "total_hours": total_hours,
          "milestones_count": len(milestones),
          "milestones": [{"name": m.get('name', ''), "week": m.get('week', 0)} for m in milestones],
          "recommended_daily_minutes": round((hours / 7) * 60),
          "resources_needed": path.get('resources', [])
      }
      
      print(json.dumps(progress, indent=2))
    output: progress_plan

  - id: sanitize_path_filename
    node: code_interpreter
    language: python
    code: |
      import re
      text = '''{{ .params.subject }}'''
      sanitized = re.sub(r'[^\w\-]', '_', text).strip('_')
      print(sanitized)
    output: sanitized_path_subject

  - id: save_path
    node: file_write
    filename: "learning_path_{{ .sanitized_path_subject }}.json"
    content: |
      {
        "subject": "{{ .params.subject }}",
        "current_level": "{{ .params.current_level }}",
        "target_level": "{{ .params.target_level }}",
        "progress_plan": {{ .progress_plan }},
        "learning_path": {{ .learning_path }}
      }
    output: file_path