name: Study Plan Generator
# Create personalized study plan for any topic
# Usage: llm-box install education/study-plan
#        llm-box run study-plan/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render, researcher
      max_iterations: 4
    input: |
      Create a comprehensive study plan for {{ .params.topic }}.
      
      Current level: {{ .params.current_level }}
      Goal level: {{ .params.goal_level }}
      Available hours/week: {{ .params.hours_per_week }}
      Duration: {{ .params.duration }}
      
      Create a structured learning path with:
      1. Learning Roadmap (overview of the journey)
      2. Prerequisites check
      3. Week-by-week breakdown:
         - Topics to cover
         - Recommended resources (books, courses, articles)
         - Practice exercises
         - Project ideas
         - Time allocation
      4. Milestone assessments
      5. Common pitfalls to avoid
      6. How to stay motivated
      7. Community and networking suggestions
      
      Be practical and realistic.
    id: study_plan

  - node: file_write
    params:
      path: study-plan.md
    input: study_plan
    id: save

  - node: notify
    params:
      channel: stdout
    input: study_plan
    id: notify
