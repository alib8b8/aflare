name: Customer Churn Analyzer
# Analyze customer churn and retention
# Usage: llm-box install customer-support/churn-analyzer
#        llm-box run churn-analyzer/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.churn_data }}"
    id: churn_data

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Analyze customer churn based on this data:
      {{ .churn_data }}
      
      Product: {{ .params.product }}
      
      Provide analysis with:
      1. Churn Overview
         - Overall churn rate
         - Monthly trend
         - Customer segment analysis
      2. Root Cause Analysis
         - Top 10 reasons for churn
         - Common patterns
         - High-risk segments
      3. Customer Insights
         - Churned customer profiles
         - Common complaints
         - Last interactions
      4. Retention Strategy
         - Immediate actions
         - Medium-term initiatives
         - Long-term improvements
         - Win-back campaigns
      5. Predictive Indicators
         - Early warning signs
         - High-risk behaviors
      6. Success Stories (retained customers)
      7. Recommended Metrics to Track
      8. Action Plan (prioritized)
    id: analysis

  - node: file_write
    params:
      path: churn-analysis.md
    input: analysis
    id: save

  - node: notify
    params:
      channel: stdout
    input: analysis
    id: notify
