name: Data Quality Check
# 政务数据质量核查（六性维度核查与整改建议）
# Usage: aflare install government/data-quality-check
#        aflare run data-quality-check/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.data_file }}"
    id: dataset

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render,json_parse
      max_iterations: 3
    input: |
      对以下政务数据集进行数据质量核查：

      数据集内容：
      {{ .dataset }}

      核查背景：
      - 数据集名称：{{ .params.dataset_name }}
      - 核查维度：{{ .params.quality_dimensions }}
      - 数据标准/规范依据：{{ .params.standard_file }}

      请按以下维度逐项核查并输出问题明细：

      1. 完整性
         - 必填字段空值率
         - 记录缺失（应有未有的行/字段）
      2. 准确性
         - 值域异常（如年龄超范围、日期不合理）
         - 编码错误（行政区划代码、行业代码不符合国标）
         - 逻辑错误（开始时间晚于结束时间等）
      3. 一致性
         - 跨表/跨字段数据矛盾
         - 同一实体多处记录不一致
      4. 及时性
         - 数据更新滞后、超期未更新
      5. 唯一性
         - 重复记录识别（主键重复、业务重复）
      6. 规范性
         - 格式不统一（日期、电话、证件号格式）
         - 枚举值使用不规范

      每个问题包含：所在位置（行/字段）、问题描述、严重程度（严重/一般/轻微）、影响分析、整改建议（源头更正/系统校验/流程完善）。

      最后输出综合质量评分（各维度 0-100 分及总体评级：优/良/中/差）。
    id: quality_analysis

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json

      analysis = {{ .quality_analysis }}

      issues = analysis.get('issues', []) if isinstance(analysis, dict) else []
      scores = analysis.get('scores', {}) if isinstance(analysis, dict) else {}

      # 按维度统计问题数
      by_dim = {}
      by_sev = {}
      for i in issues:
          d = i.get('dimension', '其他')
          s = i.get('severity', '轻微')
          by_dim[d] = by_dim.get(d, 0) + 1
          by_sev[s] = by_sev.get(s, 0) + 1

      print("## 数据质量核查统计")
      print(f"**问题总数：** {len(issues)}")
      print()
      print("### 各维度问题分布")
      for d, c in sorted(by_dim.items(), key=lambda x: -x[1]):
          print(f"- {d}: {c} 个")
      print()
      print("### 严重程度分布")
      for s, c in sorted(by_sev.items()):
          print(f"- {s}: {c} 个")
      print()
      print("### 各维度质量评分")
      for dim, sc in sorted(scores.items()):
          print(f"- {dim}: {sc} 分")
      if scores:
          avg = sum(scores.values()) / len(scores)
          print(f"\n**总体平均分：** {avg:.1f} 分")
    id: statistics

  - node: file_write
    params:
      path: data-quality-report.md
    input: |
      # 政务数据质量核查报告

      核查时间：{{ .metadata.timestamp }}

      ## 数据集信息

      - 数据集名称：{{ .params.dataset_name }}
      - 核查维度：{{ .params.quality_dimensions }}
      - 标准依据：{{ .params.standard_file }}

      ## 质量分析

      {{ .quality_analysis }}

      ## 统计摘要

      {{ .statistics }}
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      数据质量核查完成，报告已保存至 data-quality-report.md
      请数据责任部门按整改建议组织源头治理。
    id: notify
