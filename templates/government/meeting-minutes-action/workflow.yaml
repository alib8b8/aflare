name: Meeting Minutes Action
# 会议纪要待办事项提取与督办跟踪
# Usage: aflare install government/meeting-minutes-action
#        aflare run meeting-minutes-action/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.minutes_file }}"
    id: minutes

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render,json_parse
      max_iterations: 3
    input: |
      从以下会议纪要中提取全部待办事项并生成督办清单：

      会议纪要：
      {{ .minutes }}

      会议信息：
      - 会议名称：{{ .params.meeting_name }}
      - 督办周期：每 {{ .params.followup_days }} 天跟踪一次
      - 督办部门：{{ .params.supervisor_dept }}

      请逐条提取待办事项，每条包含：

      1. 事项内容：明确、可执行的任务描述（去除口语化表述）
      2. 责任单位/责任人：牵头单位与配合单位
      3. 完成时限：纪要中明确的期限；未明确的标注"待明确"并建议合理时限
      4. 优先级：紧急（会议明确要求限期完成/涉及重大事项）、重要（领导交办/跨部门协调）、一般
      5. 验收标准：如何认定该事项已完成
      6. 风险提示：推进中可能存在的困难（资金、政策、协调等）
      7. 督办建议：首次跟踪时间点、跟踪方式（书面报送/平台更新/现场核查）

      最后输出汇总：
      - 待办事项总数及按优先级分布
      - 跨部门协调事项清单（需督办部门重点跟踪）
      - 时限临近事项预警
    id: actions

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json

      data = {{ .actions }}

      items = data.get('items', []) if isinstance(data, dict) else []

      # 按优先级分组排序
      priority_order = {'紧急': 0, '重要': 1, '一般': 2}
      items.sort(key=lambda x: priority_order.get(x.get('priority', '一般'), 3))

      pending_deadline = sum(1 for i in items if i.get('deadline') in ('待明确', '', None))
      cross_dept = sum(1 for i in items if i.get('cross_department', False))

      print("## 督办清单摘要")
      print(f"**待办事项总数：** {len(items)}")
      print()
      print("### 按优先级排序")
      for idx, item in enumerate(items, 1):
          print(f"{idx}. [{item.get('priority', '一般')}] {item.get('task', '')[:60]}")
          print(f"   责任单位：{item.get('owner', '待明确')} | 时限：{item.get('deadline', '待明确')}")
      print()
      print(f"**时限待明确事项：** {pending_deadline} 条，需尽快确认")
      print(f"**跨部门协调事项：** {cross_dept} 条，督办部门重点跟踪")
    id: tracker

  - node: file_write
    params:
      path: meeting-action-tracker.md
    input: |
      # 会议纪要待办督办清单

      生成时间：{{ .metadata.timestamp }}

      ## 会议信息

      - 会议名称：{{ .params.meeting_name }}
      - 督办部门：{{ .params.supervisor_dept }}
      - 督办周期：每 {{ .params.followup_days }} 天

      ## 待办事项明细

      {{ .actions }}

      ## 督办跟踪表

      {{ .tracker }}
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      待办督办清单已生成，保存至 meeting-action-tracker.md
      请督办部门按周期跟踪并在时限前预警。
    id: notify
