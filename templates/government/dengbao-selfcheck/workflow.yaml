name: Dengbao Self-Check
# 等保三级自查清单生成（网络安全等级保护 2.0 第三级测评自查）
# Usage: aflare install government/dengbao-selfcheck
#        aflare run dengbao-selfcheck/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render,json_parse
      max_iterations: 3
    input: |
      依据《网络安全等级保护基本要求》(GB/T 22239-2019) 第三级要求，为以下信息系统生成测评自查清单：

      系统名称：{{ .params.system_name }}
      系统描述：{{ .params.system_desc }}
      责任单位：{{ .params.org_name }}
      是否使用云平台：{{ .params.cloud_platform }}
      计划测评时间：{{ .params.assessment_date }}

      请按以下 10 个安全层面逐项输出自查项：
      1. 安全物理环境：机房位置选择、物理访问控制、防盗防雷防静电防火防水、温湿度控制、电力供应
      2. 安全通信网络：网络架构、通信传输加密、可信验证
      3. 安全区域边界：边界防护、访问控制、入侵防范、恶意代码防范、可信验证
      4. 安全计算环境：身份鉴别、访问控制、安全审计、入侵防范、数据完整性与保密性、数据备份恢复、剩余信息保护、个人信息保护
      5. 安全管理中心：系统管理、审计管理、安全管理、集中管控
      6. 安全管理制度：安全策略总纲、管理制度制定发布、评审修订
      7. 安全管理机构：岗位设置、人员配备、授权审批、沟通合作、审核检查
      8. 安全管理人员：人员录用离岗、安全意识教育培训、外部人员访问管理
      9. 安全建设管理：定级备案、方案设计、产品采购、自行开发、外包开发、工程实施、测试验收、系统交付、等级测评、服务供应商选择
      10. 安全运维管理：环境管理、资产管理、介质管理、设备维护、漏洞风险管理、网络与安全管理、恶意代码防范、配置管理、密码管理、变更管理、备份恢复、安全事件处置、应急预案管理、外包运维管理

      每个自查项按以下格式输出：
      - 检查项名称
      - 对应安全要求（标注标准条款编号）
      - 自查方法（访谈/核查/测试）
      - 所需证据材料清单
      - 常见不符合项及整改建议
    id: checklist

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json

      checklist = {{ .checklist }}

      items = checklist.get('items', []) if isinstance(checklist, dict) else []

      # 统计各层面检查项数量
      areas = {}
      for item in items:
          area = item.get('area', '未分类')
          areas[area] = areas.get(area, 0) + 1

      total = len(items)
      interview = sum(1 for i in items if '访谈' in str(i.get('method', '')))
      inspect = sum(1 for i in items if '核查' in str(i.get('method', '')))
      test = sum(1 for i in items if '测试' in str(i.get('method', '')))

      print("## 自查清单统计")
      print(f"**自查项总数：** {total}")
      print()
      print("### 各层面检查项分布")
      for area, count in sorted(areas.items(), key=lambda x: -x[1]):
          print(f"- {area}: {count} 项")
      print()
      print("### 自查方法构成")
      print(f"- 访谈类: {interview} 项")
      print(f"- 核查类: {inspect} 项")
      print(f"- 测试类: {test} 项")
    id: summary

  - node: file_write
    params:
      path: dengbao-selfcheck-report.md
    input: |
      # 等保三级自查清单报告

      生成时间：{{ .metadata.timestamp }}

      ## 系统信息

      - 系统名称：{{ .params.system_name }}
      - 责任单位：{{ .params.org_name }}
      - 是否使用云平台：{{ .params.cloud_platform }}
      - 计划测评时间：{{ .params.assessment_date }}

      ## 自查清单

      {{ .checklist }}

      ## 统计摘要

      {{ .summary }}
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      等保三级自查清单已生成，报告保存至 dengbao-selfcheck-report.md
      请组织各责任岗位按清单逐项自查并留存证据材料。
    id: notify
