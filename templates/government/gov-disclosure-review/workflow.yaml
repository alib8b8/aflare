name: Gov Disclosure Review
# 政务信息公开保密审查（公开前保密审查与脱敏建议）
# Usage: aflare install government/gov-disclosure-review
#        aflare run gov-disclosure-review/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.document_path }}"
    id: document

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render,json_parse
      max_iterations: 3
    input: |
      对以下拟公开的政务信息进行公开前保密审查：

      待审查文件内容：
      {{ .document }}

      审查背景：
      - 公开方式：{{ .params.disclosure_type }}
      - 报送单位：{{ .params.applying_dept }}
      - 审查依据：{{ .params.legal_basis }}

      请依据《中华人民共和国保守国家秘密法》《政府信息公开条例》及个人信息保护相关规定，逐段审查并输出：

      1. 涉密事项识别
         - 是否包含国家秘密（标密文件引用、涉密地名/数据/图纸等）
         - 涉密等级判断及依据条款
      2. 敏感信息识别
         - 个人信息（身份证号、手机号、住址、银行卡号、健康信息等）
         - 商业秘密（经营数据、核心技术、合同条款等）
         - 内部事务信息（内部请示、讨论记录、过程性信息等）
      3. 脱敏处理建议
         - 每处敏感内容给出具体脱敏方案（遮蔽、汇总、删除）
         - 脱敏后是否达到可公开标准
      4. 审查结论
         - 可公开 / 脱敏后公开 / 暂缓公开 / 不予公开
         - 结论理由与后续流程建议（是否需会商保密部门）
    id: review

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json

      review = {{ .review }}

      findings = review.get('findings', []) if isinstance(review, dict) else []

      # 按风险类型统计
      by_type = {}
      by_level = {}
      for f in findings:
          t = f.get('type', '其他')
          l = f.get('risk_level', '低')
          by_type[t] = by_type.get(t, 0) + 1
          by_level[l] = by_level.get(l, 0) + 1

      print("## 保密审查统计")
      print(f"**识别问题总数：** {len(findings)}")
      print()
      print("### 按问题类型")
      for t, c in sorted(by_type.items(), key=lambda x: -x[1]):
          print(f"- {t}: {c} 处")
      print()
      print("### 按风险等级")
      for l, c in sorted(by_level.items()):
          print(f"- {l}风险: {c} 处")
    id: statistics

  - node: file_write
    params:
      path: disclosure-review-report.md
    input: |
      # 政务信息公开保密审查意见书

      审查时间：{{ .metadata.timestamp }}

      ## 基本信息

      - 报送单位：{{ .params.applying_dept }}
      - 公开方式：{{ .params.disclosure_type }}
      - 审查依据：{{ .params.legal_basis }}

      ## 审查意见

      {{ .review }}

      ## 统计摘要

      {{ .statistics }}
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      保密审查完成，审查意见书已保存至 disclosure-review-report.md
      请按审查结论执行后续流程（脱敏修改 / 会商保密部门 / 提交领导审定）。
    id: notify
