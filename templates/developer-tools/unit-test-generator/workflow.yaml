name: Unit Test Generator
# Generate unit test skeleton for Go functions
# Usage: llm-box install developer-tools/unit-test-generator
#        llm-box run unit-test-generator/workflow.yaml

steps:
  - node: execute
    params:
      command: find . -name "*.go" ! -name "*_test.go" -type f | head -20
    id: source_files

  - node: file_read
    params:
      path: "{{ .params.source_file }}"
    id: source_code

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Generate comprehensive unit test skeletons for the following Go code:
      {{ .source_code }}
      
      Include table-driven tests, edge cases, and error handling tests.
      Use Go's testing package standard patterns.
    id: tests

  - node: file_write
    params:
      path: generated_tests.go
    input: tests
    id: save
