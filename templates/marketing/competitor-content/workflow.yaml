name: Competitor Content Analyzer
# Analyze competitor content strategy
# Usage: aflare install marketing/competitor-content
#        aflare run competitor-content/workflow.yaml

steps:
  - node: http_request
    params:
      url: "{{ .params.competitor_blog }}"
      method: GET
      timeout: 30s
    id: competitor_site

  - node: fetch_url
    params:
      url: "{{ .params.competitor_blog }}"
    id: extracted_content

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: researcher, template_render
      max_iterations: 4
    input: |
      Analyze the content strategy of this competitor site:
      {{ .extracted_content }}
      
      Competitor: {{ .params.competitor }}
      Industry: {{ .params.industry }}
      
      Provide analysis with:
      1. Content Overview
         - Content types they produce
         - Publishing frequency
         - Average content length
      2. Topic Analysis
         - Top 20 topics they cover
         - Content pillars
         - Keyword focus areas
      3. Content Format Analysis
         - Blog posts, videos, podcasts, etc.
         - Interactive content
         - Lead magnets
      4. SEO Analysis
         - Target keywords
         - On-page SEO patterns
         - Internal linking strategy
      5. Social Media Promotion
         - Platforms used
         - Engagement patterns
      6. Content Gap Analysis
         - What they don't cover
         - Opportunities for us
      7. Content Calendar
         - Posting schedule pattern
         - Seasonal patterns
      8. Recommendations
         - Content ideas to outperform them
         - Differentiation strategy
    id: analysis

  - node: file_write
    params:
      path: competitor-content-analysis.md
    input: analysis
    id: save
