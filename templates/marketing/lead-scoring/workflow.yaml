name: Lead Scoring & Qualification
# Score and qualify leads for sales prioritization
# Usage: aflare install marketing/lead-scoring
#        aflare run lead-scoring/workflow.yaml

steps:
  - node: http_request
    params:
      url: "https://api.crm.example.com/v1/leads?status=new&limit=500"
      method: GET
      timeout: 30s
    id: leads_data

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json
      import math
      from datetime import datetime, timedelta

      raw_data = json.loads('''{{ .leads_data }}''')
      leads = raw_data.get("leads", [])

      # Scoring model configuration
      scoring_config = {
          "demographic": {
              "job_title_score": {
                  "C-Level": 25, "VP": 22, "Director": 20, "Manager": 15, "Individual": 8
              },
              "company_size_score": {
                  "Enterprise": 25, "Mid-Market": 18, "SMB": 12, "Startup": 8
              },
              "industry_score": {
                  "Technology": 15, "Finance": 20, "Healthcare": 18, "Retail": 12, "Manufacturing": 14
              }
          },
          "behavioral": {
              "website_visits": lambda v: min(v * 2, 20),
              "content_downloads": lambda v: min(v * 5, 15),
              "email_opens": lambda v: min(v * 1, 10),
              "email_clicks": lambda v: min(v * 3, 15),
              "demo_requested": lambda v: 25 if v else 0,
              "pricing_page_viewed": lambda v: 10 if v else 0,
              "days_since_last_activity": lambda v: max(0, 15 - v * 2) if v < 30 else 0
          },
          "firmographic": {
              "annual_revenue_score": lambda v: 25 if v > 100000000 else 20 if v > 10000000 else 12 if v > 1000000 else 5,
              "employee_count_score": lambda v: 20 if v > 1000 else 15 if v > 100 else 8 if v > 10 else 3
          }
      }

      scored_leads = []
      for lead in leads:
          score = 0
          factors = []

          # Demographic scoring
          job_title = lead.get("job_title", "Individual")
          for level, pts in scoring_config["demographic"]["job_title_score"].items():
              if level.lower() in job_title.lower():
                  score += pts
                  factors.append(f"Job: {level} (+{pts})")
                  break

          company_size = lead.get("company_size", "Startup")
          for size, pts in scoring_config["demographic"]["company_size_score"].items():
              if size.lower() in company_size.lower():
                  score += pts
                  factors.append(f"Company: {size} (+{pts})")
                  break

          industry = lead.get("industry", "")
          for ind, pts in scoring_config["demographic"]["industry_score"].items():
              if ind.lower() in industry.lower():
                  score += pts
                  factors.append(f"Industry: {ind} (+{pts})")
                  break

          # Behavioral scoring
          for behavior, func in scoring_config["behavioral"].items():
              val = lead.get(behavior, 0)
              pts = func(val)
              score += pts
              if pts > 0:
                  factors.append(f"{behavior}: {val} (+{pts})")

          # Firmographic scoring
          revenue = lead.get("annual_revenue", 0)
          rev_score = scoring_config["firmographic"]["annual_revenue_score"](revenue)
          score += rev_score
          if rev_score > 0:
              factors.append(f"Revenue: ${revenue} (+{rev_score})")

          employees = lead.get("employee_count", 0)
          emp_score = scoring_config["firmographic"]["employee_count_score"](employees)
          score += emp_score
          if emp_score > 0:
              factors.append(f"Employees: {employees} (+{emp_score})")

          # Qualification level
          if score >= 80:
              level = "Hot"
              action = "Immediate sales outreach"
          elif score >= 60:
              level = "Warm"
              action = "Nurture and schedule follow-up within 48h"
          elif score >= 40:
              level = "Cool"
              action = "Add to drip campaign"
          else:
              level = "Cold"
              action = "Long-term nurture"

          scored_leads.append({
              "id": lead.get("id"),
              "name": lead.get("name"),
              "email": lead.get("email"),
              "company": lead.get("company"),
              "score": score,
              "level": level,
              "recommended_action": action,
              "scoring_factors": factors
          })

      # Sort by score descending
      scored_leads.sort(key=lambda x: x["score"], reverse=True)

      # Summary statistics
      hot = [l for l in scored_leads if l["level"] == "Hot"]
      warm = [l for l in scored_leads if l["level"] == "Warm"]
      cool = [l for l in scored_leads if l["level"] == "Cool"]
      cold = [l for l in scored_leads if l["level"] == "Cold"]

      total_leads = len(scored_leads)
      avg_score = sum(l["score"] for l in scored_leads) / total_leads if total_leads > 0 else 0

      output = {
          "summary": {
              "total_leads_scored": total_leads,
              "average_score": round(avg_score, 1),
              "distribution": {
                  "hot": {"count": len(hot), "pct": round(len(hot) / total_leads * 100, 1) if total_leads > 0 else 0},
                  "warm": {"count": len(warm), "pct": round(len(warm) / total_leads * 100, 1) if total_leads > 0 else 0},
                  "cool": {"count": len(cool), "pct": round(len(cool) / total_leads * 100, 1) if total_leads > 0 else 0},
                  "cold": {"count": len(cold), "pct": round(len(cold) / total_leads * 100, 1) if total_leads > 0 else 0}
              }
          },
          "hot_leads": [{"id": l["id"], "name": l["name"], "company": l["company"], "score": l["score"], "action": l["recommended_action"]} for l in hot[:10]],
          "top_scoring_factors": list(set(f for l in hot for f in l["scoring_factors"]))[:10],
          "all_leads": scored_leads
      }

      print(json.dumps(output, indent=2))
    id: scored_leads

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: json_parse, template_render
      max_iterations: 3
    input: |
      Generate a lead scoring and qualification analysis:
      
      Campaign: {{ .params.campaign_source }}
      Total Leads: {{ .scored_leads.summary.total_leads_scored }}
      Scoring Results: {{ .scored_leads }}
      
      Provide:
      1. Executive Summary
         - Lead quality overview
         - Hot lead highlights
         - Pipeline value estimate
      2. Score Distribution Analysis
         - Qualification breakdown
         - Score distribution visualization description
         - Quality trends vs previous periods
      3. Hot Lead Deep Dive
         - Top 10 hot leads analysis
         - Common characteristics of high-scoring leads
         - Recommended outreach sequence
         - Suggested talk tracks and value props
      4. Nurture Strategy by Tier
         - Hot: Immediate sales playbook
         - Warm: Multi-channel nurture sequence (email, social, retargeting)
         - Cool: Automated drip campaign content map
         - Cold: Long-term lead recycling strategy
      5. Scoring Model Optimization
         - Factor weight analysis
         - Suggested threshold adjustments
         - Missing data points to enrich
         - A/B test ideas for scoring model
      6. Sales Handoff Process
         - Lead routing recommendations
         - SLA recommendations by tier
         - Follow-up cadence
         - Feedback loop for score refinement
    id: qualification_report

  - node: file_write
    params:
      path: lead-scoring-report.md
    input: |
      # Lead Scoring & Qualification Report
      
      **Campaign Source:** {{ .params.campaign_source }}
      **Date:** {{ .date }}
      **Total Leads Scored:** {{ .scored_leads.summary.total_leads_scored }}
      
      {{ .qualification_report }}
      
      ---
      ## Scoring Data
      ```json
      {{ .scored_leads }}
      ```
    id: save