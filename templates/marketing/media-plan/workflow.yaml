name: Media Buying Plan
# Media buying plan and budget allocation
# Usage: aflare install marketing/media-plan
#        aflare run media-plan/workflow.yaml

steps:
  - node: http_request
    params:
      url: "https://api.mediaradar.com/v1/ad-intel?industry={{ .params.industry }}&period={{ .params.period }}"
      method: GET
      timeout: 30s
    id: market_intel

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json
      import math

      budget = {{ .params.budget }}
      duration_weeks = {{ .params.duration_weeks }}
      target_audience = {{ .params.target_audience_size | default 1000000 }}
      channels = {{ .params.channels | toJson }}
      market_intel = json.loads('''{{ .market_intel }}''')

      # Channel cost benchmarks (CPM)
      channel_cpm = {
          "display": 2.80,
          "social": 6.50,
          "search": 2.50,
          "video": 20.00,
          "native": 10.00,
          "audio": 5.00,
          "ctv": 25.00,
          "dooh": 8.00,
          "email": 0.50,
          "influencer": 15.00
      }

      # Channel effectiveness scores (1-10)
      channel_effectiveness = {
          "display": 5,
          "social": 8,
          "search": 9,
          "video": 7,
          "native": 6,
          "audio": 4,
          "ctv": 7,
          "dooh": 3,
          "email": 8,
          "influencer": 7
      }

      # Calculate allocation based on channel mix
      channel_weights = {}
      for ch in channels:
          if ch in channel_effectiveness:
              channel_weights[ch] = channel_effectiveness[ch] / channel_cpm.get(ch, 1)

      total_weight = sum(channel_weights.values())

      budget_per_week = budget / duration_weeks
      allocations = {}

      for ch in channels:
          if ch in channel_weights:
              weight_pct = channel_weights[ch] / total_weight
              ch_budget = budget * weight_pct
              cpm = channel_cpm.get(ch, 5)
              impressions = (ch_budget / cpm) * 1000 if cpm > 0 else 0
              clicks = impressions * 0.005  # 0.5% estimated CTR
              conversions = clicks * 0.02  # 2% estimated CVR

              allocations[ch] = {
                  "budget": round(ch_budget, 2),
                  "budget_pct": round(weight_pct * 100, 1),
                  "weekly_budget": round(budget_per_week * weight_pct, 2),
                  "estimated_cpm": cpm,
                  "estimated_impressions": int(impressions),
                  "estimated_clicks": int(clicks),
                  "estimated_conversions": int(conversions),
                  "estimated_cpa": round(ch_budget / conversions, 2) if conversions > 0 else 0,
                  "effectiveness_score": channel_effectiveness.get(ch, 5)
              }

      # Total projections
      total_impressions = sum(a["estimated_impressions"] for a in allocations.values())
      total_clicks = sum(a["estimated_clicks"] for a in allocations.values())
      total_conversions = sum(a["estimated_conversions"] for a in allocations.values())

      # Flight schedule
      flights = []
      for week in range(1, duration_weeks + 1):
          week_data = {"week": week, "launch_allocation": round(budget_per_week, 2)}
          if week == 1:
              week_data["notes"] = "Campaign launch - full budget deployment"
              week_data["launch_allocation"] = round(budget_per_week * 1.2, 2)
          elif week == 2:
              week_data["notes"] = "Optimization phase - adjust based on early data"
              week_data["launch_allocation"] = round(budget_per_week * 0.9, 2)
          else:
              week_data["notes"] = "Scale phase - invest in top performers"
          flights.append(week_data)

      output = {
          "budget_summary": {
              "total_budget": budget,
              "duration_weeks": duration_weeks,
              "weekly_budget": round(budget_per_week, 2),
              "channels_planned": len(channels)
          },
          "channel_allocations": allocations,
          "projections": {
              "total_impressions": total_impressions,
              "total_clicks": total_clicks,
              "total_conversions": total_conversions,
              "overall_ctr": round(total_clicks / total_impressions * 100, 2) if total_impressions > 0 else 0,
              "overall_cvr": round(total_conversions / total_clicks * 100, 2) if total_clicks > 0 else 0,
              "overall_cpa": round(budget / total_conversions, 2) if total_conversions > 0 else 0
          },
          "flight_schedule": flights,
          "optimization_checkpoints": [
              {"week": 1, "action": "Baseline data collection"},
              {"week": 2, "action": "First optimization pass"},
              {"week": 4, "action": "Mid-campaign review"},
              {"week": duration_weeks - 1, "action": "Final optimization"},
              {"week": duration_weeks, "action": "Campaign wrap-up and reporting"}
          ]
      }

      print(json.dumps(output, indent=2))
    id: budget_allocations

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: json_parse, template_render
      max_iterations: 3
    input: |
      Generate a comprehensive media buying plan:
      
      Campaign: {{ .params.campaign_name }}
      Budget: ${{ .params.budget }}
      Duration: {{ .params.duration_weeks }} weeks
      Target Audience: {{ .params.target_audience }}
      Channels: {{ .params.channels }}
      Market Intel: {{ .market_intel }}
      Budget Allocations: {{ .budget_allocations }}
      
      Provide:
      1. Campaign Overview
         - Campaign objectives and KPIs
         - Target audience definition and sizing
         - Budget summary and rationale
      2. Channel Strategy
         - Channel-by-channel breakdown
         - Rationale for each channel selection
         - Creative format recommendations
         - Placement and targeting recommendations
      3. Flight Schedule
         - Weekly budget deployment plan
         - Key dates and milestones
         - Seasonality considerations
         - Testing and optimization windows
      4. Creative Strategy
         - Messaging framework by channel
         - Ad format recommendations
         - A/B testing plan for creatives
         - Brand safety guidelines
      5. Measurement Framework
         - Core KPIs and targets
         - Attribution model
         - Reporting cadence
         - Success criteria
      6. Risk Management
         - Budget contingency plan
         - Channel performance thresholds
         - Pivot triggers and decision framework
    id: media_plan

  - node: file_write
    params:
      path: media-buying-plan.md
    input: |
      # Media Buying Plan: {{ .params.campaign_name }}
      
      **Budget:** ${{ .params.budget }}
      **Duration:** {{ .params.duration_weeks }} weeks
      **Date:** {{ .date }}
      
      {{ .media_plan }}
      
      ---
      ## Budget Allocation Details
      ```json
      {{ .budget_allocations }}
      ```
    id: save