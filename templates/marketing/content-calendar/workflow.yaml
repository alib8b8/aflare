name: Content Calendar Generator
# Generate monthly content calendar
# Usage: llm-box install marketing/content-calendar
#        llm-box run content-calendar/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Create a content calendar for {{ .params.month }}.
      
      Brand: {{ .params.brand }}
      Industry: {{ .params.industry }}
      Target audience: {{ .params.audience }}
      Content goals: {{ .params.goals }}
      Platforms: {{ .params.platforms }}
      
      Create a 4-week content calendar with:
      
      1. Content Pillars for the Month
         - 3-4 main themes
         - How they support goals
      
      2. Weekly Breakdown:
         For each week:
         - Theme/focus
         - Blog post (1-2 per week)
         - Social media posts (daily ideas)
         - Email newsletter topic
         - Video/podcast topic
         - Key dates/holidays to leverage
      
      3. Content Types:
         - Educational how-to
         - Case studies
         - Industry news commentary
         - Behind-the-scenes
         - User-generated content
         - Product updates
      
      4. Content Briefs
         - For each major piece: title, outline, keywords, CTA
      
      5. Distribution Plan
         - Posting times
         - Platform-specific tweaks
         - Repurposing strategy
      
      6. Metrics to Track
      
      30+ content ideas total.
    id: calendar

  - node: file_write
    params:
      path: content-calendar.md
    input: calendar
    id: save

  - node: notify
    params:
      channel: stdout
    input: calendar
    id: notify
