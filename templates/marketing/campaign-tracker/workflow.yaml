name: Campaign Performance Tracker
# Track multi-channel marketing campaign performance
# Usage: aflare install marketing/campaign-tracker
#        aflare run campaign-tracker/workflow.yaml

steps:
  - node: http_request
    params:
      url: "https://api.analytics.example.com/v1/campaigns/{{ .params.campaign_id }}/metrics"
      method: GET
      timeout: 30s
    id: campaign_metrics

  - node: http_request
    params:
      url: "https://api.adplatform.example.com/v1/reports?campaign={{ .params.campaign_id }}&date_range={{ .params.date_range }}"
      method: GET
      timeout: 30s
    id: ad_metrics

  - node: code_interpreter
    params:
      language: python
      timeout: 60s
    input: |
      import json
      import math

      # Parse campaign metrics from API responses
      campaign_data = json.loads('''{{ .campaign_metrics }}''')
      ad_data = json.loads('''{{ .ad_metrics }}''')

      channels = {{ .params.channels | toJson }}

      # Calculate performance metrics per channel
      results = {}
      for channel in channels:
          channel_data = campaign_data.get(channel, {})
          ad_channel_data = ad_data.get(channel, {})

          impressions = channel_data.get("impressions", ad_channel_data.get("impressions", 0))
          clicks = channel_data.get("clicks", ad_channel_data.get("clicks", 0))
          conversions = channel_data.get("conversions", ad_channel_data.get("conversions", 0))
          spend = channel_data.get("spend", ad_channel_data.get("cost", 0))

          ctr = (clicks / impressions * 100) if impressions > 0 else 0
          cvr = (conversions / clicks * 100) if clicks > 0 else 0
          cpc = (spend / clicks) if clicks > 0 else 0
          cpa = (spend / conversions) if conversions > 0 else 0
          roas = (conversions * {{ .params.avg_order_value }} / spend) if spend > 0 else 0

          results[channel] = {
              "impressions": impressions,
              "clicks": clicks,
              "conversions": conversions,
              "spend": round(spend, 2),
              "ctr": round(ctr, 2),
              "cvr": round(cvr, 2),
              "cpc": round(cpc, 2),
              "cpa": round(cpa, 2),
              "roas": round(roas, 2),
              "efficiency_score": round((roas * cvr) / (cpa + 1), 2) if cpa > 0 else 0
          }

      # Aggregate totals
      total = {
          "impressions": sum(r["impressions"] for r in results.values()),
          "clicks": sum(r["clicks"] for r in results.values()),
          "conversions": sum(r["conversions"] for r in results.values()),
          "spend": round(sum(r["spend"] for r in results.values()), 2),
          "overall_ctr": 0,
          "overall_cvr": 0,
          "overall_cpa": 0,
          "overall_roas": 0
      }

      if total["impressions"] > 0:
          total["overall_ctr"] = round(total["clicks"] / total["impressions"] * 100, 2)
      if total["clicks"] > 0:
          total["overall_cvr"] = round(total["conversions"] / total["clicks"] * 100, 2)
      if total["conversions"] > 0:
          total["overall_cpa"] = round(total["spend"] / total["conversions"], 2)
      if total["spend"] > 0:
          total["overall_roas"] = round(total["conversions"] * {{ .params.avg_order_value }} / total["spend"], 2)

      # Rank channels by efficiency
      ranked = sorted(results.items(), key=lambda x: x[1]["efficiency_score"], reverse=True)

      output = {
          "channel_breakdown": results,
          "totals": total,
          "channel_ranking": [{"channel": ch, "score": data["efficiency_score"]} for ch, data in ranked],
          "best_channel": ranked[0][0] if ranked else None,
          "worst_channel": ranked[-1][0] if ranked else None,
          "budget_reallocation_suggestion": "Reallocate 20% from {} to {}".format(
              ranked[-1][0] if ranked else "N/A",
              ranked[0][0] if ranked else "N/A"
          )
      }

      print(json.dumps(output, indent=2))
    id: performance_analysis

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: json_parse, template_render
      max_iterations: 3
    input: |
      Generate a campaign performance report based on the analysis:
      
      Campaign: {{ .params.campaign_name }}
      Date Range: {{ .params.date_range }}
      Performance Data: {{ .performance_analysis }}
      
      Provide:
      1. Executive Summary
         - Overall performance vs targets
         - Key highlights and lowlights
      2. Channel Performance Deep Dive
         - Best performing channel analysis
         - Underperforming channel diagnosis
         - Channel-specific insights
      3. Budget Efficiency Analysis
         - ROAS by channel
         - CPA trends
         - Budget reallocation recommendations
      4. Conversion Funnel Analysis
         - Awareness to conversion ratios
         - Drop-off points and optimization opportunities
      5. Actionable Recommendations
         - Immediate optimizations
         - A/B test suggestions
         - Budget reallocation plan
         - Next campaign learnings
    id: report

  - node: file_write
    params:
      path: campaign-performance-report.md
    input: |
      # Campaign Performance Report: {{ .params.campaign_name }}
      
      **Date Range:** {{ .params.date_range }}
      **Generated:** {{ .date }}
      
      {{ .report }}
      
      ---
      ## Raw Performance Data
      ```json
      {{ .performance_analysis }}
      ```
    id: save