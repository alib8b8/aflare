name: Brand Health Audit
# Audit brand health and competitive positioning
# Usage: aflare install marketing/brand-audit
#        aflare run brand-audit/workflow.yaml

steps:
  - node: http_request
    params:
      url: "{{ .params.brand_website }}"
      method: GET
      timeout: 30s
    id: brand_site

  - node: http_request
    params:
      url: "https://api.g2.com/v1/products/{{ .params.brand_name | lowercase | replace " " "-" }}"
      method: GET
      timeout: 30s
    id: g2_reviews

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: researcher, template_render, json_parse
      max_iterations: 5
    input: |
      Conduct a comprehensive brand health audit for:
      
      Brand: {{ .params.brand_name }}
      Industry: {{ .params.industry }}
      Competitors: {{ .params.competitors }}
      Brand Website Content: {{ .brand_site }}
      G2 Reviews: {{ .g2_reviews }}
      
      Provide analysis across these dimensions:
      1. Brand Identity Assessment
         - Brand voice and tone consistency
         - Visual identity elements
         - Brand promise and value proposition
         - Mission/vision alignment
      2. Brand Awareness & Perception
         - Market recognition level
         - Brand associations (positive/negative)
         - Share of voice in industry
         - Brand recall metrics
      3. Competitive Positioning
         - Positioning map vs competitors
         - Unique selling propositions
         - Differentiation factors
         - Competitive advantages and gaps
      4. Brand Equity Analysis
         - Perceived quality
         - Brand loyalty indicators
         - Price premium potential
         - Brand extensions viability
      5. Digital Presence Audit
         - Website UX and messaging
         - Social media presence and engagement
         - Content quality and consistency
         - SEO visibility
      6. Customer Sentiment
         - Review ratings analysis
         - NPS (Net Promoter Score) estimation
         - Common praise themes
         - Recurring complaints
      7. Brand Risk Assessment
         - Reputation vulnerabilities
         - Market disruption threats
         - Regulatory/compliance risks
      8. Strategic Recommendations
         - Quick wins (0-30 days)
         - Medium-term improvements (30-90 days)
         - Long-term brand strategy (90+ days)
    id: audit_results

  - node: file_write
    params:
      path: brand-audit-report.md
    input: |
      # Brand Health Audit: {{ .params.brand_name }}
      
      **Industry:** {{ .params.industry }}
      **Date:** {{ .date }}
      
      {{ .audit_results }}
    id: save