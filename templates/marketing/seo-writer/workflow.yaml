name: SEO Article Writer
# Generate SEO-optimized articles
# Usage: llm-box install seo-writer
#        llm-box run seo-writer/workflow.yaml
# Config: Set TOPIC and KEYWORDS in params below

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: http_request
      max_iterations: 5
    input: |
      Research the topic "{{ .topic }}" and identify:
      1. Top 5 related subtopics
      2. Key statistics or data points
      3. Common questions people ask
      4. Relevant keywords: {{ .keywords }}
      
      Return a structured research brief.
    id: research

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 5
    input: |
      Write a comprehensive SEO article about "{{ .topic }}".
      
      Research brief: {{ .research }}
      
      Requirements:
      - Length: 1500-2000 words
      - Include H2 and H3 headings
      - Naturally incorporate keywords: {{ .keywords }}
      - Add a FAQ section at the end
      - Include meta description suggestion
      - Tone: professional and informative
      
      Return the full article in markdown.
    id: article

  - node: file_write
    params:
      path: "seo-article-{{ .slug }}.md"
    input: article
    id: save

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Review this SEO article for:
      1. Keyword density (target 1-2%)
      2. Readability score
      3. Heading structure
      4. Internal linking opportunities
      5. Call-to-action placement
      
      Article: {{ .article }}
      
      Return a concise audit report.
    id: audit

  - node: file_write
    params:
      path: "seo-audit-{{ .slug }}.md"
    input: audit
    id: save_audit