name: Influencer Campaign Brief
# Generate influencer marketing campaign briefs
# Usage: aflare install marketing/influencer-brief
#        aflare run influencer-brief/workflow.yaml

steps:
  - node: http_request
    params:
      url: "https://api.socialblade.com/v2/youtube/statistics?query={{ .params.influencer_handle }}"
      method: GET
      timeout: 30s
    id: influencer_stats

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: researcher, template_render, json_parse
      max_iterations: 4
    input: |
      Create an influencer marketing campaign brief based on:
      
      Brand: {{ .params.brand }}
      Campaign Goal: {{ .params.campaign_goal }}
      Budget: {{ .params.budget }}
      Target Audience: {{ .params.target_audience }}
      Influencer Handle: {{ .params.influencer_handle }}
      Platform: {{ .params.platform }}
      Influencer Stats: {{ .influencer_stats }}
      
      Generate a comprehensive brief with:
      1. Campaign Overview
         - Campaign name and theme
         - Brand message and key talking points
         - Campaign timeline and milestones
      2. Influencer Profile Match
         - Audience demographic alignment
         - Content style compatibility
         - Engagement rate analysis
         - Brand safety assessment
      3. Content Requirements
         - Content format(s) required
         - Number of deliverables per platform
         - Creative direction and mood board
         - Mandatory disclosures (#ad, #sponsored)
         - Brand guidelines (dos and don'ts)
      4. Deliverables Schedule
         - Content calendar with deadlines
         - Review and approval process
         - Publishing windows and cadence
      5. Compensation & Terms
         - Fee structure (flat fee, commission, hybrid)
         - Performance bonuses and incentives
         - Usage rights and exclusivity terms
         - Contract duration
      6. Performance Metrics & KPIs
         - Engagement rate targets
         - Reach and impressions goals
         - Conversion tracking setup
         - ROI calculation methodology
      7. Legal & Compliance
         - FTC disclosure requirements
         - Platform-specific rules
         - Content ownership and licensing
         - Exclusivity clauses
    id: campaign_brief

  - node: file_write
    params:
      path: influencer-campaign-brief.md
    input: |
      # Influencer Campaign Brief
      
      **Brand:** {{ .params.brand }}
      **Influencer:** {{ .params.influencer_handle }}
      **Platform:** {{ .params.platform }}
      **Date:** {{ .date }}
      
      {{ .campaign_brief }}
    id: save