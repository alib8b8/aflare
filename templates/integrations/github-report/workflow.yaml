name: GitHub Weekly Report
# Generates a weekly GitHub activity report
# Usage: aflare install github-report
#        aflare run github-report/workflow.yaml
# Config: Set REPO and AUTHOR in params below

steps:
  - node: code_interpreter
    params:
      language: python
      code: |
        import subprocess
        r = subprocess.run(["gh", "issue", "list", "--repo", "{{ .repo }}", "--since", "1 week ago", "--state", "all", "--limit", "20", "--json", "number,title,state,labels,createdAt"], capture_output=True, text=True)
        print(r.stdout or r.stderr or "")
    id: issues

  - node: code_interpreter
    params:
      language: python
      code: |
        import subprocess
        r = subprocess.run(["gh", "pr", "list", "--repo", "{{ .repo }}", "--since", "1 week ago", "--state", "all", "--limit", "20", "--json", "number,title,state,createdAt"], capture_output=True, text=True)
        print(r.stdout or r.stderr or "")
    id: prs

  - node: code_interpreter
    params:
      language: python
      code: |
        import subprocess
        r = subprocess.run(["git", "log", "--author={{ .author }}", "--since=1 week ago", "--pretty=format:%h %s", "--shortstat"], capture_output=True, text=True)
        print(r.stdout or r.stderr or "")
    id: commits

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: json_parse,template_render
      max_iterations: 3
    input: |
      Generate a weekly GitHub report with the following data:
      Issues: {{ .issues }}
      Pull Requests: {{ .prs }}
      Commits: {{ .commits }}
      
      Format as a markdown report with sections:
      - Summary statistics
      - Top issues this week
      - PR activity
      - Commit highlights
    id: report

  - node: file_write
    params:
      path: github-weekly-report.md
    input: report
    id: save

  - node: notify
    params:
      channel: stdout
    input: report
    id: notify