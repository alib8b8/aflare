name: GitHub Issue Bot
# Auto-create and label GitHub issues
# Usage: aflare install github-issue-bot
#        aflare run github-issue-bot/workflow.yaml
# Config: Set GITHUB_TOKEN, GITHUB_REPO

steps:
  - node: http_request
    params:
      url: https://api.github.com/repos/{{ .repo }}/issues?state=open&per_page=20
      method: GET
      headers:
        Authorization: "Bearer {{ .github_token }}"
        Accept: "application/vnd.github+json"
      timeout: 30s
    id: fetch_issues

  - node: json_parse
    params:
      path: ""
    input: fetch_issues
    id: existing_issues

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: json_parse,template_render
      max_iterations: 3
    input: |
      Analyze the existing GitHub issues and identify patterns:
      Existing issues: {{ .existing_issues }}
      
      Determine:
      - Duplicate issues that should be linked
      - Issues that need labels
      - Issues that need triage
      - Suggested new issues based on gaps
    id: analysis

  - node: http_request
    params:
      url: https://api.github.com/repos/{{ .repo }}/issues
      method: POST
      content_type: application/json
      headers:
        Authorization: "Bearer {{ .github_token }}"
        Accept: "application/vnd.github+json"
      body: |
        {
          "title": "Auto-generated: {{ .analysis.title }}",
          "body": "{{ .analysis.body }}",
          "labels": {{ .analysis.labels }}
        }
      timeout: 30s
    id: create_issue

  - node: http_request
    params:
      url: https://api.github.com/repos/{{ .repo }}/issues/{{ .analysis.label_target }}/labels
      method: POST
      content_type: application/json
      headers:
        Authorization: "Bearer {{ .github_token }}"
        Accept: "application/vnd.github+json"
      body: "{{ .analysis.labels }}"
      timeout: 30s
    id: apply_labels
    on_error: skip

  - node: file_write
    params:
      path: github-issue-report.md
    input: analysis
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      GitHub issues processed. Created: {{ .create_issue.number }}, Labels applied.
    id: confirm