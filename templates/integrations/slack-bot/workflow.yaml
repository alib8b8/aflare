name: Slack Bot
# Send messages and manage Slack channels
# Usage: aflare install slack-bot
#        aflare run slack-bot/workflow.yaml
# Config: Set SLACK_BOT_TOKEN and SLACK_CHANNEL

steps:
  - node: file_read
    params:
      path: slack-message.txt
    id: message_content
    on_error: skip

  - node: template_render
    params:
      template: |
        {{ if .message }}{{ .message }}{{ else }}Message from aflare workflow{{ end }}
      message: "{{ .message_content }}"
    id: rendered_message

  - node: http_request
    params:
      url: https://slack.com/api/chat.postMessage
      method: POST
      content_type: application/json
      headers:
        Authorization: "Bearer {{ .slack_token }}"
      body: |
        {
          "channel": "{{ .channel }}",
          "text": "{{ .rendered_message }}",
          "mrkdwn": true
        }
      timeout: 30s
    id: send_message

  - node: http_request
    params:
      url: https://slack.com/api/conversations.list
      method: GET
      headers:
        Authorization: "Bearer {{ .slack_token }}"
      timeout: 30s
    id: list_channels

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: json_parse
      max_iterations: 2
    input: |
      Parse the Slack API response and summarize:
      - Message delivery status: {{ .send_message }}
      - Available channels: {{ .list_channels }}
    id: summary

  - node: file_write
    params:
      path: slack-report.md
    input: summary
    id: save

  - node: notify
    params:
      channel: stdout
    input: summary
    id: notify