name: RSS to Social
# Cross-post RSS feed items to social media
# Usage: aflare install rss-to-social
#        aflare run rss-to-social/workflow.yaml
# Config: Set RSS_FEED_URL, TWITTER_API_KEY, MASTODON_TOKEN

steps:
  - node: http_request
    params:
      url: "{{ .rss_feed_url }}"
      method: GET
      timeout: 30s
    id: fetch_rss

  - node: xml_parse
    params:
      path: rss.channel.item
    input: fetch_rss
    id: items

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: json_parse,template_render
      max_iterations: 3
    input: |
      Process the latest RSS feed items and create social media posts:
      Items: {{ .items }}
      
      For each item (max 3), generate:
      - A Twitter/X post (max 280 chars) with hashtags
      - A Mastodon post (max 500 chars) with hashtags
      - A LinkedIn post (professional tone)
    id: social_posts

  - node: http_request
    params:
      url: https://api.twitter.com/2/tweets
      method: POST
      content_type: application/json
      headers:
        Authorization: "Bearer {{ .twitter_api_key }}"
      body: |
        {
          "text": "{{ .social_posts.twitter_post }}"
        }
      timeout: 30s
    id: post_twitter

  - node: http_request
    params:
      url: https://{{ .mastodon_instance }}/api/v1/statuses
      method: POST
      content_type: application/json
      headers:
        Authorization: "Bearer {{ .mastodon_token }}"
      body: |
        {
          "status": "{{ .social_posts.mastodon_post }}"
        }
      timeout: 30s
    id: post_mastodon

  - node: file_write
    params:
      path: rss-social-posts.md
    input: social_posts
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      Cross-posted to Twitter and Mastodon. Posts saved to rss-social-posts.md
    id: confirm