name: Google Sheets Report
# Generate and update reports in Google Sheets
# Usage: aflare install google-sheets-report
#        aflare run google-sheets-report/workflow.yaml
# Config: Set GOOGLE_SHEETS_API_KEY, SPREADSHEET_ID

steps:
  - node: http_request
    params:
      url: https://sheets.googleapis.com/v4/spreadsheets/{{ .spreadsheet_id }}/values/Sheet1!A1:Z100
      method: GET
      headers:
        Authorization: "Bearer {{ .google_api_key }}"
      timeout: 30s
    id: fetch_sheet

  - node: http_request
    params:
      url: https://api.openweathermap.org/data/2.5/weather?q=London&appid={{ .weather_api_key }}
      method: GET
      timeout: 30s
    id: fetch_weather

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: json_parse,template_render
      max_iterations: 3
    input: |
      Generate a report combining the following data:
      - Sheet data: {{ .fetch_sheet }}
      - Weather data: {{ .fetch_weather }}
      
      Produce a summary table with key metrics and insights.
    id: report

  - node: http_request
    params:
      url: https://sheets.googleapis.com/v4/spreadsheets/{{ .spreadsheet_id }}/values/Report!A1:append?valueInputOption=RAW
      method: POST
      content_type: application/json
      headers:
        Authorization: "Bearer {{ .google_api_key }}"
      body: |
        {
          "values": [
            ["{{ .date }}", "{{ .report }}"]
          ]
        }
      timeout: 30s
    id: update_sheet

  - node: file_write
    params:
      path: google-sheets-report.md
    input: report
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      Google Sheets updated. Status: {{ .update_sheet.status }}
    id: confirm