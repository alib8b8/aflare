name: SMS Alert
# Send SMS alerts and notifications via Twilio
# Usage: aflare install sms-alert
#        aflare run sms-alert/workflow.yaml
# Config: Set TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_PHONE, TO_PHONE

steps:
  - node: file_read
    params:
      path: sms-message.txt
    id: message_content
    on_error: skip

  - node: template_render
    params:
      template: |
        {{ if .message }}{{ .message }}{{ else }}Alert from aflare workflow at {{ .timestamp }}{{ end }}
      message: "{{ .message_content }}"
    id: rendered_message

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 2
    input: |
      Format the following message for SMS delivery (max 160 characters):
      Message: {{ .rendered_message }}
      
      If the message is too long, truncate it intelligently while preserving the key information.
    id: sms_body

  - node: http_request
    params:
      url: https://api.twilio.com/2010-04-01/Accounts/{{ .account_sid }}/Messages.json
      method: POST
      content_type: application/x-www-form-urlencoded
      headers:
        Authorization: "Basic {{ .auth_token }}"
      body: |
        From={{ .twilio_phone }}&To={{ .to_phone }}&Body={{ .sms_body }}
      timeout: 30s
    id: send_sms

  - node: json_parse
    params:
      path: sid
    input: send_sms
    id: message_sid

  - node: file_write
    params:
      path: sms-log.json
    input: |
      {
        "timestamp": "{{ .timestamp }}",
        "to": "{{ .to_phone }}",
        "message": "{{ .sms_body }}",
        "sid": "{{ .message_sid }}"
      }
    id: save_log

  - node: notify
    params:
      channel: stdout
    input: |
      SMS sent successfully. SID: {{ .message_sid }}
    id: confirm