name: Notion Sync
# Create pages and sync databases in Notion
# Usage: aflare install notion-sync
#        aflare run notion-sync/workflow.yaml
# Config: Set NOTION_API_KEY, NOTION_DATABASE_ID

steps:
  - node: http_request
    params:
      url: https://api.notion.com/v1/databases/{{ .database_id }}/query
      method: POST
      content_type: application/json
      headers:
        Authorization: "Bearer {{ .notion_api_key }}"
        Notion-Version: "2022-06-28"
      body: |
        {
          "page_size": 50
        }
      timeout: 30s
    id: fetch_db

  - node: json_parse
    params:
      path: results
    input: fetch_db
    id: existing_pages

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: json_parse,template_render
      max_iterations: 3
    input: |
      Analyze the Notion database entries and generate a new page:
      Existing pages: {{ .existing_pages }}
      
      Create a summary page with:
      - Count of existing entries
      - Categorization by type
      - Suggested action items
    id: page_content

  - node: http_request
    params:
      url: https://api.notion.com/v1/pages
      method: POST
      content_type: application/json
      headers:
        Authorization: "Bearer {{ .notion_api_key }}"
        Notion-Version: "2022-06-28"
      body: |
        {
          "parent": { "database_id": "{{ .database_id }}" },
          "properties": {
            "Name": {
              "title": [{ "text": { "content": "Sync Report - {{ .date }}" } }]
            },
            "Content": {
              "rich_text": [{ "text": { "content": "{{ .page_content }}" } }]
            }
          }
        }
      timeout: 30s
    id: create_page

  - node: file_write
    params:
      path: notion-sync-report.md
    input: page_content
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      Notion page created. Status: {{ .create_page.status }}
    id: confirm