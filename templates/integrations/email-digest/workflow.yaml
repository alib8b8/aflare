name: Email Digest
# Generate and send daily/weekly email digests
# Usage: aflare install email-digest
#        aflare run email-digest/workflow.yaml
# Config: Set SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, RECIPIENT

steps:
  - node: http_request
    params:
      url: https://newsapi.org/v2/top-headlines?country=us&apiKey={{ .news_api_key }}
      method: GET
      timeout: 30s
    id: fetch_news

  - node: json_parse
    params:
      path: articles
    input: fetch_news
    id: articles

  - node: http_request
    params:
      url: https://api.github.com/trending
      method: GET
      timeout: 30s
    id: fetch_trending

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: json_parse,template_render
      max_iterations: 3
    input: |
      Generate a daily email digest from the following data:
      - Top news headlines: {{ .articles }}
      - Trending repos: {{ .fetch_trending }}
      
      Format as a clean HTML email with:
      - Header with date
      - Top 5 news stories with links
      - Trending repositories
      - Footer with unsubscribe link
    id: digest_html

  - node: code_interpreter
    params:
      language: python
      code: |
        import smtplib
        from email.mime.text import MIMEText
        from email.mime.multipart import MIMEMultipart

        msg = MIMEMultipart("alternative")
        msg["From"] = "{{ .smtp_user }}"
        msg["To"] = "{{ .recipient }}"
        msg["Subject"] = "Daily Digest - {{ .date }}"
        msg.attach(MIMEText("{{ .digest_html }}", "html"))

        with smtplib.SMTP("{{ .smtp_host }}", {{ .smtp_port }}) as server:
            server.starttls()
            server.login("{{ .smtp_user }}", "{{ .smtp_pass }}")
            server.sendmail("{{ .smtp_user }}", "{{ .recipient }}", msg.as_string())
        print("ok")
    id: send_email

  - node: file_write
    params:
      path: email-digest-{{ .date }}.html
    input: digest_html
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      Email digest sent to {{ .recipient }}
    id: confirm