name: Zendesk Ticket Manager
# Manage Zendesk support tickets
# Usage: aflare install zendesk-ticket
#        aflare run zendesk-ticket/workflow.yaml
# Config: Set ZENDESK_SUBDOMAIN, ZENDESK_EMAIL, ZENDESK_API_TOKEN

steps:
  - node: http_request
    params:
      url: https://{{ .subdomain }}.zendesk.com/api/v2/tickets.json?sort_by=created_at&sort_order=desc
      method: GET
      headers:
        Authorization: "Basic {{ .auth_token }}"
      timeout: 30s
    id: fetch_tickets

  - node: json_parse
    params:
      path: tickets
    input: fetch_tickets
    id: tickets

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: json_parse,template_render
      max_iterations: 3
    input: |
      Analyze the Zendesk tickets and generate a support report:
      Tickets: {{ .tickets }}
      
      Provide:
      - Ticket count by status
      - Tickets needing immediate attention
      - Aging tickets (older than 48 hours)
      - Suggested responses for open tickets
      - Priority reassignment suggestions
    id: support_report

  - node: http_request
    params:
      url: https://{{ .subdomain }}.zendesk.com/api/v2/tickets.json
      method: POST
      content_type: application/json
      headers:
        Authorization: "Basic {{ .auth_token }}"
      body: |
        {
          "ticket": {
            "subject": "Support Report - {{ .date }}",
            "comment": { "body": "{{ .support_report.summary }}" },
            "priority": "normal"
          }
        }
      timeout: 30s
    id: create_report_ticket

  - node: file_write
    params:
      path: zendesk-support-report.md
    input: support_report
    id: save

  - node: notify
    params:
      channel: stdout
    input: |
      Zendesk support report generated. Tickets analyzed: {{ .tickets.length }}
    id: confirm