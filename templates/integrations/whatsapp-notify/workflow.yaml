name: WhatsApp Notify
# Send WhatsApp message notifications via Twilio
# Usage: aflare install whatsapp-notify
#        aflare run whatsapp-notify/workflow.yaml
# Config: Set TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, WHATSAPP_FROM, WHATSAPP_TO

steps:
  - node: file_read
    params:
      path: whatsapp-message.txt
    id: message_content
    on_error: skip

  - node: template_render
    params:
      template: |
        {{ if .message }}{{ .message }}{{ else }}*Notification from aflare*%0A%0AA workflow has completed at {{ .timestamp }}{{ end }}
      message: "{{ .message_content }}"
    id: rendered_message

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 2
    input: |
      Format the message for WhatsApp. Use WhatsApp text formatting:
      - *bold* for headings
      - _italic_ for emphasis
      - ``` for code blocks
      - Keep the message friendly and professional
      
      Message: {{ .rendered_message }}
    id: formatted_message

  - node: http_request
    params:
      url: https://api.twilio.com/2010-04-01/Accounts/{{ .account_sid }}/Messages.json
      method: POST
      content_type: application/x-www-form-urlencoded
      headers:
        Authorization: "Basic {{ .auth_token }}"
      body: |
        From=whatsapp:{{ .whatsapp_from }}&To=whatsapp:{{ .whatsapp_to }}&Body={{ .formatted_message }}
      timeout: 30s
    id: send_whatsapp

  - node: json_parse
    params:
      path: sid
    input: send_whatsapp
    id: message_sid

  - node: http_request
    params:
      url: https://api.twilio.com/2010-04-01/Accounts/{{ .account_sid }}/Messages/{{ .message_sid }}.json
      method: GET
      headers:
        Authorization: "Basic {{ .auth_token }}"
      timeout: 30s
    id: check_status

  - node: file_write
    params:
      path: whatsapp-log.json
    input: |
      {
        "timestamp": "{{ .timestamp }}",
        "to": "{{ .whatsapp_to }}",
        "message": "{{ .formatted_message }}",
        "sid": "{{ .message_sid }}",
        "status": "{{ .check_status.status }}"
      }
    id: save_log

  - node: notify
    params:
      channel: stdout
    input: |
      WhatsApp message sent. SID: {{ .message_sid }}, Status: {{ .check_status.status }}
    id: confirm