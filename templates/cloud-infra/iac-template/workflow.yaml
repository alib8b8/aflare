name: Infrastructure as Code Template
# Generate Terraform/IaC templates
# Usage: llm-box install cloud-infra/iac-template
#        llm-box run iac-template/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 4
    input: |
      Generate Infrastructure as Code templates for {{ .params.project }}.
      
      Project: {{ .params.project }}
      IaC tool: {{ .params.iac_tool }}
      Cloud provider: {{ .params.cloud }}
      
      Templates should include:
      1. Project Structure
         - Directory layout
         - Module organization
         - Environment separation
      2. Core Modules
         - VPC module
         - Compute module (EC2/EKS/etc)
         - Database module (RDS/DynamoDB/etc)
         - Storage module
         - IAM module
      3. Environment Configs
         - Dev
         - Staging
         - Production
      4. State Management
         - Remote state setup
         - State locking
      5. Variable Definitions
         - Input variables
         - Outputs
         - locals
      6. Example Template Code
         - provider.tf
         - main.tf
         - variables.tf
         - outputs.tf
         - terraform.tfvars
      7. Best Practices
         - Naming conventions
         - Tagging strategy
         - Security considerations
      8. CI/CD for IaC
         - Plan on PR
         - Apply on merge
         - Drift detection
      
      Include actual code examples.
    id: iac

  - node: file_write
    params:
      path: iac-templates.md
    input: iac
    id: save
