name: Budget Planner
# Create personal budget plan and tracker
# Usage: llm-box install finance-investing/budget-planner
#        llm-box run budget-planner/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Create a comprehensive personal budget plan.
      
      Monthly income: {{ .params.income }}
      Location: {{ .params.location }}
      Goals: {{ .params.goals }}
      Current situation: {{ .params.current_situation }}
      
      Budget plan should include:
      1. Budget Overview
         - Income breakdown
         - Recommended budget allocation (50/30/20 or similar)
      2. Expense Categories:
         - Housing (rent/mortgage, utilities, maintenance)
         - Transportation (car, gas, insurance, public transit)
         - Food (groceries, dining out)
         - Healthcare (insurance, out-of-pocket)
         - Entertainment
         - Personal care
         - Subscriptions
         - Savings & Investments
         - Debt repayment
         - Miscellaneous
      3. Savings Strategy
         - Emergency fund target
         - Retirement savings
         - Short-term goals
         - Long-term goals
      4. Debt Payoff Plan
         - Avalanche method
         - Snowball method
         - Recommendations
      5. Budget Tracking Template
      6. Money-saving tips for each category
      7. Annual expenses to plan for
      8. Budget review schedule
    id: budget

  - node: file_write
    params:
      path: budget-plan.md
    input: budget
    id: save

  - node: notify
    params:
      channel: stdout
    input: budget
    id: notify
