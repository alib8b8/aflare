name: Telegram Notification Bot
# Send notifications to Telegram
# Usage: llm-box install telegram-bot
#        llm-box run telegram-bot/workflow.yaml
# Config: Set TELEGRAM_BOT_TOKEN and CHAT_ID

steps:
  - node: file_read
    params:
      path: message.txt
    id: message_content
    on_error: skip

  - node: template_render
    params:
      template: |
        {{ if .message }}{{ .message }}{{ else }}Hello from llm-box!{{ end }}
        
        ---
        Sent by llm-box at {{ .timestamp }}
      timestamp: "{{ .timestamp }}"
    id: final_message

  - node: http_request
    params:
      url: https://api.telegram.org/bot{{ .bot_token }}/sendMessage
      method: POST
      content_type: application/json
      body: |
        {
          "chat_id": "{{ .chat_id }}",
          "text": "{{ .final_message }}",
          "parse_mode": "Markdown"
        }
    id: send

  - node: json_parse
    params:
      path: ok
    input: send
    id: status

  - node: notify
    params:
      channel: stdout
    input: status
    id: confirm