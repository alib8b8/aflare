name: cart-abandonment
description: Cart abandonment recovery workflow with intelligent retargeting and incentive optimization
version: "1.0"
input_schema:
  - name: abandonment_threshold_minutes
    type: integer
    default: 30
    description: Minutes after cart activity to trigger recovery
  - name: max_recovery_attempts
    type: integer
    default: 3
    description: Maximum recovery contact attempts
  - name: incentive_budget
    type: number
    default: 5.00
    description: Maximum incentive value per cart
  - name: channels
    type: array
    default: ["email", "push"]
    description: Recovery channels to use

steps:
  - id: fetch_abandoned_carts
    node: http_request
    params:
      method: GET
      url: "{{ .params.api_base }}/carts/abandoned"
      params:
        minutes_threshold: "{{ .params.abandonment_threshold_minutes }}"
        max_attempts: "{{ .params.max_recovery_attempts }}"
        limit: "100"

  - id: prioritize_carts
    node: code_interpreter
    params:
      language: python
      code: |
        import json

        carts = {{ .steps.fetch_abandoned_carts.response | toJson }}
        max_incentive = {{ .params.incentive_budget }}

        abandoned = carts.get("carts", [])
        prioritized = []

        for cart in abandoned:
            cart_value = cart.get("total", 0)
            items_count = len(cart.get("items", []))
            previous_attempts = cart.get("recovery_attempts", 0)
            
            # Scoring: higher value + fewer items (more likely to complete) + fewer attempts
            score = (cart_value * 0.5) + (items_count * 5) - (previous_attempts * 10)
            incentive = min(max_incentive, round(cart_value * 0.05, 2))
            
            # Determine best channel
            channels = cart.get("available_channels", ["email"])
            best_channel = channels[0] if channels else "email"
            
            # Determine urgency
            hours_abandoned = cart.get("hours_since_abandoned", 0)
            urgency = "high" if hours_abandoned < 2 else "medium" if hours_abandoned < 24 else "low"
            
            prioritized.append({
                "cart_id": cart["id"],
                "customer_id": cart.get("customer_id", ""),
                "cart_value": cart_value,
                "items_count": items_count,
                "score": round(score, 2),
                "incentive": incentive,
                "channel": best_channel,
                "urgency": urgency,
                "previous_attempts": previous_attempts,
                "items": [{"id": i["id"], "name": i.get("name", ""), "price": i.get("price", 0)} for i in cart.get("items", [])]
            })

        prioritized.sort(key=lambda x: x["score"], reverse=True)
        result = {"carts": prioritized, "total_found": len(abandoned)}
        print(json.dumps(result))

  - id: generate_recovery_messages
    node: agent
    params:
      model: "{{ .params.model | default \"gpt-4\" }}"
      temperature: 0.5
      prompt: |
        Generate personalized recovery messages for each abandoned cart:
        
        Prioritized Carts: {{ .steps.prioritize_carts.response | toJson }}
        Available Channels: {{ .params.channels }}
        Max Incentive: ${{ .params.incentive_budget }}
        
        For each cart, create:
        1. Email subject line and body (if email channel)
        2. Push notification text (if push channel)
        3. SMS text (if sms channel)
        4. Incentive offer description
        5. Urgency messaging
        6. Call-to-action
        
        Personalize based on cart items and value.
        Output as JSON array.

  - id: execute_recovery
    node: http_request
    params:
      method: POST
      url: "{{ .params.api_base }}/carts/recovery/execute"
      body:
        recoveries: "{{ .steps.generate_recovery_messages.response | toJson }}"
        channels: "{{ .params.channels }}"

  - id: save_recovery_report
    node: file_write
    params:
      path: "/output/cart-recovery/recovery_{{ .params.timestamp }}.json"
      content: |
        {
          "executed_at": "{{ .params.timestamp }}",
          "threshold_minutes": {{ .params.abandonment_threshold_minutes }},
          "total_carts": {{ .steps.prioritize_carts.response.total_found }},
          "prioritized_carts": {{ .steps.prioritize_carts.response | toJson }},
          "recovery_execution": {{ .steps.execute_recovery.response | toJson }}
        }