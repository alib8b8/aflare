name: marketplace-listing
description: Multi-marketplace listing optimization with platform-specific content adaptation
version: "1.0"
params:
  - name: product_id
    type: string
    required: true
    description: Product to create marketplace listings for
  - name: marketplaces
    type: array
    default: ["amazon", "ebay", "walmart"]
    description: Target marketplaces
  - name: optimize_for
    type: string
    default: "conversion"
    description: Optimization goal (conversion, visibility, ranking)

steps:
  - id: fetch_product_master
    node: http_request
    config:
      method: GET
      url: "{{ .params.api_base }}/products/{{ .params.product_id }}/master"
      params:
        include_media: "true"
        include_specs: "true"

  - id: fetch_marketplace_requirements
    node: http_request
    config:
      method: POST
      url: "{{ .params.api_base }}/marketplace/requirements"
      body:
        marketplaces: "{{ .params.marketplaces }}"
        category: "{{ .steps.fetch_product_master.response.category }}"

  - id: generate_listings
    node: agent
    config:
      model: "{{ .params.model | default \"gpt-4\" }}"
      temperature: 0.4
      prompt: |
        Generate optimized marketplace listings for each platform:
        
        Product Master Data: {{ .steps.fetch_product_master.response | toJson }}
        Marketplace Requirements: {{ .steps.fetch_marketplace_requirements.response | toJson }}
        Optimization Goal: {{ .params.optimize_for }}
        
        For each marketplace ({{ .params.marketplaces }}), generate:
        1. Platform-specific title (optimized for search)
        2. Bullet points / key features
        3. Product description (platform-appropriate length)
        4. Search terms / backend keywords
        5. Category mapping
        6. Pricing recommendation (considering platform fees)
        7. Shipping template recommendation
        8. Recommended images and order
        9. A+ Content / Enhanced content suggestions
        
        Output as JSON keyed by marketplace.

  - id: validate_listings
    node: code_interpreter
    config:
      language: python
      code: |
        import json

        listings = {{ .steps.generate_listings.response | toJson }}
        validations = {}

        for platform, listing in listings.items():
            issues = []
            title = listing.get("title", "")
            desc = listing.get("description", "")
            bullets = listing.get("bullet_points", [])
            keywords = listing.get("search_terms", [])

            # Platform-specific validations
            if platform == "amazon":
                if len(title) > 200:
                    issues.append("amazon_title_exceeds_200_chars")
                if len(bullets) < 5:
                    issues.append("amazon_needs_min_5_bullets")
            elif platform == "ebay":
                if len(title) > 80:
                    issues.append("ebay_title_exceeds_80_chars")
            elif platform == "walmart":
                if len(desc) < 150:
                    issues.append("walmart_description_too_short")

            validations[platform] = {
                "passed": len(issues) == 0,
                "issues": issues,
                "title_length": len(title),
                "bullet_count": len(bullets),
                "keyword_count": len(keywords)
            }

        print(json.dumps(validations))

  - id: save_marketplace_listings
    node: file_write
    config:
      path: "/output/marketplace/{{ .params.product_id }}_listings_{{ .params.timestamp }}.json"
      content: |
        {
          "product_id": "{{ .params.product_id }}",
          "marketplaces": {{ .params.marketplaces | toJson }},
          "optimization_goal": "{{ .params.optimize_for }}",
          "generated_at": "{{ .params.timestamp }}",
          "listings": {{ .steps.generate_listings.response | toJson }},
          "validations": {{ .steps.validate_listings.response | toJson }}
        }