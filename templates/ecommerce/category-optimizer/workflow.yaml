name: category-optimizer
description: Product category performance analysis and optimization recommendations
version: "1.0"
input_schema:
  - name: category_ids
    type: array
    required: false
    description: Specific categories to analyze (empty for all)
  - name: metrics
    type: array
    default: ["revenue", "margin", "conversion", "traffic", "returns"]
    description: KPIs to analyze
  - name: comparison_period
    type: string
    default: "30d"
    description: Comparison period

steps:
  - id: fetch_category_performance
    node: http_request
    params:
      method: POST
      url: "{{ .params.api_base }}/analytics/category-performance"
      body:
        category_ids: "{{ .params.category_ids }}"
        metrics: "{{ .params.metrics }}"
        period: "{{ .params.comparison_period }}"

  - id: fetch_market_trends
    node: http_request
    params:
      method: GET
      url: "{{ .params.api_base }}/market/trends"
      params:
        categories: "{{ .params.category_ids | join \",\" }}"

  - id: analyze_category_health
    node: agent
    params:
      model: "{{ .params.model | default \"gpt-4\" }}"
      temperature: 0.3
      prompt: |
        Analyze the performance of each product category:
        
        Performance Data: {{ .steps.fetch_category_performance.response | toJson }}
        Market Trends: {{ .steps.fetch_market_trends.response | toJson }}
        Target Metrics: {{ .params.metrics }}
        
        For each category, provide:
        1. Performance score (0-100) for each metric
        2. YoY/MoM trend analysis
        3. Market position vs competitors
        4. Growth opportunities
        5. Underperforming subcategories
        6. Product mix optimization suggestions
        7. Pricing adjustment recommendations
        8. Inventory allocation suggestions
        
        Output as structured JSON.

  - id: generate_optimization_plan
    node: agent
    params:
      model: "{{ .params.model | default \"gpt-4\" }}"
      temperature: 0.4
      prompt: |
        Based on the category health analysis, create an optimization plan:
        
        Category Analysis: {{ .steps.analyze_category_health.response | toJson }}
        
        Generate a prioritized action plan with:
        1. Top 10 optimization actions ranked by impact
        2. Quick wins (implementable within 1 week)
        3. Strategic initiatives (1-3 month timeline)
        4. Resource allocation recommendations
        5. Expected ROI for each action
        6. Risk assessment
        
        Output as structured JSON.

  - id: save_category_report
    node: file_write
    params:
      path: "/output/category/category_optimization_{{ .params.timestamp }}.json"
      content: |
        {
          "analyzed_at": "{{ .params.timestamp }}",
          "comparison_period": "{{ .params.comparison_period }}",
          "category_health": {{ .steps.analyze_category_health.response | toJson }},
          "optimization_plan": {{ .steps.generate_optimization_plan.response | toJson }}
        }