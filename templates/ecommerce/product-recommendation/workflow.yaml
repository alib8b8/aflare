name: product-recommendation
description: AI-powered product recommendation engine using customer behavior and preferences
version: "1.0"
params:
  - name: customer_id
    type: string
    required: true
    description: Target customer identifier
  - name: top_n
    type: integer
    default: 10
    description: Number of recommendations to return
  - name: strategy
    type: string
    default: "collaborative"
    description: Recommendation strategy (collaborative, content-based, hybrid)

steps:
  - id: fetch_customer_profile
    node: http_request
    params:
      method: POST
      url: "{{ .params.api_base }}/customers/profile"
      body:
        customer_id: "{{ .params.customer_id }}"
      headers:
        Content-Type: application/json

  - id: fetch_browsing_history
    node: http_request
    params:
      method: GET
      url: "{{ .params.api_base }}/customers/{{ .params.customer_id }}/browsing-history"
      params:
        days: "{{ .params.lookback_days | default 30 }}"

  - id: compute_recommendations
    node: agent
    params:
      model: "{{ .params.model | default \"gpt-4\" }}"
      temperature: 0.3
      prompt: |
        You are a product recommendation engine. Based on the following customer data:
        
        Customer Profile: {{ .steps.fetch_customer_profile.response }}
        Browsing History: {{ .steps.fetch_browsing_history.response }}
        
        Generate {{ .params.top_n }} personalized product recommendations using the {{ .params.strategy }} strategy.
        For each recommendation, provide:
        - Product ID
        - Product name
        - Confidence score (0-1)
        - Reasoning for recommendation
        
        Output as structured JSON array.

  - id: enrich_recommendations
    node: http_request
    params:
      method: POST
      url: "{{ .params.api_base }}/products/enrich"
      body:
        product_ids: "{{ .steps.compute_recommendations.response.product_ids }}"

  - id: save_results
    node: file_write
    params:
      path: "/output/recommendations/{{ .params.customer_id }}_{{ .params.timestamp }}.json"
      content: |
        {
          "customer_id": "{{ .params.customer_id }}",
          "strategy": "{{ .params.strategy }}",
          "generated_at": "{{ .params.timestamp }}",
          "recommendations": {{ .steps.compute_recommendations.response | toJson }},
          "enriched": {{ .steps.enrich_recommendations.response | toJson }}
        }