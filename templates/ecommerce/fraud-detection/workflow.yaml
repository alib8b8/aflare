name: fraud-detection
description: E-commerce fraud detection with multi-signal analysis and risk scoring
version: "1.0"
params:
  - name: order_id
    type: string
    required: true
    description: Order to evaluate for fraud
  - name: risk_threshold
    type: number
    default: 0.70
    description: Risk score threshold for flagging
  - name: auto_reject
    type: boolean
    default: false
    description: Auto-reject orders above threshold

steps:
  - id: fetch_order_details
    node: http_request
    config:
      method: GET
      url: "{{ .params.api_base }}/orders/{{ .params.order_id }}"
      params:
        include_payment: "true"
        include_shipping: "true"
        include_customer: "true"

  - id: fetch_fraud_signals
    node: http_request
    config:
      method: POST
      url: "{{ .params.api_base }}/fraud/signals"
      body:
        order_id: "{{ .params.order_id }}"
        ip_address: "{{ .steps.fetch_order_details.response.customer.ip_address }}"
        email: "{{ .steps.fetch_order_details.response.customer.email }}"
        card_bin: "{{ .steps.fetch_order_details.response.payment.card_bin }}"

  - id: compute_risk_score
    node: code_interpreter
    config:
      language: python
      code: |
        import json
        from datetime import datetime, timezone

        order = {{ .steps.fetch_order_details.response | toJSON }}
        signals = {{ .steps.fetch_fraud_signals.response | toJSON }}
        threshold = {{ .params.risk_threshold }}

        risk_factors = []
        total_score = 0.0
        max_score = 0.0

        # Check 1: AVS mismatch (Address Verification)
        max_score += 25
        if not signals.get("avs_match", True):
            total_score += 25
            risk_factors.append({"factor": "avs_mismatch", "score": 25, "severity": "high"})

        # Check 2: CVV mismatch
        max_score += 20
        if not signals.get("cvv_match", True):
            total_score += 20
            risk_factors.append({"factor": "cvv_mismatch", "score": 20, "severity": "high"})

        # Check 3: High-risk country
        max_score += 15
        high_risk_countries = signals.get("high_risk_countries", [])
        shipping_country = order.get("shipping_address", {}).get("country", "")
        if shipping_country in high_risk_countries:
            total_score += 15
            risk_factors.append({"factor": "high_risk_country", "score": 15, "severity": "high"})

        # Check 4: IP-country mismatch
        max_score += 10
        if not signals.get("ip_country_match", True):
            total_score += 10
            risk_factors.append({"factor": "ip_country_mismatch", "score": 10, "severity": "medium"})

        # Check 5: Order velocity (multiple orders in short time)
        max_score += 10
        recent_orders = signals.get("recent_order_count", 0)
        if recent_orders > 5:
            total_score += 10
            risk_factors.append({"factor": "high_order_velocity", "score": 10, "severity": "medium"})

        # Check 6: High order value
        max_score += 10
        order_total = order.get("total", 0)
        avg_order = signals.get("avg_order_value", 100)
        if order_total > avg_order * 5:
            total_score += 10
            risk_factors.append({"factor": "unusually_high_value", "score": 10, "severity": "medium"})

        # Check 7: Email domain risk
        max_score += 5
        if signals.get("disposable_email", False):
            total_score += 5
            risk_factors.append({"factor": "disposable_email", "score": 5, "severity": "low"})

        # Check 8: Shipping-billing mismatch
        max_score += 5
        if not signals.get("shipping_billing_match", True):
            total_score += 5
            risk_factors.append({"factor": "different_shipping_billing", "score": 5, "severity": "low"})

        risk_score = round(total_score / max_score, 4) if max_score > 0 else 0
        is_flagged = risk_score >= threshold
        
        # Decision
        if risk_score >= 0.85:
            decision = "reject"
        elif risk_score >= threshold:
            decision = "review"
        else:
            decision = "approve"

        result = {
            "order_id": "{{ .params.order_id }}",
            "risk_score": risk_score,
            "threshold": threshold,
            "is_flagged": is_flagged,
            "decision": decision,
            "risk_factors": risk_factors,
            "factor_count": len(risk_factors),
            "evaluated_at": datetime.now(timezone.utc).isoformat()
        }
        print(json.dumps(result))

  - id: generate_fraud_report
    node: agent
    config:
      model: "{{ .params.model | default \"gpt-4\" }}"
      temperature: 0.2
      prompt: |
        Generate a fraud analysis report based on:
        
        Risk Assessment: {{ .steps.compute_risk_score.response | toJSON }}
        Order Details: {{ .steps.fetch_order_details.response | toJSON }}
        Fraud Signals: {{ .steps.fetch_fraud_signals.response | toJSON }}
        
        Provide:
        1. Summary of risk assessment
        2. Detailed explanation of each risk factor
        3. Recommended action (with justification)
        4. Additional verification steps if needed
        5. Confidence level in the assessment
        
        Output as structured JSON.

  - id: execute_fraud_action
    node: http_request
    config:
      method: POST
      url: "{{ .params.api_base }}/fraud/action"
      body:
        order_id: "{{ .params.order_id }}"
        decision: "{{ .steps.compute_risk_score.response.decision }}"
        risk_score: "{{ .steps.compute_risk_score.response.risk_score }}"
        report: "{{ .steps.generate_fraud_report.response | toJSON }}"
    condition: "{{ and .params.auto_reject (eq .steps.compute_risk_score.response.decision \"reject\") }}"

  - id: save_fraud_report
    node: file_write
    config:
      path: "/output/fraud/fraud_check_{{ .params.order_id }}_{{ .params.timestamp }}.json"
      content: |
        {
          "order_id": "{{ .params.order_id }}",
          "checked_at": "{{ .params.timestamp }}",
          "risk_assessment": {{ .steps.compute_risk_score.response | toJSON }},
          "analysis_report": {{ .steps.generate_fraud_report.response | toJSON }},
          "action_taken": {{ .steps.execute_fraud_action.response | toJSON }}
        }