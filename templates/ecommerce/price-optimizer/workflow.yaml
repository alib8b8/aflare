name: price-optimizer
description: Dynamic pricing optimization using market data, competitor analysis, and demand signals
version: "1.0"
params:
  - name: product_id
    type: string
    required: true
    description: Target product identifier
  - name: margin_min
    type: number
    default: 0.15
    description: Minimum acceptable profit margin
  - name: margin_max
    type: number
    default: 0.45
    description: Maximum target profit margin
  - name: strategy
    type: string
    default: "profit_max"
    description: Pricing strategy (profit_max, volume_max, competitive, penetration)

steps:
  - id: fetch_product_data
    node: http_request
    config:
      method: GET
      url: "{{ .params.api_base }}/products/{{ .params.product_id }}"
      params:
        include_cost: "true"
        include_sales: "true"

  - id: fetch_competitor_prices
    node: http_request
    config:
      method: GET
      url: "{{ .params.api_base }}/market/competitor-prices"
      params:
        product_id: "{{ .params.product_id }}"
        region: "{{ .params.region | default \"default\" }}"

  - id: fetch_demand_signals
    node: http_request
    config:
      method: GET
      url: "{{ .params.api_base }}/market/demand-signals"
      params:
        product_id: "{{ .params.product_id }}"
        horizon: "{{ .params.horizon | default \"7d\" }}"

  - id: compute_optimal_price
    node: agent
    config:
      model: "{{ .params.model | default \"gpt-4\" }}"
      temperature: 0.2
      prompt: |
        You are a pricing optimization expert. Analyze the following data and recommend the optimal price:
        
        Product Data: {{ .steps.fetch_product_data.response | toJson }}
        Competitor Prices: {{ .steps.fetch_competitor_prices.response | toJson }}
        Demand Signals: {{ .steps.fetch_demand_signals.response | toJson }}
        
        Constraints:
        - Minimum margin: {{ .params.margin_min }} ({{ mul .params.margin_min 100 }}%)
        - Maximum margin: {{ .params.margin_max }} ({{ mul .params.margin_max 100 }}%)
        - Strategy: {{ .params.strategy }}
        
        Provide:
        - Recommended price
        - Expected profit margin
        - Expected volume change (%)
        - Confidence score
        - Rationale
        - Risk factors
        
        Output as JSON.

  - id: save_price_recommendation
    node: file_write
    config:
      path: "/output/pricing/{{ .params.product_id }}_{{ .params.strategy }}_{{ .params.timestamp }}.json"
      content: |
        {
          "product_id": "{{ .params.product_id }}",
          "strategy": "{{ .params.strategy }}",
          "generated_at": "{{ .params.timestamp }}",
          "current_price": {{ .steps.fetch_product_data.response.price }},
          "recommendation": {{ .steps.compute_optimal_price.response | toJson }}
        }