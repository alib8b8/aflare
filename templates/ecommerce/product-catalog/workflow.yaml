name: product-catalog
description: Product catalog enrichment with AI-generated descriptions, attributes, and SEO optimization
version: "1.0"
params:
  - name: product_ids
    type: array
    required: false
    description: Specific products to enrich (empty for all missing enrichment)
  - name: enrichment_type
    type: string
    default: "full"
    description: Enrichment type (description, attributes, seo, images, full)
  - name: language
    type: string
    default: "en"
    description: Target language for content
  - name: seo_keywords
    type: array
    required: false
    description: Target SEO keywords

steps:
  - id: fetch_products
    node: http_request
    config:
      method: POST
      url: "{{ .params.api_base }}/products/catalog"
      body:
        product_ids: "{{ .params.product_ids }}"
        enrichment_type: "{{ .params.enrichment_type }}"
        missing_only: "true"

  - id: enrich_product_content
    node: agent
    config:
      model: "{{ .params.model | default \"gpt-4\" }}"
      temperature: 0.5
      prompt: |
        Enrich the following product catalog entries:
        
        Products: {{ .steps.fetch_products.response | toJson }}
        Enrichment Type: {{ .params.enrichment_type }}
        Language: {{ .params.language }}
        {{ if .params.seo_keywords }}Target SEO Keywords: {{ .params.seo_keywords }}{{ end }}
        
        For each product, generate:
        
        {{ if or (eq .params.enrichment_type "description") (eq .params.enrichment_type "full") }}
        1. Compelling product title (SEO optimized)
        2. Short description (1-2 sentences)
        3. Long description (2-3 paragraphs with features and benefits)
        4. Bullet points of key features
        5. Technical specifications summary
        {{ end }}
        
        {{ if or (eq .params.enrichment_type "attributes") (eq .params.enrichment_type "full") }}
        6. Structured attributes (size, color, material, weight, dimensions)
        7. Categorization tags
        8. Related attributes for faceted search
        {{ end }}
        
        {{ if or (eq .params.enrichment_type "seo") (eq .params.enrichment_type "full") }}
        9. Meta title (50-60 chars)
        10. Meta description (150-160 chars)
        11. URL slug
        12. Alt text for images
        13. Schema.org structured data
        {{ end }}
        
        Output as JSON array.

  - id: validate_content
    node: code_interpreter
    config:
      language: python
      code: |
        import json

        enriched = {{ .steps.enrich_product_content.response | toJson }}
        products = enriched if isinstance(enriched, list) else enriched.get("products", [])

        validations = []
        for product in products:
            issues = []
            
            # Check title length
            title = product.get("title", "")
            if len(title) < 20:
                issues.append("title_too_short")
            elif len(title) > 200:
                issues.append("title_too_long")
            
            # Check description
            long_desc = product.get("long_description", "")
            if len(long_desc) < 100:
                issues.append("description_too_short")
            
            # Check meta description
            meta_desc = product.get("meta_description", "")
            if meta_desc and len(meta_desc) > 160:
                issues.append("meta_description_too_long")
            
            # Check required attributes
            attributes = product.get("attributes", {})
            if not attributes:
                issues.append("missing_attributes")
            
            validations.append({
                "product_id": product.get("id", "unknown"),
                "product_name": product.get("title", ""),
                "passed": len(issues) == 0,
                "issues": issues,
                "content_score": max(0, 100 - len(issues) * 15)
            })

        summary = {
            "total_products": len(validations),
            "passed": sum(1 for v in validations if v["passed"]),
            "failed": sum(1 for v in validations if not v["passed"]),
            "average_score": round(sum(v["content_score"] for v in validations) / max(len(validations), 1), 1),
            "validations": validations
        }
        print(json.dumps(summary))

  - id: save_enriched_catalog
    node: file_write
    config:
      path: "/output/catalog/enriched_catalog_{{ .params.timestamp }}.json"
      content: |
        {
          "enrichment_type": "{{ .params.enrichment_type }}",
          "language": "{{ .params.language }}",
          "generated_at": "{{ .params.timestamp }}",
          "products": {{ .steps.enrich_product_content.response | toJson }},
          "validation": {{ .steps.validate_content.response | toJson }}
        }