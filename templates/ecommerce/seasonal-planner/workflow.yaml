name: seasonal-planner
description: Seasonal inventory and promotion planning with demand forecasting and budget allocation
version: "1.0"
input_schema:
  - name: season
    type: string
    required: true
    description: Target season (spring, summer, fall, winter, holiday, back_to_school, black_friday)
  - name: planning_horizon_days
    type: integer
    default: 90
    description: Planning horizon in days
  - name: budget
    type: number
    required: false
    description: Total seasonal budget
  - name: category_ids
    type: array
    required: false
    description: Categories to include in planning

steps:
  - id: fetch_seasonal_history
    node: http_request
    params:
      method: GET
      url: "{{ .params.api_base }}/analytics/seasonal"
      params:
        season: "{{ .params.season }}"
        category_ids: "{{ .params.category_ids | join \",\" }}"

  - id: fetch_inventory_status
    node: http_request
    params:
      method: GET
      url: "{{ .params.api_base }}/inventory/status"
      params:
        category_ids: "{{ .params.category_ids | join \",\" }}"

  - id: fetch_market_trends
    node: http_request
    params:
      method: GET
      url: "{{ .params.api_base }}/market/seasonal-trends"
      params:
        season: "{{ .params.season }}"
        horizon: "{{ .params.planning_horizon_days }}"

  - id: compute_seasonal_plan
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        from datetime import datetime, timedelta

        history = {{ .steps.fetch_seasonal_history.response | toJson }}
        inventory = {{ .steps.fetch_inventory_status.response | toJson }}
        trends = {{ .steps.fetch_market_trends.response | toJson }}
        season = "{{ .params.season }}"
        horizon = {{ .params.planning_horizon_days }}
        budget = {{ .params.budget | default 0 }}

        past_seasons = history.get("seasons", [])
        current_inventory = inventory.get("products", [])
        trend_data = trends.get("trends", [])

        # Calculate seasonal uplift factors
        avg_uplift = sum(s.get("uplift_factor", 1.0) for s in past_seasons) / max(len(past_seasons), 1)

        products = []
        for inv in current_inventory:
            # Find trend data for this product
            trend = next((t for t in trend_data if t.get("product_id") == inv["id"]), {})
            trend_score = trend.get("trend_score", 0.5)
            seasonal_demand = round(inv.get("avg_daily_sales", 0) * avg_uplift * (1 + trend_score), 2)
            
            # Calculate recommended stock
            current_stock = inv.get("quantity", 0)
            needed_stock = round(seasonal_demand * horizon)
            reorder_qty = max(0, needed_stock - current_stock)
            
            # Promotion recommendation
            if trend_score > 0.8:
                promotion = "featured"
            elif trend_score > 0.5:
                promotion = "promoted"
            elif inv.get("quantity", 0) > needed_stock * 1.5:
                promotion = "clearance"
            else:
                promotion = "standard"
            
            products.append({
                "product_id": inv["id"],
                "product_name": inv.get("name", ""),
                "current_stock": current_stock,
                "avg_daily_sales": inv.get("avg_daily_sales", 0),
                "seasonal_demand_forecast": seasonal_demand,
                "needed_stock": needed_stock,
                "reorder_quantity": reorder_qty,
                "trend_score": round(trend_score, 2),
                "promotion_strategy": promotion,
                "estimated_revenue": round(seasonal_demand * horizon * inv.get("price", 0), 2)
            })

        products.sort(key=lambda x: x["estimated_revenue"], reverse=True)

        # Budget allocation
        budget_allocation = {}
        if budget > 0:
            promo_products = [p for p in products if p["promotion_strategy"] in ("featured", "promoted")]
            total_revenue = sum(p["estimated_revenue"] for p in promo_products)
            for p in promo_products:
                allocation = round(budget * (p["estimated_revenue"] / total_revenue), 2) if total_revenue > 0 else 0
                budget_allocation[p["product_id"]] = allocation

        plan = {
            "season": season,
            "horizon_days": horizon,
            "seasonal_uplift_factor": round(avg_uplift, 2),
            "total_products_planned": len(products),
            "total_estimated_revenue": round(sum(p["estimated_revenue"] for p in products), 2),
            "total_reorder_cost": round(sum(p["reorder_quantity"] * 0 for p in products), 2),
            "budget": budget,
            "budget_allocation": budget_allocation,
            "products": products
        }
        print(json.dumps(plan))

  - id: generate_promotion_calendar
    node: agent
    params:
      model: "{{ .params.model | default \"gpt-4\" }}"
      temperature: 0.4
      prompt: |
        Generate a detailed seasonal promotion calendar:
        
        Season: {{ .params.season }}
        Seasonal Plan: {{ .steps.compute_seasonal_plan.response | toJson }}
        {{ if .params.budget }}Budget: ${{ .params.budget }}{{ end }}
        
        Create a {{ .params.planning_horizon_days }}-day promotion calendar with:
        1. Key dates and milestones
        2. Weekly promotion themes
        3. Product feature schedule
        4. Channel strategy (email, social, site, ads)
        5. Content calendar highlights
        6. Expected traffic and conversion targets
        7. Contingency plans
        
        Output as structured JSON.

  - id: save_seasonal_plan
    node: file_write
    params:
      path: "/output/seasonal/{{ .params.season }}_plan_{{ .params.timestamp }}.json"
      content: |
        {
          "season": "{{ .params.season }}",
          "horizon_days": {{ .params.planning_horizon_days }},
          "generated_at": "{{ .params.timestamp }}",
          "inventory_plan": {{ .steps.compute_seasonal_plan.response | toJson }},
          "promotion_calendar": {{ .steps.generate_promotion_calendar.response | toJson }}
        }