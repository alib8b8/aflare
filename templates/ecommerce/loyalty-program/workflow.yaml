name: loyalty-program
description: Loyalty program design and optimization with tier structure, rewards, and engagement analysis
version: "1.0"
params:
  - name: program_type
    type: string
    default: "points_based"
    description: Loyalty program type (points_based, tiered, subscription, hybrid, gamified)
  - name: tier_count
    type: integer
    default: 3
    description: Number of tiers in the program
  - name: points_per_dollar
    type: number
    default: 10
    description: Base points earned per dollar spent
  - name: point_value
    type: number
    default: 0.01
    description: Dollar value of each point
  - name: target_retention_rate
    type: number
    default: 0.80
    description: Target customer retention rate

steps:
  - id: fetch_customer_engagement
    node: http_request
    config:
      method: GET
      url: "{{ .params.api_base }}/customers/engagement"
      params:
        include_activity: "true"
        include_spend: "true"
        days: "365"

  - id: analyze_engagement_patterns
    node: code_interpreter
    config:
      language: python
      code: |
        import json
        import numpy as np

        data = {{ .steps.fetch_customer_engagement.response | toJson }}
        program_type = "{{ .params.program_type }}"
        tier_count = {{ .params.tier_count }}
        points_per_dollar = {{ .params.points_per_dollar }}
        point_value = {{ .params.point_value }}
        target_retention = {{ .params.target_retention_rate }}

        customers = data.get("customers", [])
        if not customers:
            print(json.dumps({"error": "No customer data"}))
            exit()

        # Calculate spend distribution
        annual_spends = [c.get("annual_spend", 0) for c in customers]
        annual_spends.sort(reverse=True)

        # Design tier thresholds based on percentiles
        tiers = []
        tier_names = ["bronze", "silver", "gold", "platinum", "diamond"][:tier_count]
        
        for i in range(tier_count):
            percentile = 100 - ((i + 1) / tier_count * 80)
            threshold = np.percentile(annual_spends, max(10, percentile))
            point_multiplier = 1.0 + (i * 0.5)
            benefits = []
            
            if i == 0:
                benefits = ["base_points", "birthday_reward"]
            elif i == tier_count - 1:
                benefits = ["premium_points", "birthday_reward", "free_shipping", "early_access", "exclusive_events", "dedicated_support"]
            else:
                benefits = ["bonus_points", "birthday_reward", "free_shipping"]
                if i >= 2:
                    benefits.append("early_access")
            
            tiers.append({
                "name": tier_names[i],
                "level": i + 1,
                "annual_spend_threshold": round(threshold, 2),
                "point_multiplier": round(point_multiplier, 1),
                "points_per_dollar": round(points_per_dollar * point_multiplier, 1),
                "benefits": benefits,
                "estimated_members": int(len(customers) * (1 - (i / tier_count)) / tier_count)
            })

        # Calculate program economics
        avg_spend = np.mean(annual_spends) if annual_spends else 0
        total_customers = len(customers)
        total_annual_spend = sum(annual_spends)
        
        # Points liability
        total_points_issued = total_annual_spend * points_per_dollar
        estimated_redemption = total_points_issued * 0.70  # 70% redemption rate
        points_liability = round(estimated_redemption * point_value, 2)

        # ROI estimation
        current_retention = 0.70  # assumed baseline
        retention_improvement = target_retention - current_retention
        additional_revenue = total_annual_spend * retention_improvement
        program_cost = points_liability
        estimated_roi = round((additional_revenue - program_cost) / program_cost * 100, 1) if program_cost > 0 else 0

        program = {
            "program_type": program_type,
            "tier_count": tier_count,
            "base_points_per_dollar": points_per_dollar,
            "point_value": point_value,
            "tiers": tiers,
            "economics": {
                "total_customers": total_customers,
                "total_annual_spend": round(total_annual_spend, 2),
                "avg_annual_spend": round(avg_spend, 2),
                "total_points_issued": round(total_points_issued, 0),
                "estimated_redemption_rate": 0.70,
                "points_liability": points_liability,
                "program_cost_estimate": points_liability,
                "estimated_additional_revenue": round(additional_revenue, 2),
                "estimated_roi_pct": estimated_roi
            }
        }
        print(json.dumps(program))

  - id: generate_program_details
    node: agent
    config:
      model: "{{ .params.model | default \"gpt-4\" }}"
      temperature: 0.4
      prompt: |
        Design a complete loyalty program based on the analysis:
        
        Program Structure: {{ .steps.analyze_engagement_patterns.response | toJson }}
        Program Type: {{ .params.program_type }}
        Target Retention: {{ .params.target_retention_rate }}
        
        Generate:
        1. Program name and branding concept
        2. Detailed tier descriptions with benefits
        3. Earning rules (purchases, reviews, referrals, social)
        4. Redemption options and catalog
        5. Gamification elements (if applicable)
        6. Member onboarding journey
        7. Communication plan (welcome, status updates, reward reminders)
        8. Program terms and conditions summary
        9. Success metrics and KPIs to track
        10. Launch plan and timeline
        
        Output as structured JSON.

  - id: save_loyalty_program
    node: file_write
    config:
      path: "/output/loyalty/loyalty_program_{{ .params.timestamp }}.json"
      content: |
        {
          "generated_at": "{{ .params.timestamp }}",
          "program_type": "{{ .params.program_type }}",
          "structure": {{ .steps.analyze_engagement_patterns.response | toJson }},
          "program_design": {{ .steps.generate_program_details.response | toJson }}
        }