name: review-analyzer
description: Customer review sentiment analysis and insight extraction for product improvement
version: "1.0"
input_schema:
  - name: product_id
    type: string
    required: true
    description: Product to analyze reviews for
  - name: review_source
    type: string
    default: "all"
    description: Review source (all, website, marketplace, social)
  - name: date_range
    type: string
    default: "90d"
    description: Review date range to analyze
  - name: language
    type: string
    default: "auto"
    description: Review language filter

steps:
  - id: fetch_reviews
    node: http_request
    params:
      method: GET
      url: "{{ .params.api_base }}/products/{{ .params.product_id }}/reviews"
      params:
        source: "{{ .params.review_source }}"
        date_range: "{{ .params.date_range }}"
        language: "{{ .params.language }}"

  - id: analyze_sentiment
    node: agent
    params:
      model: "{{ .params.model | default \"gpt-4\" }}"
      temperature: 0.1
      prompt: |
        Analyze the sentiment of the following product reviews. For each review, classify:
        - Sentiment (positive/negative/neutral)
        - Sentiment score (0-10)
        - Key topics mentioned
        - Specific product features praised or criticized
        
        Reviews: {{ .steps.fetch_reviews.response | toJson }}
        
        Output as JSON array of analyzed reviews.

  - id: extract_insights
    node: agent
    params:
      model: "{{ .params.model | default \"gpt-4\" }}"
      temperature: 0.3
      prompt: |
        Based on the analyzed reviews below, extract actionable insights:
        
        Analyzed Reviews: {{ .steps.analyze_sentiment.response | toJson }}
        
        Provide:
        1. Overall sentiment summary (distribution %)
        2. Top 5 praised features
        3. Top 5 criticized issues
        4. Common customer pain points
        5. Product improvement recommendations
        6. Competitive advantages identified
        7. Emerging trends or patterns
        
        Output as structured JSON.

  - id: save_review_report
    node: file_write
    params:
      path: "/output/reviews/{{ .params.product_id }}_review_report_{{ .params.timestamp }}.json"
      content: |
        {
          "product_id": "{{ .params.product_id }}",
          "analysis_period": "{{ .params.date_range }}",
          "total_reviews": {{ .steps.fetch_reviews.response.count }},
          "generated_at": "{{ .params.timestamp }}",
          "sentiment_analysis": {{ .steps.analyze_sentiment.response | toJson }},
          "insights": {{ .steps.extract_insights.response | toJson }}
        }