name: customer-segmentation
description: RFM customer segmentation with targeted marketing strategy generation
version: "1.0"
input_schema:
  - name: segmentation_model
    type: string
    default: "rfm"
    description: Segmentation model (rfm, behavioral, demographic, hybrid)
  - name: recency_weight
    type: number
    default: 0.35
    description: Weight for recency in RFM scoring
  - name: frequency_weight
    type: number
    default: 0.35
    description: Weight for frequency in RFM scoring
  - name: monetary_weight
    type: number
    default: 0.30
    description: Weight for monetary value in RFM scoring

steps:
  - id: fetch_customer_transactions
    node: http_request
    params:
      method: GET
      url: "{{ .params.api_base }}/customers/transactions"
      params:
        include_all: "true"
        days: "365"

  - id: compute_rfm_segments
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        import numpy as np
        from datetime import datetime, timezone

        data = {{ .steps.fetch_customer_transactions.response | toJson }}
        r_weight = {{ .params.recency_weight }}
        f_weight = {{ .params.frequency_weight }}
        m_weight = {{ .params.monetary_weight }}

        customers = data.get("customers", [])
        now = datetime.now(timezone.utc)
        
        rfm_data = []
        for customer in customers:
            orders = customer.get("orders", [])
            if not orders:
                continue
            
            # Recency: days since last order
            dates = [datetime.fromisoformat(o["created_at"].replace("Z", "+00:00")) for o in orders]
            last_order = max(dates)
            recency = (now - last_order).days
            
            # Frequency: number of orders
            frequency = len(orders)
            
            # Monetary: total spend
            monetary = sum(o.get("total", 0) for o in orders)
            
            rfm_data.append({
                "customer_id": customer["id"],
                "customer_name": customer.get("name", ""),
                "email": customer.get("email", ""),
                "recency_days": recency,
                "frequency": frequency,
                "monetary": round(monetary, 2),
                "last_order_date": last_order.isoformat()
            })

        if not rfm_data:
            print(json.dumps({"segments": [], "error": "No customer data"}))
            exit()

        # Calculate percentiles for scoring
        recencies = [c["recency_days"] for c in rfm_data]
        frequencies = [c["frequency"] for c in rfm_data]
        monies = [c["monetary"] for c in rfm_data]

        r_percentiles = np.percentile(recencies, [33, 67])
        f_percentiles = np.percentile(frequencies, [33, 67])
        m_percentiles = np.percentile(monies, [33, 67])

        # Score and segment
        for customer in rfm_data:
            # R score: lower recency is better (1=best, 3=worst)
            if customer["recency_days"] <= r_percentiles[0]:
                r_score = 3
            elif customer["recency_days"] <= r_percentiles[1]:
                r_score = 2
            else:
                r_score = 1
            
            # F score: higher frequency is better
            if customer["frequency"] >= f_percentiles[1]:
                f_score = 3
            elif customer["frequency"] >= f_percentiles[0]:
                f_score = 2
            else:
                f_score = 1
            
            # M score: higher monetary is better
            if customer["monetary"] >= m_percentiles[1]:
                m_score = 3
            elif customer["monetary"] >= m_percentiles[0]:
                m_score = 2
            else:
                m_score = 1
            
            customer["r_score"] = r_score
            customer["f_score"] = f_score
            customer["m_score"] = m_score
            customer["rfm_score"] = r_score * r_weight + f_score * f_weight + m_score * m_weight
            
            # Segment assignment
            rfm_combo = f"{r_score}{f_score}{m_score}"
            if rfm_combo in ["333", "332", "323", "322"]:
                segment = "champions"
            elif rfm_combo in ["331", "321", "312", "311"]:
                segment = "loyal_customers"
            elif rfm_combo in ["233", "232", "223", "222"]:
                segment = "potential_loyalists"
            elif rfm_combo in ["133", "132", "123", "122"]:
                segment = "at_risk"
            elif rfm_combo in ["111", "112", "121", "211"]:
                segment = "lost"
            elif rfm_combo in ["313", "213", "113"]:
                segment = "big_spenders"
            else:
                segment = "needs_attention"
            
            customer["segment"] = segment

        # Aggregate segments
        segments = {}
        for c in rfm_data:
            seg = c["segment"]
            if seg not in segments:
                segments[seg] = {"count": 0, "customers": [], "total_revenue": 0}
            segments[seg]["count"] += 1
            segments[seg]["total_revenue"] += c["monetary"]
            segments[seg]["customers"].append(c["customer_id"])

        summary = {
            "total_customers": len(rfm_data),
            "total_revenue": round(sum(c["monetary"] for c in rfm_data), 2),
            "segments": {k: {"count": v["count"], "revenue": round(v["total_revenue"], 2), "pct": round(v["count"]/len(rfm_data)*100, 1)} for k, v in segments.items()},
            "customers": rfm_data
        }
        print(json.dumps(summary))

  - id: generate_segment_strategies
    node: agent
    params:
      model: "{{ .params.model | default \"gpt-4\" }}"
      temperature: 0.3
      prompt: |
        Generate targeted marketing strategies for each RFM segment:
        
        Segmentation Results: {{ .steps.compute_rfm_segments.response | toJson }}
        
        For each segment, provide:
        1. Segment description and characteristics
        2. Marketing strategy and messaging tone
        3. Recommended channels (email, SMS, push, retargeting)
        4. Offer/promotion strategy
        5. Content recommendations
        6. Engagement tactics
        7. Retention vs. acquisition focus
        8. Expected campaign impact
        
        Output as structured JSON keyed by segment name.

  - id: save_segmentation_report
    node: file_write
    params:
      path: "/output/segmentation/rfm_segmentation_{{ .params.timestamp }}.json"
      content: |
        {
          "generated_at": "{{ .params.timestamp }}",
          "model": "{{ .params.segmentation_model }}",
          "weights": {
            "recency": {{ .params.recency_weight }},
            "frequency": {{ .params.frequency_weight }},
            "monetary": {{ .params.monetary_weight }}
          },
          "segmentation": {{ .steps.compute_rfm_segments.response | toJson }},
          "strategies": {{ .steps.generate_segment_strategies.response | toJson }}
        }