name: headcount-planner
description: Workforce headcount planning with budget modeling and scenario analysis
params:
  - name: departments
    type: array
    required: true
    description: Department data with current headcount, growth targets
  - name: budget_total
    type: number
    required: true
    description: Total headcount budget for planning period
  - name: planning_period
    type: object
    required: true
    description: Planning period with fiscal year and quarters
  - name: growth_projections
    type: object
    required: false
    default: {}
    description: Revenue and business growth projections
  - name: attrition_rate
    type: number
    required: false
    default: 12
    description: Expected annual attrition rate percentage
  - name: scenarios
    type: array
    required: false
    default: ["conservative", "moderate", "aggressive"]
    description: Growth scenarios to model
  - name: cost_per_hire
    type: number
    required: false
    default: 15000
    description: Average cost per new hire

steps:
  - id: calculate_baseline
    node: code_interpreter
    config:
      code: |
        import json

        depts = departments
        attrition = attrition_rate / 100
        cph = cost_per_hire

        total_current = sum(d.get("current_headcount", 0) for d in depts)
        total_approved = sum(d.get("approved_headcount", 0) for d in depts)
        projected_attrition = round(total_current * attrition)
        backfill_needed = total_approved - total_current + projected_attrition

        dept_baseline = []
        for d in depts:
            current = d.get("current_headcount", 0)
            approved = d.get("approved_headcount", 0)
            dept_attrition = round(current * attrition)
            dept_backfill = max(0, approved - current + dept_attrition)
            dept_baseline.append({
                "department": d.get("name", "Unknown"),
                "current": current,
                "approved": approved,
                "open_reqs": max(0, approved - current),
                "projected_attrition": dept_attrition,
                "backfill_needed": dept_backfill
            })

        baseline = {
            "total_current_headcount": total_current,
            "total_approved_headcount": total_approved,
            "current_openings": total_approved - total_current,
            "projected_attrition": projected_attrition,
            "total_backfill_needed": backfill_needed,
            "estimated_backfill_cost": round(backfill_needed * cph, 2),
            "department_baseline": dept_baseline
        }
        print(json.dumps(baseline, indent=2))
      inputs:
        departments: "{{ .params.departments }}"
        attrition_rate: "{{ .params.attrition_rate }}"
        cost_per_hire: "{{ .params.cost_per_hire }}"
      output: baseline

  - id: model_scenarios
    node: code_interpreter
    config:
      code: |
        import json

        base = baseline
        growth = growth_projections
        budget = budget_total
        scenario_list = scenarios
        cph = cost_per_hire

        scenario_results = {}
        multipliers = {
            "conservative": 0.5,
            "moderate": 1.0,
            "aggressive": 1.5
        }

        for scenario in scenario_list:
            mult = multipliers.get(scenario, 1.0)
            revenue_growth = growth.get("revenue_growth_pct", 10) * mult
            new_headcount = round(base["total_current_headcount"] * (revenue_growth / 100))

            total_new = new_headcount + base["total_backfill_needed"]
            total_cost = round(total_new * cph, 2)
            budget_remaining = round(budget - total_cost, 2)
            budget_utilization = round(total_cost / budget * 100, 1) if budget > 0 else 0

            # Department allocation
            dept_allocations = []
            for dept in base["department_baseline"]:
                dept_new = round(dept["current"] * (revenue_growth / 100) * (dept.get("growth_priority", 1) / 2))
                dept_total = dept["backfill_needed"] + dept_new
                dept_cost = round(dept_total * cph, 2)
                dept_allocations.append({
                    "department": dept["department"],
                    "backfill": dept["backfill_needed"],
                    "new_growth": dept_new,
                    "total_hires": dept_total,
                    "estimated_cost": dept_cost
                })

            scenario_results[scenario] = {
                "revenue_growth_assumption": round(revenue_growth, 1),
                "new_headcount_needed": new_headcount,
                "total_hires_needed": total_new,
                "total_cost": total_cost,
                "budget_remaining": budget_remaining,
                "budget_utilization": round(budget_utilization, 1),
                "over_budget": budget_remaining < 0,
                "department_allocations": dept_allocations
            }

        output = {"scenarios": scenario_results, "baseline": base}
        print(json.dumps(output, indent=2))
      inputs:
        baseline: "{{ .steps.calculate_baseline.output.baseline }}"
        growth_projections: "{{ .params.growth_projections }}"
        budget_total: "{{ .params.budget_total }}"
        scenarios: "{{ .params.scenarios }}"
        cost_per_hire: "{{ .params.cost_per_hire }}"
      output: scenario_models

  - id: generate_recommendation
    node: agent
    config:
      instruction: |
        Analyze the headcount scenarios and provide strategic recommendations.

        Planning period: {{ .params.planning_period }}
        Budget: ${{ .params.budget_total }}

        For each scenario, provide:
        1. Feasibility assessment
        2. Risks and trade-offs
        3. Hiring prioritization by department
        4. Timeline recommendations (which quarters to hire)

        Overall recommendations:
        1. Recommended scenario with justification
        2. Critical hires that must happen regardless of scenario
        3. Departments where hiring can be deferred
        4. Budget reallocation suggestions
        5. Contingency plans for under/over-performance

        Return recommendations as structured JSON.
      input:
        scenario_models: "{{ .steps.model_scenarios.output.scenario_models }}"
        planning_period: "{{ .params.planning_period }}"
        budget_total: "{{ .params.budget_total }}"
        departments: "{{ .params.departments }}"
      output: recommendations

  - id: save_plan
    node: file_write
    config:
      filename: "{{ .params.output_file | default \"headcount_plan.json\" }}"
      content: |
        {
          "planning_period": {{ .params.planning_period | toJson }},
          "budget": {{ .params.budget_total }},
          "baseline": {{ .steps.calculate_baseline.output.baseline | toJson }},
          "scenario_analysis": {{ .steps.model_scenarios.output.scenario_models | toJson }},
          "recommendations": {{ .steps.generate_recommendation.output.recommendations | toJson }}
        }
      format: json