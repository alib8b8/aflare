name: employee-handbook
description: Employee handbook generator with policy customization and compliance
params:
  - name: company_name
    type: string
    required: true
    description: Company legal name
  - name: company_info
    type: object
    required: true
    description: Company details (founded, industry, size, locations)
  - name: policies
    type: array
    required: true
    description: List of policy sections to include
  - name: jurisdiction
    type: object
    required: true
    description: Legal jurisdiction details (country, state, local laws)
  - name: employment_type
    type: string
    required: false
    default: "at-will"
    description: Employment type - at-will, contract, union
  - name: work_model
    type: string
    required: false
    default: "hybrid"
    description: Work model - office, remote, hybrid
  - name: company_culture
    type: string
    required: false
    default: ""
    description: Company culture and values description
  - name: custom_policies
    type: array
    required: false
    default: []
    description: Custom policy content to include

steps:
  - id: fetch_compliance_requirements
    node: http_request
    config:
      method: POST
      url: "{{ .params.compliance_api_url | default \"https://api.compliance.internal/requirements\" }}"
      headers:
        Authorization: "Bearer {{ .params.api_token }}"
        Content-Type: "application/json"
      body: |
        {
          "jurisdiction": {{ .params.jurisdiction | toJson }},
          "company_size": {{ .params.company_info.size }},
          "industry": "{{ .params.company_info.industry }}"
        }
      output: compliance_requirements

  - id: generate_handbook
    node: agent
    config:
      instruction: |
        Generate a comprehensive, legally-informed employee handbook for {{ .params.company_name }}.

        Company details:
        - Founded: {{ .params.company_info.founded }}
        - Industry: {{ .params.company_info.industry }}
        - Size: {{ .params.company_info.size }} employees
        - Locations: {{ .params.company_info.locations }}

        Employment type: {{ .params.employment_type }}
        Work model: {{ .params.work_model }}
        Jurisdiction: {{ .params.jurisdiction }}

        Required policy sections: {{ .params.policies }}

        Compliance requirements to incorporate: {{ .steps.fetch_compliance_requirements.output.compliance_requirements }}

        Include these sections (based on selected policies):
        1. **Welcome & Company Overview** - Mission, vision, values, culture: {{ .params.company_culture }}
        2. **Employment Basics** - At-will statement, equal opportunity, classifications
        3. **Compensation & Benefits** - Payroll, overtime, benefits overview
        4. **Time Off & Leave** - PTO, sick leave, parental leave, FMLA, holidays
        5. **Work Hours & Attendance** - Schedule, remote/hybrid policy, overtime
        6. **Code of Conduct** - Professional behavior, dress code, harassment policy
        7. **Technology & Data** - Acceptable use, data privacy, security, social media
        8. **Health & Safety** - Workplace safety, emergency procedures, workers comp
        9. **Performance & Development** - Reviews, promotions, training
        10. **Separation** - Resignation, termination, exit process, COBRA

        Append custom policies: {{ .params.custom_policies }}

        For each section:
        - Write in clear, employee-friendly language
        - Include legally required disclaimers and notices
        - Reference specific laws for the jurisdiction
        - Add acknowledgment section at the end

        Return as a complete, well-formatted markdown document.
      input:
        company_name: "{{ .params.company_name }}"
        company_info: "{{ .params.company_info }}"
        policies: "{{ .params.policies }}"
        jurisdiction: "{{ .params.jurisdiction }}"
        employment_type: "{{ .params.employment_type }}"
        work_model: "{{ .params.work_model }}"
        company_culture: "{{ .params.company_culture }}"
        custom_policies: "{{ .params.custom_policies }}"
        compliance_requirements: "{{ .steps.fetch_compliance_requirements.output.compliance_requirements }}"
      output: handbook_content

  - id: generate_table_of_contents
    node: code_interpreter
    config:
      code: |
        import json
        import re

        content = handbook_content
        lines = content.split('\n')
        toc = []
        for line in lines:
            match = re.match(r'^(#{1,3})\s+(.+)$', line)
            if match:
                level = len(match.group(1))
                title = match.group(2)
                anchor = title.lower().replace(' ', '-').replace('&', 'and').replace('/', '-')
                toc.append({"level": level, "title": title, "anchor": anchor})

        result = {
            "page_count_estimate": len(content) // 3000 + 1,
            "section_count": len([t for t in toc if t["level"] == 2]),
            "table_of_contents": toc
        }
        print(json.dumps(result, indent=2))
      inputs:
        handbook_content: "{{ .steps.generate_handbook.output.handbook_content }}"
      output: toc_data

  - id: compute_date
    node: code_interpreter
    config:
      code: |
        from datetime import date
        print(date.today().strftime('%B %d, %Y'))
      output: compute_date

  - id: save_handbook
    node: file_write
    config:
      filename: "{{ .params.output_file | default \"employee_handbook.md\" }}"
      content: |
        # {{ .params.company_name }} Employee Handbook

        **Last Updated:** {{ .compute_date }}
        **Version:** {{ .params.version | default "1.0" }}

        ---

        {{ range .steps.generate_table_of_contents.output.toc_data.table_of_contents }}
        {{ if eq .level 2 }}- [{{ .title }}](#{{ .anchor }})
        {{ end }}{{ end }}

        ---

        {{ .steps.generate_handbook.output.handbook_content }}

        ---

        ## Acknowledgment of Receipt

        I, \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_ (Employee Name), acknowledge that I have received a copy of the {{ .params.company_name }} Employee Handbook. I understand that it is my responsibility to read and comply with the policies contained in this handbook.

        **Signature:** \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_
        **Date:** \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_
      format: markdown