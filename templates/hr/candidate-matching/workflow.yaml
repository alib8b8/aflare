name: candidate-matching
description: Job-candidate matching and scoring with multi-dimensional fit analysis
params:
  - name: job_requisition
    type: object
    required: true
    description: Job requisition with title, requirements, skills, experience, location, salary range
  - name: candidate_pool
    type: array
    required: true
    description: Array of candidate profiles with structured data
  - name: match_threshold
    type: number
    required: false
    default: 60
    description: Minimum match score percentage to include in results
  - name: weights
    type: object
    required: false
    default:
      skills: 0.35
      experience: 0.25
      education: 0.15
      location: 0.10
      salary_fit: 0.15
    description: Weight distribution for scoring dimensions

steps:
  - id: normalize_profiles
    node: agent
    config:
      instruction: |
        Normalize all candidate profiles into a consistent structured format:
        - Extract and standardize skill names using a common taxonomy
        - Parse years of experience into a numeric field
        - Normalize education levels (Bachelor's, Master's, PhD, etc.)
        - Standardize location to city/state/country
        - Extract current and expected salary
        Return normalized profiles as JSON.
      input:
        candidates: "{{ .params.candidate_pool }}"
      output: normalized_candidates

  - id: compute_match_scores
    node: code_interpreter
    config:
      code: |
        import json

        def compute_skill_match(candidate_skills, required_skills, preferred_skills):
            required_match = len(set(s.lower() for s in candidate_skills) & set(s.lower() for s in required_skills)) / len(required_skills) if required_skills else 1.0
            preferred_match = len(set(s.lower() for s in candidate_skills) & set(s.lower() for s in preferred_skills)) / len(preferred_skills) if preferred_skills else 1.0
            return (required_match * 0.7 + preferred_match * 0.3) * 100

        def compute_experience_match(candidate_years, required_years, preferred_years):
            if candidate_years >= preferred_years:
                return 100
            elif candidate_years >= required_years:
                return 70 + (candidate_years - required_years) / max(preferred_years - required_years, 1) * 30
            else:
                return max(0, (candidate_years / required_years) * 70)

        def compute_education_match(candidate_edu, required_level):
            levels = {"high school": 1, "associate": 2, "bachelor": 3, "master": 4, "phd": 5}
            cand_level = levels.get(candidate_edu.lower(), 1)
            req_level = levels.get(required_level.lower(), 3)
            return min(100, (cand_level / req_level) * 100)

        def compute_location_match(candidate_loc, job_loc, remote):
            if remote and candidate_loc.lower() != job_loc.lower():
                return 70
            return 100 if candidate_loc.lower() == job_loc.lower() else 30

        def compute_salary_match(candidate_expected, salary_range):
            low, high = salary_range
            if candidate_expected < low:
                return 100
            elif candidate_expected <= high:
                return 100 - ((candidate_expected - low) / (high - low)) * 30
            else:
                return max(0, 100 - ((candidate_expected - high) / high) * 50)

        w = weights
        job = job_requisition
        results = []

        for c in normalized_candidates:
            scores = {
                "skills": compute_skill_match(c.get("skills", []), job.get("required_skills", []), job.get("preferred_skills", [])),
                "experience": compute_experience_match(c.get("years_of_experience", 0), job.get("min_experience", 0), job.get("preferred_experience", 5)),
                "education": compute_education_match(c.get("education_level", "bachelor"), job.get("required_education", "bachelor")),
                "location": compute_location_match(c.get("location", ""), job.get("location", ""), job.get("remote", False)),
                "salary_fit": compute_salary_match(c.get("expected_salary", 0), job.get("salary_range", [50000, 100000]))
            }
            overall = sum(scores[k] * w[k] for k in w)
            if overall >= match_threshold:
                results.append({
                    "candidate_id": c.get("id"),
                    "name": c.get("name"),
                    "overall_score": round(overall, 1),
                    "dimension_scores": {k: round(v, 1) for k, v in scores.items()},
                    "match_tier": "Excellent" if overall >= 85 else "Good" if overall >= 70 else "Adequate"
                })

        results.sort(key=lambda x: x["overall_score"], reverse=True)
        print(json.dumps(results, indent=2))
      inputs:
        normalized_candidates: "{{ .steps.normalize_profiles.output.normalized_candidates }}"
        job_requisition: "{{ .params.job_requisition }}"
        weights: "{{ .params.weights }}"
        match_threshold: "{{ .params.match_threshold }}"
      output: match_results

  - id: generate_insights
    node: agent
    config:
      instruction: |
        Analyze the match results and generate actionable insights:
        - Identify the strongest candidates and why they stand out
        - Highlight common skill gaps across the candidate pool
        - Suggest whether the job requirements should be adjusted based on market availability
        - Provide a talent pool quality assessment (Strong / Moderate / Weak)
        Return insights as structured JSON.
      input:
        match_results: "{{ .steps.compute_match_scores.output.match_results }}"
        job_requisition: "{{ .params.job_requisition }}"
      output: insights

  - id: save_results
    node: file_write
    config:
      filename: "{{ .params.output_file | default \"candidate_matching_report.json\" }}"
      content: |
        {
          "job_requisition": {{ .params.job_requisition | toJson }},
          "match_results": {{ .steps.compute_match_scores.output.match_results | toJson }},
          "insights": {{ .steps.generate_insights.output.insights | toJson }},
          "metadata": {
            "total_candidates": {{ len .params.candidate_pool }},
            "matched_candidates": {{ len .steps.compute_match_scores.output.match_results }},
            "match_threshold": {{ .params.match_threshold }}
          }
        }
      format: json