name: job-posting
description: AI-powered job posting and description generator with SEO optimization
params:
  - name: job_title
    type: string
    required: true
    description: Job title
  - name: department
    type: string
    required: true
    description: Department name
  - name: location
    type: string
    required: true
    description: Job location (city, remote, hybrid)
  - name: employment_type
    type: string
    required: true
    description: Full-time, Part-time, Contract, Internship
  - name: seniority_level
    type: string
    required: true
    description: Entry, Mid, Senior, Lead, Director, Executive
  - name: key_responsibilities
    type: array
    required: true
    description: Key responsibilities for the role
  - name: required_qualifications
    type: array
    required: true
    description: Required qualifications and skills
  - name: preferred_qualifications
    type: array
    required: false
    default: []
    description: Preferred but not required qualifications
  - name: compensation_range
    type: object
    required: false
    default: {}
    description: Salary range and benefits summary
  - name: company_overview
    type: string
    required: true
    description: Company description and culture
  - name: target_platforms
    type: array
    required: false
    default: ["linkedin", "indeed", "company_careers"]
    description: Platforms to optimize for

steps:
  - id: generate_description
    node: agent
    config:
      instruction: |
        Create a compelling and inclusive job posting for {{ .params.job_title }}.

        Write in a tone appropriate for {{ .params.seniority_level }} level.
        Department: {{ .params.department }}
        Location: {{ .params.location }}
        Type: {{ .params.employment_type }}

        Include these sections:
        1. **About the Role** - Engaging overview of the position and team
        2. **What You'll Do** - Key responsibilities in bullet format from: {{ .params.key_responsibilities }}
        3. **What You'll Bring** - Required qualifications from: {{ .params.required_qualifications }}
        4. **Nice to Have** - Preferred qualifications from: {{ .params.preferred_qualifications }}
        5. **Compensation & Benefits** - From: {{ .params.compensation_range }}
        6. **About Us** - Company overview: {{ .params.company_overview }}
        7. **Our Commitment to Diversity** - Inclusive language statement
        8. **How to Apply** - Application instructions

        Ensure the posting is:
        - Free of biased language (gender, age, ethnicity)
        - Uses inclusive pronouns
        - Clear about requirements vs preferences
        - Engaging and authentic to the company culture
        - Optimized for search visibility

        Return the full job posting as formatted markdown.
      input:
        job_title: "{{ .params.job_title }}"
        department: "{{ .params.department }}"
        location: "{{ .params.location }}"
        employment_type: "{{ .params.employment_type }}"
        seniority_level: "{{ .params.seniority_level }}"
        key_responsibilities: "{{ .params.key_responsibilities }}"
        required_qualifications: "{{ .params.required_qualifications }}"
        preferred_qualifications: "{{ .params.preferred_qualifications }}"
        compensation_range: "{{ .params.compensation_range }}"
        company_overview: "{{ .params.company_overview }}"
      output: job_posting_content

  - id: optimize_for_platforms
    node: agent
    config:
      instruction: |
        Adapt the job posting for each target platform: {{ .params.target_platforms }}

        For each platform, apply platform-specific optimizations:
        - **LinkedIn**: Add relevant hashtags, ensure first 3 lines are compelling (preview), include skills tags
        - **Indeed**: Optimize title for search, add salary information prominently, use Indeed-friendly formatting
        - **Company Careers Page**: Full-format with rich formatting, add team photos placeholder, include employee testimonials section
        - **Glassdoor**: Include employer value proposition, highlight culture
        - **Remote Job Boards**: Emphasize remote tools, async communication, timezone requirements

        For each platform, return the optimized posting text.
      input:
        job_posting: "{{ .steps.generate_description.output.job_posting_content }}"
        target_platforms: "{{ .params.target_platforms }}"
        job_title: "{{ .params.job_title }}"
      output: platform_variants

  - id: generate_meta
    node: code_interpreter
    config:
      code: |
        import json
        from datetime import date

        title = job_title
        department = dept
        location = loc

        meta = {
            "seo_title": f"{title} - {department} | {location}",
            "meta_description": f"Join our team as a {title} in {department}. {location}. Apply now!",
            "url_slug": title.lower().replace(" ", "-").replace("/", "-"),
            "schema_markup": {
                "@context": "https://schema.org",
                "@type": "JobPosting",
                "title": title,
                "industry": department,
                "jobLocation": {"@type": "Place", "address": location},
                "datePosted": date.today().isoformat()
            },
            "keywords": [title.lower(), department.lower(), location.lower(), "jobs", "careers", "hiring"],
            "social_share_text": f"We're hiring! Join us as a {title} in {department}. {location}. #hiring #jobs #careers"
        }
        print(json.dumps(meta, indent=2))
      inputs:
        job_title: "{{ .params.job_title }}"
        dept: "{{ .params.department }}"
        loc: "{{ .params.location }}"
      output: meta_data

  - id: publish_to_ats
    node: http_request
    config:
      method: POST
      url: "{{ .params.ats_api_url | default \"https://api.ats.internal/jobs\" }}"
      headers:
        Authorization: "Bearer {{ .params.api_token }}"
        Content-Type: "application/json"
      body: |
        {
          "title": "{{ .params.job_title }}",
          "department": "{{ .params.department }}",
          "location": "{{ .params.location }}",
          "type": "{{ .params.employment_type }}",
          "posting": "{{ .steps.generate_description.output.job_posting_content }}",
          "platform_variants": {{ .steps.optimize_for_platforms.output.platform_variants | toJson }},
          "meta": {{ .steps.generate_meta.output.meta_data | toJson }}
        }
      output: publication_result

  - id: generate_filename
    node: code_interpreter
    config:
      code: |
        title = "{{ .params.job_title }}"
        output = "{{ .params.output_file }}" or f"job_posting_{title.replace(' ', '_').lower()}.md"
        print(output)
      output: filename

  - id: format_platform_keys
    node: code_interpreter
    config:
      code: |
        import json
        data = json.loads("{{ .steps.optimize_for_platforms.output.platform_variants | toJson }}")
        formatted = {}
        for key, value in data.items():
            formatted[key.title()] = value
        print(json.dumps(formatted))
      output: formatted_variants

  - id: save_posting
    node: file_write
    config:
      filename: "{{ .steps.generate_filename.output.filename }}"
      content: |
        # {{ .params.job_title }} - {{ .params.department }}

        {{ .steps.generate_description.output.job_posting_content }}

        ---
        ## Platform Variants
        {{ range $platform, $content := .steps.format_platform_keys.output.formatted_variants }}
        ### {{ $platform }}
        {{ $content }}
        {{ end }}
      format: markdown