name: talent-pipeline
description: Talent pipeline and recruitment funnel analytics workflow
params:
  - name: pipeline_data
    type: object
    required: true
    description: Recruitment funnel data by stage
  - name: time_period
    type: object
    required: true
    description: Analysis time period
  - name: roles
    type: array
    required: true
    description: List of roles being recruited for
  - name: source_channels
    type: array
    required: false
    default: []
    description: Recruitment source channels
  - name: target_fill_days
    type: integer
    required: false
    default: 45
    description: Target time-to-fill in days
  - name: cost_per_stage
    type: object
    required: false
    default: {}
    description: Cost data per recruitment stage

steps:
  - id: compute_funnel_metrics
    node: code_interpreter
    params:
      code: |
        import json

        pipeline = pipeline_data
        stages = ["sourced", "applied", "screened", "phone_interview", "onsite", "offer", "accepted", "hired"]
        stage_names = ["Sourced", "Applied", "Screened", "Phone Screen", "Onsite", "Offer", "Accepted", "Hired"]

        funnel = {}
        for i, stage in enumerate(stages):
            count = pipeline.get(stage, 0)
            prev_count = pipeline.get(stages[i-1], count) if i > 0 else count
            conversion = round(count / prev_count * 100, 1) if prev_count > 0 else 0
            funnel[stage] = {
                "name": stage_names[i],
                "count": count,
                "conversion_from_previous": conversion,
                "cumulative_conversion": round(count / pipeline.get("sourced", count) * 100, 1) if pipeline.get("sourced", 0) > 0 else 0
            }

        # Time metrics
        avg_time_to_fill = pipeline.get("avg_time_to_fill_days", 0)
        avg_time_in_stage = pipeline.get("time_in_stage", {})

        # Source effectiveness
        source_data = pipeline.get("source_breakdown", {})
        source_effectiveness = {}
        for source, counts in source_data.items():
            hired = counts.get("hired", 0)
            total = counts.get("applied", 0)
            source_effectiveness[source] = {
                "applied": total,
                "hired": hired,
                "conversion_rate": round(hired / total * 100, 1) if total > 0 else 0,
                "cost_per_hire": round(counts.get("total_cost", 0) / hired, 2) if hired > 0 else 0
            }

        output = {
            "funnel": funnel,
            "time_metrics": {
                "avg_time_to_fill": avg_time_to_fill,
                "vs_target": round(avg_time_to_fill - target_fill_days, 1),
                "on_track": avg_time_to_fill <= target_fill_days,
                "time_in_stage": avg_time_in_stage
            },
            "source_effectiveness": source_effectiveness,
            "overall_conversion": round(pipeline.get("hired", 0) / pipeline.get("sourced", 1) * 100, 1),
            "total_cost": pipeline.get("total_recruitment_cost", 0),
            "cost_per_hire": round(pipeline.get("total_recruitment_cost", 0) / pipeline.get("hired", 1), 2) if pipeline.get("hired", 0) > 0 else 0
        }
        print(json.dumps(output, indent=2))
      inputs:
        pipeline_data: "{{ .params.pipeline_data }}"
        target_fill_days: "{{ .params.target_fill_days }}"
      output: funnel_metrics

  - id: identify_bottlenecks
    node: agent
    params:
      instruction: |
        Analyze the recruitment funnel and identify bottlenecks and optimization opportunities.

        Examine:
        1. **Stage Drop-off Analysis**: Stages with highest candidate drop-off
        2. **Time Bottlenecks**: Stages where candidates spend too much time
        3. **Source Quality**: Which channels produce the best candidates
        4. **Role-specific Patterns**: Variations by role: {{ .params.roles }}
        5. **Interviewer Impact**: If available, which interviewers have highest pass-through
        6. **Offer Decline Reasons**: Why candidates decline offers

        For each bottleneck, provide:
        - Root cause hypothesis
        - Impact quantification (candidates lost, time wasted)
        - Recommended intervention
        - Expected improvement

        Return analysis as structured JSON.
      input:
        funnel_metrics: "{{ .steps.compute_funnel_metrics.output.funnel_metrics }}"
        pipeline_data: "{{ .params.pipeline_data }}"
        roles: "{{ .params.roles }}"
        source_channels: "{{ .params.source_channels }}"
      output: bottleneck_analysis

  - id: generate_forecast
    node: code_interpreter
    params:
      code: |
        import json

        funnel = funnel_metrics
        pipeline = pipeline_data
        roles = roles_list

        # Current pipeline forecast
        current_pipeline = pipeline.get("active_candidates", {})
        historical_conversion = funnel.get("funnel", {})
        accepted_rate = historical_conversion.get("accepted", {}).get("conversion_from_previous", 80) / 100
        offer_rate = historical_conversion.get("offer", {}).get("conversion_from_previous", 50) / 100

        forecasts = []
        for role in roles:
            role_name = role.get("title", "Unknown")
            open_reqs = role.get("open_positions", 0)
            current_stage = current_pipeline.get(role_name, {})

            # Estimate hires from current pipeline
            estimated_hires = 0
            for stage, count in current_stage.items():
                if stage == "offer":
                    estimated_hires += count * accepted_rate
                elif stage == "onsite":
                    estimated_hires += count * offer_rate * accepted_rate
                elif stage == "phone_interview":
                    estimated_hires += count * 0.4 * offer_rate * accepted_rate

            remaining_needed = max(0, open_reqs - estimated_hires)
            top_of_funnel_needed = round(remaining_needed / (funnel["overall_conversion"] / 100)) if funnel["overall_conversion"] > 0 else 0

            forecasts.append({
                "role": role_name,
                "open_positions": open_reqs,
                "pipeline_candidates": sum(current_stage.values()),
                "estimated_hires_from_pipeline": round(estimated_hires, 1),
                "remaining_to_fill": remaining_needed,
                "additional_sourcing_needed": top_of_funnel_needed
            })

        output = {
            "role_forecasts": forecasts,
            "total_open_positions": sum(r.get("open_positions", 0) for r in roles),
            "total_pipeline_hires_expected": round(sum(f["estimated_hires_from_pipeline"] for f in forecasts), 1),
            "total_additional_sourcing": sum(f["additional_sourcing_needed"] for f in forecasts)
        }
        print(json.dumps(output, indent=2))
      inputs:
        funnel_metrics: "{{ .steps.compute_funnel_metrics.output.funnel_metrics }}"
        pipeline_data: "{{ .params.pipeline_data }}"
        roles_list: "{{ .params.roles }}"
      output: forecast

  - id: save_report
    node: file_write
    params:
      filename: "{{ .params.output_file | default \"talent_pipeline_report.json\" }}"
      content: |
        {
          "time_period": {{ .params.time_period | toJson }},
          "funnel_metrics": {{ .steps.compute_funnel_metrics.output.funnel_metrics | toJson }},
          "bottleneck_analysis": {{ .steps.identify_bottlenecks.output.bottleneck_analysis | toJson }},
          "hiring_forecast": {{ .steps.generate_forecast.output.forecast | toJson }}
        }
      format: json