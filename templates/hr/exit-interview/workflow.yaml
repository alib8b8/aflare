name: exit-interview
description: Exit interview analysis and insights generation workflow
params:
  - name: exit_interviews
    type: array
    required: true
    description: Collection of exit interview data
  - name: analysis_period
    type: object
    required: true
    description: Date range for analysis
  - name: department_filter
    type: string
    required: false
    default: ""
    description: Filter to specific department (empty = all)
  - name: include_historical
    type: boolean
    required: false
    default: true
    description: Include historical data for trend analysis
  - name: min_tenure_months
    type: integer
    required: false
    default: 0
    description: Minimum tenure for inclusion
  - name: trigger_alerts
    type: boolean
    required: false
    default: true
    description: Whether to trigger alerts for concerning patterns

steps:
  - id: preprocess_data
    node: code_interpreter
    config:
      code: |
        import json
        from datetime import datetime

        interviews = exit_interviews
        dept_filter = department_filter
        min_tenure = min_tenure_months
        start_date = analysis_period.get("start", "2000-01-01")
        end_date = analysis_period.get("end", "2099-12-31")

        filtered = []
        for interview in interviews:
            exit_date = interview.get("exit_date", "")
            dept = interview.get("department", "")
            tenure = interview.get("tenure_months", 0)

            if start_date <= exit_date <= end_date:
                if not dept_filter or dept == dept_filter:
                    if tenure >= min_tenure:
                        filtered.append(interview)

        # Basic stats
        total = len(filtered)
        voluntary = len([i for i in filtered if i.get("exit_type") == "voluntary"])
        involuntary = len([i for i in filtered if i.get("exit_type") == "involuntary"])
        avg_tenure = round(sum(i.get("tenure_months", 0) for i in filtered) / total, 1) if total > 0 else 0

        # Department breakdown
        dept_counts = {}
        for i in filtered:
            d = i.get("department", "Unknown")
            dept_counts[d] = dept_counts.get(d, 0) + 1

        result = {
            "filtered_interviews": filtered,
            "summary": {
                "total_exits": total,
                "voluntary": voluntary,
                "involuntary": involuntary,
                "voluntary_rate": round(voluntary / total * 100, 1) if total > 0 else 0,
                "average_tenure": avg_tenure,
                "by_department": dept_counts
            }
        }
        print(json.dumps(result, indent=2))
      inputs:
        exit_interviews: "{{ .params.exit_interviews }}"
        analysis_period: "{{ .params.analysis_period }}"
        department_filter: "{{ .params.department_filter }}"
        min_tenure_months: "{{ .params.min_tenure_months }}"
      output: preprocessed_data

  - id: analyze_themes
    node: agent
    config:
      instruction: |
        Analyze the exit interview data to identify patterns and themes.

        For each interview, extract and categorize:
        1. Primary reason for leaving (compensation, growth, management, culture, work-life balance, relocation, career change, other)
        2. Secondary contributing factors
        3. Sentiment toward: company, manager, team, work, compensation, benefits
        4. Whether the employee would recommend the company (eNPS proxy)
        5. Key quotes that illustrate the employee's experience

        Aggregate analysis:
        1. Top 5 reasons for voluntary turnover
        2. Theme frequency and correlation
        3. Sentiment scores by department
        4. Manager-related themes (identify problematic patterns)
        5. Compensation-related themes
        6. Early tenure (<12 months) vs long tenure patterns

        Return comprehensive analysis as structured JSON.
      input:
        interviews: "{{ .steps.preprocess_data.output.preprocessed_data.filtered_interviews }}"
        summary: "{{ .steps.preprocess_data.output.preprocessed_data.summary }}"
      output: theme_analysis

  - id: generate_insights
    node: agent
    config:
      instruction: |
        Generate actionable insights and recommendations from the exit interview analysis.

        Include:
        1. **Executive Summary**: Key findings in 3-5 bullet points
        2. **Turnover Trends**: Current vs historical patterns
        3. **Risk Areas**: Departments or roles with elevated turnover
        4. **Root Cause Analysis**: Deep dive into top reasons
        5. **Retention Recommendations**: Specific, actionable strategies
           - Compensation adjustments
           - Career path improvements
           - Management training needs
           - Culture initiatives
           - Policy changes
        6. **Early Warning Indicators**: Signals to monitor for future retention
        7. **Predicted Impact**: Estimated cost savings from implementing recommendations
        8. **Alert Triggers**: If enabled, flag concerning patterns requiring immediate attention

        Trigger alerts: {{ .params.trigger_alerts }}
        Return as structured JSON.
      input:
        theme_analysis: "{{ .steps.analyze_themes.output.theme_analysis }}"
        summary: "{{ .steps.preprocess_data.output.preprocessed_data.summary }}"
        trigger_alerts: "{{ .params.trigger_alerts }}"
        include_historical: "{{ .params.include_historical }}"
      output: insights

  - id: notify_stakeholders
    node: notify
    config:
      channel: "{{ .params.notification_channel | default \"email\" }}"
      recipients: "{{ .params.notification_recipients | default \"hr-leadership@company.com\" }}"
      subject: "Exit Interview Analysis: {{ .params.analysis_period.start }} - {{ .params.analysis_period.end }}"
      body: |
        Exit Interview Analysis Complete

        Period: {{ .params.analysis_period.start }} to {{ .params.analysis_period.end }}
        Total Exits: {{ .steps.preprocess_data.output.preprocessed_data.summary.total_exits }}
        Voluntary Rate: {{ .steps.preprocess_data.output.preprocessed_data.summary.voluntary_rate }}%

        Top Reasons: {{ index .steps.analyze_themes.output.theme_analysis.top_reasons 0 }}, {{ index .steps.analyze_themes.output.theme_analysis.top_reasons 1 }}, {{ index .steps.analyze_themes.output.theme_analysis.top_reasons 2 }}

        {{ if .params.trigger_alerts }}
        {{ range .steps.generate_insights.output.insights.alerts }}
        🚨 ALERT: {{ . }}
        {{ end }}
        {{ end }}

        Full report: {{ .params.output_file | default \"exit_interview_report.json\" }}

  - id: compute_timestamp
    node: code_interpreter
    config:
      code: |
        from datetime import datetime, timezone
        print(datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'))
      output: compute_timestamp

  - id: save_report
    node: file_write
    config:
      filename: "{{ .params.output_file | default \"exit_interview_report.json\" }}"
      content: |
        {
          "metadata": {
            "period": {{ .params.analysis_period | toJson }},
            "department_filter": "{{ .params.department_filter }}",
            "generated_at": "{{ .compute_timestamp }}"
          },
          "summary": {{ .steps.preprocess_data.output.preprocessed_data.summary | toJson }},
          "theme_analysis": {{ .steps.analyze_themes.output.theme_analysis | toJson }},
          "insights": {{ .steps.generate_insights.output.insights | toJson }}
        }
      format: json