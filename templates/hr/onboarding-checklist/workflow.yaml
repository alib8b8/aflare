name: onboarding-checklist
description: New hire onboarding checklist generator with role-based customization
params:
  - name: employee_name
    type: string
    required: true
    description: New hire full name
  - name: job_title
    type: string
    required: true
    description: Job title
  - name: department
    type: string
    required: true
    description: Department name
  - name: start_date
    type: string
    required: true
    description: Start date (YYYY-MM-DD)
  - name: manager_name
    type: string
    required: true
    description: Reporting manager name
  - name: role_type
    type: string
    required: false
    default: "office"
    description: Role type - office, remote, hybrid, contractor
  - name: seniority_level
    type: string
    required: false
    default: "mid"
    description: Seniority - entry, mid, senior, executive
  - name: it_requirements
    type: array
    required: false
    default: []
    description: Specific IT access and equipment needed
  - name: compliance_required
    type: array
    required: false
    default: []
    description: Compliance training requirements
  - name: start_week
    type: integer
    required: false
    default: 1
    description: Week number for checklist (1-4)

steps:
  - id: generate_checklist
    type: agent
    config:
      instruction: |
        Generate a comprehensive new hire onboarding checklist organized by:
        - Pre-boarding (before start date)
        - Day 1 activities
        - Week 1 activities
        - Week 2-4 activities
        - 30/60/90 day milestones

        Tailor the checklist based on:
        - Role type ({{ .params.role_type }}): Include remote setup items for remote/hybrid
        - Seniority level ({{ .params.seniority_level }}): Add executive briefings for executive level
        - Department: {{ .params.department }}: Include department-specific tools and training
        - IT requirements: {{ .params.it_requirements }}
        - Compliance: {{ .params.compliance_required }}

        Each checklist item should have:
        - Task description
        - Owner (HR, IT, Manager, Employee)
        - Priority (Critical, High, Medium)
        - Category (IT Setup, HR/Admin, Team, Training, Compliance)
        - Estimated duration
        - Dependencies (if any)

        Return as structured JSON.
      input:
        employee_name: "{{ .params.employee_name }}"
        job_title: "{{ .params.job_title }}"
        department: "{{ .params.department }}"
        start_date: "{{ .params.start_date }}"
        manager_name: "{{ .params.manager_name }}"
        role_type: "{{ .params.role_type }}"
        seniority_level: "{{ .params.seniority_level }}"
        it_requirements: "{{ .params.it_requirements }}"
        compliance_required: "{{ .params.compliance_required }}"
      output: checklist_data

  - id: calculate_timeline
    type: code_interpreter
    config:
      code: |
        import json
        from datetime import datetime, timedelta

        start = datetime.strptime(start_date, "%Y-%m-%d")
        timeline = {
            "pre_boarding_deadline": (start - timedelta(days=5)).strftime("%Y-%m-%d"),
            "day_1": start.strftime("%Y-%m-%d"),
            "week_1_end": (start + timedelta(days=7)).strftime("%Y-%m-%d"),
            "week_2_end": (start + timedelta(days=14)).strftime("%Y-%m-%d"),
            "week_4_end": (start + timedelta(days=28)).strftime("%Y-%m-%d"),
            "day_30": (start + timedelta(days=30)).strftime("%Y-%m-%d"),
            "day_60": (start + timedelta(days=60)).strftime("%Y-%m-%d"),
            "day_90": (start + timedelta(days=90)).strftime("%Y-%m-%d")
        }

        checklist = checklist_data
        total_items = 0
        by_category = {}
        by_owner = {}
        for phase, items in checklist.items():
            if isinstance(items, list):
                total_items += len(items)
                for item in items:
                    cat = item.get("category", "Other")
                    by_category[cat] = by_category.get(cat, 0) + 1
                    owner = item.get("owner", "Unassigned")
                    by_owner[owner] = by_owner.get(owner, 0) + 1

        result = {
            "timeline": timeline,
            "checklist": checklist,
            "summary": {
                "total_items": total_items,
                "by_category": by_category,
                "by_owner": by_owner
            }
        }
        print(json.dumps(result, indent=2))
      inputs:
        start_date: "{{ .params.start_date }}"
        checklist_data: "{{ .steps.generate_checklist.output.checklist_data }}"
      output: complete_checklist

  - id: assign_initial_tasks
    type: http_request
    config:
      method: POST
      url: "{{ .params.task_api_url | default \"https://api.tasks.internal/onboarding/create\" }}"
      headers:
        Authorization: "Bearer {{ .params.api_token }}"
        Content-Type: "application/json"
      body: |
        {
          "employee_name": "{{ .params.employee_name }}",
          "start_date": "{{ .params.start_date }}",
          "manager": "{{ .params.manager_name }}",
          "pre_boarding_tasks": {{ index .steps.generate_checklist.output.checklist_data "pre_boarding" | toJson }}
        }
      output: task_creation_result

  - id: save_checklist
    type: file_write
    config:
      filename: "{{ .params.output_file | default (printf \"onboarding_%s.md\" .params.employee_name | replace \" \" \"_\") }}"
      content: |
        # Onboarding Checklist: {{ .params.employee_name }}
        **Role:** {{ .params.job_title }} | **Department:** {{ .params.department }} | **Start:** {{ .params.start_date }}
        **Manager:** {{ .params.manager_name }} | **Type:** {{ .params.role_type }}

        ## Timeline
        | Milestone | Date |
        |-----------|------|
        | Pre-boarding Deadline | {{ .steps.calculate_timeline.output.complete_checklist.timeline.pre_boarding_deadline }} |
        | Day 1 | {{ .steps.calculate_timeline.output.complete_checklist.timeline.day_1 }} |
        | Week 1 Review | {{ .steps.calculate_timeline.output.complete_checklist.timeline.week_1_end }} |
        | 30-Day Check-in | {{ .steps.calculate_timeline.output.complete_checklist.timeline.day_30 }} |
        | 60-Day Check-in | {{ .steps.calculate_timeline.output.complete_checklist.timeline.day_60 }} |
        | 90-Day Review | {{ .steps.calculate_timeline.output.complete_checklist.timeline.day_90 }} |

        ## Summary
        - **Total Items:** {{ .steps.calculate_timeline.output.complete_checklist.summary.total_items }}
        - **By Category:** {{ .steps.calculate_timeline.output.complete_checklist.summary.by_category | toJson }}
        - **By Owner:** {{ .steps.calculate_timeline.output.complete_checklist.summary.by_owner | toJson }}

        {{ range $phase, $items := .steps.generate_checklist.output.checklist_data }}
        ## {{ $phase | replace "_" " " | title }}
        {{ range $items }}
        - [ ] **{{ .task }}** | Owner: {{ .owner }} | Priority: {{ .priority }} | Category: {{ .category }} | Est: {{ .estimated_duration }}
        {{ end }}
        {{ end }}
      format: markdown