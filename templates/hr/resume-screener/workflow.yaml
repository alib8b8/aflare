name: resume-screener
description: AI-powered resume screening and ranking workflow
params:
  - name: job_description
    type: string
    required: true
    description: Full job description text
  - name: resumes
    type: array
    required: true
    description: List of resume objects with candidate names and text
  - name: top_n
    type: integer
    required: false
    default: 10
    description: Number of top candidates to return
  - name: required_skills
    type: array
    required: false
    default: []
    description: List of mandatory skills to filter by
  - name: min_experience_years
    type: integer
    required: false
    default: 0
    description: Minimum years of experience required

steps:
  - id: parse_resumes
    node: agent
    params:
      instruction: |
        Parse and extract structured information from each resume:
        - Full name, email, phone, location
        - Years of experience (total)
        - Education (degree, institution, year)
        - Skills (technical and soft skills)
        - Work history (company, title, duration, key achievements)
        - Certifications
        Return the data as a structured JSON array.
      input:
        resumes: "{{ .params.resumes }}"
      output: parsed_resumes

  - id: filter_by_requirements
    node: transform
    params:
      code: |
        function filterCandidates(parsed, requiredSkills, minYears) {
          let filtered = parsed;
          if (requiredSkills && requiredSkills.length > 0) {
            filtered = filtered.filter(c => {
              const candidateSkills = (c.skills || []).map(s => s.toLowerCase());
              return requiredSkills.every(rs => candidateSkills.includes(rs.toLowerCase()));
            });
          }
          if (minYears > 0) {
            filtered = filtered.filter(c => (c.years_of_experience || 0) >= minYears);
          }
          return filtered;
        }
        return filterCandidates(parsed_resumes, required_skills, min_experience_years);
      inputs:
        parsed_resumes: "{{ .steps.parse_resumes.output.parsed_resumes }}"
        required_skills: "{{ .params.required_skills }}"
        min_experience_years: "{{ .params.min_experience_years }}"
      output: filtered_resumes

  - id: score_and_rank
    node: agent
    params:
      instruction: |
        You are an expert recruiter. Score each candidate against the job description on a scale of 0-100.
        Consider: skill match, experience relevance, education fit, industry background, career progression.
        Rank candidates by overall score. For each candidate, provide:
        - overall_score: numeric 0-100
        - skill_match_score: numeric 0-100
        - experience_score: numeric 0-100
        - education_fit: "High" / "Medium" / "Low"
        - strengths: list of key strengths for this role
        - gaps: list of gaps or concerns
        - recommendation: "Strongly Recommend" / "Recommend" / "Consider" / "Not Recommended"
        Return the ranked list as JSON.
      input:
        job_description: "{{ .params.job_description }}"
        candidates: "{{ .steps.filter_by_requirements.output.filtered_resumes }}"
      output: ranked_results

  - id: generate_report
    node: code_interpreter
    params:
      code: |
        import json

        ranked = ranked_results
        top_n = min(top_n, len(ranked)) if ranked else 0

        # Build summary statistics
        scores = [c['overall_score'] for c in ranked[:top_n]]
        avg_score = sum(scores) / len(scores) if scores else 0

        report = {
            "pipeline_summary": {
                "total_resumes": len(resumes_input),
                "passed_filter": len(filtered_resumes),
                "ranked_candidates": len(ranked),
                "top_n": top_n,
                "average_top_score": round(avg_score, 1)
            },
            "top_candidates": ranked[:top_n],
            "score_distribution": {
                "strongly_recommend": len([c for c in ranked[:top_n] if c['recommendation'] == 'Strongly Recommend']),
                "recommend": len([c for c in ranked[:top_n] if c['recommendation'] == 'Recommend']),
                "consider": len([c for c in ranked[:top_n] if c['recommendation'] == 'Consider']),
                "not_recommended": len([c for c in ranked[:top_n] if c['recommendation'] == 'Not Recommended'])
            }
        }
        print(json.dumps(report, indent=2))
      inputs:
        ranked_results: "{{ .steps.score_and_rank.output.ranked_results }}"
        filtered_resumes: "{{ .steps.filter_by_requirements.output.filtered_resumes }}"
        resumes_input: "{{ .params.resumes }}"
        top_n: "{{ .params.top_n }}"
      output: final_report

  - id: save_results
    node: file_write
    params:
      filename: "{{ .params.output_file | default \"resume_screening_report.json\" }}"
      content: "{{ .steps.generate_report.output.final_report }}"
      format: json