name: org-chart
description: Organizational chart generator with reporting hierarchy and team analytics
input_schema:
  - name: organization_name
    type: string
    required: true
    description: Organization or company name
  - name: employees
    type: array
    required: true
    description: Employee data with reporting relationships
  - name: chart_format
    type: string
    required: false
    default: "mermaid"
    description: Output format - mermaid, plantuml, json, dot
  - name: include_vacant
    type: boolean
    required: false
    default: true
    description: Show vacant positions
  - name: color_by
    type: string
    required: false
    default: "department"
    description: Color coding - department, level, location, tenure
  - name: max_depth
    type: integer
    required: false
    default: 10
    description: Maximum hierarchy depth to display
  - name: group_by
    type: string
    required: false
    default: "department"
    description: Grouping strategy - department, function, location

steps:
  - id: build_hierarchy
    node: code_interpreter
    params:
      code: |
        import json

        employees = employee_data
        max_depth = max_depth_val

        # Build lookup
        emp_map = {}
        for e in employees:
            emp_map[e.get("id")] = {
                "id": e.get("id"),
                "name": e.get("name"),
                "title": e.get("title"),
                "department": e.get("department"),
                "level": e.get("level", 0),
                "location": e.get("location", ""),
                "tenure_years": e.get("tenure_years", 0),
                "manager_id": e.get("manager_id"),
                "is_vacant": e.get("is_vacant", False),
                "direct_reports": []
            }

        # Build tree
        roots = []
        for e in employees:
            eid = e.get("id")
            mgr_id = e.get("manager_id")
            if mgr_id and mgr_id in emp_map:
                emp_map[mgr_id]["direct_reports"].append(eid)
            elif not mgr_id or mgr_id not in emp_map:
                roots.append(eid)

        # Compute stats
        def compute_stats(node_id, depth=0):
            if depth > max_depth:
                return {"count": 0, "max_depth": depth}
            node = emp_map.get(node_id, {})
            total = 1
            max_d = depth
            for child_id in node.get("direct_reports", []):
                sub = compute_stats(child_id, depth + 1)
                total += sub["count"]
                max_d = max(max_d, sub["max_depth"])
            return {"count": total, "max_depth": max_d}

        hierarchy = {
            "roots": roots,
            "employee_map": emp_map,
            "total_employees": len(employees),
            "org_depth": max(compute_stats(r)["max_depth"] for r in roots) if roots else 0,
            "span_of_control": {}
        }

        for eid, node in emp_map.items():
            dr_count = len(node["direct_reports"])
            hierarchy["span_of_control"][eid] = dr_count

        avg_span = sum(hierarchy["span_of_control"].values()) / len(hierarchy["span_of_control"]) if hierarchy["span_of_control"] else 0
        hierarchy["avg_span_of_control"] = round(avg_span, 1)

        print(json.dumps(hierarchy, indent=2))
      inputs:
        employee_data: "{{ .params.employees }}"
        max_depth_val: "{{ .params.max_depth }}"
      output: hierarchy_data

  - id: generate_chart
    node: code_interpreter
    params:
      code: |
        import json

        hierarchy = hierarchy_data
        fmt = chart_format
        color_field = color_by
        group_field = group_by

        color_map = {
            "department": {},
            "level": {0: "#e8f5e9", 1: "#c8e6c9", 2: "#a5d6a7", 3: "#81c784", 4: "#66bb6a", 5: "#4caf50"},
            "location": {},
            "tenure": {}
        }

        def get_color(emp):
            field_val = emp.get(color_field, "")
            if color_field == "level":
                return color_map["level"].get(field_val, "#e0e0e0")
            if field_val not in color_map.get(color_field, {}):
                colors = ["#bbdefb", "#c5cae9", "#f8bbd0", "#c8e6c9", "#fff9c4", "#ffccbc", "#d1c4e9", "#b2dfdb"]
                idx = len(color_map[color_field])
                color_map[color_field][field_val] = colors[idx % len(colors)]
            return color_map[color_field].get(field_val, "#e0e0e0")

        if fmt == "mermaid":
            lines = ["graph TD"]
            lines.append("    %% " + organization_name + " Organizational Chart")
            lines.append("")

            # Styling
            for eid, emp in hierarchy["employee_map"].items():
                color = get_color(emp)
                label = f"{emp['name']}\\n{emp['title']}"
                if emp.get("is_vacant"):
                    label = f"VACANT\\n{emp['title']}"
                lines.append(f"    style {eid} fill:{color}")

            # Edges
            for eid, emp in hierarchy["employee_map"].items():
                mgr_id = emp.get("manager_id")
                if mgr_id and mgr_id in hierarchy["employee_map"]:
                    lines.append(f"    {mgr_id} --> {eid}")

            chart = "\\n".join(lines)

        elif fmt == "json":
            chart = json.dumps(hierarchy, indent=2)
        else:
            chart = f"Chart format '{fmt}' - hierarchy data available"

        result = {"format": fmt, "chart": chart, "stats": {"total_employees": hierarchy["total_employees"], "org_depth": hierarchy["org_depth"], "avg_span": hierarchy["avg_span_of_control"]}}
        print(json.dumps(result, indent=2))
      inputs:
        hierarchy_data: "{{ .steps.build_hierarchy.output.hierarchy_data }}"
        chart_format: "{{ .params.chart_format }}"
        color_by: "{{ .params.color_by }}"
        group_by: "{{ .params.group_by }}"
        organization_name: "{{ .params.organization_name }}"
      output: chart_output

  - id: analyze_structure
    node: agent
    params:
      instruction: |
        Analyze the organizational structure and provide insights:

        1. **Span of Control Analysis**: Identify managers with too many (>12) or too few (<3) direct reports
        2. **Hierarchy Depth**: Assess if the org is too flat or too deep
        3. **Bottleneck Identification**: Employees with disproportionate influence
        4. **Vacancy Impact**: Critical vacant positions and their effect
        5. **Team Size Distribution**: Department-level team sizes
        6. **Structural Recommendations**: Suggested reorgs for efficiency

        Return analysis as structured JSON.
      input:
        hierarchy_data: "{{ .steps.build_hierarchy.output.hierarchy_data }}"
        organization_name: "{{ .params.organization_name }}"
      output: structural_analysis

  - id: compute_date
    node: code_interpreter
    params:
      code: |
        from datetime import date
        print(date.today().isoformat())
      output: compute_date

  - id: save_chart
    node: file_write
    params:
      filename: "{{ .params.output_file | default \"org_chart.mmd\" }}"
      content: |
        %% {{ .params.organization_name }} - Organizational Chart
        %% Generated: {{ .compute_date }}
        %% Format: {{ .params.chart_format }}

        {{ .steps.generate_chart.output.chart_output.chart }}

        %% --- Statistics ---
        %% Total Employees: {{ .steps.generate_chart.output.chart_output.stats.total_employees }}
        %% Org Depth: {{ .steps.generate_chart.output.chart_output.stats.org_depth }}
        %% Avg Span of Control: {{ .steps.generate_chart.output.chart_output.stats.avg_span }}

        %% --- Structural Analysis ---
        {{ .steps.analyze_structure.output.structural_analysis | toJson }}
      format: text