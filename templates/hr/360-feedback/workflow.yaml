name: 360-feedback
description: 360-degree feedback collection, aggregation, and analysis workflow
params:
  - name: subject_name
    type: string
    required: true
    description: Person receiving feedback
  - name: subject_title
    type: string
    required: true
    description: Job title of feedback subject
  - name: feedback_period
    type: object
    required: true
    description: Period for feedback collection
  - name: reviewers
    type: array
    required: true
    description: List of reviewers with relationship type
  - name: competency_model
    type: array
    required: true
    description: Competency framework with rating scales
  - name: anonymize_peers
    type: boolean
    required: false
    default: true
    description: Anonymize peer and direct report feedback
  - name: include_self_assessment
    type: boolean
    required: false
    default: true
    description: Include self-assessment comparison
  - name: minimum_reviewers
    type: integer
    required: false
    default: 3
    description: Minimum reviewers per category

steps:
  - id: collect_feedback
    type: http_request
    config:
      method: POST
      url: "{{ .params.feedback_api_url | default \"https://api.feedback.internal/360/collect\" }}"
      headers:
        Authorization: "Bearer {{ .params.api_token }}"
        Content-Type: "application/json"
      body: |
        {
          "subject": "{{ .params.subject_name }}",
          "title": "{{ .params.subject_title }}",
          "period": {{ .params.feedback_period | toJson }},
          "reviewers": {{ .params.reviewers | toJson }},
          "competency_model": {{ .params.competency_model | toJson }},
          "anonymize_peers": {{ .params.anonymize_peers }}
        }
      output: raw_feedback

  - id: aggregate_feedback
    type: code_interpreter
    config:
      code: |
        import json

        feedback = raw_feedback
        competencies = competency_model
        anonymize = anonymize_peers

        # Group by reviewer type
        groups = {"self": [], "manager": [], "peer": [], "direct_report": [], "other": []}
        for r in feedback.get("responses", []):
            rel = r.get("relationship", "other")
            if rel in groups:
                groups[rel].append(r)

        # Compute aggregate scores per competency
        aggregated = []
        for comp in competencies:
            comp_name = comp.get("name", "Unknown")
            scores = {"self": None, "manager": None, "peer": [], "direct_report": [], "overall": None}
            textual = []

            for rel_type, responses in groups.items():
                for r in responses:
                    rating = r.get("ratings", {}).get(comp_name)
                    if rating is not None:
                        if rel_type == "self":
                            scores["self"] = rating
                        elif rel_type == "manager":
                            scores["manager"] = rating
                        elif rel_type in ["peer", "direct_report"]:
                            scores[rel_type].append(rating)
                    comment = r.get("comments", {}).get(comp_name)
                    if comment:
                        textual.append({"relationship": rel_type if not anonymize or rel_type not in ["peer", "direct_report"] else "Peer/Report", "comment": comment})

            # Compute averages
            all_scores = []
            if scores["self"] is not None: all_scores.append(scores["self"])
            if scores["manager"] is not None: all_scores.append(scores["manager"])
            all_scores.extend(scores["peer"])
            all_scores.extend(scores["direct_report"])

            peer_avg = round(sum(scores["peer"]) / len(scores["peer"]), 1) if scores["peer"] else None
            dr_avg = round(sum(scores["direct_report"]) / len(scores["direct_report"]), 1) if scores["direct_report"] else None
            overall = round(sum(all_scores) / len(all_scores), 1) if all_scores else None

            aggregated.append({
                "competency": comp_name,
                "self_score": scores["self"],
                "manager_score": scores["manager"],
                "peer_average": peer_avg,
                "direct_report_average": dr_avg,
                "overall_average": overall,
                "self_vs_others_gap": round(scores["self"] - overall, 1) if scores["self"] is not None and overall is not None else None,
                "comments": textual
            })

        # Sort by overall average descending
        aggregated.sort(key=lambda x: x["overall_average"] or 0, reverse=True)

        # Identify strengths and areas for improvement
        strengths = [a for a in aggregated if a["overall_average"] and a["overall_average"] >= 4.0]
        improvements = [a for a in aggregated if a["overall_average"] and a["overall_average"] < 3.0]
        blind_spots = [a for a in aggregated if a["self_vs_others_gap"] and a["self_vs_others_gap"] > 1.0]
        hidden_strengths = [a for a in aggregated if a["self_vs_others_gap"] and a["self_vs_others_gap"] < -0.5]

        result = {
            "subject": subject_name,
            "title": subject_title,
            "response_summary": {
                "total_reviewers": len(feedback.get("responses", [])),
                "self": len(groups["self"]),
                "manager": len(groups["manager"]),
                "peers": len(groups["peer"]),
                "direct_reports": len(groups["direct_report"]),
                "completion_rate": round(len(feedback.get("responses", [])) / len(reviewers) * 100, 1) if reviewers else 0
            },
            "competency_scores": aggregated,
            "analysis": {
                "top_strengths": [s["competency"] for s in strengths[:3]],
                "areas_for_improvement": [i["competency"] for i in improvements[:3]],
                "blind_spots": [b["competency"] for b in blind_spots],
                "hidden_strengths": [h["competency"] for h in hidden_strengths]
            }
        }
        print(json.dumps(result, indent=2))
      inputs:
        raw_feedback: "{{ .steps.collect_feedback.output.raw_feedback }}"
        competency_model: "{{ .params.competency_model }}"
        subject_name: "{{ .params.subject_name }}"
        subject_title: "{{ .params.subject_title }}"
        reviewers: "{{ .params.reviewers }}"
        anonymize_peers: "{{ .params.anonymize_peers }}"
      output: aggregated_feedback

  - id: generate_report
    type: agent
    config:
      instruction: |
        Generate a comprehensive 360-degree feedback report for {{ .params.subject_name }} ({{ .params.subject_title }}).

        Include:
        1. **Executive Summary**: Overall performance snapshot
        2. **Response Overview**: Participation rates by reviewer category
        3. **Competency Dashboard**: Scores by competency with self/manager/peer/direct report breakdown
        4. **Strengths Analysis**: Top strengths with supporting quotes
        5. **Development Areas**: Areas for improvement with specific feedback
        6. **Self-Awareness Analysis**: Blind spots and hidden strengths
        7. **Thematic Feedback**: Key themes from qualitative comments
        8. **Comparative Insights**: How scores compare to norms (if available)
        9. **Development Recommendations**: Specific, actionable growth plan
        10. **Appendix**: Full anonymous feedback responses

        Anonymize peers and direct reports: {{ .params.anonymize_peers }}
        Return as a professional markdown document.
      input:
        aggregated_feedback: "{{ .steps.aggregate_feedback.output.aggregated_feedback }}"
        subject_name: "{{ .params.subject_name }}"
        subject_title: "{{ .params.subject_title }}"
        anonymize_peers: "{{ .params.anonymize_peers }}"
      output: report_content

  - id: generate_filename
    type: code_interpreter
    config:
      code: |
        name = "{{ .params.subject_name }}"
        output = "{{ .params.output_file }}" or f"360_feedback_{name.replace(' ', '_')}.md"
        print(output)
      output: filename

  - id: save_report
    type: file_write
    config:
      filename: "{{ .steps.generate_filename.output.filename }}"
      content: "{{ .steps.generate_report.output.report_content }}"
      format: markdown