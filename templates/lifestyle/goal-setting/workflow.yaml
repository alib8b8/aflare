name: Goal Setting Workbook
# Set SMART goals with action plans
# Usage: llm-box install productivity-personal/goal-setting
#        llm-box run goal-setting/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Help me set SMART goals for {{ .params.timeframe }}.
      
      My aspirations:
      {{ .params.aspirations }}
      
      Current situation:
      {{ .params.current }}
      
      Create a goal-setting workbook with:
      1. Vision statement
      2. 3-5 major goals (SMART format)
      3. For each goal:
         - Specific outcomes
         - Measurable metrics
         - Achievable steps
         - Relevant to vision
         - Time-bound deadlines
      4. Quarterly milestones
      5. Weekly action items template
      6. Accountability measures
      7. Potential obstacles and solutions
      8. Reward system for hitting milestones
    id: goals

  - node: file_write
    params:
      path: goal-workbook.md
    input: goals
    id: save
