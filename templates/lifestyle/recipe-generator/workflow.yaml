name: Recipe Generator
# Generate personalized recipes from available ingredients
# Usage: aflare install lifestyle/recipe-generator
#        aflare run recipe-generator/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: researcher, template_render
      max_iterations: 4
    input: |
      Create a personalized recipe based on the following:

      Available ingredients: {{ .params.ingredients }}
      Dietary preferences: {{ .params.dietary_preferences }}
      Cuisine type: {{ .params.cuisine_type }}
      Meal type: {{ .params.meal_type }}
      Cooking time limit: {{ .params.cooking_time }}
      Skill level: {{ .params.skill_level }}
      Number of servings: {{ .params.servings }}
      Allergies/restrictions: {{ .params.allergies }}

      Generate a complete recipe with:

      1. Recipe Overview
         - Recipe name (creative and descriptive)
         - Brief description (2-3 sentences)
         - Prep time, cook time, total time
         - Difficulty level
         - Cuisine and category

      2. Ingredient List
         - All ingredients with exact measurements
         - Clearly mark which are from the available ingredients list
         - Note any additional pantry staples needed
         - Suggested substitutions for hard-to-find items

      3. Step-by-Step Instructions
         - Clear, numbered steps
         - Include preparation tips and techniques
         - Note critical steps (e.g., "don't overmix")
         - Indicate when to preheat, prep ahead, etc.

      4. Nutrition Information (per serving)
         - Calories, protein, carbs, fat, fiber
         - Any notable vitamins/minerals

      5. Serving Suggestions
         - Plating and presentation tips
         - Recommended side dishes or pairings
         - Wine or beverage pairing (if applicable)

      6. Storage & Meal Prep
         - How to store leftovers
         - Make-ahead tips
         - Freezing instructions (if applicable)

      7. Variations
         - 2-3 alternative versions (e.g., vegan, gluten-free, spicy)
         - Seasonal substitutions
    id: recipe

  - node: file_write
    params:
      path: recipe-{{ .params.meal_type }}.md
    input: recipe
    id: save