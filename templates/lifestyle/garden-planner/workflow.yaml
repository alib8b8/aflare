name: Garden Planner
# Generate a personalized garden planting plan
# Usage: aflare install lifestyle/garden-planner
#        aflare run garden-planner/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: researcher, template_render
      max_iterations: 5
    input: |
      Create a detailed garden planting plan with the following parameters:

      Garden type: {{ .params.garden_type }}
      Climate zone: {{ .params.climate_zone }}
      Garden size: {{ .params.garden_size }}
      Sunlight exposure: {{ .params.sunlight }}
      Soil type: {{ .params.soil_type }}
      Season: {{ .params.season }}
      Gardening experience: {{ .params.experience_level }}
      Goals: {{ .params.goals }}
      Budget: {{ .params.budget }}
      Maintenance preference: {{ .params.maintenance }}

      Generate a comprehensive garden plan:

      1. Garden Overview
         - Garden layout description (shape, zones, paths)
         - Sunlight mapping for different areas
         - Soil amendment recommendations based on soil type
         - Water source and irrigation notes

      2. Plant Selection
         - Recommended plants categorized by:
           * Vegetables / Herbs
           * Fruits / Berries
           * Flowers (annuals and perennials)
           * Companion plants for pest control
         - For each plant: planting date, spacing, days to harvest/bloom
         - Sun and water requirements for each
         - Difficulty rating for each plant

      3. Seasonal Calendar
         - Month-by-month planting schedule
         - Indoor seed starting timeline
         - Transplant dates
         - Harvest windows
         - End-of-season tasks

      4. Layout Design
         - Suggested bed/row arrangement
         - Companion planting pairs
         - Crop rotation notes (for future seasons)
         - Vertical gardening opportunities

      5. Maintenance Schedule
         - Weekly watering guide
         - Fertilizing schedule
         - Pruning and deadheading tasks
         - Pest and disease monitoring checklist
         - Mulching recommendations

      6. Budget Breakdown
         - Seeds and seedlings
         - Soil amendments and fertilizers
         - Tools and equipment
         - Irrigation supplies
         - Total estimated cost

      7. Tips & Best Practices
         - Region-specific advice for the climate zone
         - Common mistakes to avoid
         - Organic gardening tips
         - Harvesting and storage guidance
    id: garden_plan

  - node: file_write
    params:
      path: garden-plan.md
    input: garden_plan
    id: save