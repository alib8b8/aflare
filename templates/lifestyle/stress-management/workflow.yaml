name: Stress Management Plan
# Create stress management toolkit
# Usage: aflare install health-wellness/stress-management
#        aflare run stress-management/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Create a comprehensive stress management plan.
      
      Main stress sources: {{ .params.stress_sources }}
      Current coping mechanisms: {{ .params.current_coping }}
      Time available for self-care: {{ .params.time_available }}
      
      Stress management plan:
      1. Stress Assessment
         - Understanding stress
         - Your personal stress profile
         - Warning signs to watch for
      2. Immediate Relief Techniques (5 minutes or less)
         - Breathing exercises (4-7-8, box breathing)
         - Grounding techniques (5-4-3-2-1)
         - Progressive muscle relaxation
         - Quick stretches
      3. Daily Stress Management
         - Morning routine
         - Midday reset
         - Evening wind-down
         - Digital detox strategies
      4. Weekly Self-Care Plan
         - Physical self-care
         - Mental/emotional self-care
         - Social self-care
         - Spiritual self-care
      5. Cognitive Techniques
         - Thought reframing
         - Mindfulness practices
         - Gratitude practice
         - Journaling prompts
      6. Lifestyle Factors
         - Sleep connection
         - Exercise recommendations
         - Nutrition tips
      7. Long-term Stress Reduction
         - Boundary setting
         - Time management
         - Saying no strategies
         - Problem-solving approach
      8. Emergency Stress Toolkit
      9. When to seek professional help
    id: stress_plan

  - node: file_write
    params:
      path: stress-management.md
    input: stress_plan
    id: save

  - node: notify
    params:
      channel: stdout
    input: stress_plan
    id: notify
