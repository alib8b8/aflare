name: Component Library Design
# Generate UI component library design
# Usage: llm-box install frontend/component-library
#        llm-box run component-library/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 4
    input: |
      Design a comprehensive UI component library for {{ .params.product }}.
      
      Product: {{ .params.product }}
      Framework: {{ .params.framework }}
      Design system: {{ .params.design_system }}
      
      Component library should include:
      1. Foundation
         - Colors (primary, secondary, neutral, semantic)
         - Typography (font family, sizes, weights, line heights)
         - Spacing scale
         - Border radius
         - Shadows
         - Breakpoints
      2. Atoms
         - Button variants (primary, secondary, ghost, danger, icon)
         - Input types (text, email, password, number, textarea, select, checkbox, radio, switch)
         - Typography components
         - Badge, tag, chip
         - Avatar
         - Icon
      3. Molecules
         - Search input
         - Form field (with label, help text, error)
         - Card
         - Alert
         - Toast / Snackbar
         - Tooltip
         - Dropdown
      4. Organisms
         - Navigation bar
         - Sidebar
         - Modal / Dialog
         - Table / Data grid
         - Form
         - Tabs
         - Accordion
         - Pagination
         - Breadcrumbs
         - Stepper
      5. Templates
         - Dashboard layout
         - Form page
         - List page
         - Detail page
         - Auth page (login/register)
         - Error page (404, 500)
      6. Component API Reference
         - Props
         - Events
         - Slots
         - CSS variables
      7. Accessibility Guidelines
      8. Theming / Dark mode support
      
      Include code examples for each component.
    id: components

  - node: file_write
    params:
      path: component-library.md
    input: components
    id: save

  - node: notify
    params:
      channel: stdout
    input: components
    id: notify
