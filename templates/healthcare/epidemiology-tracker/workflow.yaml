name: Disease Outbreak & Epidemiology Tracker
# Track disease outbreaks and epidemiological trends
# Usage: aflare install healthcare/epidemiology-tracker
#        aflare run epidemiology-tracker/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: http_request
      max_iterations: 3
    input: |
      Define the epidemiological surveillance parameters.

      Disease/Condition: {{ .params.disease }}
      Geographic area: {{ .params.geographic_area }}
      Time period: {{ .params.time_period }}
      Population: {{ .params.population }}
      Surveillance goals: {{ .params.surveillance_goals }}

      Determine:
      1. Case definition (confirmed, probable, suspected)
      2. Surveillance type (active, passive, sentinel, syndromic)
      3. Key epidemiological indicators needed
      4. Data sources to query
      5. Reporting thresholds
      6. Alert criteria
    id: surveillance_plan

  - node: http_request
    params:
      url: "https://disease.sh/v3/covid-19/historical/{{ .params.geographic_area | urlquery }}?lastdays={{ .params.last_days }}"
      method: GET
      timeout: 30s
    id: disease_data

  - node: code_interpreter
    params:
      language: python
      timeout: 30s
    input: |
      import json
      from datetime import datetime, timedelta

      data = {{ .disease_data | toJson }}
      plan = {{ .surveillance_plan | toJson }}

      # Calculate epidemiological metrics
      timeline = data.get("timeline", {})
      cases = timeline.get("cases", {})
      deaths = timeline.get("deaths", {})

      case_values = list(cases.values()) if cases else []
      death_values = list(deaths.values()) if deaths else []

      # Calculate key metrics
      total_cases = sum(case_values) if case_values else 0
      total_deaths = sum(death_values) if death_values else 0

      # Calculate 7-day moving average
      if len(case_values) >= 7:
          moving_avg = sum(case_values[-7:]) / 7
      else:
          moving_avg = sum(case_values) / len(case_values) if case_values else 0

      # Trend detection
      if len(case_values) >= 14:
          recent_week = sum(case_values[-7:])
          prior_week = sum(case_values[-14:-7])
          if prior_week > 0:
              trend_pct = ((recent_week - prior_week) / prior_week) * 100
          else:
              trend_pct = 0
      else:
          trend_pct = 0

      trend = "stable"
      if trend_pct > 10:
          trend = "increasing"
      elif trend_pct < -10:
          trend = "decreasing"

      # Risk level
      if trend == "increasing" and trend_pct > 25:
          risk_level = "high"
      elif trend == "increasing":
          risk_level = "moderate"
      else:
          risk_level = "low"

      print(json.dumps({
          "total_cases": total_cases,
          "total_deaths": total_deaths,
          "cfr": round((total_deaths / total_cases * 100), 2) if total_cases > 0 else 0,
          "moving_avg_7day": round(moving_avg, 1),
          "trend": trend,
          "trend_pct": round(trend_pct, 1),
          "risk_level": risk_level,
          "data_points": len(case_values),
          "period_days": len(case_values)
      }))
    id: epi_metrics

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 2
    input: |
      Generate epidemiological report and public health recommendations.

      Surveillance plan: {{ .surveillance_plan }}
      Epidemiological metrics: {{ .epi_metrics }}
      Raw data: {{ .disease_data }}

      Create:
      1. Executive summary of current situation
      2. Epidemiological curve description
      3. Geographic distribution analysis
      4. Demographic breakdown (if available)
      5. Comparison with historical baselines
      6. Public health recommendations
      7. Forecasting and projections
      8. Data limitations and caveats
    id: epi_report

  - node: file_write
    params:
      path: "{{ .params.output_path | default \"epidemiology-report.md\" }}"
    input: |
      # EPIDEMIOLOGY TRACKER REPORT
      ---
      **Disease/Condition:** {{ .params.disease }}
      **Area:** {{ .params.geographic_area }}
      **Period:** {{ .params.time_period }}
      **Risk Level:** {{ .epi_metrics.risk_level | upper }}
      **Trend:** {{ .epi_metrics.trend | upper }} ({{ .epi_metrics.trend_pct }}%)

      ## Key Metrics
      | Metric | Value |
      |--------|-------|
      | Total Cases | {{ .epi_metrics.total_cases }} |
      | Total Deaths | {{ .epi_metrics.total_deaths }} |
      | Case Fatality Rate | {{ .epi_metrics.cfr }}% |
      | 7-Day Moving Avg | {{ .epi_metrics.moving_avg_7day }} |
      | Trend | {{ .epi_metrics.trend }} ({{ .epi_metrics.trend_pct }}%) |

      ## Epidemiological Analysis
      {{ .epi_report }}

      ---
      *Data sourced from public health surveillance systems. Verify with local health authorities.*
      *Report generated: {{ .params.report_date }}*
    id: save_report