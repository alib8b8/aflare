name: Medical Billing & Coding Workflow
# Automated medical billing and coding workflow
# Usage: aflare install healthcare/medical-billing
#        aflare run medical-billing/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: code_interpreter
      max_iterations: 3
    input: |
      Extract billing-relevant information from the clinical encounter.

      Clinical documentation: {{ .params.clinical_documentation }}
      Encounter type: {{ .params.encounter_type }}
      Place of service: {{ .params.place_of_service }}
      Provider: {{ .params.provider }}
      Patient insurance: {{ .params.insurance_type }}

      Extract:
      1. ICD-10-CM diagnosis codes (primary and secondary)
      2. CPT/HCPCS procedure codes
      3. E/M level justification (history, exam, MDM components)
      4. Modifiers needed (laterality, multiple procedures, etc.)
      5. NCCI edits to check
      6. Medical necessity documentation
      7. Units for each service
      8. Diagnosis pointers linking Dx to procedures
    id: code_extraction

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: http_request
      max_iterations: 2
    input: |
      Validate billing codes and check for common errors.

      Extracted codes: {{ .code_extraction }}
      Payer: {{ .params.insurance_type }}

      Validate:
      1. ICD-10 code specificity (to highest level)
      2. CPT code bundling (NCCI edits)
      3. E/M code level appropriateness
      4. Modifier correctness
      5. Medical necessity linkage
      6. LCD/NCD coverage determination
      7. Frequency limitations
      8. Gender/procedure compatibility
    id: code_validation

  - node: code_interpreter
    params:
      language: python
      timeout: 30s
    input: |
      import json

      extraction = {{ .code_extraction | toJSON }}
      validation = {{ .code_validation | toJSON }}

      # Calculate billing metrics
      codes = extraction.get("codes", [])
      errors = validation.get("errors", [])
      warnings = validation.get("warnings", [])

      total_codes = len(codes)
      dx_codes = sum(1 for c in codes if c.get("type") == "diagnosis")
      proc_codes = sum(1 for c in codes if c.get("type") == "procedure")

      error_count = len(errors)
      warning_count = len(warnings)

      # Calculate claim readiness score
      base_score = 100
      base_score -= error_count * 20
      base_score -= warning_count * 5
      claim_readiness = max(0, base_score)

      # Estimate RVUs
      total_rvu = sum(c.get("rvu", 0) for c in codes)

      readiness = "ready"
      if error_count > 0:
          readiness = "needs_correction"
      elif warning_count > 2:
          readiness = "review_recommended"

      print(json.dumps({
          "total_codes": total_codes,
          "diagnosis_codes": dx_codes,
          "procedure_codes": proc_codes,
          "error_count": error_count,
          "warning_count": warning_count,
          "claim_readiness_score": claim_readiness,
          "readiness": readiness,
          "estimated_rvu": round(total_rvu, 2),
          "errors": errors,
          "warnings": warnings
      }))
    id: billing_metrics

  - node: transform
    params:
      template: |
        # MEDICAL BILLING REPORT
        ---
        **Encounter Date:** {{ .params.encounter_date }}
        **Encounter Type:** {{ .params.encounter_type }}
        **Place of Service:** {{ .params.place_of_service }}
        **Claim Readiness:** {{ .billing_metrics.readiness | upper }}
        **Score:** {{ .billing_metrics.claim_readiness_score }}/100

        ## Diagnosis Codes ({{ .billing_metrics.diagnosis_codes }})
        {{ .code_extraction.diagnosis_codes }}

        ## Procedure Codes ({{ .billing_metrics.procedure_codes }})
        {{ .code_extraction.procedure_codes }}

        ## Estimated RVUs: {{ .billing_metrics.estimated_rvu }}

        ## Errors ({{ .billing_metrics.error_count }})
        {{ if .billing_metrics.error_count }}
        {{ range .billing_metrics.errors }}
        - **{{ .severity | upper }}:** {{ .description }}
        {{ end }}
        {{ else }}
        No errors found.
        {{ end }}

        ## Warnings ({{ .billing_metrics.warning_count }})
        {{ if .billing_metrics.warning_count }}
        {{ range .billing_metrics.warnings }}
        - {{ .description }}
        {{ end }}
        {{ else }}
        No warnings.
        {{ end }}

        ## Validation Notes
        {{ .code_validation.notes }}

        ---
        *Codes require provider review and sign-off before submission. Verify against payer-specific guidelines.*
    input:
      code_extraction: code_extraction
      code_validation: code_validation
      billing_metrics: billing_metrics
    id: billing_report

  - node: file_write
    params:
      path: "{{ .params.output_path | default \"medical-billing-report.md\" }}"
    input: billing_report
    id: save_report