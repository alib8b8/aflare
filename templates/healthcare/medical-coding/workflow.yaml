name: ICD-10 Medical Coding Assistant
# AI-powered ICD-10 medical coding assistant
# Usage: aflare install healthcare/medical-coding
#        aflare run medical-coding/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: http_request
      max_iterations: 4
    input: |
      Analyze the clinical documentation and extract relevant diagnoses and procedures for ICD-10 coding.

      Clinical notes: {{ .params.clinical_notes }}
      Encounter type: {{ .params.encounter_type }}
      Specialty: {{ .params.specialty }}
      Provider notes: {{ .params.provider_notes }}

      Extract:
      1. Primary diagnosis with supporting evidence
      2. Secondary diagnoses and comorbidities
      3. All procedures performed
      4. Signs and symptoms
      5. External cause codes (if applicable)
      6. Z-codes for health status and encounters
      7. Laterality for applicable codes
      8. Any documentation gaps that need clarification
    id: clinical_extraction

  - node: http_request
    params:
      url: "https://clinicaltables.nlm.nih.gov/api/icd10cm/v3/search?terms={{ .params.primary_diagnosis | urlquery }}&maxList=10"
      method: GET
      timeout: 15s
    id: icd10_lookup

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: code_interpreter
      max_iterations: 3
    input: |
      Map the extracted clinical concepts to appropriate ICD-10-CM codes.

      Clinical extraction: {{ .clinical_extraction }}
      ICD-10 lookup results: {{ .icd10_lookup }}

      For each diagnosis and procedure, provide:
      1. Most specific ICD-10-CM code available
      2. Code description
      3. Coding guidelines applied (e.g., code first, use additional)
      4. Sequencing rationale (primary vs. secondary)
      5. Documentation improvement suggestions
      6. HCC/risk adjustment flags (if applicable)
      7. Any Excludes1/Excludes2 notes that apply
    id: code_mapping

  - node: code_interpreter
    params:
      language: python
      timeout: 30s
    input: |
      import json

      codes = {{ .code_mapping | toJson }}

      # Validate code format and calculate metrics
      valid_codes = []
      for code_entry in codes.get("codes", []):
          code = code_entry.get("code", "")
          # Basic ICD-10-CM format validation
          if len(code) >= 3 and code[0].isalpha():
              code_entry["format_valid"] = True
              valid_codes.append(code_entry)
          else:
              code_entry["format_valid"] = False

      # Calculate coding metrics
      metrics = {
          "total_codes": len(codes.get("codes", [])),
          "valid_codes": len(valid_codes),
          "primary_dx_code": valid_codes[0]["code"] if valid_codes else "N/A",
          "hcc_codes": [c["code"] for c in valid_codes if c.get("hcc_flag")],
          "documentation_gaps": len(codes.get("documentation_gaps", []))
      }

      print(json.dumps(metrics))
    id: coding_metrics

  - node: transform
    params:
      template: |
        # ICD-10 Medical Coding Report
        ---
        **Encounter Date:** {{ .params.encounter_date }}
        **Encounter Type:** {{ .params.encounter_type }}
        **Total Codes:** {{ .coding_metrics.total_codes }}
        **Valid Codes:** {{ .coding_metrics.valid_codes }}
        **HCC Codes:** {{ .coding_metrics.hcc_codes }}

        ## Primary Diagnosis
        **{{ .coding_metrics.primary_dx_code }}** - {{ .code_mapping.primary_description }}

        ## Secondary Diagnoses
        {{ .code_mapping.secondary_diagnoses }}

        ## Procedures
        {{ .code_mapping.procedures }}

        ## Documentation Gaps ({{ .coding_metrics.documentation_gaps }})
        {{ .code_mapping.documentation_gaps }}

        ## Coding Summary
        {{ .code_mapping.summary }}

        ---
        *Codes validated against ICD-10-CM {{ .params.code_year }}. Verify all codes before submission.*
    input:
      code_mapping: code_mapping
      coding_metrics: coding_metrics
    id: coding_report

  - node: file_write
    params:
      path: "{{ .params.output_path | default \"medical-coding-report.md\" }}"
    input: coding_report
    id: save_report