name: Radiology Report Generator
# Generate and analyze radiology reports
# Usage: aflare install healthcare/radiology-report
#        aflare run radiology-report/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: http_request, code_interpreter
      max_iterations: 4
    input: |
      Analyze the radiology findings and generate a structured report.

      Imaging modality: {{ .params.modality }}
      Body region: {{ .params.body_region }}
      Clinical indication: {{ .params.clinical_indication }}
      Imaging findings: {{ .params.findings }}
      Comparison studies: {{ .params.comparison }}
      Technique: {{ .params.technique }}

      Generate a structured radiology report with:
      1. Clinical history and indication
      2. Technique/protocol used
      3. Comparison with prior studies
      4. Detailed findings organized by anatomical structure
      5. Key measurements (if applicable)
      6. Impression (most likely diagnosis ranked)
      7. Differential diagnoses
      8. Recommendations for further imaging or follow-up
      9. Incidental findings (if any)
      10. Urgency flag (routine/urgent/STAT)
    id: radiology_findings

  - node: code_interpreter
    params:
      language: python
      timeout: 30s
    input: |
      import json

      findings = {{ .radiology_findings | toJSON }}

      # Categorize findings by severity
      categories = {
          "critical": [],
          "significant": [],
          "incidental": [],
          "normal": []
      }

      for finding in findings.get("detailed_findings", []):
          severity = finding.get("severity", "normal").lower()
          if severity in categories:
              categories[severity].append(finding)

      # Calculate BI-RADS/LI-RADS equivalent if applicable
      has_classification = False
      classification_score = None
      if findings.get("classification"):
          has_classification = True
          classification_score = findings["classification"]

      print(json.dumps({
          "critical_count": len(categories["critical"]),
          "significant_count": len(categories["significant"]),
          "incidental_count": len(categories["incidental"]),
          "normal_count": len(categories["normal"]),
          "has_classification": has_classification,
          "classification_score": classification_score,
          "overall_urgency": "STAT" if categories["critical"] else "urgent" if categories["significant"] else "routine"
      }))
    id: finding_categories

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 2
    input: |
      Generate a layperson summary of the radiology findings.

      Radiology findings: {{ .radiology_findings }}
      Finding categories: {{ .finding_categories }}

      Create a patient-friendly explanation that:
      1. Explains what the imaging test was looking for
      2. Describes the key findings in simple terms
      3. Avoids unnecessary medical jargon
      4. Does NOT provide a diagnosis - only explains findings
      5. Includes appropriate reassurance or concern level
      6. Lists clear next steps
    id: patient_summary

  - node: transform
    params:
      template: |
        # RADIOLOGY REPORT
        ---
        **Exam:** {{ .params.modality }} - {{ .params.body_region }}
        **Date:** {{ .params.exam_date }}
        **Ordering Provider:** {{ .params.ordering_provider }}
        **Urgency:** {{ .finding_categories.overall_urgency }}

        ## Clinical Indication
        {{ .params.clinical_indication }}

        ## Findings
        {{ .radiology_findings }}

        ## Impression
        {{ .radiology_findings.impression }}

        ---
        ## Patient Summary
        {{ .patient_summary }}

        ---
        *Report generated by AI. Reviewed and finalized by: {{ .params.radiologist }}*
    input:
      radiology_findings: radiology_findings
      finding_categories: finding_categories
      patient_summary: patient_summary
    id: final_report

  - node: file_write
    params:
      path: "{{ .params.output_path | default \"radiology-report.md\" }}"
    input: final_report
    id: save_report