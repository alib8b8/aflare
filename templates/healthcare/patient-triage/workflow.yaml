name: Patient Triage & Urgency Assessment
# AI-powered patient triage with urgency scoring and recommendation
# Usage: aflare install healthcare/patient-triage
#        aflare run patient-triage/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: http_request, code_interpreter
      max_iterations: 4
    input: |
      Perform initial patient triage assessment based on the following information.

      Chief complaint: {{ .params.chief_complaint }}
      Symptoms: {{ .params.symptoms }}
      Onset: {{ .params.symptom_onset }}
      Vital signs: {{ .params.vital_signs }}
      Medical history: {{ .params.medical_history }}
      Age: {{ .params.age }}
      Gender: {{ .params.gender }}

      Provide a structured triage assessment including:
      1. Primary complaint analysis
      2. Red flag indicators
      3. Differential considerations
      4. Recommended triage level (1-5, ESI scale)
      5. Suggested immediate actions
      6. Disposition recommendation
    id: triage_assessment

  - node: code_interpreter
    params:
      language: python
      timeout: 30s
    input: |
      # Calculate urgency score based on triage assessment factors
      import json

      assessment = {{ .triage_assessment | toJSON }}

      # Scoring factors
      red_flags = assessment.get("red_flag_count", 0)
      vital_abnormalities = assessment.get("vital_abnormalities", 0)
      age_factor = 1 if {{ .params.age }} > 65 or {{ .params.age }} < 1 else 0

      urgency_score = (red_flags * 25) + (vital_abnormalities * 15) + (age_factor * 10)

      triage_level = 1
      if urgency_score >= 80:
          triage_level = 1
      elif urgency_score >= 60:
          triage_level = 2
      elif urgency_score >= 30:
          triage_level = 3
      elif urgency_score >= 10:
          triage_level = 4
      else:
          triage_level = 5

      print(json.dumps({
          "urgency_score": urgency_score,
          "triage_level": triage_level,
          "red_flags": red_flags,
          "vital_abnormalities": vital_abnormalities,
          "age_factor": age_factor
      }))
    id: urgency_score

  - node: transform
    params:
      template: |
        # PATIENT TRIAGE REPORT
        ---
        **Patient ID:** {{ .params.patient_id }}
        **Chief Complaint:** {{ .params.chief_complaint }}
        **Triage Level:** {{ .urgency_score.triage_level }} (ESI)
        **Urgency Score:** {{ .urgency_score.urgency_score }}/100

        ## Assessment
        {{ .triage_assessment }}

        ## Recommendation
        Based on triage level {{ .urgency_score.triage_level }}, the patient requires:
        {{ if eq .urgency_score.triage_level 1 }}IMMEDIATE life-saving intervention.{{ end }}
        {{ if eq .urgency_score.triage_level 2 }}Emergent care within 10 minutes.{{ end }}
        {{ if eq .urgency_score.triage_level 3 }}Urgent care, can wait up to 30 minutes.{{ end }}
        {{ if eq .urgency_score.triage_level 4 }}Less urgent, can wait up to 60 minutes.{{ end }}
        {{ if eq .urgency_score.triage_level 5 }}Non-urgent, can wait up to 120 minutes.{{ end }}
    input:
      triage_assessment: triage_assessment
      urgency_score: urgency_score
    id: triage_report

  - node: file_write
    params:
      path: "{{ .params.output_path | default \"patient-triage-report.md\" }}"
    input: triage_report
    id: save_report

  - node: notify
    params:
      channel: stdout
      severity: "{{ if le .urgency_score.urgency_score 60 }}info{{ else }}warning{{ end }}"
    input: triage_report
    id: notify_result