name: Drug Interaction Checker
# Check drug interactions and contraindications
# Usage: aflare install healthcare/drug-interaction-checker
#        aflare run drug-interaction-checker/workflow.yaml

steps:
  - node: http_request
    params:
      url: "https://api.fda.gov/drug/label.json?search=openfda.brand_name:{{ .params.drug_name | urlquery }}&limit=3"
      method: GET
      timeout: 15s
    id: drug_label_data

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: http_request, code_interpreter
      max_iterations: 5
    input: |
      Analyze the following medication list for potential drug interactions and contraindications.

      Primary drug: {{ .params.drug_name }}
      Drug label data: {{ .drug_label_data }}
      Patient medications: {{ .params.patient_medications }}
      Patient age: {{ .params.age }}
      Patient conditions: {{ .params.conditions }}
      Allergies: {{ .params.allergies }}
      Pregnancy status: {{ .params.pregnancy }}
      Renal function: {{ .params.renal_function }}
      Hepatic function: {{ .params.hepatic_function }}

      Analyze for:
      1. Drug-drug interactions (severity rated: mild/moderate/severe/contraindicated)
      2. Drug-condition contraindications
      3. Drug-allergy interactions
      4. Age-related considerations (geriatric/pediatric)
      5. Pregnancy/lactation safety category
      6. Renal/hepatic dose adjustments needed
      7. Food interactions
      8. Duplicate therapy checks
    id: interaction_analysis

  - node: http_request
    params:
      url: "https://rxnav.nlm.nih.gov/REST/interaction/list.json?rxcuis={{ .params.rxcui_list }}"
      method: GET
      timeout: 15s
    id: rxnav_interactions

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 2
    input: |
      Combine the FDA label analysis with RxNav interaction data to create a comprehensive interaction report.

      FDA analysis: {{ .interaction_analysis }}
      RxNav interactions: {{ .rxnav_interactions }}
      Patient medications: {{ .params.patient_medications }}

      Produce a final interaction assessment with:
      1. All identified interactions with severity levels
      2. Clinical management recommendations
      3. Alternative medication suggestions (if severe interactions found)
      4. Monitoring parameters
      5. Patient counseling points
    id: final_analysis

  - node: code_interpreter
    params:
      language: python
      timeout: 30s
    input: |
      import json

      analysis = {{ .final_analysis | toJSON }}

      # Count interactions by severity
      severity_counts = {"contraindicated": 0, "severe": 0, "moderate": 0, "mild": 0}
      for interaction in analysis.get("interactions", []):
          sev = interaction.get("severity", "mild").lower()
          if sev in severity_counts:
              severity_counts[sev] += 1

      risk_level = "low"
      if severity_counts["contraindicated"] > 0:
          risk_level = "critical"
      elif severity_counts["severe"] > 0:
          risk_level = "high"
      elif severity_counts["moderate"] > 2:
          risk_level = "medium"

      print(json.dumps({
          "risk_level": risk_level,
          "severity_counts": severity_counts,
          "total_interactions": sum(severity_counts.values())
      }))
    id: risk_assessment

  - node: file_write
    params:
      path: "{{ .params.output_path | default \"drug-interaction-report.md\" }}"
    input: |
      # DRUG INTERACTION CHECKER REPORT
      ---
      **Primary Drug:** {{ .params.drug_name }}
      **Risk Level:** {{ .risk_assessment.risk_level | upper }}
      **Total Interactions Found:** {{ .risk_assessment.total_interactions }}
      **Contraindicated:** {{ .risk_assessment.severity_counts.contraindicated }}
      **Severe:** {{ .risk_assessment.severity_counts.severe }}
      **Moderate:** {{ .risk_assessment.severity_counts.moderate }}
      **Mild:** {{ .risk_assessment.severity_counts.mild }}

      ## Detailed Analysis
      {{ .final_analysis }}

      ---
      *Disclaimer: This is a screening tool only. Always verify with a clinical pharmacist.*
    id: save_report