name: Medical Literature Search & Review
# Search and review medical literature from PubMed
# Usage: aflare install healthcare/medical-literature-review
#        aflare run medical-literature-review/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: http_request
      max_iterations: 3
    input: |
      Build a comprehensive PubMed search strategy for the clinical question.

      Clinical question: {{ .params.clinical_question }}
      Study type preference: {{ .params.study_type }}
      Date range: {{ .params.date_range }}
      Population: {{ .params.population }}
      Intervention: {{ .params.intervention }}
      Outcome: {{ .params.outcome }}

      Create a PICO-formatted search:
      1. P - Population terms and MeSH headings
      2. I - Intervention terms and MeSH headings
      3. C - Comparison terms (if applicable)
      4. O - Outcome terms and MeSH headings
      5. Combine with Boolean operators
      6. Apply filters (study type, date, language, species)
    id: search_strategy

  - node: http_request
    params:
      url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term={{ .search_strategy.search_query | urlquery }}&retmax=20&retmode=json&sort=relevance"
      method: GET
      timeout: 30s
    id: pubmed_search

  - node: http_request
    params:
      url: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esummary.fcgi?db=pubmed&id={{ .pubmed_search.id_list }}&retmode=json"
      method: GET
      timeout: 30s
    id: article_details

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: code_interpreter
      max_iterations: 4
    input: |
      Analyze and synthesize the retrieved medical literature.

      Clinical question: {{ .params.clinical_question }}
      Article details: {{ .article_details }}

      For each article:
      1. Study design and level of evidence
      2. Key findings and statistical significance
      3. Strengths and limitations
      4. Relevance to clinical question
      5. Quality assessment (Jadad score for RCTs, etc.)

      Then synthesize:
      1. Overall evidence summary
      2. Consistency of findings across studies
      3. Clinical applicability
      4. Evidence gaps identified
      5. Strength of recommendation
    id: literature_synthesis

  - node: code_interpreter
    params:
      language: python
      timeout: 30s
    input: |
      import json

      synthesis = {{ .literature_synthesis | toJson }}

      evidence_levels = {"meta-analysis": 1, "systematic-review": 1, "rct": 2, "cohort": 3, "case-control": 4, "case-series": 5}
      studies = synthesis.get("studies", [])

      total_studies = len(studies)
      high_quality = sum(1 for s in studies if s.get("quality_score", 0) >= 4)
      evidence_level = min(evidence_levels.get(s.get("study_type", "case-series"), 5) for s in studies) if studies else 5

      # GRADE-style recommendation strength
      if total_studies >= 5 and high_quality >= 3:
          recommendation = "strong"
      elif total_studies >= 3 and high_quality >= 1:
          recommendation = "moderate"
      else:
          recommendation = "weak"

      print(json.dumps({
          "total_studies": total_studies,
          "high_quality_studies": high_quality,
          "highest_evidence_level": evidence_level,
          "recommendation_strength": recommendation,
          "needs_more_research": total_studies < 3 or high_quality == 0
      }))
    id: evidence_assessment

  - node: file_write
    params:
      path: "{{ .params.output_path | default \"literature-review.md\" }}"
    input: |
      # MEDICAL LITERATURE REVIEW
      ---
      **Clinical Question:** {{ .params.clinical_question }}
      **Search Date:** {{ .params.search_date }}
      **Studies Reviewed:** {{ .evidence_assessment.total_studies }}
      **High Quality:** {{ .evidence_assessment.high_quality_studies }}
      **Recommendation Strength:** {{ .evidence_assessment.recommendation_strength | upper }}

      ## Search Strategy
      {{ .search_strategy }}

      ## Evidence Synthesis
      {{ .literature_synthesis }}

      ## Evidence Summary
      - **Highest Evidence Level:** {{ .evidence_assessment.highest_evidence_level }}
      - **Recommendation:** {{ .evidence_assessment.recommendation_strength | upper }}
      - **{{ if .evidence_assessment.needs_more_research }}More high-quality research is needed.{{ else }}Evidence is sufficient for clinical decision-making.{{ end }}**

      ---
      *Literature search performed via PubMed. Verify critical findings against primary sources.*
    id: save_review