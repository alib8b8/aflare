name: Hospital Department Workflow Automation
# Automate and optimize hospital department workflows
# Usage: aflare install healthcare/hospital-workflow
#        aflare run hospital-workflow/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: code_interpreter
      max_iterations: 3
    input: |
      Analyze the current hospital department workflow and identify bottlenecks.

      Department: {{ .params.department }}
      Current workflow: {{ .params.current_workflow }}
      Staff count: {{ .params.staff_count }}
      Patient volume: {{ .params.patient_volume }}
      Average wait time: {{ .params.avg_wait_time }}
      Peak hours: {{ .params.peak_hours }}
      Resources: {{ .params.resources }}
      KPIs: {{ .params.kpis }}

      Analyze:
      1. Process flow mapping (current state)
      2. Bottleneck identification
      3. Wait time analysis by step
      4. Resource utilization assessment
      5. Staff workload distribution
      6. Handoff points and communication gaps
      7. Compliance and safety checkpoints
    id: workflow_analysis

  - node: code_interpreter
    params:
      language: python
      timeout: 30s
    input: |
      import json

      analysis = {{ .workflow_analysis | toJSON }}

      # Calculate efficiency metrics
      steps = analysis.get("workflow_steps", [])
      bottlenecks = analysis.get("bottlenecks", [])

      total_steps = len(steps)
      bottleneck_count = len(bottlenecks)
      bottleneck_pct = (bottleneck_count / total_steps * 100) if total_steps > 0 else 0

      total_wait = sum(s.get("wait_time_minutes", 0) for s in steps)
      avg_wait_per_step = total_wait / total_steps if total_steps > 0 else 0

      # Calculate efficiency score
      efficiency_score = max(0, 100 - (bottleneck_pct * 2) - (avg_wait_per_step * 2))

      # Staffing optimization
      staff_needed = analysis.get("recommended_staff", {{ .params.staff_count }})
      staff_gap = staff_needed - int({{ .params.staff_count }})

      optimization_opportunities = []
      if bottleneck_pct > 20:
          optimization_opportunities.append("Process redesign")
      if staff_gap > 0:
          optimization_opportunities.append(f"Add {staff_gap} staff members")
      if avg_wait_per_step > 15:
          optimization_opportunities.append("Task automation")
      if analysis.get("handoff_issues"):
          optimization_opportunities.append("Improve handoff protocols")

      print(json.dumps({
          "total_steps": total_steps,
          "bottleneck_count": bottleneck_count,
          "bottleneck_pct": round(bottleneck_pct, 1),
          "total_wait_minutes": total_wait,
          "avg_wait_per_step": round(avg_wait_per_step, 1),
          "efficiency_score": round(efficiency_score, 1),
          "current_staff": int({{ .params.staff_count }}),
          "recommended_staff": staff_needed,
          "staff_gap": staff_gap,
          "optimization_opportunities": optimization_opportunities
      }))
    id: efficiency_metrics

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 2
    input: |
      Generate an optimized workflow and implementation plan.

      Workflow analysis: {{ .workflow_analysis }}
      Efficiency metrics: {{ .efficiency_metrics }}
      Department: {{ .params.department }}

      Create:
      1. Optimized workflow (future state map)
      2. Step-by-step implementation plan
      3. Staff redistribution recommendations
      4. Technology/automation recommendations
      5. Training requirements
      6. Timeline for changes
      7. Expected improvements (quantified)
      8. Risk mitigation plan
    id: optimized_workflow

  - node: file_write
    params:
      path: "{{ .params.output_path | default \"hospital-workflow-report.md\" }}"
    input: |
      # HOSPITAL WORKFLOW OPTIMIZATION REPORT
      ---
      **Department:** {{ .params.department }}
      **Current Efficiency Score:** {{ .efficiency_metrics.efficiency_score }}/100
      **Bottlenecks Identified:** {{ .efficiency_metrics.bottleneck_count }}
      **Staff Gap:** {{ .efficiency_metrics.staff_gap }}

      ## Current State Analysis
      {{ .workflow_analysis }}

      ## Efficiency Metrics
      | Metric | Current | Target |
      |--------|---------|--------|
      | Total Steps | {{ .efficiency_metrics.total_steps }} | {{ .optimized_workflow.target_steps }} |
      | Bottleneck % | {{ .efficiency_metrics.bottleneck_pct }}% | <10% |
      | Avg Wait/Step | {{ .efficiency_metrics.avg_wait_per_step }} min | <10 min |
      | Staff | {{ .efficiency_metrics.current_staff }} | {{ .efficiency_metrics.recommended_staff }} |
      | Total Wait Time | {{ .efficiency_metrics.total_wait_minutes }} min | {{ .optimized_workflow.target_wait }} min |

      ## Optimization Plan
      {{ .optimized_workflow }}

      ## Implementation Timeline
      {{ .optimized_workflow.timeline }}

      ---
      *Review with department leadership before implementation. Monitor KPIs post-implementation.*
    id: save_report