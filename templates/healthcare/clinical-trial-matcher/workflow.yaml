name: Clinical Trial Matcher
# Match patients to relevant clinical trials
# Usage: aflare install healthcare/clinical-trial-matcher
#        aflare run clinical-trial-matcher/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: http_request
      max_iterations: 3
    input: |
      Extract structured eligibility criteria from the patient profile.

      Condition: {{ .params.condition }}
      Age: {{ .params.age }}
      Gender: {{ .params.gender }}
      Stage/Severity: {{ .params.stage }}
      Prior treatments: {{ .params.prior_treatments }}
      Genetic markers: {{ .params.genetic_markers }}
      Location: {{ .params.location }}

      Generate:
      1. Primary condition keywords for search
      2. Inclusion criteria summary
      3. Exclusion criteria based on history
      4. Geographic search radius preference
    id: patient_criteria

  - node: http_request
    params:
      url: "https://clinicaltrials.gov/api/v2/studies?query.cond={{ .params.condition | urlquery }}&filter.overallStatus=RECRUITING&filter.geo={{ .params.location | urlquery }}&pageSize=20&format=json"
      method: GET
      timeout: 30s
    id: trial_search

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: code_interpreter
      max_iterations: 4
    input: |
      Match the patient against the retrieved clinical trials.

      Patient criteria: {{ .patient_criteria }}
      Trial search results: {{ .trial_search }}

      For each trial, evaluate:
      1. Eligibility match score (0-100)
      2. Key inclusion criteria met
      3. Key exclusion criteria that may disqualify
      4. Distance from patient location
      5. Phase and intervention type
      6. Enrollment status and contact info

      Rank trials by match score and provide top 10 matches.
    id: trial_matches

  - node: code_interpreter
    params:
      language: python
      timeout: 30s
    input: |
      import json

      matches = {{ .trial_matches | toJson }}

      ranked = sorted(matches.get("trials", []), key=lambda x: x.get("match_score", 0), reverse=True)[:10]

      summary = {
          "total_trials_found": matches.get("total_count", 0),
          "high_match": len([t for t in ranked if t.get("match_score", 0) >= 80]),
          "moderate_match": len([t for t in ranked if 50 <= t.get("match_score", 0) < 80]),
          "low_match": len([t for t in ranked if t.get("match_score", 0) < 50]),
          "top_trials": ranked
      }

      print(json.dumps(summary))
    id: match_summary

  - node: transform
    params:
      template: |
        # Clinical Trial Matching Report
        ---
        **Patient Condition:** {{ .params.condition }}
        **Location:** {{ .params.location }}
        **Total Trials Found:** {{ .match_summary.total_trials_found }}
        **High Matches:** {{ .match_summary.high_match }}
        **Moderate Matches:** {{ .match_summary.moderate_match }}

        ## Top Matching Trials
        {{ range .match_summary.top_trials }}
        ### {{ .title }} (Score: {{ .match_score }}%)
        - **NCT ID:** {{ .nct_id }}
        - **Phase:** {{ .phase }}
        - **Status:** {{ .status }}
        - **Location:** {{ .location }}
        - **Contact:** {{ .contact }}
        - **Summary:** {{ .brief_summary }}
        {{ end }}

        ## Next Steps
        1. Review eligibility criteria with your oncologist/specialist
        2. Contact trial coordinators for pre-screening
        3. Gather required medical records
        4. Discuss travel/logistics for trial sites

        ---
        *Data sourced from ClinicalTrials.gov. Verify all details with trial coordinators.*
    input:
      match_summary: match_summary
    id: trial_report

  - node: file_write
    params:
      path: "{{ .params.output_path | default \"clinical-trial-matches.md\" }}"
    input: trial_report
    id: save_report