name: Personalized Nutrition & Diet Plan
# Generate personalized nutrition and diet plans
# Usage: aflare install healthcare/nutrition-plan
#        aflare run nutrition-plan/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: http_request, code_interpreter
      max_iterations: 4
    input: |
      Assess the patient's nutritional needs and create a dietary profile.

      Age: {{ .params.age }}
      Gender: {{ .params.gender }}
      Height: {{ .params.height_cm }}
      Weight: {{ .params.weight_kg }}
      Activity level: {{ .params.activity_level }}
      Dietary preferences: {{ .params.dietary_preferences }}
      Food allergies: {{ .params.food_allergies }}
      Medical conditions: {{ .params.medical_conditions }}
      Health goals: {{ .params.health_goals }}
      Current diet: {{ .params.current_diet }}

      Assess:
      1. BMI calculation and weight status
      2. Estimated daily caloric needs (TDEE)
      3. Macronutrient targets (protein, carbs, fats)
      4. Micronutrient needs based on age/gender/conditions
      5. Dietary restrictions and modifications needed
      6. Meal timing and frequency recommendations
      7. Hydration goals
      8. Supplement considerations
    id: nutritional_assessment

  - node: code_interpreter
    params:
      language: python
      timeout: 30s
    input: |
      import json
      import math

      height_cm = float({{ .params.height_cm }})
      weight_kg = float({{ .params.weight_kg }})
      age = int({{ .params.age }})
      gender = "{{ .params.gender }}"
      activity = "{{ .params.activity_level }}"

      # BMI Calculation
      height_m = height_cm / 100
      bmi = weight_kg / (height_m ** 2)

      bmi_category = "normal"
      if bmi < 18.5:
          bmi_category = "underweight"
      elif bmi < 25:
          bmi_category = "normal"
      elif bmi < 30:
          bmi_category = "overweight"
      else:
          bmi_category = "obese"

      # BMR (Mifflin-St Jeor)
      if gender.lower() == "male":
          bmr = (10 * weight_kg) + (6.25 * height_cm) - (5 * age) + 5
      else:
          bmr = (10 * weight_kg) + (6.25 * height_cm) - (5 * age) - 161

      # TDEE
      activity_factors = {
          "sedentary": 1.2,
          "light": 1.375,
          "moderate": 1.55,
          "active": 1.725,
          "very_active": 1.9
      }
      tdee = bmr * activity_factors.get(activity, 1.2)

      # Macronutrient targets (based on health goals)
      protein_g = weight_kg * 1.6  # g per kg
      fat_g = (tdee * 0.25) / 9     # 25% of calories from fat
      carb_g = (tdee - (protein_g * 4) - (fat_g * 9)) / 4

      print(json.dumps({
          "bmi": round(bmi, 1),
          "bmi_category": bmi_category,
          "bmr": round(bmr),
          "tdee": round(tdee),
          "protein_target_g": round(protein_g),
          "fat_target_g": round(fat_g),
          "carb_target_g": round(carb_g),
          "protein_calories": round(protein_g * 4),
          "fat_calories": round(fat_g * 9),
          "carb_calories": round(carb_g * 4)
      }))
    id: calorie_calculation

  - node: http_request
    params:
      url: "https://api.nal.usda.gov/fdc/v1/foods/search?query={{ .params.dietary_preferences | urlquery }}&pageSize=5&api_key={{ .params.usda_api_key }}"
      method: GET
      timeout: 15s
    id: food_database

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 3
    input: |
      Create a detailed 7-day meal plan based on the nutritional assessment.

      Nutritional assessment: {{ .nutritional_assessment }}
      Calorie calculations: {{ .calorie_calculation }}
      Food database: {{ .food_database }}
      Dietary preferences: {{ .params.dietary_preferences }}
      Health goals: {{ .params.health_goals }}

      Generate:
      1. 7-day meal plan (breakfast, lunch, dinner, 2 snacks)
      2. Portion sizes and calorie estimates per meal
      3. Grocery shopping list organized by category
      4. Meal prep tips for the week
      5. Healthy substitutions for common cravings
      6. Eating out guidelines
      7. Progress tracking suggestions
    id: meal_plan

  - node: file_write
    params:
      path: "{{ .params.output_path | default \"nutrition-plan.md\" }}"
    input: |
      # PERSONALIZED NUTRITION PLAN
      ---
      **BMI:** {{ .calorie_calculation.bmi }} ({{ .calorie_calculation.bmi_category }})
      **Daily Calorie Target:** {{ .calorie_calculation.tdee }} kcal
      **Protein:** {{ .calorie_calculation.protein_target_g }}g | **Carbs:** {{ .calorie_calculation.carb_target_g }}g | **Fat:** {{ .calorie_calculation.fat_target_g }}g

      ## Nutritional Assessment
      {{ .nutritional_assessment }}

      ## 7-Day Meal Plan
      {{ .meal_plan }}

      ---
      *Consult a registered dietitian before making significant dietary changes, especially with medical conditions.*
    id: save_plan