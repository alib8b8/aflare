name: Mental Health Screening Questionnaire
# Mental health screening with validated assessment tools
# Usage: aflare install healthcare/mental-health-screener
#        aflare run mental-health-screener/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: code_interpreter
      max_iterations: 3
    input: |
      Administer a mental health screening based on the specified assessment tool.

      Screening tool: {{ .params.screening_tool }}
      Patient responses: {{ .params.responses }}
      Patient demographics: {{ .params.demographics }}
      Reason for screening: {{ .params.reason }}
      Previous screening scores: {{ .params.previous_scores }}

      For the {{ .params.screening_tool }} assessment:
      1. Score each item according to the validated scoring rubric
      2. Calculate total and subscale scores
      3. Interpret scores against clinical thresholds
      4. Identify areas of concern
      5. Compare with previous scores if available
      6. Recommend appropriate level of care
      7. Note any critical items (suicidal ideation, self-harm)
    id: screening_results

  - node: code_interpreter
    params:
      language: python
      timeout: 30s
    input: |
      import json

      results = {{ .screening_results | toJson }}
      tool = "{{ .params.screening_tool }}"

      # Define thresholds for common screening tools
      thresholds = {
          "PHQ-9": {"minimal": 4, "mild": 9, "moderate": 14, "moderately_severe": 19, "severe": 27},
          "GAD-7": {"minimal": 4, "mild": 9, "moderate": 14, "severe": 21},
          "PHQ-2": {"negative": 2, "positive": 6},
      }

      total_score = results.get("total_score", 0)
      critical_items = results.get("critical_items", [])

      severity = "minimal"
      if tool in thresholds:
          for level, cutoff in sorted(thresholds[tool].items(), key=lambda x: x[1]):
              if total_score >= cutoff:
                  severity = level

      risk_level = "low"
      if critical_items:
          risk_level = "high"
      elif severity in ["severe", "moderately_severe"]:
          risk_level = "high"
      elif severity == "moderate":
          risk_level = "medium"

      care_recommendation = "routine"
      if risk_level == "high":
          care_recommendation = "immediate_psychiatric_evaluation"
      elif risk_level == "medium":
          care_recommendation = "mental_health_referral"
      elif severity == "mild":
          care_recommendation = "watchful_waiting"

      print(json.dumps({
          "total_score": total_score,
          "severity": severity,
          "risk_level": risk_level,
          "care_recommendation": care_recommendation,
          "critical_items": critical_items,
          "tool": tool,
          "subscale_scores": results.get("subscale_scores", {})
      }))
    id: score_analysis

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 2
    input: |
      Generate patient-friendly results and resources.

      Screening results: {{ .screening_results }}
      Score analysis: {{ .score_analysis }}

      Create:
      1. Plain-language explanation of screening results
      2. What the scores mean (without alarming the patient)
      3. Evidence-based self-care strategies
      4. When to seek professional help
      5. Crisis resources (hotlines, text lines)
      6. Recommended follow-up steps
    id: patient_guidance

  - node: file_write
    params:
      path: "{{ .params.output_path | default \"mental-health-screening.md\" }}"
    input: |
      # MENTAL HEALTH SCREENING REPORT
      ---
      **Screening Tool:** {{ .score_analysis.tool }}
      **Date:** {{ .params.screening_date }}
      **Total Score:** {{ .score_analysis.total_score }}
      **Severity:** {{ .score_analysis.severity | upper }}
      **Risk Level:** {{ .score_analysis.risk_level | upper }}
      **Recommendation:** {{ .score_analysis.care_recommendation }}

      ## Clinical Results
      {{ .screening_results }}

      ## Subscale Analysis
      {{ range $key, $value := .score_analysis.subscale_scores }}
      - **{{ $key }}:** {{ $value }}
      {{ end }}

      ## Critical Items
      {{ if .score_analysis.critical_items }}
      **IMMEDIATE ATTENTION REQUIRED:**
      {{ range .score_analysis.critical_items }}
      - {{ . }}
      {{ end }}
      {{ else }}
      No critical items identified.
      {{ end }}

      ## Patient Guidance
      {{ .patient_guidance }}

      ---
      **Crisis Resources:**
      - National Suicide Prevention Lifeline: 988
      - Crisis Text Line: Text HOME to 741741
      - Emergency: Call 911 or go to nearest ER

      *This screening is not a diagnosis. Follow up with a mental health professional.*
    id: save_report