name: Microservices Architecture
# Generate microservices architecture design
# Usage: aflare install backend/microservices-design
#        aflare run microservices-design/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 4
    input: |
      Design a microservices architecture for {{ .params.system }}.
      
      System: {{ .params.system }}
      Domain: {{ .params.domain }}
      Scale: {{ .params.scale }}
      Team size: {{ .params.teams }} teams
      
      Architecture should include:
      1. System Overview
         - Monolith vs microservices rationale
         - Service boundaries (by domain)
         - Bounded contexts
      2. Services Breakdown
         For each service:
         - Name and purpose
         - Owned data
         - API endpoints
         - Dependencies
         - Team ownership
      3. Communication Patterns
         - Sync (REST/gRPC)
         - Async (events/messaging)
         - Event storming results
         - Event schema
      4. API Gateway
         - Routing
         - Authentication
         - Rate limiting
         - Aggregation
      5. Data Management
         - Database per service pattern
         - Saga pattern for distributed transactions
         - CQRS patterns
      6. Infrastructure
         - Container orchestration
         - Service mesh
         - Service discovery
         - Load balancing
      7. Observability
         - Logging
         - Metrics
         - Distributed tracing
         - Alerting
      8. Resilience
         - Circuit breakers
         - Retry policies
         - Fallbacks
         - Bulkheads
      9. Deployment
         - CI/CD per service
         - Blue/green deployments
         - Feature flags
      10. Security
         - Service-to-service auth
         - API security
         - Secrets management
      
      Be thorough and practical.
    id: microservices

  - node: file_write
    params:
      path: microservices-architecture.md
    input: microservices
    id: save

  - node: notify
    params:
      channel: stdout
    input: microservices
    id: notify
