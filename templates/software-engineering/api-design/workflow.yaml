name: REST API Design Guide
# Generate RESTful API design specification
# Usage: llm-box install api-development/api-design
#        llm-box run api-design/workflow.yaml

steps:
  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 4
    input: |
      Design a comprehensive RESTful API for {{ .params.product }}.
      
      Product: {{ .params.product }}
      Domain: {{ .params.domain }}
      Users: {{ .params.users }}
      
      API design should include:
      1. API Overview
         - Purpose and goals
         - API philosophy (REST, versioning strategy)
         - Base URL format
      2. Core Resources
         - List of main resources
         - Resource relationships
      3. Endpoint Reference
         For each endpoint:
         - HTTP method and path
         - Description
         - Authentication required
         - Request parameters
         - Request body schema
         - Response format
         - Response status codes
         - Example request/response
      4. Authentication & Authorization
         - Auth strategy
         - Token format
         - Permission model
      5. Error Handling
         - Error response format
         - Common error codes
         - Rate limiting
      6. Pagination & Filtering
         - Pagination strategy
         - Filtering options
         - Sorting
      7. API Versioning Strategy
      8. SDK Generation Plan
      9. Testing Strategy
      10. Performance Guidelines
      
      Aim for 20-30 endpoints covering CRUD for all major resources.
    id: api_design

  - node: file_write
    params:
      path: api-design.md
    input: api_design
    id: save

  - node: notify
    params:
      channel: stdout
    input: api_design
    id: notify
