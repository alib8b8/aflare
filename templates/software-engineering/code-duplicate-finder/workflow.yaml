name: Code Duplicate Finder
# Scan codebase for duplicated code patterns
# Usage: aflare install developer-tools/code-duplicate-finder
#        aflare run code-duplicate-finder/workflow.yaml

steps:
  - node: execute
    params:
      command: find . -name "*.go" -type f | head -50
    id: file_list

  - node: execute
    params:
      command: wc -l $(find . -name "*.go" -type f) | sort -rn | head -20
    id: file_stats

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: file_read, template_render
      max_iterations: 5
    input: |
      Analyze these Go files and identify potential code duplication patterns:
      File list: {{ .file_list }}
      File stats: {{ .file_stats }}
      
      List top 5 most likely duplication candidates with file paths
    id: analysis

  - node: file_write
    params:
      path: code-duplication-report.md
    input: analysis
    id: save
