name: ascend-quick-adapt
description: |
  昇腾 NPU 模型适配 - 快速适配工作流。
  仅 4 步（搜索 → 验证 → 适配 → 文档），1 小时内完成模型可行性验证。
  适用于 Demo 跑通、迁移可行性评估、快速产出最小适配报告。
  输入：模型名称（如 Qwen2.5-7B-Instruct）。
# 用法:
#   llm-box run ascend-adapt/quick-adapt/workflow.yaml --input "Qwen2.5-7B-Instruct"
#   llm-box run ascend-adapt/quick-adapt/workflow.yaml --input "ChatGLM3-6B" --set target_npu=910B

inputs:
  model: "Qwen2.5-7B-Instruct"      # 待适配的模型名称
  target_npu: "800I-A2"             # 目标 NPU: 910B / 910C / 800I-A2 / 310P
  framework: "pytorch"              # 开发框架: pytorch / mindspore

steps:
  # ============================================================
  # 步骤 1：模型搜索 Agent
  # 在 AtomGit / HuggingFace 检索候选模型，输出模型卡与下载地址
  # ============================================================
  - id: search_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「模型搜索 Agent」。
        职责：根据输入的模型名称，优先在 AtomGit 检索，回退到 HuggingFace，
        快速定位模型下载地址与基础模型卡。
        输出 JSON：{"query": "...", "source": "...", "limit": 5}
      model: qwen2.5-7b
      prompt: |
        待适配模型：{{input}}
        目标硬件：{{target_npu}}
        请快速制定搜索策略（快速模式，limit=5）。
    depends_on: []

  - id: search
    node: ascend_model_search
    params:
      query: "{{input}}"
      source: "atomgit/huggingface"
      limit: 5
    depends_on: [search_plan]

  # ============================================================
  # 步骤 2：模型验证 Agent
  # 校验模型文件完整性、License 合规性、昇腾兼容性预检
  # ============================================================
  - id: verify_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「模型验证 Agent」。
        职责：快速校验权重完整性、config.json、tokenizer、License，
        并给出昇腾兼容性预检结论（low/medium/high 风险）。
        输出 JSON：{"source": "...", "compatibility_risk": "...", "blockers": [...]}
      model: qwen2.5-7b
      prompt: |
        模型：{{input}}
        搜索结果：{{step.search}}
        请快速验证并给出兼容性预检结论。
    depends_on: [search]

  - id: verify
    node: ascend_model_verify
    params:
      model_name: "{{input}}"
      source: "atomgit/huggingface"
    depends_on: [verify_plan]

  # ============================================================
  # 步骤 3：模型适配 Agent
  # 将模型迁移到昇腾 NPU，auto 策略优先使用原生适配
  # ============================================================
  - id: adapt_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「模型适配 Agent」。
        职责：快速模式下使用 auto 策略，优先调用 torch_npu / mindspore 原生适配路径，
        仅记录关键算子替换与风险点，不做深度图改写。
        输出 JSON：{"strategy": "auto", "framework": "...", "target_npu": "...", "risk_ops": [...]}
      model: qwen2.5-7b
      prompt: |
        模型：{{input}}
        框架：{{framework}}
        目标 NPU：{{target_npu}}
        验证结果：{{step.verify}}
        请使用 auto 策略快速完成适配规划。
    depends_on: [verify]

  - id: adapt
    node: ascend_model_adapt
    params:
      model_name: "{{input}}"
      framework: "{{framework}}"
      strategy: "auto"
      target_npu: "{{target_npu}}"
    depends_on: [adapt_plan]

  # ============================================================
  # 步骤 4：文档生成 Agent
  # 汇总前三步产物，生成最小可行适配报告（含复现步骤）
  # ============================================================
  - id: doc_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「文档生成 Agent」。
        职责：快速模式下生成精简版适配报告，包含模型卡、适配路径、
        兼容性结论、复现步骤。Benchmark 可选（快速模式默认 false，待性能调优阶段补充）。
        输出 JSON：{"format": "markdown", "include_benchmark": false, "sections": [...]}
      model: qwen2.5-7b
      prompt: |
        模型：{{input}}
        硬件：{{target_npu}}
        框架：{{framework}}
        请汇总以下产物生成快速适配报告：
        - 搜索结果：{{step.search}}
        - 验证结果：{{step.verify}}
        - 适配结果：{{step.adapt}}
    depends_on: [adapt]

  - id: doc
    node: ascend_model_doc
    params:
      model_name: "{{input}}"
      format: "markdown"
      include_benchmark: false
    depends_on: [doc_plan]

# 最终输出：快速适配报告（最小可行，不含 Benchmark）
output: "{{step.doc}}"
