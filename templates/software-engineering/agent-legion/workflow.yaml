name: Agent Legion - Multi-Agent Software Development
# Inspired by superset-sh/superset: multiple coding agents collaborating
# Deploy an army of coding agents to build features, review code, and ship
# Usage: llm-box install development/agent-legion
#        llm-box run agent-legion/workflow.yaml

steps:
  - node: file_read
    params:
      path: "{{ .params.spec_file }}"
    id: spec

  - node: supervisor
    params:
      strategy: swarm
      domain: software
      specialists: frontend_developer,backend_developer,devops_engineer,architect,qa_engineer,tech_lead,security_expert,technical_writer
    input: |
      Deploy Agent Legion to implement this feature:

      SPEC:
      {{ .spec }}

      Technology stack: {{ .params.tech_stack }}
      Codebase: {{ .params.codebase_path }}

      You have 8 specialist agents. Coordinate them as a SWARM:

      🏗️ ARCHITECT
      - Design overall architecture
      - Define module boundaries and interfaces
      - Choose patterns and data structures
      - Produce architecture diagram (Mermaid)

      🔧 BACKEND DEVELOPER
      - Implement core business logic
      - Create APIs and data models
      - Handle persistence and caching
      - Write unit tests

      🎨 FRONTEND DEVELOPER
      - Implement UI components
      - Handle state management
      - Create responsive layouts
      - Write component tests

      ⚙️ DEVOPS ENGINEER
      - Set up CI/CD pipeline
      - Configure Docker/Kubernetes
      - Set up monitoring and logging
      - Handle deployment

      🔍 QA ENGINEER
      - Write integration tests
      - Perform edge case testing
      - Test error handling
      - Create test coverage report

      🔒 SECURITY EXPERT
      - Audit code for vulnerabilities
      - Check input validation
      - Review authentication/authorization
      - Perform dependency scan

      📝 TECHNICAL WRITER
      - Write API documentation
      - Create README and usage guides
      - Document architecture decisions
      - Write inline code comments

      👨‍💼 TECH LEAD (coordinator)
      - Review all outputs
      - Enforce code quality standards
      - Ensure consistency across modules
      - Resolve disagreements between agents
      - Final integration check

      Communication protocol:
      1. Architects broadcasts design to all
      2. Backend and Frontend work in parallel, direct-messaging each other
      3. DevOps works independently but checks shared blackboard for requirements
      4. QA and Security review code as it's written (continuous)
      5. Tech Lead does final review and integration

      Produce:
      - Architecture document
      - All source code files
      - Test suite
      - CI/CD configuration
      - Documentation
      - Security audit report
      - Final integration review
    id: legion_output

  - node: verify
    params:
      verify_type: code_correctness
      output_format: detailed
    input: |
      Verify this Agent Legion output:

      {{ .legion_output }}

      Check:
      1. Do all modules have consistent interfaces?
      2. Is error handling comprehensive?
      3. Are there any security issues?
      4. Is the code properly tested?
      5. Is documentation complete?
      6. Can the code actually compile/run?
    id: verification

  - node: file_write
    params:
      path: agent-legion-output.md
    input: legion_output
    id: save

  - node: notify
    params:
      channel: stdout
    input: legion_output
    id: notify
