name: Dotfiles Manager
# Manage and backup dotfiles
# Usage: llm-box install environment-setup/dotfiles-manager
#        llm-box run dotfiles-manager/workflow.yaml

steps:
  - node: execute
    params:
      command: |
        echo "=== Home dir dotfiles ==="
        ls -la ~/.* 2>/dev/null | head -40
        echo ""
        echo "=== Config dirs ==="
        ls ~/.config/ 2>/dev/null
    id: dotfiles_list

  - node: execute
    params:
      command: |
        BACKUP_DIR="{{ .params.backup_dir }}/dotfiles-$(date +%Y%m%d)"
        mkdir -p "$BACKUP_DIR"
        # Backup common dotfiles
        for f in ~/.bashrc ~/.bash_profile ~/.zshrc ~/.vimrc ~/.gitconfig ~/.tmux.conf ~/.profile ~/.aliases; do
          [ -f "$f" ] && cp "$f" "$BACKUP_DIR/"
        done
        # Backup .config directories
        for d in nvim fish starship kitty; do
          [ -d ~/.config/$d ] && cp -r ~/.config/$d "$BACKUP_DIR/"
        done
        echo "Backup complete: $BACKUP_DIR"
        ls -la "$BACKUP_DIR"
    id: backup

  - node: template_render
    params:
      template: |
        # Dotfiles Backup Report
        Date: {{ .date }}
        
        Backup location: {{ .params.backup_dir }}
        
        ## Backup Contents
        {{ .backup }}
        
        ## Original Dotfiles Found
        {{ .dotfiles_list }}
    id: report

  - node: file_write
    params:
      path: dotfiles-backup-report.md
    input: report
    id: save

  - node: notify
    params:
      channel: stdout
    input: report
    id: notify
