name: Dotfiles Manager
# Manage and backup dotfiles
# Usage: aflare install environment-setup/dotfiles-manager
#        aflare run dotfiles-manager/workflow.yaml

steps:
  - node: execute
    params:
      command: |
        echo "=== Home dir dotfiles ==="
        ls -la ~/.* 2>/dev/null | head -40
        echo ""
        echo "=== Config dirs ==="
        ls ~/.config/ 2>/dev/null
    id: dotfiles_list

  - node: code_interpreter
    params:
      language: python
      code: |
        import os, shutil, datetime, glob

        backup_dir = os.path.join("{{ .params.backup_dir }}", f"dotfiles-{datetime.date.today().strftime('%Y%m%d')}")
        os.makedirs(backup_dir, exist_ok=True)

        # Backup common dotfiles
        home = os.path.expanduser("~")
        dotfiles = [".bashrc", ".bash_profile", ".zshrc", ".vimrc", ".gitconfig", ".tmux.conf", ".profile", ".aliases"]
        for f in dotfiles:
            src = os.path.join(home, f)
            if os.path.isfile(src):
                shutil.copy2(src, backup_dir)

        # Backup .config directories
        config_dirs = ["nvim", "fish", "starship", "kitty"]
        for d in config_dirs:
            src = os.path.join(home, ".config", d)
            if os.path.isdir(src):
                shutil.copytree(src, os.path.join(backup_dir, d), dirs_exist_ok=True)

        print(f"Backup complete: {backup_dir}")
        for item in os.listdir(backup_dir):
            print(item)
    id: backup

  - node: template_render
    params:
      template: |
        # Dotfiles Backup Report
        Date: {{ .date }}
        
        Backup location: {{ .params.backup_dir }}
        
        ## Backup Contents
        {{ .backup }}
        
        ## Original Dotfiles Found
        {{ .dotfiles_list }}
    id: report

  - node: file_write
    params:
      path: dotfiles-backup-report.md
    input: report
    id: save

  - node: notify
    params:
      channel: stdout
    input: report
    id: notify
