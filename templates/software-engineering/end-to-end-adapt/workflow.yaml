name: ascend-end-to-end-adapt
description: |
  昇腾 NPU 模型适配 - 端到端模型适配工作流（全流程）。
  串联七大 Agent 完成从搜索到文档的全流程：
  搜索 → 验证 → 适配 → 量化 → 调优 → 部署 → 文档。
  输入：模型名称（如 Qwen2.5-7B-Instruct），可选目标硬件与框架。
# 用法:
#   aflare run ascend-adapt/end-to-end-adapt/workflow.yaml --input "Qwen2.5-7B-Instruct"
#   aflare run ascend-adapt/end-to-end-adapt/workflow.yaml --input "Qwen2.5-14B-Instruct" --set target_npu=910C

inputs:
  model: "Qwen2.5-7B-Instruct"      # 待适配的模型名称
  target_npu: "800I-A2"             # 目标 NPU: 910B / 910C / 800I-A2 / 310P
  framework: "pytorch"              # 开发框架: pytorch / mindspore
  quantize_method: "w8a8"           # 量化方法: int8 / fp8 / w8a8
  deploy_port: 8080                 # 部署服务端口

steps:
  # ============================================================
  # 阶段 1：模型搜索 Agent
  # 在 AtomGit / HuggingFace 等模型源检索候选模型，输出模型卡与下载地址
  # ============================================================
  - id: search_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「模型搜索 Agent」。
        职责：根据输入的模型名称，制定检索策略，确定优先模型源（AtomGit 优先于 HuggingFace），
        并为 ascend_model_search 节点构造 query 与 source 参数。
        输出 JSON：{"query": "...", "source": "...", "limit": 10}
      model: qwen2.5-7b
      prompt: |
        待适配模型：{{input}}
        目标硬件：{{target_npu}}
        请制定模型搜索策略，优先在昇腾官方模型源 AtomGit 检索，回退到 HuggingFace。
    depends_on: []

  - id: search
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        print(json.dumps({
            'status': 'ascend_model_search_not_available',
            'message': 'Ascend NPU model search is not available in aflare. Please use AtomGit or HuggingFace directly.',
            'recommended_action': 'Search for the model on https://huggingface.co/ or https://atomgit.com/'
        }, ensure_ascii=False))
    id: ascend_model_search_unavailable
    depends_on: [search_plan]

  # ============================================================
  # 阶段 2：模型验证 Agent
  # 校验模型文件完整性、License 合规性、昇腾兼容性预检
  # ============================================================
  - id: verify_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「模型验证 Agent」。
        职责：基于搜索结果制定验证清单，检查权重完整性、config.json、tokenizer 文件、
        License 是否允许商用、是否已存在昇腾适配版本。
        输出 JSON：{"checklist": [...], "source": "...", "compatibility_risk": "low/medium/high"}
      model: qwen2.5-7b
      prompt: |
        基于搜索结果，验证模型 {{input}} 是否满足昇腾适配前置条件。
        搜索结果摘要：{{step.search}}
    depends_on: [search]

  - id: verify
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        print(json.dumps({
            'status': 'ascend_model_verify_not_available',
            'message': 'Ascend NPU model verification is not available in aflare.',
            'recommended_action': 'Manually verify model files, config.json, tokenizer, and license compatibility.'
        }, ensure_ascii=False))
    id: ascend_model_verify_unavailable
    depends_on: [verify_plan]

  # ============================================================
  # 阶段 3：模型适配 Agent
  # 将模型迁移到昇腾 NPU，处理算子替换、图改写、框架转换
  # ============================================================
  - id: adapt_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「模型适配 Agent」。
        职责：根据验证结果与目标硬件，选择适配策略（auto 自动 / manual 手动），
        规划算子替换、图改写、框架转换路径。auto 策略优先使用 torch_npu / mindspore 原生适配。
        输出 JSON：{"strategy": "auto", "framework": "...", "target_npu": "...", "risk_ops": [...]}
      model: qwen2.5-7b
      prompt: |
        模型：{{input}}
        框架：{{framework}}
        目标 NPU：{{target_npu}}
        验证结果：{{step.verify}}
        请制定适配策略。
    depends_on: [verify]

  - id: adapt
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        print(json.dumps({
            'status': 'ascend_model_adapt_not_available',
            'message': 'Ascend NPU model adaptation is not available in aflare.',
            'recommended_action': 'Use torch_npu or MindSpore for Ascend NPU adaptation. See: https://www.hiascend.com/'
        }, ensure_ascii=False))
    id: ascend_model_adapt_unavailable
    depends_on: [adapt_plan]

  # ============================================================
  # 阶段 4：模型量化 Agent
  # 对适配后模型执行 INT8 / FP8 / W8A8 量化，降低显存与延迟
  # ============================================================
  - id: quantize_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「模型量化 Agent」。
        职责：根据适配结果与硬件能力选择量化方法（int8 / fp8 / w8a8），
        800I A2 与 910C 优先 fp8，910B / 310P 优先 w8a8。
        选择校准数据集并预估精度损失。
        输出 JSON：{"method": "...", "calibration_dataset": "...", "expected_loss": ...}
      model: qwen2.5-7b
      prompt: |
        模型：{{input}}
        目标 NPU：{{target_npu}}
        用户期望量化方法：{{quantize_method}}
        适配结果：{{step.adapt}}
        请制定量化方案。
    depends_on: [adapt]

  - id: quantize
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        print(json.dumps({
            'status': 'ascend_model_quantize_not_available',
            'message': 'Ascend NPU model quantization is not available in aflare.',
            'recommended_action': 'Use Ascend ModelZoo or AMCT toolkit for quantization.'
        }, ensure_ascii=False))
    id: ascend_model_quantize_unavailable
    depends_on: [quantize_plan]

  # ============================================================
  # 阶段 5：性能调优 Agent
  # 针对 NPU 硬件特性进行算子融合、Graph 编译、吞吐/延迟优化
  # ============================================================
  - id: optimize_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「性能调优 Agent」。
        职责：基于量化结果制定调优方案，包括算子融合、Ascend Graph 编译、
        batch / 流水线配置、KV-Cache 优化。设定目标延迟与吞吐。
        输出 JSON：{"hardware": "...", "target_latency": ..., "target_throughput": ..., "techniques": [...]}
      model: qwen2.5-7b
      prompt: |
        模型：{{input}}
        硬件：{{target_npu}}
        量化结果：{{step.quantize}}
        请制定性能调优方案，目标首 token 延迟 < 100ms。
    depends_on: [quantize]

  - id: optimize
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        print(json.dumps({
            'status': 'ascend_model_optimize_not_available',
            'message': 'Ascend NPU performance optimization is not available in aflare.',
            'recommended_action': 'Use Ascend Graph Engine (GE) and AOE for performance tuning.'
        }, ensure_ascii=False))
    id: ascend_model_optimize_unavailable
    depends_on: [optimize_plan]

  # ============================================================
  # 阶段 6：模型部署 Agent
  # 基于 MindIE 等后端启动推理服务，输出可访问的 Endpoint
  # ============================================================
  - id: deploy_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「模型部署 Agent」。
        职责：基于调优结果选择推理后端（mindie 默认 / vllm-ascend），
        规划端口、并发、健康检查与回滚策略。
        输出 JSON：{"backend": "mindie", "port": ..., "replicas": 1, "health_path": "/health"}
      model: qwen2.5-7b
      prompt: |
        模型：{{input}}
        硬件：{{target_npu}}
        端口：{{deploy_port}}
        调优结果：{{step.optimize}}
        请制定部署方案。
    depends_on: [optimize]

  - id: deploy
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        print(json.dumps({
            'status': 'ascend_model_deploy_not_available',
            'message': 'Ascend NPU model deployment is not available in aflare.',
            'recommended_action': 'Use MindIE or vLLM-Ascend for inference deployment.'
        }, ensure_ascii=False))
    id: ascend_model_deploy_unavailable
    depends_on: [deploy_plan]

  # ============================================================
  # 阶段 7：文档生成 Agent
  # 自动生成适配报告、Benchmark 数据、复现指南（最终交付物）
  # ============================================================
  - id: doc_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「文档生成 Agent」。
        职责：汇总全流程产物，生成标准化测评报告（Markdown/HTML），
        包含：模型卡、适配路径、量化方案、Benchmark 数据、部署指南、复现步骤、风险说明。
        报告必须 include_benchmark=true。
        输出 JSON：{"format": "markdown", "include_benchmark": true, "sections": [...]}
      model: qwen2.5-7b
      prompt: |
        模型：{{input}}
        硬件：{{target_npu}}
        框架：{{framework}}
        请汇总以下产物生成测评报告：
        - 搜索结果：{{step.search}}
        - 验证结果：{{step.verify}}
        - 适配结果：{{step.adapt}}
        - 量化结果：{{step.quantize}}
        - 调优结果：{{step.optimize}}
        - 部署结果：{{step.deploy}}
    depends_on: [deploy]

  - id: doc
    node: code_interpreter
    params:
      language: python
      code: |
        import json
        print(json.dumps({
            'status': 'ascend_model_doc_not_available',
            'message': 'Ascend NPU documentation generation is not available in aflare.',
            'recommended_action': 'Generate documentation manually using the collected outputs.'
        }, ensure_ascii=False))
    id: ascend_model_doc_unavailable
    depends_on: [doc_plan]

# 最终输出：测评报告（含 Benchmark）
output: "{{step.doc}}"
