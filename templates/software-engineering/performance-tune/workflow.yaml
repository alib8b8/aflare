name: ascend-performance-tune
description: |
  昇腾 NPU 模型适配 - 性能调优工作流。
  5 步完成性能冲刺：适配 → 量化 → 调优 → 部署 → 文档。
  聚焦极致吞吐与延迟优化，适用于已通过基础适配、追求极致性能的模型。
  输入：模型名称 + 目标硬件（800I A2 或 310P）。
# 用法:
#   aflare run ascend-adapt/performance-tune/workflow.yaml --input "Qwen2.5-7B-Instruct" --set hardware=800I-A2
#   aflare run ascend-adapt/performance-tune/workflow.yaml --input "Qwen2.5-7B-Instruct" --set hardware=310P --set quantize_method=int8

inputs:
  model: "Qwen2.5-7B-Instruct"      # 待调优的模型名称
  hardware: "800I-A2"               # 目标硬件: 800I-A2 / 310P / 910B / 910C
  framework: "pytorch"              # 开发框架: pytorch / mindspore
  quantize_method: "fp8"            # 量化方法: int8 / fp8 / w8a8（800I-A2 推荐 fp8）
  target_latency: 50                # 目标首 token 延迟（ms）
  target_throughput: 100            # 目标吞吐（tokens/s）
  deploy_port: 8080                 # 部署服务端口

steps:
  # ============================================================
  # 步骤 1：模型适配 Agent
  # 将模型迁移到目标硬件（性能调优起点），auto 策略 + 目标硬件定向
  # ============================================================
  - id: adapt_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「模型适配 Agent」。
        职责：针对性能调优场景，使用 auto 策略快速完成基础适配，
        重点记录影响性能的关键算子（Attention / RMSNorm / RoPE），
        为后续量化与调优提供基线。
        输出 JSON：{"strategy": "auto", "framework": "...", "target_npu": "...", "perf_critical_ops": [...]}
      model: qwen2.5-7b
      prompt: |
        模型：{{input}}
        框架：{{framework}}
        目标硬件：{{hardware}}
        请完成基础适配，并标注性能关键算子，作为调优基线。
    depends_on: []

  - id: adapt
    node: ascend_model_adapt
    params:
      model_name: "{{input}}"
      framework: "{{framework}}"
      strategy: "auto"
      target_npu: "{{hardware}}"
    depends_on: [adapt_plan]

  # ============================================================
  # 步骤 2：模型量化 Agent
  # 按硬件能力选择量化方法：800I-A2/910C→fp8，910B→w8a8，310P→int8
  # ============================================================
  - id: quantize_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「模型量化 Agent」。
        职责：性能优先场景下选择低延迟量化方法：
        - 800I-A2 / 910C：fp8（原生支持，精度损失 < 1%）
        - 910B：w8a8（权重 + 激活 INT8）
        - 310P：int8（边缘极致压缩）
        选择校准数据集并预估精度与延迟收益。
        输出 JSON：{"method": "...", "calibration_dataset": "...", "expected_latency_gain": ..., "expected_loss": ...}
      model: qwen2.5-7b
      prompt: |
        模型：{{input}}
        硬件：{{hardware}}
        用户期望方法：{{quantize_method}}
        适配基线：{{step.adapt}}
        请制定性能优先的量化方案。
    depends_on: [adapt]

  - id: quantize
    node: ascend_model_quantize
    params:
      model_name: "{{input}}"
      method: "{{quantize_method}}"
      calibration_dataset: "c4-en-512"
    depends_on: [quantize_plan]

  # ============================================================
  # 步骤 3：性能调优 Agent（核心环节）
  # 算子融合、Ascend Graph 编译、batch/流水线、KV-Cache 优化
  # ============================================================
  - id: optimize_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「性能调优 Agent」——核心环节。
        职责：基于量化结果制定极致性能优化方案，包括：
        1. FlashAttention / FlashComm 算子融合
        2. Ascend Graph 整图编译（GE）与子图优化
        3. batch sizing 与多流流水线
        4. KV-Cache 内存复用与 PagedAttention
        5. 算子精度回退（高风险算子保留 FP16）
        目标延迟与吞吐由用户设定。
        输出 JSON：{"hardware": "...", "target_latency": ..., "target_throughput": ..., "techniques": [...], "fallback_ops": [...]}
      model: qwen2.5-7b
      prompt: |
        模型：{{input}}
        硬件：{{hardware}}
        目标延迟：{{target_latency}} ms
        目标吞吐：{{target_throughput}} tokens/s
        量化结果：{{step.quantize}}
        请制定极致性能调优方案，达成性能目标。
    depends_on: [quantize]

  - id: optimize
    node: ascend_model_optimize
    params:
      model_name: "{{input}}"
      hardware: "{{hardware}}"
      target_latency: "{{target_latency}}"
      target_throughput: "{{target_throughput}}"
    depends_on: [optimize_plan]

  # ============================================================
  # 步骤 4：模型部署 Agent
  # MindIE 后端启动高性能推理服务，输出可压测的 Endpoint
  # ============================================================
  - id: deploy_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「模型部署 Agent」。
        职责：基于调优结果部署高性能推理服务，配置多卡张量并行、
        连续批处理（continuous batching）、预热与压测入口。
        输出 JSON：{"backend": "mindie", "port": ..., "tensor_parallel": ..., "health_path": "/health", "bench_path": "/v1/completions"}
      model: qwen2.5-7b
      prompt: |
        模型：{{input}}
        硬件：{{hardware}}
        端口：{{deploy_port}}
        调优结果：{{step.optimize}}
        请部署高性能推理服务并准备压测入口。
    depends_on: [optimize]

  - id: deploy
    node: ascend_model_deploy
    params:
      model_name: "{{input}}"
      hardware: "{{hardware}}"
      port: "{{deploy_port}}"
      backend: "mindie"
    depends_on: [deploy_plan]

  # ============================================================
  # 步骤 5：文档生成 Agent
  # 生成性能调优报告 + 完整 Benchmark（最终交付物）
  # ============================================================
  - id: doc_plan
    node: agent
    params:
      system: |
        你是昇腾 NPU 模型适配的「文档生成 Agent」。
        职责：汇总调优全流程产物，生成性能调优报告，必须包含完整 Benchmark：
        - 首 token 延迟（TTFT）
        - 端到端延迟
        - 吞吐量（tokens/s）
        - 显存峰值
        - 与基线（FP16 未调优）的对比加速比
        - 调优技术清单与回退策略
        include_benchmark=true 必填。
        输出 JSON：{"format": "markdown", "include_benchmark": true, "sections": [...]}
      model: qwen2.5-7b
      prompt: |
        模型：{{input}}
        硬件：{{hardware}}
        框架：{{framework}}
        请汇总以下产物生成性能调优报告（含完整 Benchmark）：
        - 适配基线：{{step.adapt}}
        - 量化结果：{{step.quantize}}
        - 调优结果：{{step.optimize}}
        - 部署结果：{{step.deploy}}
    depends_on: [deploy]

  - id: doc
    node: ascend_model_doc
    params:
      model_name: "{{input}}"
      format: "markdown"
      include_benchmark: true
    depends_on: [doc_plan]

# 最终输出：性能调优报告 + 完整 Benchmark（性能调优交付物）
output: "{{step.doc}}"
