name: Git Commit Analyzer
# Analyze git commit history and generate changelog
# Usage: aflare install developer-tools/git-commit-analyzer
#        aflare run git-commit-analyzer/workflow.yaml

steps:
  - node: execute
    params:
      command: git log --pretty=format:"%h|%s|%an|%ad" --date=short -30
    id: git_log

  - node: agent
    params:
      provider: ollama
      model: llama3
      tools: template_render
      max_iterations: 2
    input: |
      Analyze these git commits and generate a categorized changelog:
      {{ .git_log }}
      
      Format with sections: Features, Bug Fixes, Improvements, Breaking Changes
    id: changelog

  - node: file_write
    params:
      path: changelog.md
    input: changelog
    id: save

  - node: notify
    params:
      channel: stdout
    input: changelog
    id: notify
