name: ccpa-compliance
description: "CCPA (California Consumer Privacy Act) compliance workflow"
version: "1.0.0"
params:
  - name: organization_name
    type: string
    required: true
    description: "Name of the organization"
  - name: annual_revenue
    type: number
    required: false
    description: "Annual gross revenue for threshold check"
  - name: consumer_data_volume
    type: integer
    required: false
    description: "Number of consumers whose data is processed annually"
  - name: data_sales
    type: boolean
    required: false
    default: false
    description: "Whether the organization sells personal information"
  - name: data_categories
    type: array
    required: true
    description: "Categories of personal information collected"

steps:
  - id: applicability_check
    node: agent
    description: "Determine if CCPA applies to the organization"
    params:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }}gpt-4{{ end }}'
      system_prompt: |
        You are a CCPA compliance expert. Determine if the organization meets CCPA applicability
        thresholds based on: annual revenue, data volume, and data sales. Provide a detailed
        applicability analysis with citation of relevant CCPA sections.
      prompt: |
        Organization: {{ .params.organization_name }}
        Annual revenue: {{ .params.annual_revenue }}
        Consumer data volume: {{ .params.consumer_data_volume }}
        Data sales: {{ .params.data_sales }}
        Determine CCPA applicability and scope.

  - id: rights_requirements
    node: agent
    description: "Map CCPA consumer rights requirements"
    params:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }}gpt-4{{ end }}'
      system_prompt: |
        You are a CCPA compliance specialist. For each CCPA consumer right, provide:
        the right description, implementation requirements, operational impact,
        required disclosures, and timeline for compliance. Cover: right to know,
        right to delete, right to opt-out, right to non-discrimination, and
        right to data portability.
      prompt: |
        Data categories: {{ .params.data_categories }}
        Data sales: {{ .params.data_sales }}
        Applicability: {{ index .steps.applicability_check.outputs "applicability" }}
        Map all CCPA consumer rights requirements.

  - id: notice_requirements
    node: agent
    description: "Generate required CCPA notice content"
    params:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }}gpt-4{{ end }}'
      system_prompt: |
        You are a privacy notice drafter. Generate the required CCPA notice content including:
        notice at collection, privacy policy updates, and opt-out notice. Ensure all required
        CCPA disclosures are included. Provide the notice text and implementation guidance.
      prompt: |
        Organization: {{ .params.organization_name }}
        Data categories: {{ .params.data_categories }}
        Data sales: {{ .params.data_sales }}
        Rights requirements: {{ index .steps.rights_requirements.outputs "rights" }}
        Generate required CCPA notices.

  - id: compliance_score
    node: code_interpreter
    description: "Calculate CCPA compliance score"
    params:
      language: python
      code: |
        import json
        rights = {{ index .steps.rights_requirements.outputs "rights" | toJson }}
        rights_list = rights if isinstance(rights, list) else rights.get("rights", [])
        total_rights = len(rights_list) if rights_list else 5
        # Each right has implementation steps; count compliance gaps
        implemented = sum(1 for r in rights_list if r.get("compliance_status") == "compliant") if rights_list else 3
        score = round((implemented / total_rights) * 100, 1)
        level = "Compliant" if score >= 90 else "Partially Compliant" if score >= 60 else "Non-Compliant"
        result = {
            "compliance_score": score,
            "status": level,
            "rights_assessed": total_rights,
            "rights_compliant": implemented
        }
        print(json.dumps(result, indent=2))

  - id: save_report
    node: file_write
    description: "Save CCPA compliance report"
    params:
      path: '{{ if .params.output_path }}{{ .params.output_path }}{{ else }}output/ccpa_compliance_report.md{{ end }}'
      content: |
        # CCPA Compliance Report
        ## Organization: {{ .params.organization_name }}
        
        ### Applicability
        {{ index .steps.applicability_check.outputs "applicability" }}
        
        ### Compliance Score
        {{ index .steps.compliance_score.outputs "compliance_score" }}
        
        ### Consumer Rights Requirements
        {{ index .steps.rights_requirements.outputs "rights" }}
        
        ### Required Notices
        {{ index .steps.notice_requirements.outputs "notices" }}