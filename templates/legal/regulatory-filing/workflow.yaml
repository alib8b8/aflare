name: regulatory-filing
description: "Regulatory filing preparation workflow"
version: "1.0.0"
params:
  - name: filing_type
    type: string
    required: true
    description: "Type of regulatory filing (SEC-10K, SEC-8K, FDA-510k, FCC, EPA, etc.)"
  - name: organization_name
    type: string
    required: true
    description: "Name of the filing organization"
  - name: reporting_period
    type: string
    required: false
    description: "Reporting period (e.g., FY2024, Q3-2025)"
  - name: jurisdiction
    type: string
    required: true
    description: "Regulatory jurisdiction"
  - name: data_points
    type: object
    required: false
    description: "Key data points for the filing"
  - name: deadline
    type: string
    required: false
    description: "Filing deadline (YYYY-MM-DD)"

steps:
  - id: fetch_requirements
    node: agent
    description: "Research filing requirements and latest forms"
    config:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }gpt-4{{ end }}'
      system_prompt: |
        You are a regulatory filing specialist. Provide the complete filing requirements
        for the specified filing type and jurisdiction. Include: required forms, sections,
        exhibits, certifications, fee schedules, formatting requirements, and submission
        instructions. Reference the latest regulatory guidance.
      prompt: |
        Filing type: {{ .params.filing_type }}
        Jurisdiction: {{ .params.jurisdiction }}
        Organization: {{ .params.organization_name }}
        Provide complete filing requirements and instructions.

  - id: draft_filing
    node: agent
    description: "Draft the regulatory filing content"
    config:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }gpt-4{{ end }}'
      system_prompt: |
        You are a regulatory filing drafter. Draft the complete filing document following
        the identified requirements. Include all required sections, disclosures, and
        certifications. Use the provided data points to populate the filing. Ensure
        compliance with formatting and submission standards.
      prompt: |
        Filing type: {{ .params.filing_type }}
        Organization: {{ .params.organization_name }}
        Reporting period: {{ .params.reporting_period }}
        Requirements: {{ index .steps.fetch_requirements.outputs "requirements" }}
        Data points: {{ .params.data_points }}
        Draft the complete regulatory filing.

  - id: compliance_check
    node: agent
    description: "Verify filing compliance and completeness"
    config:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }gpt-4{{ end }}'
      system_prompt: |
        You are a regulatory compliance reviewer. Verify the draft filing against all
        requirements. Check for: completeness, accuracy, compliance with disclosure
        requirements, proper formatting, required signatures, and timing requirements.
        Flag any issues or omissions that need correction before submission.
      prompt: |
        Filing: {{ index .steps.draft_filing.outputs "filing" }}
        Requirements: {{ index .steps.fetch_requirements.outputs "requirements" }}
        Filing type: {{ .params.filing_type }}
        Verify compliance and completeness.

  - id: save_filing
    node: file_write
    description: "Save the regulatory filing document"
    config:
      path: '{{ if .params.output_path }}{{ .params.output_path }}{{ else }output/regulatory_filing.md{{ end }}'
      content: |
        # {{ .params.filing_type }} Filing
        ## Organization: {{ .params.organization_name }}
        {{ if .params.reporting_period }}## Period: {{ .params.reporting_period }}{{ end }}
        {{ if .params.deadline }}## Deadline: {{ .params.deadline }}{{ end }}
        
        ## Filing Requirements
        {{ index .steps.fetch_requirements.outputs "requirements" }}
        
        ---
        
        {{ index .steps.draft_filing.outputs "filing" }}
        
        ---
        
        ## Compliance Review
        {{ index .steps.compliance_check.outputs "compliance_review" }}