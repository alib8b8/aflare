name: compliance-checklist
description: "Regulatory compliance checklist generator for any industry"
version: "1.0.0"
params:
  - name: industry
    type: string
    required: true
    description: "Industry sector"
  - name: regulations
    type: array
    required: true
    description: "List of applicable regulations"
  - name: organization_size
    type: string
    required: false
    default: "medium"
    description: "Organization size (small, medium, enterprise)"
  - name: regions
    type: array
    required: false
    default: ["US"]
    description: "Operating regions"
  - name: risk_profile
    type: string
    required: false
    default: "moderate"
    description: "Risk profile (low, moderate, high)"

steps:
  - id: fetch_regulatory_data
    node: http_request
    description: "Fetch latest regulatory updates for specified regulations"
    config:
      method: GET
      url: "https://api.regulations.gov/v4/documents?filter[searchTerm]={{ range $i, $r := .params.regulations }}{{ if $i }},{{ end }}{{ $r }}{{ end }}&sort=-lastModifiedDate&page[size]=10"
      headers:
        Accept: "application/json"

  - id: generate_checklist
    node: agent
    description: "Generate comprehensive compliance checklist"
    config:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }}gpt-4{{ end }}'
      system_prompt: |
        You are a regulatory compliance expert. Generate a comprehensive compliance checklist
        tailored to the organization's industry, size, and risk profile. For each requirement,
        provide: regulation reference, requirement description, compliance status indicator,
        evidence needed, responsible party, and priority level (Critical/High/Medium/Low).
        Organize by regulation and then by topic area.
      prompt: |
        Industry: {{ .params.industry }}
        Regulations: {{ .params.regulations }}
        Organization size: {{ .params.organization_size }}
        Regions: {{ .params.regions }}
        Risk profile: {{ .params.risk_profile }}
        {{ if index .steps "fetch_regulatory_data" }}Regulatory updates: {{ index .steps.fetch_regulatory_data.outputs "body" }}{{ end }}
        Generate a comprehensive compliance checklist.

  - id: prioritize_actions
    node: agent
    description: "Prioritize compliance actions based on risk"
    config:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }}gpt-4{{ end }}'
      system_prompt: |
        You are a compliance program manager. Review the checklist and create a prioritized
        action plan. Group actions by urgency: immediate (0-30 days), short-term (30-90 days),
        medium-term (90-180 days), and ongoing. For each action, estimate effort, cost, and
        assign recommended owners.
      prompt: |
        Checklist: {{ index .steps.generate_checklist.outputs "checklist" }}
        Risk profile: {{ .params.risk_profile }}
        Organization size: {{ .params.organization_size }}
        Create a prioritized compliance action plan.

  - id: calculate_coverage
    node: code_interpreter
    description: "Calculate compliance coverage metrics"
    config:
      language: python
      code: |
        import json
        checklist = {{ index .steps.generate_checklist.outputs "checklist" | toJson }}
        items = checklist if isinstance(checklist, list) else checklist.get("items", [])
        total = len(items) if items else 0
        priorities = {"Critical": 0, "High": 0, "Medium": 0, "Low": 0}
        if items and isinstance(items, list):
            for item in items:
                p = item.get("priority", "Medium")
                priorities[p] = priorities.get(p, 0) + 1
        
        critical_ratio = priorities["Critical"] / max(total, 1) * 100
        coverage_score = max(0, round(100 - critical_ratio * 2, 1))
        result = {
            "total_requirements": total,
            "by_priority": priorities,
            "coverage_score": coverage_score,
            "risk_assessment": "High Risk" if critical_ratio > 30 else "Moderate Risk" if critical_ratio > 10 else "Low Risk"
        }
        print(json.dumps(result, indent=2))

  - id: save_checklist
    node: file_write
    description: "Save the compliance checklist report"
    config:
      path: '{{ if .params.output_path }}{{ .params.output_path }}{{ else }}output/compliance_checklist.md{{ end }}'
      content: |
        # Compliance Checklist: {{ .params.industry }} - {{ range $i, $r := .params.regulations }}{{ if $i }}, {{ end }}{{ $r }}{{ end }}
        
        ## Coverage Metrics
        {{ index .steps.calculate_coverage.outputs "coverage_metrics" }}
        
        ## Compliance Checklist
        {{ index .steps.generate_checklist.outputs "checklist" }}
        
        ## Prioritized Action Plan
        {{ index .steps.prioritize_actions.outputs "action_plan" }}