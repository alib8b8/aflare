name: litigation-timeline
description: "Litigation timeline and deadline tracker workflow"
version: "1.0.0"
params:
  - name: case_name
    type: string
    required: true
    description: "Name of the litigation case"
  - name: jurisdiction
    type: string
    required: true
    description: "Court jurisdiction"
  - name: case_type
    type: string
    required: true
    description: "Type of case (civil, criminal, appellate, administrative)"
  - name: filing_date
    type: string
    required: true
    description: "Date the case was filed (YYYY-MM-DD)"
  - name: key_events
    type: array
    required: false
    default: []
    description: "List of known key events with dates"
  - name: trial_date
    type: string
    required: false
    description: "Scheduled trial date (YYYY-MM-DD)"

steps:
  - id: calculate_deadlines
    node: code_interpreter
    description: "Calculate all procedural deadlines"
    config:
      language: python
      code: |
        import json
        from datetime import datetime, timedelta
        
        filing_date = datetime.strptime("{{ .params.filing_date }}", "%Y-%m-%d")
        deadline_rules = {
            "civil": {
                "Answer/Response": 21,
                "Rule 26(f) Conference": 60,
                "Initial Disclosures": 75,
                "Amend Pleadings": 90,
                "Expert Disclosures (Plaintiff)": 180,
                "Expert Disclosures (Defendant)": 210,
                "Discovery Cutoff": 240,
                "Dispositive Motions": 270,
                "Pretrial Conference": 330,
                "Trial": 365
            },
            "criminal": {
                "Initial Appearance": 1,
                "Preliminary Hearing": 14,
                "Indictment": 30,
                "Arraignment": 40,
                "Pretrial Motions": 60,
                "Discovery": 90,
                "Trial": 180
            },
            "appellate": {
                "Notice of Appeal": 30,
                "Record on Appeal": 60,
                "Appellant Brief": 90,
                "Appellee Brief": 120,
                "Reply Brief": 135,
                "Oral Argument": 180
            }
        }
        
        rules = deadline_rules.get("{{ .params.case_type }}", deadline_rules["civil"])
        deadlines = []
        for event, days in rules.items():
            deadline_date = filing_date + timedelta(days=days)
            deadlines.append({
                "event": event,
                "deadline": deadline_date.strftime("%Y-%m-%d"),
                "days_from_filing": days,
                "status": "pending"
            })
        
        print(json.dumps({"deadlines": deadlines, "filing_date": "{{ .params.filing_date }}", "case_type": "{{ .params.case_type }}"}, indent=2))

  - id: generate_timeline
    node: agent
    description: "Generate comprehensive litigation timeline"
    config:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }}gpt-4{{ end }}'
      system_prompt: |
        You are a litigation paralegal. Create a comprehensive litigation timeline combining
        calculated deadlines with any known case events. For each milestone, provide:
        date, event description, responsible party, deliverables, and priority level.
        Include reminders for preparation activities before each deadline.
      prompt: |
        Case: {{ .params.case_name }}
        Calculated deadlines: {{ index .steps.calculate_deadlines.outputs "deadlines" }}
        Known events: {{ .params.key_events }}
        {{ if .params.trial_date }}Trial date: {{ .params.trial_date }}{{ end }}
        Generate a comprehensive litigation timeline.

  - id: risk_assessment
    node: agent
    description: "Assess timeline risks and bottlenecks"
    config:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }}gpt-4{{ end }}'
      system_prompt: |
        You are a litigation strategist. Analyze the timeline for risks, bottlenecks, and
        resource conflicts. Identify: tight deadlines, overlapping obligations, preparation
        gaps, and strategic opportunities. Provide recommendations for timeline management.
      prompt: |
        Timeline: {{ index .steps.generate_timeline.outputs "timeline" }}
        Case type: {{ .params.case_type }}
        {{ if .params.trial_date }}Trial date: {{ .params.trial_date }}{{ end }}
        Analyze timeline risks and provide recommendations.

  - id: save_timeline
    node: file_write
    description: "Save the litigation timeline"
    config:
      path: '{{ if .params.output_path }}{{ .params.output_path }}{{ else }}output/litigation_timeline.md{{ end }}'
      content: |
        # Litigation Timeline: {{ .params.case_name }}
        
        ## Case Information
        - **Jurisdiction**: {{ .params.jurisdiction }}
        - **Case Type**: {{ .params.case_type }}
        - **Filing Date**: {{ .params.filing_date }}
        {{ if .params.trial_date }}- **Trial Date**: {{ .params.trial_date }}{{ end }}
        
        ## Timeline
        {{ index .steps.generate_timeline.outputs "timeline" }}
        
        ## Risk Assessment
        {{ index .steps.risk_assessment.outputs "risk_assessment" }}