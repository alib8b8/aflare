name: legal-research
description: "Legal research and case law search workflow"
version: "1.0.0"
params:
  - name: query
    type: string
    required: true
    description: "Legal research question or topic"
  - name: jurisdiction
    type: string
    required: false
    default: "US"
    description: "Jurisdiction for research"
  - name: sources
    type: array
    required: false
    default: ["case-law", "statutes", "regulations"]
    description: "Types of legal sources to search"
  - name: date_range
    type: object
    required: false
    description: "Date range filter (start and end years)"
  - name: max_results
    type: integer
    required: false
    default: 10
    description: "Maximum number of results per source"

steps:
  - id: search_case_law
    node: http_request
    description: "Search case law databases"
    config:
      method: GET
      url: "https://api.case.law/v1/cases/?search={{ .params.query }}&jurisdiction={{ .params.jurisdiction }}&page_size={{ .params.max_results }}"
      headers:
        Authorization: "{{ .params.api_key | default "" }}"
        Accept: "application/json"
    condition: "{{ .params.sources | includes "case-law" }}"

  - id: analyze_results
    node: agent
    description: "Analyze and synthesize legal research results"
    config:
      model: "{{ .params.model | default "gpt-4" }}"
      system_prompt: |
        You are a legal research analyst. Synthesize the search results into a comprehensive
        research memorandum. For each relevant case or authority, provide: citation, key facts,
        holding, reasoning, and relevance to the research question. Identify legal principles,
        trends, and any conflicting authorities.
      prompt: |
        Research question: {{ .params.query }}
        Jurisdiction: {{ .params.jurisdiction }}
        {{ if index .steps "search_case_law" }}Case law results: {{ index .steps.search_case_law.outputs "body" }}{{ end }}
        Please analyze and synthesize the legal research findings.

  - id: identify_principles
    node: agent
    description: "Extract key legal principles and precedents"
    config:
      model: "{{ .params.model | default "gpt-4" }}"
      system_prompt: |
        You are a legal scholar. From the research results, extract and organize the key legal
        principles, landmark precedents, and controlling authorities. Explain the current state
        of the law and any circuit splits or jurisdictional differences.
      prompt: |
        Analysis: {{ index .steps.analyze_results.outputs "analysis" }}
        Jurisdiction: {{ .params.jurisdiction }}
        Extract and organize key legal principles and precedents.

  - id: generate_memo
    node: agent
    description: "Generate formal legal research memorandum"
    config:
      model: "{{ .params.model | default "gpt-4" }}"
      system_prompt: |
        You are a senior legal associate. Draft a formal legal research memorandum with:
        executive summary, question presented, brief answer, statement of facts, analysis,
        conclusion, and table of authorities. Use proper legal citation format.
      prompt: |
        Research question: {{ .params.query }}
        Analysis: {{ index .steps.analyze_results.outputs "analysis" }}
        Principles: {{ index .steps.identify_principles.outputs "principles" }}
        Draft a formal legal research memorandum.

  - id: save_memo
    node: file_write
    description: "Save the legal research memorandum"
    config:
      path: "{{ .params.output_path | default "output/legal_research_memo.md" }}"
      content: |
        {{ index .steps.generate_memo.outputs "memorandum" }}