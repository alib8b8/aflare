name: gdpr-compliance
description: "GDPR compliance checklist and assessment workflow"
version: "1.0.0"
params:
  - name: organization_name
    type: string
    required: true
    description: "Name of the organization being assessed"
  - name: data_types
    type: array
    required: true
    description: "Types of personal data processed"
  - name: processing_purposes
    type: array
    required: true
    description: "Purposes of data processing"
  - name: data_subject_categories
    type: array
    required: false
    default: ["customers", "employees"]
    description: "Categories of data subjects"
  - name: cross_border
    type: boolean
    required: false
    default: false
    description: "Whether data is transferred internationally"
  - name: dpo_required
    type: boolean
    required: false
    default: false
    description: "Whether a DPO is required"

steps:
  - id: generate_checklist
    node: agent
    description: "Generate GDPR compliance checklist based on organization profile"
    params:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }}gpt-4{{ end }}'
      system_prompt: |
        You are a GDPR compliance specialist. Generate a comprehensive compliance checklist
        tailored to the organization's data processing profile. Include all relevant GDPR articles
        and requirements. For each checklist item, provide: article reference, requirement description,
        applicability, and evidence needed.
      prompt: |
        Organization: {{ .params.organization_name }}
        Data types: {{ .params.data_types }}
        Processing purposes: {{ .params.processing_purposes }}
        Data subject categories: {{ .params.data_subject_categories }}
        Cross-border transfers: {{ .params.cross_border }}
        DPO required: {{ .params.dpo_required }}
        Generate a comprehensive GDPR compliance checklist.

  - id: risk_assessment
    node: agent
    description: "Perform DPIA risk assessment"
    params:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }}gpt-4{{ end }}'
      system_prompt: |
        You are a data protection impact assessment specialist. Evaluate the risks associated with
        the data processing activities. For each risk: assess likelihood, severity, and provide
        mitigation measures. Determine if a full DPIA is required under GDPR Article 35.
      prompt: |
        Checklist: {{ index .steps.generate_checklist.outputs "checklist" }}
        Data types: {{ .params.data_types }}
        Processing purposes: {{ .params.processing_purposes }}
        Perform a DPIA assessment and risk evaluation.

  - id: gap_analysis
    node: agent
    description: "Analyze gaps between current state and GDPR requirements"
    params:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }}gpt-4{{ end }}'
      system_prompt: |
        You are a GDPR remediation consultant. Based on the checklist and risk assessment,
        identify the most critical gaps and prioritize remediation actions. Create a prioritized
        action plan with timelines and resource requirements.
      prompt: |
        Checklist: {{ index .steps.generate_checklist.outputs "checklist" }}
        Risk assessment: {{ index .steps.risk_assessment.outputs "dpia" }}
        Create a prioritized gap analysis and remediation plan.

  - id: calculate_readiness
    node: code_interpreter
    description: "Calculate GDPR readiness score"
    params:
      language: python
      code: |
        import json, math
        checklist = {{ index .steps.generate_checklist.outputs "checklist" | toJson }}
        items = checklist if isinstance(checklist, list) else checklist.get("items", [])
        total = len(items) if items else 20
        # Simulate readiness score based on gap analysis
        gaps = {{ index .steps.gap_analysis.outputs "gaps" | toJson }}
        gap_count = len(gaps) if isinstance(gaps, list) else gaps.get("total_gaps", 5)
        score = max(0, round(100 - (gap_count / total * 100), 1))
        level = "High" if score >= 80 else "Medium" if score >= 50 else "Low"
        result = {"readiness_score": score, "readiness_level": level, "total_requirements": total, "identified_gaps": gap_count}
        print(json.dumps(result, indent=2))

  - id: save_report
    node: file_write
    description: "Save GDPR compliance report"
    params:
      path: '{{ if .params.output_path }}{{ .params.output_path }}{{ else }}output/gdpr_compliance_report.md{{ end }}'
      content: |
        # GDPR Compliance Assessment Report
        ## Organization: {{ .params.organization_name }}
        
        ### Readiness Score
        {{ index .steps.calculate_readiness.outputs "compliance_scores" }}
        
        ### Compliance Checklist
        {{ index .steps.generate_checklist.outputs "checklist" }}
        
        ### Risk Assessment
        {{ index .steps.risk_assessment.outputs "dpia" }}
        
        ### Gap Analysis & Remediation Plan
        {{ index .steps.gap_analysis.outputs "gaps" }}