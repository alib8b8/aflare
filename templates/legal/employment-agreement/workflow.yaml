name: employment-agreement
description: "Employment contract generator with role-specific clauses"
version: "1.0.0"
input_schema:
  - name: employer_name
    type: string
    required: true
    description: "Name of the employer"
  - name: employee_name
    type: string
    required: true
    description: "Name of the employee"
  - name: job_title
    type: string
    required: true
    description: "Job title"
  - name: employment_type
    type: string
    required: false
    default: "full-time"
    description: "Employment type (full-time, part-time, contract, probationary)"
  - name: salary
    type: string
    required: true
    description: "Annual salary amount"
  - name: location
    type: string
    required: false
    default: "on-site"
    description: "Work location (on-site, remote, hybrid)"
  - name: benefits
    type: array
    required: false
    default: []
    description: "List of benefits offered"
  - name: jurisdiction
    type: string
    required: false
    default: "California"
    description: "Governing jurisdiction"

steps:
  - id: check_labor_laws
    node: agent
    description: "Check applicable labor laws and requirements"
    params:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }}gpt-4{{ end }}'
      system_prompt: |
        You are an employment law specialist. Identify all applicable labor laws and
        mandatory provisions for the given jurisdiction and employment type. Include:
        minimum wage, overtime rules, meal/rest breaks, leave entitlements, notice periods,
        at-will employment rules, and non-compete enforceability.
      prompt: |
        Jurisdiction: {{ .params.jurisdiction }}
        Employment type: {{ .params.employment_type }}
        Work location: {{ .params.location }}
        Identify all applicable labor law requirements.

  - id: generate_contract
    node: agent
    description: "Generate the employment contract"
    params:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }}gpt-4{{ end }}'
      system_prompt: |
        You are an employment contract drafter. Generate a complete employment agreement
        with all standard clauses: position and duties, compensation, benefits, working hours,
        leave policies, confidentiality, intellectual property assignment, non-compete/non-solicit,
        termination conditions, dispute resolution, and at-will employment acknowledgment.
        Ensure compliance with the identified labor law requirements.
      prompt: |
        Employer: {{ .params.employer_name }}
        Employee: {{ .params.employee_name }}
        Job title: {{ .params.job_title }}
        Employment type: {{ .params.employment_type }}
        Salary: {{ .params.salary }}
        Location: {{ .params.location }}
        Benefits: {{ .params.benefits }}
        Labor law requirements: {{ index .steps.check_labor_laws.outputs "labor_laws" }}
        Generate the complete employment agreement.

  - id: validate_contract
    node: agent
    description: "Validate the employment contract"
    params:
      model: '{{ if .params.model }}{{ .params.model }}{{ else }}gpt-4{{ end }}'
      system_prompt: |
        You are an employment law compliance reviewer. Validate the generated employment
        contract for: legal compliance, fairness, enforceability of restrictive covenants,
        completeness of mandatory provisions, and clarity of terms. Flag any issues.
      prompt: |
        Contract: {{ index .steps.generate_contract.outputs "contract_text" }}
        Jurisdiction: {{ .params.jurisdiction }}
        Validate the contract and provide compliance feedback.

  - id: save_contract
    node: file_write
    description: "Save the employment contract"
    params:
      path: '{{ if .params.output_path }}{{ .params.output_path }}{{ else }}output/employment_agreement.md{{ end }}'
      content: |
        # Employment Agreement
        ## {{ .params.employer_name }} & {{ .params.employee_name }}
        
        {{ index .steps.generate_contract.outputs "contract_text" }}
        
        ---
        ## Compliance Validation
        {{ index .steps.validate_contract.outputs "validation" }}