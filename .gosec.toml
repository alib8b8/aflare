# gosec configuration
# https://github.com/securego/gosec#configuration

# Exclude rules that are false positives or already mitigated:
# - G115: integer overflow conversion rune -> byte (safe in our lowercase function, ASCII only)
# - G204: Subprocess launched with variable (we validate commands via auditLog and shellMetachars check)
# - G301: Expect directory permissions to be 0750 or less (user config dirs need 0755 for accessibility)
# - G304: Potential file inclusion via variable (we use validateReadPath/validateWritePath for user input)
# - G306: Expect WriteFile permissions to be 0600 or less (config/registry files need 0644 for readability)
# - G703: Path traversal via taint analysis (we use safeJoinPath for external node entries)
# - G704: SSRF via taint analysis (we use validateURL and validateLMLEndpoint for all external requests)

[severity "medium"]
enabled = ["G101", "G102", "G103", "G104", "G105", "G106", "G107", "G108", "G109", "G110"]

[severity "high"]
enabled = ["G101", "G102", "G103", "G104", "G105", "G106", "G107", "G108", "G109", "G110"]

# Exclude specific rules globally
[exclude]
rules = ["G115", "G204", "G301", "G304", "G306", "G703", "G704"]
