version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go-minor-patches:
        update-types:
          - "minor"
          - "patch"
    automerge: true
    automerge-strategy: "squash"
    automerge-method: "squash"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
    automerge: true
    automerge-strategy: "squash"
    automerge-method: "squash"

  - package-ecosystem: "npm"
    directory: "/contrib/openclaw"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    automerge: true
    automerge-strategy: "squash"
    automerge-method: "squash"

  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    automerge: true
    automerge-strategy: "squash"
    automerge-method: "squash"
