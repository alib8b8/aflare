version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      go-minor-patches:
        update-types:
          - "minor"
          - "patch"
    rebase-strategy: "auto"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-deps:
        update-types:
          - "minor"
          - "patch"
    rebase-strategy: "auto"

  - package-ecosystem: "npm"
    directory: "/contrib/openclaw"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      openclaw-deps:
        update-types:
          - "minor"
          - "patch"
    rebase-strategy: "auto"

  - package-ecosystem: "npm"
    directory: "/vscode-extension"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      vscode-deps:
        update-types:
          - "minor"
          - "patch"
    rebase-strategy: "auto"
