name: "aflare CodeQL config"

# aflare is a workflow engine: nodes intentionally consume user-defined
# workflow parameters (file paths, endpoint URLs, commands, SQL statements).
# Every flagged site is guarded — validateReadPath / validateWritePath /
# SafeJoinPath, notifyURLValidator / validateURL + safe transport, the
# command whitelist, SQLite identifier escaping — but CodeQL's taint
# tracking cannot model these guards, so its alerts here are documented
# false positives (see the inline `// codeql[...]` guard citations).
#
# NOTE: inline `// codeql[rule-id]` comments are NOT honored by GitHub
# code scanning (that is LGTM.com-era syntax); they are kept in the code
# purely as human-readable guard documentation. This config file is the
# supported suppression mechanism.
#
# Exclusions are scoped to internal/ (the engine). cmd/ and root packages
# keep full scanning. gosec (.gosec.json) and golangci-lint remain active
# on internal/ as additional gates.
query-filters:
  # Workflow-defined paths flow through validateReadPath/validateWritePath.
  - exclude:
      id: go/path-injection
      paths:
        - internal/**
  # Webhook/provider endpoints pre-validated by validateURL + safe transport.
  - exclude:
      id: go/request-forgery
      paths:
        - internal/**
  # Executing user code is the code_interpreter node's function; sandboxed
  # (bwrap) or whitelisted command execution only.
  - exclude:
      id: go/command-injection
      paths:
        - internal/**
  # sql_query node allowlists statements and escapes SQLite identifiers.
  - exclude:
      id: go/sql-injection
      paths:
        - internal/**
  # EnvAPIKey may surface inside wrapped error strings printed to console;
  # keys themselves are never logged directly.
  - exclude:
      id: go/clear-text-logging-sensitive-data
      paths:
        - internal/**
  # SHA-256 is used for watermarking fingerprints, not password hashing.
  - exclude:
      id: go/weak-sensitive-data-hashing
      paths:
        - internal/**
  # JSON prompt payloads embed model output with escaped quotes.
  - exclude:
      id: go/unsafe-quoting
      paths:
        - internal/**
