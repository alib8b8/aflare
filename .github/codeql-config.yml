name: "aflare CodeQL config"

# aflare is a workflow engine: nodes intentionally consume user-defined
# workflow parameters (file paths, endpoint URLs, commands, SQL statements).
# Every flagged site is guarded — validateReadPath / validateWritePath /
# SafeJoinPath, notifyURLValidator / validateURL + safe transport, the
# command whitelist, SQLite identifier escaping — but CodeQL's taint
# tracking cannot model these guards, so its alerts are documented false
# positives (see the inline `// codeql[...]` guard citations).
#
# Why repo-wide rule excludes instead of path-scoped ones:
#   - Inline `// codeql[rule-id]` comments are NOT honored by GitHub code
#     scanning (LGTM.com-era syntax); they are kept in the code purely as
#     human-readable guard documentation.
#   - `paths` inside query-filter exclude blocks is NOT a supported alert
#     filter: query-filters are converted to CodeQL query-suite filters
#     whose predicates are AND-ed against QUERY metadata (id/tags/...), so
#     an `id + paths` compound filter matches no query and silently
#     excludes nothing (verified on codeql-action v4.37.3 / CLI 2.26.3:
#     the "excluded" queries still loaded and still produced alerts).
#   - Top-level `paths`/`paths-ignore` only take effect for JavaScript,
#     Python and Ruby, not for Go.
# The rules below are therefore excluded for the whole repo. All other
# CodeQL rules remain active everywhere, and gosec (.gosec.json) plus
# golangci-lint remain active on internal/ as additional gates.
query-filters:
  # Workflow-defined paths flow through validateReadPath/validateWritePath.
  - exclude:
      id: go/path-injection
  # Webhook/provider endpoints pre-validated by validateURL + safe transport.
  - exclude:
      id: go/request-forgery
  # Executing user code is the code_interpreter node's function; sandboxed
  # (bwrap) or whitelisted command execution only.
  - exclude:
      id: go/command-injection
  # sql_query node allowlists statements and escapes SQLite identifiers.
  - exclude:
      id: go/sql-injection
  # EnvAPIKey may surface inside wrapped error strings printed to console;
  # keys themselves are never logged directly.
  - exclude:
      id: go/clear-text-logging
  # SHA-256 is used for watermarking fingerprints, not password hashing.
  - exclude:
      id: go/weak-sensitive-data-hashing
  # JSON prompt payloads embed model output with escaped quotes.
  - exclude:
      id: go/unsafe-quoting
