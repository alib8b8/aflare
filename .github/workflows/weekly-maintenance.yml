name: Weekly Auto-Maintenance

on:
  schedule:
    # Run every 7 days on Monday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual trigger anytime

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Run maintenance check
        id: check
        run: |
          cd ${{ github.workspace }}
          chmod +x scripts/maintenance-check.sh
          OUTPUT=$(./scripts/maintenance-check.sh 2>&1)
          echo "$OUTPUT"
          
          # Check for any failures
          if echo "$OUTPUT" | grep -q "FAILED\|✗"; then
            echo "status=issues" >> $GITHUB_OUTPUT
          else
            echo "status=clean" >> $GITHUB_OUTPUT
          fi

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report
          path: maintenance_report_*.txt
          if-no-files-found: ignore

      - name: Create issue if issues found
        if: steps.check.outputs.status == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reports = fs.readdirSync('.').filter(f => f.startsWith('maintenance_report_'));
            let body = 'Automated maintenance check found potential issues. Please review.\n\n';
            if (reports.length > 0) {
              body += 'Latest report: ' + reports[reports.length - 1] + '\n\n';
            }
            body += 'Please check the build logs for details.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[Auto-Maintenance] Weekly health check - issues found',
              body: body,
              labels: ['maintenance', 'auto-generated']
            });
