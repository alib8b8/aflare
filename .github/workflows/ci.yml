name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # allows manually triggering the full run incl. benchmarks

jobs:
  test:
    strategy:
      matrix:
        arch: [amd64]
        include:
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25.12'

    - name: Build
      run: go build ./...

    - name: Test with race detector
      run: go test ./... -race -short

    - name: Generate coverage profile
      run: go test -coverprofile=coverage.out -covermode=atomic $(go list ./internal/... | grep -v '/webui$') -short

    - name: Check coverage threshold (enforced)
      run: |
        total=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${total}%"
        threshold=60
        echo "Threshold: ${threshold}%"
        pass=$(awk -v total="$total" -v threshold="$threshold" 'BEGIN { print (total >= threshold) ? 1 : 0 }')
        if [ "$pass" -eq 0 ]; then
          echo "::error::Coverage ${total}% is below required threshold ${threshold}%"
          exit 1
        else
          echo "::notice::Coverage ${total}% meets threshold ${threshold}%"
        fi

    - name: Check per-package coverage thresholds (enforced)
      run: |
        set -uo pipefail
        fail=0
        # Per-package coverage gates (see docs/code-review.md Test Coverage Targets).
        # Format: "package_prefix:threshold". coverage.out is generated above.
        targets=(
          "internal/agent:60"
          "internal/nodes:50"
          "internal/workflow:60"
          "internal/memory:60"
        )
        for entry in "${targets[@]}"; do
          pkg="${entry%:*}"
          threshold="${entry#*:}"
          # Aggregate weighted coverage from coverage.out by package prefix.
          # Each coverprofile line is: file:start.col,end.col numStmts count
          read -r total covered < <(awk -v p="/$pkg/" '
            $1 ~ p && $1 !~ /^mode:/ { t+=$2; if($3>0) c+=$2 }
            END { print t+0, c+0 }
          ' coverage.out)
          if [ "$total" -eq 0 ]; then
            echo "::warning::No coverage data for $pkg (package may have no tests)"
            continue
          fi
          cov=$(awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.1f", c/t*100 }')
          pass=$(awk -v cov="$cov" -v th="$threshold" 'BEGIN { print (cov >= th) ? 1 : 0 }')
          if [ "$pass" -eq 0 ]; then
            echo "::error::$pkg coverage ${cov}% is below required ${threshold}%"
            fail=1
          else
            echo "::notice::$pkg coverage ${cov}% meets threshold ${threshold}%"
          fi
        done
        exit $fail

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage.out
        flags: unittests
        name: aflare-coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        args: --timeout 5m

    # Blocking: govulncheck reports only symbol-level reachable
    # vulnerabilities in the dependency chain — a failure means known
    # exploitable code paths and must red-cross the build (matches
    # docs/code-review.md "Vulnerability scan — Blocking: Yes").
    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    # Benchmarks are expensive (count=5 across ./... twice — current + baseline).
    # Skip them on ordinary push-to-main so the quality gate (build/test/race/
    # coverage/lint) returns fast; run them only on release tags and manual
    # dispatches where regression detection actually matters.
    - name: Install benchstat
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      run: go install golang.org/x/perf/cmd/benchstat@latest

    - name: Run benchmarks (current branch)
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      run: |
        go test -bench=. -benchmem -run=^a -count=5 ./... > bench-current.txt 2>&1
        cat bench-current.txt

    - name: Checkout base branch for baseline
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.ref || 'main' }}
        path: baseline-checkout

    - name: Run benchmarks (base branch)
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      run: |
        cd baseline-checkout
        go test -bench=. -benchmem -run=^a -count=5 ./... > ../bench-baseline.txt 2>&1
        cat ../bench-baseline.txt

    - name: Compare benchmarks
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      run: |
        echo "=== benchstat comparison (baseline vs current) ==="
        benchstat bench-baseline.txt bench-current.txt | tee bench-comparison.txt
        echo "::group::Benchmark Comparison Report"
        cat bench-comparison.txt
        echo "::endgroup::"
        # Check for significant regressions (>15%)
        if grep -qE '[+-][0-9]{2,}\.[0-9]+%' bench-comparison.txt; then
          echo "::warning::Potential performance regression detected (>15% change)"
        fi

