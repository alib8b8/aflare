name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build
      run: go build ./...

    - name: Test with race detector
      run: go test ./... -race -short

    - name: Generate coverage profile
      run: go test -coverprofile=coverage.out -covermode=atomic $(go list ./internal/... | grep -v '/webui$') -short

    - name: Check coverage threshold (informational)
      run: |
        total=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${total}%"
        threshold=65
        echo "Threshold: ${threshold}%"
        pass=$(awk -v total="$total" -v threshold="$threshold" 'BEGIN { print (total >= threshold) ? 1 : 0 }')
        if [ "$pass" -eq 0 ]; then
          echo "WARNING: coverage ${total}% is below threshold ${threshold}%"
        else
          echo "PASS: coverage ${total}% meets threshold ${threshold}%"
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

    - name: Generate coverage badge
      run: |
        total=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
        coverage=$(printf "%.1f" "$total")
        echo "Coverage: ${coverage}%"
        color=$(awk -v cov="$coverage" 'BEGIN { if (cov < 60) print "red"; else if (cov < 75) print "yellow"; else print "green" }')
        cat > coverage-badge.svg <<EOF
<svg xmlns="http://www.w3.org/2000/svg" width="137" height="20">
  <linearGradient id="b" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <rect rx="3" width="137" height="20" fill="#555"/>
  <rect rx="3" x="71" width="66" height="20" fill="#${color}"/>
  <path d="M71 0h4v20h-4z" fill="#555"/>
  <path d="M71 0h4v20h-4z" fill="#${color}"/>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="35.5" y="14" fill="#010101" fill-opacity=".3">coverage</text>
    <text x="35.5" y="13">coverage</text>
    <text x="104" y="14" fill="#010101" fill-opacity=".3">${coverage}%</text>
    <text x="104" y="13">${coverage}%</text>
  </g>
</svg>
EOF
        echo "Generated coverage badge: ${coverage}%"

    - name: Commit and push badge
      run: |
        git config --global user.name "CI Bot"
        git config --global user.email "ci@example.com"
        git add coverage-badge.svg
        git commit -m "ci: update coverage badge to ${coverage}%" --allow-empty
        git push origin main
