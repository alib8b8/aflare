name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        arch: [amd64]
        include:
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25.12'

    - name: Build
      run: go build ./...

    - name: Test with race detector
      run: go test ./... -race -short

    - name: Generate coverage profile
      run: go test -coverprofile=coverage.out -covermode=atomic $(go list ./internal/... | grep -v '/webui$') -short

    - name: Check coverage threshold (enforced)
      run: |
        total=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${total}%"
        threshold=60
        echo "Threshold: ${threshold}%"
        pass=$(awk -v total="$total" -v threshold="$threshold" 'BEGIN { print (total >= threshold) ? 1 : 0 }')
        if [ "$pass" -eq 0 ]; then
          echo "::error::Coverage ${total}% is below required threshold ${threshold}%"
          exit 1
        else
          echo "::notice::Coverage ${total}% meets threshold ${threshold}%"
        fi

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        args: --timeout 5m

    - name: Run govulncheck
      continue-on-error: true
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

