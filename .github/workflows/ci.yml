name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    strategy:
      matrix:
        arch: [amd64]
        include:
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25.12'

    - name: Build
      run: go build ./...

    - name: Test with race detector
      run: go test ./... -race -short

    - name: Generate coverage profile
      run: go test -coverprofile=coverage.out -covermode=atomic $(go list ./internal/... | grep -v '/webui$') -short

    - name: Check coverage threshold (enforced)
      run: |
        total=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | sed 's/%//')
        echo "Total coverage: ${total}%"
        threshold=60
        echo "Threshold: ${threshold}%"
        pass=$(awk -v total="$total" -v threshold="$threshold" 'BEGIN { print (total >= threshold) ? 1 : 0 }')
        if [ "$pass" -eq 0 ]; then
          echo "::error::Coverage ${total}% is below required threshold ${threshold}%"
          exit 1
        else
          echo "::notice::Coverage ${total}% meets threshold ${threshold}%"
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: coverage.out
        flags: unittests
        name: aflare-coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.12.2
        args: --timeout 5m

    - name: Run govulncheck
      continue-on-error: true
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - name: Install benchstat
      run: go install golang.org/x/perf/cmd/benchstat@latest

    - name: Run benchmarks (current branch)
      run: |
        go test -bench=. -benchmem -run=^a -count=5 ./... > bench-current.txt 2>&1
        cat bench-current.txt

    - name: Checkout base branch for baseline
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.ref || 'main' }}
        path: baseline-checkout

    - name: Run benchmarks (base branch)
      run: |
        cd baseline-checkout
        go test -bench=. -benchmem -run=^a -count=5 ./... > ../bench-baseline.txt 2>&1
        cat ../bench-baseline.txt

    - name: Compare benchmarks
      run: |
        echo "=== benchstat comparison (baseline vs current) ==="
        benchstat bench-baseline.txt bench-current.txt | tee bench-comparison.txt
        echo "::group::Benchmark Comparison Report"
        cat bench-comparison.txt
        echo "::endgroup::"
        # Check for significant regressions (>15%)
        if grep -qE '[+-][0-9]{2,}\.[0-9]+%' bench-comparison.txt; then
          echo "::warning::Potential performance regression detected (>15% change)"
        fi

