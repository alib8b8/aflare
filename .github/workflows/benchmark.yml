name: Benchmark

# 性能回归检测:每周日凌晨运行全部 benchmark,并与上一周的基线用
# benchstat 对比。也可通过 workflow_dispatch 手动触发。
# 结果上传为 artifact 供人工查阅;出现显著回归(>15%)时构建置红(blocking)。

on:
  schedule:
    - cron: '0 4 * * 0'  # 每周日 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.7'
          cache: true

      - name: Install benchstat
        # Pinned: benchstat@latest now requires go >= 1.26 — with CI on 1.26.7
        # @latest would work, but a pin keeps future x/perf bumps from
        # silently breaking the weekly benchmark job again.
        run: go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260819171926-ebcb4798430d

      - name: Download previous baseline (if any)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: benchmark-baseline
          path: baseline

      - name: Run benchmarks
        run: |
          # -run=^a 跳过所有测试,只跑 benchmark;-benchmem 报告内存分配
          go test -bench=. -benchmem -run=^a -count=5 ./... > current.txt 2>&1
          cat current.txt

      - name: Compare with baseline (gate on >15% regression)
        id: compare
        run: |
          if [ ! -f baseline/bench.txt ]; then
            echo "No baseline found; this run becomes the new baseline."
            exit 0
          fi
          echo "=== benchstat comparison (old vs new) ==="
          benchstat baseline/bench.txt current.txt | tee benchstat.txt || true
          # A regression is a significant "+N.NN%" vs-base delta on a
          # measurement row. benchstat prints "~" for statistically
          # insignificant deltas and bare "±N%" for uncertainty columns,
          # so any +N.NN% match is a real slowdown/allocation growth.
          # Threshold 15%: above shared-runner noise, matching the header
          # comment's stated intent.
          reg=$(grep -oE '\+[0-9]+\.[0-9]+%' benchstat.txt | sed 's/[+%]//g' | awk '$1 > 15' | tr '\n' ' ')
          if [ -n "$reg" ]; then
            echo "::error::Benchmark regression(s) >15% detected: ${reg}(see benchstat output above)"
            exit 1
          fi
          echo "No regression >15% detected."

      - name: Upload current results as baseline
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-baseline
          path: current.txt
          retention-days: 21

      - name: Upload full report
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: current.txt
          retention-days: 30
