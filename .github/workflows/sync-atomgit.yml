# Mirror main branch and tags from GitHub to AtomGit.
#
# Triggered on every push to main (and manually / weekly as a fallback).
# Requires the ATOMGIT_TOKEN repository secret (AtomGit personal access
# token with repository write permission). GitHub automatically masks
# secret values in logs, so the token never appears in output.
name: Sync to AtomGit

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly fallback re-sync (Sundays 02:17 UTC) in case a push-triggered
    # run failed silently.
    - cron: "17 2 * * 0"

permissions:
  contents: read

concurrency:
  group: sync-atomgit
  cancel-in-progress: false

jobs:
  mirror:
    # Never run on forks of this repository.
    if: github.repository == 'alib8b8/aflare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check mirror reachable
        id: mirror
        env:
          ATOMGIT_TOKEN: ${{ secrets.ATOMGIT_TOKEN }}
          # Mirror target under the project's own name. Historically this
          # pushed to the pre-rename llm-box/llm-box repo — update this env
          # if the mirror lives elsewhere.
          ATOMGIT_REPO: alib8b8/aflare
        run: |
          set -euo pipefail
          if [ -z "${ATOMGIT_TOKEN}" ]; then
            echo "::error::ATOMGIT_TOKEN secret is not configured. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Token is passed via a per-remote credential helper so it never
          # becomes part of the remote URL (which git may print on errors).
          # Configured here; persists in .git/config for the push step below.
          git config credential.https://atomgit.com.helper '!f() { echo "username=oauth2"; echo "password=${ATOMGIT_TOKEN}"; }; f'
          set +e
          err=$(git ls-remote "https://atomgit.com/${ATOMGIT_REPO}.git" HEAD 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          # AtomGit reports a missing project as "could not be found" with
          # HTTP 403 (verified against atomgit.com); GitHub-style "not found"
          # is matched too, just in case.
          elif echo "$err" | grep -qiE '(could not be found|not found)'; then
            echo "::notice::Mirror https://atomgit.com/${ATOMGIT_REPO} does not exist yet. Skipping sync — create the empty repo on AtomGit and the next push will sync automatically."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            # Auth failure, network error, etc. — surface it instead of
            # skipping silently.
            echo "::error::Cannot reach mirror: $err"
            exit 1
          fi

      - name: Push main and tags to AtomGit
        if: steps.mirror.outputs.exists == 'true'
        run: |
          set -euo pipefail
          git remote add atomgit "https://atomgit.com/alib8b8/aflare.git"
          # Mirror semantics: force-push so AtomGit always matches GitHub
          # exactly (the GitHub repo is the single source of truth).
          git push atomgit refs/heads/main:refs/heads/main --force
          git push atomgit --tags --force
          echo "Mirror sync completed."
