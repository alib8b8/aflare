name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build (Unix)
        if: matrix.os != 'windows'
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          BIN_NAME="llm-box-${{ matrix.os }}-${{ matrix.arch }}"
          go build -ldflags "-s -w" -o "${BIN_NAME}" ./cmd/llm-box
          sha256sum "${BIN_NAME}" > "${BIN_NAME}.sha256"
          echo "BIN_NAME=${BIN_NAME}" >> $GITHUB_ENV

      - name: Build (Windows)
        if: matrix.os == 'windows'
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          $BIN_NAME = "llm-box-${{ matrix.os }}-${{ matrix.arch }}.exe"
          go build -ldflags "-s -w" -o $BIN_NAME ./cmd/llm-box
          Get-FileHash -Path $BIN_NAME -Algorithm SHA256 | Format-List | Out-File -FilePath "${BIN_NAME}.sha256"
          echo "BIN_NAME=$BIN_NAME" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}
          path: |
            ${{ env.BIN_NAME }}
            ${{ env.BIN_NAME }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts -type f -name "llm-box-*" | sort

      - name: Generate checksums.txt
        run: |
          cd artifacts
          sha256sum llm-box-* | grep -v ".sha256" > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/llm-box-*
            artifacts/checksums.txt
          body: |
            ## 🚀 Release ${{ github.ref_name }}

            ### Changes
            - Cross-platform binaries for Linux, macOS, and Windows
            - ARM64 support for Linux and macOS

            ### Downloads
            - `llm-box-linux-amd64` - Linux x86_64
            - `llm-box-linux-arm64` - Linux ARM64
            - `llm-box-darwin-amd64` - macOS Intel
            - `llm-box-darwin-arm64` - macOS Apple Silicon
            - `llm-box-windows-amd64.exe` - Windows x86_64
            - `llm-box-windows-arm64.exe` - Windows ARM64

            ### Installation
            ```bash
            # Linux/macOS
            curl -sL https://raw.githubusercontent.com/alib8b8/HKAIC/main/install.sh | bash
            ```

            ### Verify
            Check SHA256 checksums in `checksums.txt`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
