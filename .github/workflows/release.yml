name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          echo "::group::Env"
          go version
          go env GOOS GOARCH CGO_ENABLED
          ls -la
          echo "::endgroup::"
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          else
            EXT=""
          fi
          BIN_NAME="llm-box-${GOOS}-${GOARCH}${EXT}"
          echo "BIN_NAME=$BIN_NAME" >> "$GITHUB_ENV"
          echo "Building $BIN_NAME ..."
          go build -ldflags "-s -w" -o "$BIN_NAME" ./cmd/llm-box
          echo "Build OK, generating checksum"
          sha256sum "$BIN_NAME" > "$BIN_NAME.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.BIN_NAME }}
          path: |
            ${{ env.BIN_NAME }}
            ${{ env.BIN_NAME }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts -type f -name "llm-box-*" | sort

      - name: Generate checksums.txt
        run: |
          cd artifacts
          for f in $(find . -type f -name "llm-box-*" ! -name "*.sha256"); do
            sha256sum "$f"
          done > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2.2
        with:
          tag_name: ${{ github.ref_name }}
          name: "llm-box ${{ github.ref_name }}"
          body: |
            ## 🚀 Release ${{ github.ref_name }}

            Cross-platform binaries for **llm-box** — 终端里的零代码 AI 工作流引擎。

            ### Downloads

            | File | Platform |
            | --- | --- |
            | `llm-box-linux-amd64` | Linux x86_64 |
            | `llm-box-linux-arm64` | Linux ARM64 |
            | `llm-box-darwin-amd64` | macOS Intel |
            | `llm-box-darwin-arm64` | macOS Apple Silicon |
            | `llm-box-windows-amd64.exe` | Windows x86_64 |
            | `llm-box-windows-arm64.exe` | Windows ARM64 |

            ### Install (Linux / macOS)

            ```bash
            curl -sL https://raw.githubusercontent.com/alib8b8/HKAIC/main/install.sh | bash
            ```

            ### Verify

            Check SHA256 checksums in `checksums.txt`.
          files: |
            artifacts/llm-box-*
            artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
