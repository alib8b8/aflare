name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          set -e
          # Download Go directly
          wget -q https://go.dev/dl/go1.25.1.linux-amd64.tar.gz -O /tmp/go.tgz
          tar -C /usr/local -xzf /tmp/go.tgz
          export PATH=/usr/local/go/bin:$PATH
          go version
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; else EXT=""; fi
          go build -ldflags "-s -w" -o "llm-box-${GOOS}-${GOARCH}${EXT}" ./cmd/llm-box
          sha256sum "llm-box-${GOOS}-${GOARCH}${EXT}" > "llm-box-${GOOS}-${GOARCH}${EXT}.sha256"
          ls -la

      - name: Upload
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            llm-box-*
