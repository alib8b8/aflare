name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          set -x
          go version
          go env GOOS GOARCH CGO_ENABLED
          go build -ldflags "-s -w" -v -o "llm-box-${GOOS}-${GOARCH}$([ "$GOOS" = "windows" ] && echo .exe || echo)" ./cmd/llm-box
          sha256sum "llm-box-${GOOS}-${GOARCH}$([ "$GOOS" = "windows" ] && echo .exe || echo)" > "llm-box-${GOOS}-${GOARCH}$([ "$GOOS" = "windows" ] && echo .exe || echo).sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.os }}-${{ matrix.arch }}
          path: |
            llm-box-*
