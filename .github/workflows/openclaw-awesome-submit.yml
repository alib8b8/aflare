name: Submit OpenClaw Plugin to Awesome Lists

on:
  push:
    tags:
      - 'openclaw-v*'

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies (contrib/openclaw)
        working-directory: contrib/openclaw
        run: npm install

      - name: Build plugin
        working-directory: contrib/openclaw
        run: npm run build

      - name: Submit to VoltAgent/awesome-openclaw-skills
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          
          # Clone the awesome list repo
          git clone --depth 1 https://x-access-token:${GITHUB_TOKEN}@github.com/VoltAgent/awesome-openclaw-skills.git /tmp/awesome-openclaw-skills
          
          cd /tmp/awesome-openclaw-skills
          
          # Check if llm-box is already listed
          if grep -q "llm-box\|llmbox" README.md; then
            echo "llm-box already listed in awesome-openclaw-skills, skipping"
            exit 0
          fi
          
          # Create a new branch
          git checkout -b add-llm-box
          
          # Add llm-box entry to Notable Skills section
          # Find the right place and insert
          python3 << 'PYEOF'
          import re
          
          with open('README.md', 'r') as f:
              content = f.read()
          
          entry = "- **[llm-box](https://github.com/alib8b8/llm-box/tree/main/contrib/openclaw)** — Terminal-based AI workflow engine with YAML-driven pipelines. Expose llm-box workflows as callable tools in OpenClaw conversations. Supports 20+ LLM providers. Written in Go, single binary.\n"
          
          # Try to find "## Notable Skills" or similar section
          pattern = r'(##\s+Notable\s+Skills[^\n]*\n)'
          match = re.search(pattern, content, re.IGNORECASE)
          
          if match:
              # Insert after the section header
              pos = match.end()
              content = content[:pos] + entry + content[pos:]
          else:
              # Just append at the end
              content += "\n" + entry
          
          with open('README.md', 'w') as f:
              f.write(content)
          PYEOF
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "feat: add llm-box plugin

Add llm-box OpenClaw plugin to Notable Skills.

llm-box is a terminal-based AI workflow engine with YAML-driven
pipelines that supports 20+ LLM providers. This plugin exposes
llm-box workflows as callable tools in OpenClaw conversations."
          
          # Push to fork (using HTTPS with token)
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/alib8b8/awesome-openclaw-skills.git add-llm-box 2>/dev/null || {
            # If push fails, fork first via API
            curl -sL -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/VoltAgent/awesome-openclaw-skills/forks
            sleep 5
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/alib8b8/awesome-openclaw-skills.git add-llm-box
          }
          
          # Create PR via API
          curl -sL -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/VoltAgent/awesome-openclaw-skills/pulls \
            -d '{
              "title": "feat: add llm-box plugin",
              "body": "Add llm-box OpenClaw plugin to Notable Skills.\n\n**llm-box** is a terminal-based AI workflow engine with YAML-driven pipelines that supports 20+ LLM providers (DeepSeek, Qwen, GLM, Mistral, Kimi, etc.).\n\nThis plugin exposes llm-box workflows as callable tools in OpenClaw conversations, enabling agents to:\n- List available workflows\n- Execute workflows by filename\n- Get workflow description and details\n\nRepository: https://github.com/alib8b8/llm-box/tree/main/contrib/openclaw",
              "head": "alib8b8:add-llm-box",
              "base": "main"
            }'
          
          echo "PR submitted successfully!"
