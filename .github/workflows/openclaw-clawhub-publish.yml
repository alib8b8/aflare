name: Publish OpenClaw Plugin to ClawHub

on:
  push:
    tags:
      - 'openclaw-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contrib/openclaw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Login to ClawHub
        run: clawhub login --token ${{ secrets.CLAWHUB_TOKEN }}
        env:
          CLAWHUB_DISABLE_TELEMETRY: '1'

      - name: Build
        run: npm run build

      - name: Publish to ClawHub (dry run)
        run: clawhub package publish alib8b8/llm-box --dry-run
        env:
          CLAWHUB_DISABLE_TELEMETRY: '1'

      - name: Publish to ClawHub
        run: clawhub package publish alib8b8/llm-box
        env:
          CLAWHUB_DISABLE_TELEMETRY: '1'
