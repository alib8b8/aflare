name: Publish OpenClaw Plugin to ClawHub

on:
  push:
    tags:
      - 'openclaw-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contrib/openclaw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish to ClawHub
        run: |
          if [ -z "${CLAWHUB_TOKEN}" ]; then
            echo "⏭️  CLAWHUB_TOKEN not configured, skipping ClawHub publish"
            echo "To enable ClawHub publishing, add CLAWHUB_TOKEN secret in repository settings"
            echo "https://github.com/alib8b8/llm-box/settings/secrets/actions"
          else
            npm install -g clawhub 2>/dev/null || {
              echo "⚠️  clawhub CLI not available, skipping publish"
              exit 0
            }
            clawhub login --token "${CLAWHUB_TOKEN}" && \
            clawhub package publish alib8b8/llm-box && \
            echo "✅ Published to ClawHub successfully"
          fi
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          CLAWHUB_DISABLE_TELEMETRY: '1'
