name: Publish OpenClaw Plugin to npm

on:
  push:
    tags:
      - 'openclaw-v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contrib/openclaw
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "⏭️  NPM_TOKEN not configured, skipping npm publish"
            echo "To enable npm publishing, add NPM_TOKEN secret in repository settings"
            echo "https://github.com/alib8b8/llm-box/settings/secrets/actions"
          else
            npm publish --access public
            echo "✅ Published to npm successfully"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
