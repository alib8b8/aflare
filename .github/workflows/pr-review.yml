name: PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'

      - name: Run go mod tidy
        run: go mod tidy

      - name: Run gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        continue-on-error: true
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.out

      - name: Build
        run: go build -ldflags "-s -w" -o aflare ./cmd/aflare

      - name: Verify binary
        run: ./aflare --help

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'

      - name: Run gosec security scan
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt=text -out=gosec-results.txt ./... || true
        continue-on-error: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
        continue-on-error: true

  multi-platform-build:
    name: Multi-Platform Build
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            ext: ''
          - os: linux
            arch: arm64
            ext: ''
          - os: darwin
            arch: amd64
            ext: ''
          - os: darwin
            arch: arm64
            ext: ''
          - os: windows
            arch: amd64
            ext: '.exe'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          BINARY_NAME="aflare-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          go build -ldflags "-s -w" -o "$BINARY_NAME" ./cmd/aflare
          echo "BINARY_NAME=$BINARY_NAME" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: aflare-${{ matrix.os }}-${{ matrix.arch }}
          path: aflare-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}

  # Aggregate gate: single required status check for branch protection.
  # Enable branch protection on main and set this job ("gate" / "PR Review / gate")
  # as the required status check. This ensures CI gate + review enforcement.
  gate:
    name: gate (required)
    runs-on: ubuntu-latest
    needs: [build, security-scan, multi-platform-build]
    if: always()
    steps:
      - name: Check all required jobs passed
        if: ${{ !(needs.build.result == 'success' && needs.security-scan.result == 'success' && needs.multi-platform-build.result == 'success') }}
        run: |
          echo "::error::CI gate failed - not all required checks passed"
          echo "build: ${{ needs.build.result }}"
          echo "security-scan: ${{ needs.security-scan.result }}"
          echo "multi-platform-build: ${{ needs.multi-platform-build.result }}"
          exit 1
      - name: Gate passed
        run: echo "::notice::All CI gate checks passed - ready for code review and merge"
