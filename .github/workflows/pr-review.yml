name: PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Fix go.mod version for CI
        run: sed -i 's/go 1\.[0-9]\+\.[0-9]\+/go 1.24/' go.mod

      - name: Run go mod tidy
        run: go mod tidy

      - name: Run gofmt
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build -ldflags "-s -w" -o llm-box ./cmd/llm-box

      - name: Verify binary
        run: ./llm-box --help
