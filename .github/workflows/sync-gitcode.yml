# Mirror main branch and tags from GitHub to GitCode (CN mirror).
#
# Triggered on every push to main (and manually / weekly as a fallback).
# Requires the GITCODE_TOKEN repository secret (GitCode personal access
# token with repository write permission). GitHub automatically masks
# secret values in logs, so the token never appears in output.
#
# The mirror target is https://gitcode.com/llm-box/aflare. If that repo
# has not been created (or its name is still stuck in GitCode's recycle
# bin), the probe step notices and the job exits green with a notice,
# so a missing mirror never red-crosses main.
name: Sync to GitCode

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly fallback re-sync (Sundays 02:17 UTC) in case a push-triggered
    # run failed silently.
    - cron: "17 2 * * 0"

permissions:
  contents: read

concurrency:
  group: sync-gitcode
  cancel-in-progress: false

jobs:
  mirror:
    # Never run on forks of this repository.
    if: github.repository == 'alib8b8/aflare'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Check mirror reachable
        id: mirror
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPO: llm-box/aflare
        run: |
          set -euo pipefail
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "::error::GITCODE_TOKEN secret is not configured. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Token is passed via a per-remote credential helper so it never
          # becomes part of the remote URL (which git may print on errors).
          # Configured here; persists in .git/config for the push step below.
          git config credential.https://gitcode.com.helper '!f() { echo "username=oauth2"; echo "password=${GITCODE_TOKEN}"; }; f'
          set +e
          err=$(git ls-remote "https://gitcode.com/${GITCODE_REPO}.git" HEAD 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          # GitCode reports a missing project as "could not be found" behind
          # HTTP 403 (verified against gitcode.com); GitHub-style "not found"
          # is matched too, just in case.
          elif echo "$err" | grep -qiE '(could not be found|not found)'; then
            echo "::notice::Mirror https://gitcode.com/${GITCODE_REPO} does not exist yet. Skipping sync — create the empty repo on GitCode and the next push will sync automatically."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            # Auth failure, network error, etc. — surface it instead of
            # skipping silently.
            echo "::error::Cannot reach mirror: $err"
            exit 1
          fi

      - name: Push main and tags to GitCode
        if: steps.mirror.outputs.exists == 'true'
        run: |
          set -euo pipefail
          git remote add gitcode "https://gitcode.com/llm-box/aflare.git"
          # Mirror semantics: force-push so GitCode always matches GitHub
          # exactly (the GitHub repo is the single source of truth).
          git push gitcode refs/heads/main:refs/heads/main --force
          git push gitcode --tags --force
          echo "Mirror sync completed."
