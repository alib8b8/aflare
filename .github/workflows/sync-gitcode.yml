# Mirror main branch and tags from GitHub to GitCode (CN mirror).
#
# CI-GATED: the mirror only runs after the CI workflow succeeds on the
# pushed commit (workflow_run), and the push step itself re-verifies that
# the CI run for the exact main HEAD being mirrored is green. A red or
# still-running build never reaches GitCode — GitHub is the source of
# truth, GitCode only receives CI-validated code.
#
# Also available manually / weekly as a fallback (same CI gate applies).
# Requires the GITCODE_TOKEN repository secret (GitCode personal access
# token with repository write permission). GitHub automatically masks
# secret values in logs, so the token never appears in output.
#
# The mirror target is https://gitcode.com/llm-box/aflare. If that repo
# has not been created (or its name is still stuck in GitCode's recycle
# bin), the probe step notices and the job exits green with a notice,
# so a missing mirror never red-crosses main.
name: Sync to GitCode

on:
  workflow_run:
    # Fires when the CI workflow completes on main; the job-level `if`
    # below skips everything unless it concluded successfully.
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly fallback re-sync (Sundays 02:17 UTC) in case a
    # workflow_run-triggered run failed silently.
    - cron: "17 2 * * 0"

permissions:
  contents: read
  # Read access to the Actions API so the gate step can query the CI run
  # status for the commit being mirrored.
  actions: read

concurrency:
  group: sync-gitcode
  cancel-in-progress: false

jobs:
  mirror:
    # Never run on forks; only mirror when the triggering CI run succeeded.
    if: >-
      github.repository == 'alib8b8/aflare' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always check out the CURRENT main HEAD (not the workflow_run head
      # SHA): if main moved ahead while CI was running, the gate step below
      # notices the new HEAD is not CI-green yet and skips — the next
      # workflow_run will sync it once its CI passes.
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          fetch-tags: true

      - name: CI gate — main HEAD must be green
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "Mirroring main @ ${sha} (trigger: ${GITHUB_EVENT_NAME})"
          # Single API call: green iff ANY completed CI run for this exact
          # commit concluded success (push or manual dispatch both count);
          # an in-progress re-run never un-greens an already-validated SHA.
          green=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${sha}&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | any(.status == "completed" and .conclusion == "success")')
          echo "CI green for ${sha}: ${green}"
          if [ "${green}" = "true" ]; then
            echo "ci_green=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CI gate not green for ${sha}. Mirror skipped — code must pass CI before it reaches GitCode."
            echo "ci_green=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check mirror reachable
        id: mirror
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_REPO: llm-box/aflare
        run: |
          set -euo pipefail
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "::error::GITCODE_TOKEN secret is not configured. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Token is passed via a per-remote credential helper so it never
          # becomes part of the remote URL (which git may print on errors).
          # Configured here; persists in .git/config for the push step below.
          git config credential.https://gitcode.com.helper '!f() { echo "username=oauth2"; echo "password=${GITCODE_TOKEN}"; }; f'
          set +e
          err=$(git ls-remote "https://gitcode.com/${GITCODE_REPO}.git" HEAD 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          # GitCode reports a missing project as "could not be found" behind
          # HTTP 403 (verified against gitcode.com); GitHub-style "not found"
          # is matched too, just in case.
          elif echo "$err" | grep -qiE '(could not be found|not found)'; then
            echo "::notice::Mirror https://gitcode.com/${GITCODE_REPO} does not exist yet. Skipping sync — create the empty repo on GitCode and the next push will sync automatically."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            # Auth failure, network error, etc. — surface it instead of
            # skipping silently.
            echo "::error::Cannot reach mirror: $err"
            exit 1
          fi

      - name: Push main and tags to GitCode
        if: steps.mirror.outputs.exists == 'true' && steps.gate.outputs.ci_green == 'true'
        # GITCODE_TOKEN must be re-exported here: the credential helper
        # stored in the probe step expands ${GITCODE_TOKEN} when git
        # invokes it during this step, not when it is configured.
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -euo pipefail
          git remote add gitcode "https://gitcode.com/llm-box/aflare.git"
          # Mirror semantics: force-push so GitCode always matches GitHub
          # exactly (the GitHub repo is the single source of truth).
          git push gitcode refs/heads/main:refs/heads/main --force
          git push gitcode --tags --force
          echo "Mirror sync completed."
