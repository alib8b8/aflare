name: Supply Chain

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1'  # weekly on Monday

jobs:
  sbom:
    name: Generate SBOM (SPDX)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25.13'

    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        format: spdx-json
        output-file: sbom.spdx.json
        path: ./

    - name: Upload SBOM artifact
      uses: actions/upload-artifact@v4
      with:
        name: sbom-spdx
        path: sbom.spdx.json
        retention-days: 90

  license-scan:
    name: License Scan (FOSSA)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Run FOSSA license scan
      uses: fossas/fossa-action@v1
      with:
        api-key: ${{ secrets.FOSSA_API_KEY }}
      continue-on-error: true

    - name: Run FOSSA test (fail on license issues)
      if: github.event_name == 'pull_request'
      uses: fossas/fossa-action@v1
      with:
        api-key: ${{ secrets.FOSSA_API_KEY }}
        run-tests: true
      continue-on-error: true

  govulncheck:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25.13'

    # Blocking: reachable dependency vulnerabilities must fail the scan
    # (matches ci.yml / pr-review.yml and docs/code-review.md "Blocking: Yes").
    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck -show verbose ./...