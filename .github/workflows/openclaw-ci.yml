name: OpenClaw Plugin CI

on:
  push:
    branches: [main, 'feature/*']
    paths:
      - 'contrib/openclaw/**'
      - '.github/workflows/openclaw-*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contrib/openclaw/**'
      - '.github/workflows/openclaw-*.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: contrib/openclaw
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: contrib/openclaw/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsc --noEmit

      - name: Test (argv contract, no-shell spawn)
        run: npm test
