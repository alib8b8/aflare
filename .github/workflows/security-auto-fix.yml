name: Security Scan

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'fix/*'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.12'

      - name: Install security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run gosec security scan
        run: |
          gosec -fmt=json -out=gosec-results.json ./... || true
          issues=$(cat gosec-results.json | grep -o '"Issues":\s*\[' | wc -l || echo "0")
          echo "gosec_issues=$issues" >> $GITHUB_OUTPUT
        id: gosec

      - name: Run govulncheck
        run: |
          govulncheck -json ./... > govuln-results.json 2>/dev/null || true
          vulns=$(cat govuln-results.json 2>/dev/null | grep -c '"osv"' || echo "0")
          echo "govuln_count=$vulns" >> $GITHUB_OUTPUT
          echo "Found $vulns vulnerabilities"
        id: govuln

      - name: Verify build
        run: |
          go build ./...
          go test ./... -short

      - name: Upload security scan results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-scan-results
          path: |
            gosec-results.json
            govuln-results.json

  create-security-issue:
    name: Create Security Issue
    runs-on: ubuntu-latest
    needs: security-scan
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Create security issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Security scan failed on main branch';
            const body = `## Security Scan Failed

            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref }}
            **Workflow:** ${{ github.workflow }}
            **Run URL:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ### 请检查：
            - gosec 安全扫描结果
            - govulncheck 依赖漏洞扫描结果

            ### 手动修复建议：
            1. 运行 \`gosec ./...\` 查看安全问题
            2. 运行 \`govulncheck ./...\` 查看依赖漏洞
            3. 运行 \`go get -u ./... && go mod tidy\` 更新依赖
            4. 验证构建：\`go build ./... && go test ./...\`
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security'
            });

            const exists = issues.data.some(i => i.title === title);
            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'automated']
              });
            }
