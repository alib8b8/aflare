name: Test Build

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show working directory
        run: |
          echo "PWD: $(pwd)"
          echo "GitHub workspace: $GITHUB_WORKSPACE"
          echo "Runner workspace: $RUNNER_WORKSPACE"
          echo "Home: $HOME"
          echo "=== find cmd dir ==="
          find /home -name "main.go" -path "*llm-box*" 2>/dev/null | head -5
          echo "=== ls /home/runner ==="
          ls -la /home/runner 2>/dev/null
          echo "=== ls /home/runner/work ==="
          ls -la /home/runner/work 2>/dev/null
          echo "=== ls -la ==="
          ls -la
          echo "=== git rev-parse ==="
          git rev-parse --show-toplevel

      - name: Try building at discovered location
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          TOP=$(git rev-parse --show-toplevel)
          echo "Building at: $TOP"
          cd "$TOP"
          pwd
          ls -la cmd/llm-box/
          go build -ldflags "-s -w" -o test-binary ./cmd/llm-box
          ls -la test-binary
