name: Test Build

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show what's checked out
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== LS ==="
          ls -la
          echo "=== go module ==="
          cat go.mod | head -5
          echo "=== ls cmd ==="
          ls -la cmd/llm-box || echo "no cmd/llm-box"

      - name: Build with system Go
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go version
          go env
          go build -ldflags "-s -w" -o test-binary ./cmd/llm-box
          ls -la test-binary
          echo "Build SUCCESS"
