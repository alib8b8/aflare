name: Test Build

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml', 'cmd/llm-box/**', 'go.mod']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go version
          go env GOOS GOARCH
          go build -v -o llm-box-test ./cmd/llm-box
          ls -la llm-box-test
