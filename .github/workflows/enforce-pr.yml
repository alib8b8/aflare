# Enforces PR-only flow: blocks direct pushes to protected branches.
# This is defense-in-depth; the primary enforcement is GitHub branch protection
# (Settings → Branches → Branch protection rules → Require pull request reviews
#  + Require status checks → set "PR Review / gate (required)" as required).
#
# Applies to both GitHub (origin) and GitCode (mirror) since workflows are synced.
#
# Allows any commit that originates from a merged PR, regardless of merge
# strategy (regular "Merge pull request", squash merge, or rebase merge), by
# asking GitHub's API whether the pushed commit is linked to a merged PR.
# Direct pushes (including admin overrides that bypass branch protection) are
# rejected unless they carry the [skip-pr-gate] emergency marker.
name: Enforce PR Flow

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  block-direct-push:
    name: Block direct push to main
    runs-on: ubuntu-latest
    steps:
      - name: Determine if commit came from a merged PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.event.after }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -e
          # Fast path 1: explicit emergency override marker.
          if printf '%s' "$COMMIT_MSG" | grep -q '\[skip-pr-gate\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit carries [skip-pr-gate] — allowing (emergency override)."
            exit 0
          fi

          # Fast path 2: regular merge commits produced by GitHub's merge button.
          if printf '%s' "$COMMIT_MSG" | grep -qE '^(Merge pull request|Merge branch)'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Regular merge commit — allowing."
            exit 0
          fi

          # Fast path 3: squash-merge commits. GitHub formats the squash commit
          # title as "<PR title> (#NN)". Match the trailing PR reference in the
          # first line, then verify via the PR API that the PR exists AND is
          # merged. NOTE: `gh api` writes the 404 error body to stdout and
          # exits 0 for some errors, so we cannot rely on exit code or stdout
          # non-emptiness alone — we require a valid ISO-8601 merged_at value.
          SQUASH_PR=$(printf '%s' "$COMMIT_MSG" | head -1 | grep -oE '\(#[0-9]+\)$' | grep -oE '[0-9]+')
          if [ -n "$SQUASH_PR" ]; then
            MERGED_AT=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SQUASH_PR}" \
              --jq '.merged_at // empty' 2>/dev/null || true)
            if printf '%s' "$MERGED_AT" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}T'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Squash-merge commit of merged PR #${SQUASH_PR} (merged_at ${MERGED_AT}) — allowing."
              exit 0
            fi
          fi

          # Robust path: ask GitHub whether this commit is the merge commit of a
          # merged PR. Covers rebase merges and acts as a backstop for squash
          # merges. NOTE: the `commits/{sha}/pulls` endpoint returns `merged`
          # as null (not true) for squash merges, so match on `merge_commit_sha`
          # equaling the pushed SHA instead — that field is set reliably for
          # all merge strategies. Direct pushes return an empty list → blocked.
          PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"${COMMIT_SHA}\")] | .[0].number" 2>/dev/null || echo "")
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit ${COMMIT_SHA} is the merge of PR #${PR_NUMBER} — allowing."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Reject direct push (must go through PR + CI gate + review)
        if: steps.pr.outputs.skip != 'true'
        run: |
          echo "::error::Direct pushes to main are not allowed."
          echo "::error::Create a feature branch, open a PR, and wait for the"
          echo "::error::'PR Review / gate (required)' check to pass + CODEOWNERS review."
          echo "::error::To override in an emergency, include [skip-pr-gate] in the commit message."
          exit 1
