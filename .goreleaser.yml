version: 2

project_name: aflare

before:
  hooks:
    - go mod tidy

builds:
  - id: aflare
    main: ./cmd/aflare
    binary: aflare
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/alib8b8/aflare/internal/version.Version={{.Tag}}
      - -X github.com/alib8b8/aflare/internal/version.BuildDate={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}-
      {{- .Os }}-
      {{- .Arch }}
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - install.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"

release:
  github:
    owner: alib8b8
    name: aflare
  name_template: "aflare {{ .Tag }}"
  footer: |
    ## Install

    **macOS / Linux:**
    ```bash
    curl -fsSL https://raw.githubusercontent.com/alib8b8/aflare/main/install.sh | bash
    ```

    **Windows (PowerShell):**
    ```powershell
    irm https://raw.githubusercontent.com/alib8b8/aflare/main/install.ps1 | iex
    ```

    Homebrew: `brew install alib8b8/tap/aflare`

    ## Build verification status

    | Artifact        | CI verified                                                       |
    |-----------------|-------------------------------------------------------------------|
    | `linux-amd64`   | ✅ tested on `ubuntu-latest` (build + vet + race tests + lint)    |
    | `linux-arm64`   | ✅ tested on `ubuntu-24.04-arm` (build + vet + race tests + lint) |
    | `darwin-amd64`  | ⚠️ build-only (not exercised in CI)                               |
    | `darwin-arm64`  | ⚠️ build-only (not exercised in CI)                               |
    | `windows-amd64` | ⚠️ build-only (not exercised in CI)                               |
    | `windows-arm64` | ⚠️ build-only (not exercised in CI)                               |

    > Verification status reflects the CI matrix in `.github/workflows/ci.yml` at release time.

nfpms:
  - id: packages
    package_name: aflare
    description: Terminal-first AI workflow engine
    maintainer: alib8b8
    license: AGPL-3.0
    formats:
      - deb
      - rpm
    contents:
      - src: install.sh
        dst: /usr/share/aflare/install.sh
