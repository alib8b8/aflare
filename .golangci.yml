version: "2"

linters:
  default: none
  enable:
    # Core bug-finding linters (blocking).
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    # Additional bug-finding linters (blocking).
    - errorlint  # erroneous error-handling (== instead of errors.Is, %w misuse)
    - nilerr     # returning nil while err != nil
    # Resource & correctness linters (blocking).
    - bodyclose      # unclosed http.Response.Body — real resource leak detection
    - unconvert      # unnecessary type conversions — zero-noise, already clean
    - usestdlibvars  # use net/http constants instead of string literals
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      # Exclude functions whose error return is not actionable in context
      # (HTTP response writes, JSON encoding to ResponseWriter, defer cleanup).
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (io.Closer).Close
        - (*encoding/json.Encoder).Encode
        - (*github.com/gin-gonic/gin.Context).Error
    staticcheck:
      # Disable QF (quick-fix), ST (style), S1 (simplification) checks —
      # they are code modernization/style suggestions, not bugs.
      # Keep SA checks for real bug detection (nil deref, deprecated, etc.).
      checks:
        - all
        - -QF1001
        - -QF1002
        - -QF1003
        - -QF1004
        - -QF1005
        - -QF1006
        - -QF1007
        - -QF1008
        - -QF1009
        - -QF1010
        - -QF1011
        - -QF1012
        - -ST1000
        - -ST1003
        - -ST1005
        - -ST1021
        - -S1002
        - -S1005
        - -S1011
        - -S1039
        - -SA9003
    # errorlint: prefer errors.Is/As and %w; keep it focused on real misuse.
    errorlint:
      errorf: true      # flag fmt.Errorf without %w where wrapping is likely
      asserts: true     # flag err == target comparisons
      comparison: true  # flag direct error-value comparisons
  exclusions:
    paths:
      - vendor
      - grok-mcp-server
    rules:
      - path: _test\.go
        linters:
          - errcheck
          # bodyclose can't track response-body closure across mock
          # transport boundaries: test mocks return http.Response values
          # whose bodies are closed by the production code under test, not
          # the test itself. Excluding tests keeps real production leaks
          # blocking while avoiding false positives in test mocks.
          - bodyclose
      # defer <x>.Close() in cleanup — error not actionable
      - linters: [errcheck]
        source: 'defer\s+.*\.Close\(\)'
      # fmt.Fprint*/Fprintln*/Fprintf* to stdout/log/buffer — error not actionable
      - linters: [errcheck]
        source: 'fmt\.F(print|println|printf)\s*\('

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
